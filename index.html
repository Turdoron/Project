      <tfoot><tr class="total"><td>Acumulado del ejercicio</td>
        <td class="num">${Q(r2(trim.reduce((s,x)=>s+x.costoVentas,0)))}</td>
        <td class="num">${Q(r2(trim.reduce((s,x)=>s+x.gastosDeducibles,0)))}</td>
        <td class="num">${Q(r2(trim.reduce((s,x)=>s+x.noDeducible,0)))}</td>
        <td class="num">${Q(r2(trim.reduce((s,x)=>s+x.costoVentas+x.gastosDeducibles+x.noDeducible,0)))}</td></tr></tfoot></table>
      ${htmlTarjetaISO(e)}`;
  }
  else if(regimenPeriodoSel==='simplificado'){
    const acum=meses.reduce((s,x)=>s+x.imp,0);
    bloqueISR=`<h3 style="color:var(--verde);margin:26px 0 4px">ISR Régimen Opcional Simplificado sobre Ingresos</h3>
      <p style="margin:0 0 12px;font-size:14px;color:var(--tinta-suave)">
        Pago <strong>mensual y definitivo</strong> sobre la renta bruta, sin deducir costos ni gastos:
        5% sobre los primeros Q30,000 del mes y 7% sobre el excedente.

      <div class="cifras">
        <div class="cifra"><span>Renta bruta ${sel==='anio'?'del ejercicio':'del mes'}</span><strong>${Q(p.ingresos)}</strong></div>
        <div class="cifra"><span>ISR ${sel==='anio'?'acumulado del ejercicio':'del mes'}</span><strong>${Q(p.imp)}</strong></div>

      <div class="aviso">Al pagar ("Pagar ISR") se restan solas las retenciones de ISR que anotaste al cargar
        las facturas de venta. Las rentas exentas hay que excluirlas a mano.</div>`;
  }
  else if(regimenPeriodoSel==='pequeno'){

        ${pct>=85?'Si lo supera, hay que trasladarlo al régimen general.':''}</div>`;
  }
  else{
    const smVigente=e.salarioMinimo||SALARIO_MINIMO;
    const topeAgro=r2(smVigente*3500);
    const anual=meses.reduce((s,x)=>s+x.ingresos,0);
    bloqueISR=`<h3 style="color:var(--verde);margin:26px 0 4px">${esc(REGIMENES[regimenPeriodoSel]||regimenPeriodoSel)}</h3>
      <p style="margin:0 0 12px;font-size:14px;color:var(--tinta-suave)">

  }

  return cab('Tablero fiscal',`${esc(e.nombre)} · ejercicio ${e.ejercicio} · régimen actual: ${esc(REGIMENES[e.regimen]||e.regimen)}`,

     ${e.regimen==='simplificado'?'<button class="btn sec" data-accion="pagarISR">Pagar ISR</button>':''}
     ${e.regimen==='general'?'<button class="btn sec" data-accion="cierreFiscalParcial">Cierre parcial</button>':''}

      const Rsel=calcularResultados(e,desdeSel,hastaPeriodoSel);

        </div>

    })()}

    <h3 style="color:var(--verde);margin:26px 0 10px">Detalle mes a mes del ejercicio</h3>
    ${meses.some(x=>x.regimen!==meses[0].regimen)?`<div class="aviso">Esta empresa cambió de régimen durante

    ${conMov.length? `<table><thead><tr><th>Mes</th><th class="num">Ventas</th>
      <th class="num">Costos y gastos</th><th class="num">Débito</th><th class="num">Crédito</th>

        <td class="num">${Q(x.ingresos)}</td><td class="num">${Q(x.cg)}</td>
        <td class="num h">${Q(x.debito)}</td><td class="num d">${Q(x.credito)}</td>
        <td class="num">${x.ivaPagar>0?Q(x.ivaPagar):'('+Q(Math.abs(x.ivaPagar))+')'}</td>
        ${meses.some(m=>m.regimen!=='general')?`<td class="num">${Q(x.imp)}</td>`:''}</tr>`).join('')}</tbody>
      <tfoot><tr class="total"><td>Totales</td>
        <td class="num">${Q(meses.reduce((s,x)=>s+x.ingresos,0))}</td>
        <td class="num">${Q(meses.reduce((s,x)=>s+x.cg,0))}</td>
        <td class="num">${Q(meses.reduce((s,x)=>s+x.debito,0))}</td>
        <td class="num">${Q(meses.reduce((s,x)=>s+x.credito,0))}</td>
        <td class="num">${Q(meses.reduce((s,x)=>s+x.ivaPagar,0))}</td>
        ${meses.some(x=>x.regimen!=='general')?`<td class="num">${Q(meses.reduce((s,x)=>s+x.imp,0))}</td>`:''}</tr></tfoot></table>
      <p style="font-size:13px;color:var(--tinta-suave);margin-top:8px">
        Los montos entre paréntesis son remanentes de crédito fiscal a favor.</p>`
     : `<div class="vacio">Todavía no hay movimiento registrado en el ejercicio ${e.ejercicio}.</div>`}

/* ============ CARTERA DE PROVEEDORES Y CLIENTES ============ */
/* Se arma a partir del detalle de documentos, no de las partidas: en el modo
   agrupado por día las partidas ya no distinguen proveedor por línea, pero el
   detalle documento por documento siempre conserva el NIT y el nombre. */
function carteraProveedores(e){
  const map={};
  (e.documentos||[]).forEach(d=>{
    if(d.tipo!=='compra'||!d.alCredito) return;
    const k=d.nit||'—';
    map[k]=map[k]||{nit:k,nombre:d.nombre,comprado:0,pagado:0};
    map[k].comprado=r2(map[k].comprado+(d.signo||1)*d.total);
    if(d.nombre) map[k].nombre=d.nombre;
  });
  (e.pagos||[]).forEach(pg=>{
    const k=pg.nit||'—';
    map[k]=map[k]||{nit:k,nombre:pg.nombre,comprado:0,pagado:0};
    map[k].pagado=r2(map[k].pagado+pg.monto);
  });
  return Object.values(map).map(x=>({...x,saldo:r2(x.comprado-x.pagado)}))
    .sort((a,b)=>b.saldo-a.saldo);
}
function carteraClientes(e){
  const map={};
  (e.documentos||[]).forEach(d=>{
    if(d.tipo!=='venta'||!d.alCredito) return;
    const k=d.nit||'—';
    map[k]=map[k]||{nit:k,nombre:d.nombre,vendido:0,cobrado:0};
    /* Lo que el cliente retuvo (ISR, IVA o 5%) no lo va a pagar: se descuenta del saldo. */
    map[k].vendido=r2(map[k].vendido+(d.signo||1)*r2(d.total-(d.retencionISR||0)-(d.retencionIVA||0)));
    if(d.nombre) map[k].nombre=d.nombre;
  });
  (e.cobros||[]).forEach(cb=>{
    const k=cb.nit||'—';
    map[k]=map[k]||{nit:k,nombre:cb.nombre,vendido:0,cobrado:0};
    map[k].cobrado=r2(map[k].cobrado+cb.monto);
  });
  return Object.values(map).map(x=>({...x,saldo:r2(x.vendido-x.cobrado)}))
    .sort((a,b)=>b.saldo-a.saldo);
}
/* Cuentas de caja y bancos, para elegir de dónde sale o a dónde entra el dinero. */
const cuentasCajaBanco=e=>e.cuentas.filter(c=>c.d && /caja|banco/i.test(c.n));

/* Movimientos cronológicos de un proveedor o cliente: las facturas suman al
   saldo (cargo) y los pagos o cobros restan (abono). Para el estado de cuenta. */
function movimientosCuenta(e,nit,tipo){
  const cargos=(e.documentos||[]).filter(d=>
      d.tipo===(tipo==='proveedor'?'compra':'venta') && d.alCredito && d.nit===nit)
    .map(d=>({fecha:d.fecha,
      concepto:`${d.signo===-1?'Nota de crédito':(d.tipoDte||'Factura')} ${d.serie?d.serie+'-':''}${d.dte}`,
      monto:(d.signo||1)*r2(d.total-(d.retencionISR||0)-(d.retencionIVA||0)-(d.retIvaFesp||0)-(d.retIsrFesp||0))}));
  const abonos=(tipo==='proveedor'?(e.pagos||[]):(e.cobros||[])).filter(m=>m.nit===nit)
    .map(m=>({fecha:m.fecha,
      concepto:m.forma==='retencion'?`Retención${m.numeroCheque?' — constancia '+m.numeroCheque:''}`:`${tipo==='proveedor'?'Pago':'Cobro'} en ${m.forma==='cheque'
        ?'cheque'+(m.numeroCheque?' No. '+m.numeroCheque:''):'efectivo'}`,
      monto:-m.monto}));
  return [...cargos,...abonos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
}

VISTAS.bitacora=()=>{
  const admin=administradorDeSesion();
  const propia=(BD.bitacora||[]).filter(x=>x.administradorId===admin).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const d=filtros.desde, h=filtros.hasta;
  const filtrada = propia.filter(x=>{
    const soloFecha=x.fecha.slice(0,10);
    if(d && soloFecha<d) return false;
    if(h && soloFecha>h) return false;
    return true;
  });
  const fFechaHora=iso=>{
    const dt=new Date(iso);
    return dt.toLocaleDateString('es-GT')+' '+dt.toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit'});
  };
  const filas=filtrada.slice(0,500).map(x=>`<tr>
    <td style="white-space:nowrap">${fFechaHora(x.fecha)}</td>
    <td>${esc(x.usuarioNombre)}<br><span style="font-size:12px;color:var(--tinta-suave)">${esc(x.rol)}</span></td>
    <td>${esc(x.empresaNombre||'—')}</td>
    <td>${esc(x.accion)}${x.detalle?`<br><span style="font-size:12px;color:var(--tinta-suave)">${esc(x.detalle)}</span>`:''}</td>
  </tr>`).join('');
  return cab('Bitácora','Quién hizo qué y cuándo, dentro de tu despacho. Solo vos la podés ver.')
    + `<div class="barra">
        <div class="campo"><label>Desde</label><input type="date" data-filtro="desde" value="${d||''}"></div>
        <div class="campo"><label>Hasta</label><input type="date" data-filtro="hasta" value="${h||''}"></div>
      </div>`
    + (filtrada.length? `<table><thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Empresa</th><th>Acción</th></tr></thead>
        <tbody>${filas}</tbody></table>
        ${filtrada.length>500?`<p style="font-size:13px;color:var(--tinta-suave);margin-top:8px">Mostrando las 500 más recientes de ${filtrada.length}.</p>`:''}`
      : `<div class="vacio">Todavía no hay nada registrado en este rango.</div>`);
};

      </div></div>`:'')

/* ============ MÓDULO EMPLEADOS Y PLANILLAS — vistas y acciones juntas ============ */
/* A diferencia del resto del archivo, aquí las pantallas (VISTAS.empleados,
   VISTAS.planillas) y sus acciones (ACCIONES.nuevoEmpleado, ACCIONES.confirmarPlanilla,
   etc.) están intercaladas en vez de separadas, porque se escribieron como un
   módulo autocontenido. El cálculo de sueldos, IGSS e ISR vive más arriba,
   en "PLANILLAS Y SALARIOS". */
const ACCIONES={};

/* ACCIONES.deshacer vive acá, apenas se declara ACCIONES, para que cualquier
   otra sección del archivo pueda referenciarla sin problema de orden. La
   captura del snapshot (tomarSnapshotDeshacer) se dispara aparte, en los tres
   puntos donde de verdad se aplica un cambio — ver más abajo, cerca de
   abrirModal y confirmar. */
ACCIONES.deshacer=()=>{
  if(!snapshotDeshacer){avisar('No hay ninguna acción reciente para deshacer.');return}
  const e=emp();
  if(!e||e.id!==snapshotDeshacer.empId){avisar('El deshacer solo funciona en la misma empresa donde se hizo la última acción, y ya cambiaste de empresa.');return}
  const aRestaurar=snapshotDeshacer;   // se guarda en una variable propia — confirmar() también
                                        // toma su propio snapshot antes de aplicar el cambio, y
                                        // eso pisaría snapshotDeshacer antes de llegar a usarlo acá.
  confirmar(`¿Deshacer "${etiquetaDeshacer}"? La empresa vuelve exacto a como estaba antes de esa acción.`,()=>{
    saltarSnapshot=true;   // restaurar no debe guardarse como algo "para deshacer"
    const idx=BD.empresas.findIndex(x=>x.id===aRestaurar.empId);
    if(idx>=0) BD.empresas[idx]=aRestaurar.datos;
    snapshotDeshacer=null; etiquetaDeshacer='';
    guardar(); pintar();
    avisar('Deshecho.','Listo');
  },'Deshacer');
};

/* ============ COMPRAS: cotizaciones, órdenes de compra y aprobación de gastos ============ */
/* Nada de esto genera partidas: es el trabajo que ocurre ANTES de que llegue la
   factura. La contabilidad sigue entrando por "Cargar facturas"; lo único que une
   las dos cosas es que, al cargar una factura de compra, se puede decir a qué
   orden aprobada corresponde, y el sistema compara lo ordenado contra lo facturado. */
const IVA_COMPRAS=0.12;
const ESTADOS_OC={borrador:'Borrador',pendiente:'Pendiente de aprobación',aprobada:'Aprobada',rechazada:'Rechazada',facturada:'Facturada',anulada:'Anulada'};
const COLOR_ESTADO_OC={borrador:'var(--tinta-suave)',pendiente:'var(--haber)',aprobada:'var(--verde)',rechazada:'var(--alerta)',facturada:'var(--verde)',anulada:'var(--tinta-suave)'};
let comprasTab='ordenes';

const normNIT=n=>String(n||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
/* Aprueban el Administrador y el Gerente de Compras. El Auxiliar prepara, no aprueba. */
function puedeAprobarCompras(){const u=usuarioActual();return !!u&&(u.rol==='administrador'||u.rol==='compras_gerente');}
function totalesCompra(items,aplicaIVA){
  const subtotal=r2(items.reduce((s,i)=>s+r2((+i.cantidad||0)*(+i.precio||0)),0));
  const iva=aplicaIVA?r2(subtotal*IVA_COMPRAS):0;
  return {subtotal,iva,total:r2(subtotal+iva)};
}
/* Cuánto puede diferir una factura de lo que falta por facturar antes de avisar: el mayor entre Q1 y el 1%. */
const toleranciaOC=total=>Math.max(1,r2(total*0.01));
const porFacturarOC=oc=>r2(oc.total-(oc.facturado||0));
const buscarOC=(e,id)=>(e.ordenesCompra||[]).find(o=>o.id===id);
const buscarCot=(e,id)=>(e.cotizaciones||[]).find(c=>c.id===id);
function proximoNumeroCompras(e,prefijo,campo){e[campo]=(e[campo]||0)+1;return `${prefijo}-${String(e[campo]).padStart(4,'0')}`;}
function historialOC(oc,accion,detalle){
  const u=usuarioActual();
  (oc.historial=oc.historial||[]).push({fecha:new Date().toISOString(),usuario:u?(u.nombre||u.usuario):'',accion,detalle:detalle||''});
}
const quienSoy=()=>{const u=usuarioActual();return u?{id:u.id,nombre:u.nombre||u.usuario}:{id:'',nombre:''};};
function proveedoresConocidos(e){
  const m=new Map();
  (e.documentos||[]).filter(d=>d.tipo==='compra'&&d.nit).forEach(d=>{if(!m.has(normNIT(d.nit))) m.set(normNIT(d.nit),{nit:d.nit,nombre:d.nombre||''});});
  [...(e.ordenesCompra||[]),...(e.cotizaciones||[])].forEach(x=>{
    if(x.proveedorNit&&!m.has(normNIT(x.proveedorNit))) m.set(normNIT(x.proveedorNit),{nit:x.proveedorNit,nombre:x.proveedorNombre||''});});
  return [...m.values()];
}

/* ---- piezas de formulario compartidas por cotización y orden ---- */
function htmlProveedorCampos(e,nit,nombre){

    <div class="campo"><label>Nombre del proveedor</label><input name="proveedorNombre" value="${esc(nombre||'')}"></div>`;
}
function enlazarProveedor(e){
  const n=mForm.querySelector('[name="proveedorNit"]'), nom=mForm.querySelector('[name="proveedorNombre"]');
  n.onchange=()=>{const p=proveedoresConocidos(e).find(x=>normNIT(x.nit)===normNIT(n.value)); if(p&&!nom.value) nom.value=p.nombre;};
}
const filaItemCompra=it=>`<tr data-it><td><input data-c="desc" value="${esc(it.descripcion||'')}" placeholder="Producto o servicio" style="width:100%"></td>
  <td><input data-c="cant" type="number" min="0" step="0.01" value="${it.cantidad===undefined?1:it.cantidad}" style="width:80px;text-align:right"></td>
  <td><input data-c="precio" type="number" min="0" step="0.01" value="${it.precio===undefined?'':it.precio}" style="width:100px;text-align:right"></td>
  <td class="num" data-sub></td><td><button type="button" class="btn mini peligro" data-quitar aria-label="Quitar renglón">×</button></td></tr>`;
function htmlEditorItems(items){
  return `<table style="font-size:13px;margin-top:10px"><thead><tr><th>Descripción</th><th class="num">Cantidad</th>
    <th class="num">Precio unitario</th><th class="num">Subtotal</th><th></th></tr></thead>
    <tbody id="tbItems">${(items&&items.length?items:[{}]).map(filaItemCompra).join('')}</tbody></table>
    <button type="button" class="btn mini sec" id="btnAddItem" style="margin-top:6px">+ Agregar renglón</button>`;
}
/* Solo los renglones completos: con descripción, cantidad y precio. */
function leerItemsEditor(){
  return [...mForm.querySelectorAll('[data-it]')].map(tr=>({
    descripcion:tr.querySelector('[data-c="desc"]').value.trim(),
    cantidad:+tr.querySelector('[data-c="cant"]').value||0,
    precio:+tr.querySelector('[data-c="precio"]').value||0})).filter(i=>i.descripcion&&i.cantidad>0&&i.precio>0);
}
function enlazarEditorItems(){
  const tb=mForm.querySelector('#tbItems'), tot=mForm.querySelector('#totCompra'), iva=mForm.querySelector('[name="aplicaIVA"]');
  const recalcular=()=>{
    tb.querySelectorAll('[data-it]').forEach(tr=>{
      const c=+tr.querySelector('[data-c="cant"]').value||0, p=+tr.querySelector('[data-c="precio"]').value||0;
      tr.querySelector('[data-sub]').textContent=c&&p?Q(r2(c*p)):'';});
    const t=totalesCompra(leerItemsEditor(),iva.checked);
    tot.innerHTML=`Subtotal Q${Q(t.subtotal)} · IVA Q${Q(t.iva)} · <strong>Total Q${Q(t.total)}</strong>`;
  };
  tb.addEventListener('input',recalcular);
  /* Enter dentro del detalle no debe guardar el formulario por accidente. */
  tb.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();ev.stopPropagation();}});
  tb.addEventListener('click',ev=>{
    if(ev.target.matches('[data-quitar]')){
      ev.target.closest('[data-it]').remove();
      if(!tb.querySelector('[data-it]')) tb.insertAdjacentHTML('beforeend',filaItemCompra({}));
      recalcular();}
  });
  mForm.querySelector('#btnAddItem').onclick=()=>{tb.insertAdjacentHTML('beforeend',filaItemCompra({}));recalcular();};
  iva.onchange=recalcular; recalcular();
}
const htmlCheckIVA=aplica=>`<label style="display:flex;gap:8px;align-items:center;margin:10px 0 4px;font-size:14px">
  <input type="checkbox" name="aplicaIVA"${aplica!==false?' checked':''} style="width:auto"> Los precios no incluyen IVA: se suma el 12%</label>
  <p id="totCompra" style="margin:4px 0 10px;font-size:14px"></p>`;

/* ---- cotizaciones ---- */
function formCotizacion(c){
  const e=emp(), nuevo=!c; c=c||{items:[],aplicaIVA:true};
  const reqs=[...new Set((e.cotizaciones||[]).map(x=>x.requerimiento).filter(Boolean))];
  abrirModal(nuevo?'Nueva cotización':`Editar cotización ${esc(c.numero)}`,
    `<datalist id="dlReq">${reqs.map(r=>`<option value="${esc(r)}">`).join('')}</datalist>
    <div class="rej">
      <div class="campo full"><label>¿Qué se necesita comprar? (requerimiento)</label>
        <input name="requerimiento" list="dlReq" value="${esc(c.requerimiento||'')}" placeholder="Ej.: Cajas para el pedido de octubre">
        <span style="font-size:12.5px;color:var(--tinta-suave)">Las cotizaciones con el mismo requerimiento se comparan juntas.</span></div>
      ${htmlProveedorCampos(e,c.proveedorNit,c.proveedorNombre)}
      <div class="campo"><label>Fecha de la cotización</label><input name="fecha" type="date" value="${c.fecha||hoy()}"></div>
      <div class="campo"><label>Vigente hasta</label><input name="vigenteHasta" type="date" value="${c.vigenteHasta||''}"></div>
    </div>
    ${htmlEditorItems(c.items)}${htmlCheckIVA(c.aplicaIVA)}
    <div class="campo full"><label>Notas</label><input name="notas" value="${esc(c.notas||'')}" placeholder="Tiempo de entrega, forma de pago…"></div>`,
    d=>{
      if(!d.requerimiento.trim()){avisar('Escribí qué se necesita comprar: así se agrupan las cotizaciones para compararlas.');return false}
      if(!d.proveedorNombre.trim()){avisar('Escribí el nombre del proveedor.');return false}
      const items=leerItemsEditor();
      if(!items.length){avisar('Agregá al menos un renglón completo: descripción, cantidad y precio.');return false}
      const aplicaIVA=d.aplicaIVA==='on', t=totalesCompra(items,aplicaIVA);
      const datos={requerimiento:d.requerimiento.trim(),proveedorNit:d.proveedorNit.trim(),proveedorNombre:d.proveedorNombre.trim(),
        fecha:d.fecha||hoy(),vigenteHasta:d.vigenteHasta||'',items,aplicaIVA,...t,notas:d.notas.trim()};
      if(nuevo){
        (e.cotizaciones=e.cotizaciones||[]).push({id:uid(),numero:proximoNumeroCompras(e,'COT','correlativoCot'),estado:'vigente',creadoPor:quienSoy(),...datos});
        registrarLog('Registró una cotización',`${datos.proveedorNombre} — ${datos.requerimiento} — Q${Q(t.total)}`);
      }else{ Object.assign(c,datos); registrarLog('Editó una cotización',`${c.numero} — ${datos.proveedorNombre}`); }
      guardar(); pintar();
    },nuevo?'Guardar cotización':'Guardar cambios');
  enlazarProveedor(e); enlazarEditorItems();
}
ACCIONES.nuevaCotizacion=()=>formCotizacion(null);
ACCIONES.editarCotizacion=d=>{
  const c=buscarCot(emp(),d.id);
  if(!c){avisar('No se encontró esa cotización.');return}
  if(c.ocId){avisar(`Esta cotización ya originó la orden de compra ${buscarOC(emp(),c.ocId)?buscarOC(emp(),c.ocId).numero:''}: ya no se edita.`);return}
  formCotizacion(c);
};
ACCIONES.eliminarCotizacion=d=>{
  const e=emp(), c=buscarCot(e,d.id);
  if(!c) return;
  if(c.ocId){avisar('Esta cotización ya originó una orden de compra: no se puede eliminar.');return}
  confirmar(`Se eliminará la cotización ${c.numero} de ${c.proveedorNombre}.`,()=>{
    e.cotizaciones=e.cotizaciones.filter(x=>x.id!==c.id); guardar(); pintar();},'Eliminar');
};
/* Elegir una cotización descarta las otras del mismo requerimiento que todavía no tienen orden. */
ACCIONES.elegirCotizacion=d=>{
  const e=emp(), c=buscarCot(e,d.id);
  if(!c) return;
  confirmar(`Elegir la cotización de ${c.proveedorNombre} (Q${Q(c.total)}) para "${c.requerimiento}". Las demás cotizaciones de este requerimiento quedan descartadas.`,()=>{
    e.cotizaciones.filter(x=>x.requerimiento===c.requerimiento&&x.id!==c.id&&!x.ocId).forEach(x=>x.estado='descartada');
    c.estado='elegida'; registrarLog('Eligió una cotización',`${c.numero} — ${c.proveedorNombre} — Q${Q(c.total)}`);
    guardar(); pintar();},'Elegir');
};
ACCIONES.reabrirCotizacion=d=>{
  const e=emp(), c=buscarCot(e,d.id);
  if(!c||c.ocId) return;
  c.estado='vigente'; guardar(); pintar();
};
ACCIONES.ordenDesdeCotizacion=d=>{
  const c=buscarCot(emp(),d.id);
  if(!c){avisar('No se encontró esa cotización.');return}
  if(c.ocId){avisar('Esta cotización ya tiene su orden de compra.');return}
  formOrdenCompra(null,c);
};

/* ---- órdenes de compra ---- */
function formOrdenCompra(oc,cot){
  const e=emp(), nuevo=!oc;
  const base=oc||(cot?{proveedorNit:cot.proveedorNit,proveedorNombre:cot.proveedorNombre,items:cot.items.map(i=>({...i})),aplicaIVA:cot.aplicaIVA}:{items:[],aplicaIVA:true});
  abrirModal(nuevo?'Nueva orden de compra':`Editar ${esc(oc.numero)}`,
    `${cot?`<p style="margin:0 0 10px;font-size:13px;color:var(--tinta-suave)">Se arma con la cotización ${esc(cot.numero)} de ${esc(cot.proveedorNombre)}.</p>`:''}
    <div class="rej">${htmlProveedorCampos(e,base.proveedorNit,base.proveedorNombre)}
      <div class="campo"><label>Fecha de la orden</label><input name="fecha" type="date" value="${base.fecha||hoy()}"></div>
      <div class="campo"><label>Entrega esperada</label><input name="fechaEntrega" type="date" value="${base.fechaEntrega||''}"></div>
    </div>
    ${htmlEditorItems(base.items)}${htmlCheckIVA(base.aplicaIVA)}
    <div class="campo full"><label>Condiciones</label><input name="condiciones" value="${esc(base.condiciones||'')}" placeholder="Forma de pago, lugar de entrega…"></div>
    <div class="aviso">Queda como <strong>borrador</strong>. Cuando esté lista, usá "Enviar a aprobación".</div>`,
    d=>{
      if(!d.proveedorNombre.trim()){avisar('Escribí el nombre del proveedor.');return false}
      const items=leerItemsEditor();
      if(!items.length){avisar('Agregá al menos un renglón completo: descripción, cantidad y precio.');return false}
      const aplicaIVA=d.aplicaIVA==='on', t=totalesCompra(items,aplicaIVA);
      const datos={proveedorNit:d.proveedorNit.trim(),proveedorNombre:d.proveedorNombre.trim(),fecha:d.fecha||hoy(),
        fechaEntrega:d.fechaEntrega||'',items,aplicaIVA,...t,condiciones:d.condiciones.trim()};
      if(nuevo){
        const o={id:uid(),numero:proximoNumeroCompras(e,'OC','correlativoOC'),estado:'borrador',creadoPor:quienSoy(),
          cotizacionId:cot?cot.id:'',facturado:0,facturas:[],historial:[],...datos};
        historialOC(o,'Creada',cot?`A partir de la cotización ${cot.numero}`:'');
        (e.ordenesCompra=e.ordenesCompra||[]).push(o);
        if(cot){cot.ocId=o.id; cot.estado='elegida';}
        registrarLog('Creó una orden de compra',`${o.numero} — ${o.proveedorNombre} — Q${Q(t.total)}`);
      }else{ Object.assign(oc,datos); historialOC(oc,'Editada',''); registrarLog('Editó una orden de compra',oc.numero); }
      guardar(); pintar();
    },nuevo?'Guardar borrador':'Guardar cambios');
  enlazarProveedor(e); enlazarEditorItems();
}
ACCIONES.nuevaOrdenCompra=()=>formOrdenCompra(null,null);
ACCIONES.editarOrdenCompra=d=>{
  const oc=buscarOC(emp(),d.id);
  if(!oc) return;
  if(oc.estado!=='borrador'){avisar('Solo se edita una orden en borrador. Si fue rechazada, primero reabrila.');return}
  formOrdenCompra(oc,null);
};
ACCIONES.eliminarOrdenCompra=d=>{
  const e=emp(), oc=buscarOC(e,d.id);
  if(!oc) return;
  if(oc.estado!=='borrador'){avisar('Solo se elimina una orden en borrador. Una orden ya enviada se anula, no se borra.');return}
  confirmar(`Se eliminará el borrador ${oc.numero}.`,()=>{
    const c=oc.cotizacionId&&buscarCot(e,oc.cotizacionId); if(c){c.ocId='';}
    e.ordenesCompra=e.ordenesCompra.filter(x=>x.id!==oc.id); guardar(); pintar();},'Eliminar');
};
ACCIONES.enviarOrdenCompra=d=>{
  const e=emp(), oc=buscarOC(e,d.id);
  if(!oc) return;
  if(oc.estado!=='borrador'){avisar('Solo se envía a aprobación una orden en borrador.');return}
  const lim=+e.limiteAprobacionAuto||0, auto=lim>0&&oc.total<=lim;
  confirmar(auto
    ?`${oc.numero} es de Q${Q(oc.total)}, dentro del límite de aprobación automática (Q${Q(lim)}): queda aprobada al enviarla.`
    :`${oc.numero} (Q${Q(oc.total)}) pasa a aprobación. Un Gerente de Compras o el Administrador tiene que aprobarla.`,()=>{
    if(auto){
      oc.estado='aprobada'; oc.aprobadaPor={id:'',nombre:'Aprobación automática',fecha:new Date().toISOString()};
      historialOC(oc,'Aprobada automáticamente',`Monto dentro del límite de Q${Q(lim)}`);
    }else{ oc.estado='pendiente'; historialOC(oc,'Enviada a aprobación',''); }
    registrarLog('Envió una orden de compra',`${oc.numero} — ${auto?'aprobada automáticamente':'pendiente de aprobación'}`);
    guardar(); pintar();},'Enviar');
};
ACCIONES.aprobarOrdenCompra=d=>{
  const e=emp(), oc=buscarOC(e,d.id);
  if(!oc) return;
  if(!puedeAprobarCompras()){avisar('Tu rol no aprueba gastos. Lo hace el Gerente de Compras o el Administrador.');return}
  if(oc.estado!=='pendiente'){avisar('Esta orden no está pendiente de aprobación.');return}
  const propia=oc.creadoPor&&oc.creadoPor.id&&oc.creadoPor.id===quienSoy().id;
  confirmar(`Aprobar ${oc.numero} de ${oc.proveedorNombre} por Q${Q(oc.total)}.${propia?'\n\nLa preparaste vos mismo: quedará anotado en el historial.':''}`,()=>{
    oc.estado='aprobada'; oc.aprobadaPor={...quienSoy(),fecha:new Date().toISOString()};
    historialOC(oc,'Aprobada',propia?'Aprobó una orden que él mismo preparó':'');
    registrarLog('Aprobó una orden de compra',`${oc.numero} — Q${Q(oc.total)}`);
    guardar(); pintar();},'Aprobar');
};
ACCIONES.rechazarOrdenCompra=d=>{
  const e=emp(), oc=buscarOC(e,d.id);
  if(!oc) return;
  if(!puedeAprobarCompras()){avisar('Tu rol no aprueba gastos. Lo hace el Gerente de Compras o el Administrador.');return}
  if(oc.estado!=='pendiente'){avisar('Esta orden no está pendiente de aprobación.');return}
  abrirModal(`Rechazar ${esc(oc.numero)}`,
    `<p style="margin:0 0 10px;font-size:13px;color:var(--tinta-suave)">${esc(oc.proveedorNombre)} · Q${Q(oc.total)}. Quien la preparó va a ver el motivo.</p>
    <div class="campo full"><label>Motivo del rechazo</label><input name="motivo" placeholder="Ej.: Falta una tercera cotización"></div>`,
    f=>{
      if(!f.motivo.trim()){avisar('Escribí el motivo: sin él, quien preparó la orden no sabe qué corregir.');return false}
      oc.estado='rechazada'; oc.motivo=f.motivo.trim();
      historialOC(oc,'Rechazada',oc.motivo); registrarLog('Rechazó una orden de compra',`${oc.numero} — ${oc.motivo}`);
      guardar(); pintar();
    },'Rechazar');
};
ACCIONES.reabrirOrdenCompra=d=>{
  const oc=buscarOC(emp(),d.id);
  if(!oc||oc.estado!=='rechazada') return;
  oc.estado='borrador'; historialOC(oc,'Reabierta como borrador',''); guardar(); pintar();
};
ACCIONES.anularOrdenCompra=d=>{
  const e=emp(), oc=buscarOC(e,d.id);
  if(!oc) return;
  if(!puedeAprobarCompras()){avisar('Tu rol no anula órdenes ya enviadas. Lo hace el Gerente de Compras o el Administrador.');return}
  if(!['pendiente','aprobada'].includes(oc.estado)){avisar('Solo se anula una orden pendiente o aprobada.');return}
  if((oc.facturas||[]).length){avisar(`${oc.numero} ya tiene facturas vinculadas: no se puede anular.`);return}
  abrirModal(`Anular ${esc(oc.numero)}`,
    `<div class="campo full"><label>Motivo</label><input name="motivo" placeholder="Ej.: El proveedor no tenía existencia"></div>`,
    f=>{
      if(!f.motivo.trim()){avisar('Escribí el motivo de la anulación.');return false}
      oc.estado='anulada'; oc.motivo=f.motivo.trim(); historialOC(oc,'Anulada',oc.motivo);
      registrarLog('Anuló una orden de compra',`${oc.numero} — ${oc.motivo}`); guardar(); pintar();
    },'Anular');
};
ACCIONES.politicaAprobacion=()=>{
  const e=emp();
  if(!puedeAprobarCompras()){avisar('Solo el Gerente de Compras o el Administrador define la política de aprobación.');return}

    `<p style="margin:0 0 12px;font-size:13px;color:var(--tinta-suave)">Las órdenes por un monto <strong>igual o menor</strong> a este límite se aprueban solas al enviarlas;

/* ---- vínculo con "Cargar facturas" ---- */
/* Una orden se puede vincular a una factura solo si está aprobada y todavía no se facturó completa. */
const ocVinculable=(e,id)=>{const o=buscarOC(e,id);return !!o&&o.estado==='aprobada';};
function htmlCeldaOC(e,d,i){
  if(d.tipo!=='compra') return '<td style="color:var(--tinta-suave)">—</td>';
  const aprobadas=(e.ordenesCompra||[]).filter(o=>o.estado==='aprobada');
  const nit=normNIT(d.nitEmisor);
  const mias=aprobadas.filter(o=>nit&&normNIT(o.proveedorNit)===nit), otras=aprobadas.filter(o=>!mias.includes(o));
  const op=o=>`<option value="${o.id}"${d.ocId===o.id?' selected':''}>${esc(o.numero)} — ${esc(o.proveedorNombre)} — por facturar Q${Q(porFacturarOC(o))}</option>`;
  let nota='';
  const oc=d.ocId&&aprobadas.find(o=>o.id===d.ocId);
  if(oc){
    const rest=porFacturarOC(oc), monto=r2((d.signo||1)*d.total), dif=r2(monto-rest), tol=toleranciaOC(oc.total);
    const partes=[];
    if(normNIT(oc.proveedorNit)&&nit&&normNIT(oc.proveedorNit)!==nit) partes.push('<span style="color:var(--alerta)">El NIT no es el de la orden</span>');
    partes.push(dif>tol?`<span style="color:var(--alerta)">Excede lo que falta por facturar en Q${Q(dif)}</span>`
      :dif<-tol?`<span style="color:var(--tinta-suave)">Quedaría por facturar Q${Q(-dif)}</span>`
      :'<span style="color:var(--verde)">Coincide con la orden</span>');
    nota=`<br><span style="font-size:12px">${partes.join(' · ')}</span>`;
  }else if(d.ocId) nota='<br><span style="font-size:12px;color:var(--alerta)">La orden vinculada ya no está disponible.</span>';
  if(!aprobadas.length&&!d.ocId) return '<td style="color:var(--tinta-suave)">—</td>';
  return `<td style="min-width:170px"><select data-oc="${i}" style="max-width:210px"><option value="">${mias.length?`— sin orden (hay ${mias.length} de este proveedor) —`:'— sin orden —'}</option>
    ${mias.length?`<optgroup label="Del mismo proveedor">${mias.map(op).join('')}</optgroup>`:''}
    ${otras.length?`<optgroup label="Otras órdenes aprobadas">${otras.map(op).join('')}</optgroup>`:''}</select>${nota}</td>`;
}
/* Lo que cada orden recibiría en esta carga, contra lo que le falta por facturar. */
function resumenVinculosOC(e,docs){
  const por={};
  docs.filter(d=>d.tipo==='compra'&&d.ocId).forEach(d=>{por[d.ocId]=r2((por[d.ocId]||0)+(d.signo||1)*d.total);});
  return Object.entries(por).map(([id,monto])=>{
    const oc=buscarOC(e,id), rest=porFacturarOC(oc), tol=toleranciaOC(oc.total), dif=r2(monto-rest);
    return {oc,monto,rest,dif,excede:dif>tol,completa:Math.abs(dif)<=tol};
  });
}
function aplicarVinculosOC(e,docs){
  const lineas=[];
  docs.filter(d=>d.tipo==='compra'&&d.ocId).forEach(d=>{
    const oc=buscarOC(e,d.ocId); if(!oc) return;
    (oc.facturas=oc.facturas||[]).push({fecha:d.fecha,tipoDte:d.tipoDte||'FACT',serie:d.serie,dte:d.dte,total:r2(d.total),signo:d.signo||1});
    oc.facturado=r2(oc.facturas.reduce((s,f)=>s+f.signo*f.total,0));
    historialOC(oc,'Factura vinculada',`${d.tipoDte||'FACT'} ${d.serie||''}${d.dte?'-'+d.dte:''} por Q${Q(d.total)}`);
  });
  [...new Set(docs.filter(d=>d.tipo==='compra'&&d.ocId).map(d=>d.ocId))].forEach(id=>{
    const oc=buscarOC(e,id); if(!oc) return;
    if(oc.estado==='aprobada'&&porFacturarOC(oc)<=toleranciaOC(oc.total)){oc.estado='facturada'; historialOC(oc,'Facturada por completo','');}
    lineas.push(oc.estado==='facturada'?`${oc.numero}: facturada por completo.`:`${oc.numero}: queda por facturar Q${Q(porFacturarOC(oc))}.`);
  });
  return lineas;
}

/* ---- orden de compra en PDF ---- */
ACCIONES.pdfOrdenCompra=async d=>{
  const e=emp(), oc=buscarOC(e,d.id);
  if(!oc){avisar('No se encontró esa orden.');return}
  try{
    const jsPDF=await cargarJsPDF();
    const doc=new jsPDF({unit:'pt',format:'letter'});
    const y=encabezadoPDF(doc,`Orden de compra ${oc.numero}`,`Fecha ${fFecha(oc.fecha)} · ${ESTADOS_OC[oc.estado]}`);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(40,40,40);
    doc.text(`Proveedor: ${oc.proveedorNombre}`,40,y+6); doc.text(`NIT: ${oc.proveedorNit||'—'}`,40,y+20);
    if(oc.fechaEntrega) doc.text(`Entrega esperada: ${fFecha(oc.fechaEntrega)}`,40,y+34);
    doc.autoTable({startY:y+48,margin:{left:40,right:40},theme:'grid',styles:{fontSize:9,cellPadding:4},headStyles:{fillColor:VERDE},
      head:[['#','Descripción','Cantidad','Precio unitario','Subtotal']],
      body:oc.items.map((it,i)=>[i+1,it.descripcion,String(it.cantidad),Q(it.precio),Q(r2(it.cantidad*it.precio))]),
      columnStyles:{0:{cellWidth:24},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}}});
    let y2=doc.lastAutoTable.finalY+16;
    const ancho=doc.internal.pageSize.getWidth();
    [['Subtotal',oc.subtotal],['IVA (12%)',oc.iva],['Total',oc.total]].forEach(([t,v],i)=>{
      doc.setFont('helvetica',i===2?'bold':'normal'); doc.text(t,ancho-200,y2); doc.text('Q'+Q(v),ancho-40,y2,{align:'right'}); y2+=15;});
    if(oc.condiciones){doc.setFont('helvetica','normal'); doc.text(doc.splitTextToSize(`Condiciones: ${oc.condiciones}`,ancho-80),40,y2+8); y2+=30;}
    y2=Math.max(y2+50,doc.lastAutoTable.finalY+110);
    doc.setDrawColor(120); doc.line(40,y2,230,y2); doc.line(ancho-230,y2,ancho-40,y2);
    doc.setFontSize(9); doc.setFont('helvetica','normal');
    doc.text(`Elaboró: ${(oc.creadoPor||{}).nombre||''}`,40,y2+12);
    doc.text(oc.aprobadaPor?`Aprobó: ${oc.aprobadaPor.nombre}${oc.aprobadaPor.fecha?' — '+fFecha(oc.aprobadaPor.fecha.slice(0,10)):''}`:'Aprobación pendiente',ancho-230,y2+12);
    doc.save(`OrdenCompra-${oc.numero}-${archivoSeguro(e.nombre)}.pdf`);
  }catch(err){
    avisar('No se pudo generar el PDF: '+err.message+'\n\nEl generador se descarga de internet la primera vez, así que necesitás conexión.');
  }
};


/* ============ VENTAS — Consignación ============ */
/* Primera pieza de esta sección: mercadería que sale a consignación se
   registra por su COSTO, no por precio — todavía no es una venta, la
   mercadería sigue siendo del negocio, solo cambió de lugar. Cuando el
   consignatario de verdad la vende, ahí sí se carga el precio, ligado a una
   factura, y recién ahí se reconoce el ingreso, el costo y la comisión. */
VISTAS.ventas=()=>{
  const e=emp();
  e.consignaciones=e.consignaciones||[];
  e.salidasInventario=e.salidasInventario||[];
  const enConsig=e.consignaciones.filter(c=>c.estado==='en_consignacion');
  const vendidas=[...e.consignaciones.filter(c=>c.estado==='vendido')].sort((a,b)=>(b.fechaVenta||'').localeCompare(a.fechaVenta||''));
  const ventasDirectas=[...e.salidasInventario.filter(s=>s.motivo==='venta')].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const filaEnConsig=c=>`<tr><td>${fFecha(c.fecha)}</td><td>${esc(c.producto)}</td>
    <td>${esc(c.nombreConsignatario||'—')}${c.nitConsignatario?`<br><span style="font-size:12px;color:var(--tinta-suave)">NIT ${esc(c.nitConsignatario)}</span>`:''}</td>
    <td class="num">${c.cantidad||'—'}</td><td class="num">${Q(c.costoTotal)}</td>
    <td class="num"><button class="btn mini" data-accion="registrarVentaConsignacion" data-id="${c.id}">Registrar venta</button></td></tr>`;
  const filaVendida=c=>`<tr><td>${fFecha(c.fechaVenta)}</td><td>${esc(c.producto)}</td>
    <td>${esc(c.nombreConsignatario||'—')}</td>
    <td class="num">${Q(c.costoTotal)}</td><td class="num">${c.comisionMonto?Q(c.comisionMonto):'—'}</td>
    <td class="num"><button class="btn mini" data-accion="verPartida" data-id="${c.partidaVentaId}">Ver partida</button></td></tr>`;
  const filaVentaDirecta=s=>`<tr><td>${fFecha(s.fecha)}</td><td>${esc(s.producto)}</td>
    <td class="num">${s.cantidad}</td><td class="num">${Q(s.costoUnitario)}</td><td class="num">${Q(s.costoTotal)}</td>
    <td class="num"><button class="btn mini sec" data-accion="editarVentaDirecta" data-id="${s.id}">Editar</button></td></tr>`;
  return cab('Ventas','Venta directa (solo descuenta inventario) o consignación (genera su propia partida).',
    `<button class="btn" data-accion="nuevaVentaDirecta">Nueva venta</button>
     <button class="btn sec" data-accion="nuevaConsignacion">Nueva consignación</button>`)
  + `<h3 style="color:var(--verde);margin:0 0 8px">Ventas directas</h3>
    <div class="aviso">Esto solo lleva el control de inventario por cantidad. El ingreso, el IVA y el costo de
      cada venta se registran, como siempre, en "Cargar facturas".</div>
    ${ventasDirectas.length? `<table><thead><tr><th>Fecha</th><th>Producto</th><th class="num">Cantidad</th>
      <th class="num">Costo unitario</th><th class="num">Costo total</th><th></th></tr></thead>
      <tbody>${ventasDirectas.map(filaVentaDirecta).join('')}</tbody></table>`
     : `<div class="vacio">Todavía no se ha registrado ninguna venta directa.</div>`}
    <h3 style="color:var(--verde);margin:22px 0 8px">En consignación</h3>
    ${enConsig.length? `<table><thead><tr><th>Fecha</th><th>Producto</th><th>Consignatario</th><th class="num">Cantidad</th>
      <th class="num">Costo</th><th class="num"></th></tr></thead>
      <tbody>${enConsig.map(filaEnConsig).join('')}</tbody></table>`
     : `<div class="vacio">No hay mercadería en consignación pendiente de vender.</div>`}
    <h3 style="color:var(--verde);margin:22px 0 8px">Consignaciones ya vendidas</h3>
    ${vendidas.length? `<table><thead><tr><th>Fecha de venta</th><th>Producto</th><th>Consignatario</th><th class="num">Costo</th>
      <th class="num">Comisión</th><th class="num"></th></tr></thead>
      <tbody>${vendidas.map(filaVendida).join('')}</tbody></table>`
     : `<div class="vacio">Todavía no se ha vendido nada de consignación.</div>`}`;
};

/* El desplegable de producto es el mismo para venta directa y consignación:
   sale del inventario que realmente hay en existencia (entradas menos lo que
   ya salió antes), nunca de texto libre. */
function opsProductoInventario(e,seleccionado){
  const {lista}=inventarioDetalle(e);
  const disponibles=lista.filter(p=>p.cantidad>0.0001);
  if(!disponibles.length) return '';
  const peps=metodoCosteo(e)==='peps';
  return disponibles.map(p=>{
    /* En PEPS la próxima unidad que sale es la de la capa más vieja, no el promedio. */
    const cu=peps?costoSalidaInventario(e,p.producto,1).costoUnitario:p.costoUnitario;
    return `<option value="${esc(p.producto)}" data-costo="${cu}"
    data-disponible="${p.cantidad}"${p.producto===seleccionado?' selected':''}>
    ${esc(p.producto)} — ${p.cantidad} disp. · ${peps?'próxima unidad':'costo prom.'} Q${Q(cu)}/u</option>`;}).join('');
}

ACCIONES.nuevaVentaDirecta=()=>{
  const e=emp();
  const ops=opsProductoInventario(e);
  if(!ops){avisar('No hay productos con existencia en el inventario todavía. Cargá compras de bienes primero.');return}
  abrirModal('Nueva venta',
    `<p style="margin:0 0 14px;font-size:13px;color:var(--tinta-suave)">Esto solo descuenta la cantidad del
      inventario — no genera ninguna partida. El ingreso, el IVA y el costo de esta venta ya se registran,
      como siempre, cuando cargás la factura en "Cargar facturas".</p>
    <div class="rej">
      <div class="campo full"><label>Producto</label><select name="producto">${ops}</select></div>
      <div class="campo"><label>Cantidad vendida</label><input name="cantidad" type="number" step="0.01" min="0"></div>
      <div class="campo"><label>Fecha</label><input name="fecha" type="date" value="${hoy()}"></div>
    </div>
    <p id="previewVenta" style="margin:10px 0 0;font-size:13px;color:var(--tinta-suave)"></p>`,
    d=>{
      const cantidad=r2(+d.cantidad);
      const sel=mForm.querySelector('[name="producto"]');
      const opt=sel.options[sel.selectedIndex];
      const disponible=+opt.dataset.disponible;
      if(!cantidad||cantidad<=0){avisar('Escribí cuánto se vendió.');return false}
      if(cantidad>disponible){avisar(`Solo hay ${disponible} en existencia de ese producto.`);return false}
      const {costoUnitario,costoTotal}=costoSalidaInventario(e,d.producto,cantidad);
      e.salidasInventario=e.salidasInventario||[];
      e.salidasInventario.push({id:uid(),fecha:d.fecha||hoy(),producto:d.producto,cantidad,
        costoUnitario,costoTotal,motivo:'venta'});
      registrarLog('Registró salida de inventario por venta',`${d.producto} — ${cantidad} u.`);
      guardar();
      avisar(`Inventario actualizado: salieron ${cantidad} u. de ${d.producto}.`,'Listo');
    },'Registrar venta');
  const actualizarPreview=()=>{
    const sel=mForm.querySelector('[name="producto"]'), opt=sel.options[sel.selectedIndex];
    const cantidad=+mForm.querySelector('[name="cantidad"]').value||0;
    document.getElementById('previewVenta').innerHTML=
      `Disponible: ${opt.dataset.disponible} u. · Costo que sale del inventario (${METODOS_COSTEO[metodoCosteo(e)]}): Q${Q(costoSalidaInventario(e,sel.value,cantidad).costoTotal)}`;
  };
  mForm.querySelector('[name="producto"]').onchange=actualizarPreview;
  mForm.querySelector('[name="cantidad"]').oninput=actualizarPreview;
  actualizarPreview();
};

ACCIONES.editarVentaDirecta=d=>{
  const e=emp();
  const s=(e.salidasInventario||[]).find(x=>x.id===d.id);
  if(!s){avisar('No se encontró esa venta.');return}
  /* La disponible para validar tiene que sumarle de vuelta la cantidad que
     esta misma venta ya restó — si no, editarla sin cambiar nada daría
     "no hay suficiente" porque se estaría descontando dos veces. */
  const {lista}=inventarioDetalle(e);
  const item=lista.find(p=>p.producto===s.producto);
  const disponibleSinEsta=r2((item?item.cantidad:0)+s.cantidad);
  abrirModal('Editar venta',
    `<p style="margin:0 0 14px;font-size:13px;color:var(--tinta-suave)">Solo cambia el control de inventario de
      esta salida — no toca ninguna partida ni la factura ya cargada. El costo unitario se mantiene igual al que
      tenía cuando se registró, para no mezclarlo con el costo promedio de hoy.</p>
    <div class="rej">
      <div class="campo full"><label>Producto</label><input value="${esc(s.producto)}" disabled></div>
      <div class="campo"><label>Cantidad vendida</label><input name="cantidad" type="number" step="0.01" min="0" value="${s.cantidad}"></div>
      <div class="campo"><label>Fecha</label><input name="fecha" type="date" value="${s.fecha}"></div>
    </div>
    <p style="margin:10px 0 0;font-size:13px;color:var(--tinta-suave)">Disponible sin contar esta venta: ${disponibleSinEsta} u.
      · Costo unitario: Q${Q(s.costoUnitario)}</p>`,
    dd=>{
      const cantidad=r2(+dd.cantidad);
      if(!cantidad||cantidad<=0){avisar('Escribí cuánto se vendió.');return false}
      if(cantidad>disponibleSinEsta){avisar(`Solo hay ${disponibleSinEsta} en existencia de ese producto, contando lo que esta misma venta ya tenía descontado.`);return false}
      if(!dd.fecha){avisar('Escribí la fecha de la venta.');return false}
      s.cantidad=cantidad; s.fecha=dd.fecha; s.costoTotal=r2(cantidad*s.costoUnitario);
      registrarLog('Editó una venta directa',`${s.producto} — ahora ${cantidad} u. al ${fFecha(dd.fecha)}`);
      guardar(); pintar();
      avisar('Venta actualizada.','Listo');
    },'Guardar cambios');
};

ACCIONES.nuevaConsignacion=()=>{
  const e=emp();
  const ops=opsProductoInventario(e);
  if(!ops){avisar('No hay productos con existencia en el inventario todavía. Cargá compras de bienes primero.');return}
  const cuentasActivo=e.cuentas.filter(c=>c.d&&c.t==='activo'&&c.c!=='1.1.14');
  abrirModal('Nueva consignación',
    `<div class="rej">
      <div class="campo full"><label>Producto</label><select name="producto">${ops}</select></div>
      <div class="campo"><label>Cantidad</label><input name="cantidad" type="number" step="0.01" min="0"></div>
      <div class="campo"><label>Costo total</label><input name="costoTotal" type="number" step="0.01" min="0" readonly style="background:var(--fondo-suave)"></div>
      <div class="campo full"><label>Nombre del consignatario</label><input name="nombreConsignatario" placeholder="A quién le entregás la mercadería"></div>
      <div class="campo"><label>NIT del consignatario</label><input name="nitConsignatario" placeholder="CF si no tiene"></div>
      <div class="campo"><label>Fecha</label><input name="fecha" type="date" value="${hoy()}"></div>
      <div class="campo full"><label>¿De qué cuenta sale?</label><select name="cuentaOrigen">
        ${cuentasActivo.map(c=>`<option value="${c.c}"${c.c==='1.1.08'?' selected':''}>${c.c} — ${esc(c.n)}</option>`).join('')}
      </select></div>
    </div>`,
    d=>{
      const cantidad=r2(+d.cantidad);
      const sel=mForm.querySelector('[name="producto"]');
      const opt=sel.options[sel.selectedIndex];
      const disponible=+opt.dataset.disponible;
      const {costoUnitario,costoTotal}=costoSalidaInventario(e,d.producto,cantidad);
      if(!cantidad||cantidad<=0){avisar('Escribí cuánto sale a consignación.');return false}
      if(cantidad>disponible){avisar(`Solo hay ${disponible} en existencia de ese producto.`);return false}
      if(!d.nombreConsignatario.trim()){avisar('Escribí a nombre de quién sale la mercadería en consignación.');return false}
      asegurarCuenta(e,'1.1.14','Mercadería en consignación','activo');
      const p={id:uid(),numero:e.correlativo++,fecha:d.fecha||hoy(),
        concepto:`Mercadería en consignación — ${d.producto} — ${d.nombreConsignatario.trim()}`,
        docTipo:'',docSerie:'',docNum:'',nit:(d.nitConsignatario||'CF').trim(),contraparte:d.nombreConsignatario.trim(),
        lineas:[{cta:'1.1.14',desc:'',debe:costoTotal,haber:0},{cta:d.cuentaOrigen,desc:'',debe:0,haber:costoTotal}]};
      e.partidas.push(p);
      e.consignaciones=e.consignaciones||[];
      e.consignaciones.push({id:uid(),fecha:d.fecha||hoy(),producto:d.producto,
        nombreConsignatario:d.nombreConsignatario.trim(),nitConsignatario:(d.nitConsignatario||'CF').trim(),
        cantidad,costoTotal,cuentaOrigen:d.cuentaOrigen,estado:'en_consignacion',partidaConsignacionId:p.id});
      e.salidasInventario=e.salidasInventario||[];
      e.salidasInventario.push({id:uid(),fecha:d.fecha||hoy(),producto:d.producto,cantidad,
        costoUnitario,costoTotal,motivo:'consignacion',referenciaId:p.id});
      registrarLog('Registró mercadería en consignación',`${d.producto} — Q${Q(costoTotal)}`);
      guardar();
      avisar(`Consignación registrada en la partida No. ${p.numero}.`,'Listo');
    },'Registrar consignación');
  const actualizarCosto=()=>{
    const sel=mForm.querySelector('[name="producto"]'), opt=sel.options[sel.selectedIndex];
    const cantidad=+mForm.querySelector('[name="cantidad"]').value||0;
    mForm.querySelector('[name="costoTotal"]').value=costoSalidaInventario(e,sel.value,cantidad).costoTotal;
  };
  mForm.querySelector('[name="producto"]').onchange=actualizarCosto;
  mForm.querySelector('[name="cantidad"]').oninput=actualizarCosto;
  actualizarCosto();
};

ACCIONES.registrarVentaConsignacion=d0=>{
  const e=emp();
  const c=(e.consignaciones||[]).find(x=>x.id===d0.id);
  if(!c){avisar('No se encontró esa consignación.');return}

  abrirModal(`Terminar consignación — ${esc(c.producto)}`,
    `<p style="margin:0 0 14px;font-size:13px;color:var(--tinta-suave)">Salió a consignación el ${fFecha(c.fecha)}
      por un costo de Q${Q(c.costoTotal)}. Esto solo saca ese costo de "Mercadería en consignación" — el
      ingreso, el IVA y los datos del cliente se registran aparte, cuando cargués la factura real de esta venta
      en "Cargar facturas".</p>
    <div class="rej">
      <div class="campo"><label>Fecha de venta</label><input name="fechaVenta" type="date" value="${hoy()}"></div>
      <div class="campo"><label>Comisión al consignatario (opcional)</label><input name="comisionMonto" type="number" step="0.01" min="0" value="0"></div>
    </div>`,
    d=>{
      const comisionMonto=r2(+d.comisionMonto||0);
      asegurarCuenta(e,'6.1.08','Comisiones sobre ventas','gasto');
      asegurarCuenta(e,'2.1.16','Comisiones por pagar','pasivo');
      const lineas=[{cta:'5.1.01',desc:'',debe:c.costoTotal,haber:0},{cta:'1.1.14',desc:'',debe:0,haber:c.costoTotal}];
      if(comisionMonto) lineas.push({cta:'6.1.08',desc:'',debe:comisionMonto,haber:0},{cta:'2.1.16',desc:'',debe:0,haber:comisionMonto});

      const p={id:uid(),numero:e.correlativo++,fecha:d.fechaVenta||hoy(),
        concepto:`Salida de consignación por venta — ${c.producto}`,
        docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:c.nombreConsignatario||'',lineas};
      e.partidas.push(p);

      Object.assign(c,{estado:'vendido',fechaVenta:d.fechaVenta||hoy(),comisionMonto,partidaVentaId:p.id});
      registrarLog('Terminó una consignación',`${c.producto} — costo Q${Q(c.costoTotal)}`);
      guardar();
      avisar(`Inventario de consignación cerrado en la partida No. ${p.numero}. No olvidés cargar la factura real de esta venta en "Cargar facturas".`,'Listo');
    },'Terminar consignación');
};


VISTAS.empleados=()=>{
  const e=emp();
  e.empleados=e.empleados||[];
  const activos=e.empleados.filter(x=>x.activo!==false);
  const inactivos=e.empleados.filter(x=>x.activo===false);
  const fila=x=>`<tr${x.activo===false?' style="opacity:.55"':''}>
    <td>${esc(x.nombre)}${x.activo===false?' <span style="color:var(--alerta);font-size:12px">(baja)</span>':''}</td>
    <td>${esc(x.puesto||'—')}</td>
    <td>${x.fechaIngreso?fFecha(x.fechaIngreso):'<span style="color:var(--alerta)">sin definir</span>'}</td>
    <td class="num">${Q(x.salarioBase)}</td>
    <td class="num">
      <button class="btn mini sec" data-accion="editarEmpleado" data-id="${x.id}">Editar</button>
      ${x.activo===false?'':`<button class="btn mini" data-accion="liquidarEmpleado" data-id="${x.id}">Liquidar</button>`}
      ${(()=>{const l=(e.liquidaciones||[]).filter(z=>z.empleadoId===x.id).sort((a,b)=>b.fechaRetiro.localeCompare(a.fechaRetiro))[0];
        return l?`<button class="btn mini sec" data-accion="pdfFiniquito" data-id="${l.id}">Imprimir finiquito</button>`:'';})()}
      <button class="btn mini ${x.activo===false?'':'peligro'}" data-accion="alternarEmpleado" data-id="${x.id}">${x.activo===false?'Reactivar':'Dar de baja'}</button>
    </td></tr>`;
  return cab('Empleados','Salario base mensual completo, sin la bonificación incentivo — esa se calcula sola.',
    `<button class="btn" data-accion="nuevoEmpleado">Agregar empleado</button>`)
  + (e.empleados.length? `<table><thead><tr><th>Nombre</th><th>Puesto</th><th>Fecha de ingreso</th>
      <th class="num">Salario base mensual</th><th class="num"></th></tr></thead>
      <tbody>${activos.map(fila).join('')}${inactivos.map(fila).join('')}</tbody></table>`
     : `<div class="vacio">Todavía no hay empleados registrados.</div>`)
  + ((e.liquidaciones||[]).length?`<h3 style="color:var(--verde);margin:24px 0 8px">Liquidaciones</h3>
    <table style="font-size:13px"><thead><tr><th>Retiro</th><th>Empleado</th><th>Motivo</th><th class="num">Días laborados</th><th class="num">Total pagado</th><th class="num">Partida</th><th class="num"></th></tr></thead>

/* ============ LIQUIDACIÓN FINAL DE UN EMPLEADO QUE SE RETIRA ============ */
/* Lo que hay provisionado y todavía sin pagar de una prestación para un empleado: lo que
   fueron acumulando sus planillas, menos lo ya pagado y menos lo que ya cancelaron liquidaciones. */
function provisionPendienteEmpleado(e,empleadoId,tipo){
  const prov=(e.planillas||[]).filter(p=>p.partidaNumero).reduce((s,p)=>s+p.detalle.filter(f=>f.empleadoId===empleadoId)
    .reduce((a,f)=>a+((f.prestaciones||{})[tipo]||0),0),0);
  const pagado=(e.pagosPrestaciones||[]).filter(p=>p.tipo===tipo).reduce((s,p)=>s+p.detalle
    .filter(f=>f.empleadoId===empleadoId).reduce((a,f)=>a+(f.monto||0),0),0);
  const liq=(e.liquidaciones||[]).filter(l=>l.empleadoId===empleadoId)
    .reduce((s,l)=>s+(((l.conceptos||{})[tipo]||{}).provision||0),0);
  return r2(Math.max(0,prov-pagado-liq));
}
/* Cuánto se le debe a quien se retira, por cada concepto. Todas son una proporción de su monto
   de un año, medida contra los días REALES del período —365 o 366—, de modo que un período
   completo paga exactamente un sueldo (o medio, en vacaciones) aunque haya cruzado un 29 de febrero:
   · Indemnización: (sueldo × 14 ÷ 12) por año de servicio = (((sueldo × 14) ÷ 12) ÷ 365) × días
     laborados, con los años completos contados como años y solo la fracción del año en curso
     medida en días.
   · Aguinaldo: sueldo × días trabajados del período (1 dic – 30 nov) ÷ días del período.
   · Bono 14: sueldo × días trabajados del período (1 jul – 30 jun) ÷ días del período.
   · Vacaciones: (sueldo ÷ 2) × días del año de servicio en curso ÷ días de ese año, contado desde
     el aniversario de ingreso. Se pagan cada año y no se acumulan: lo de años anteriores solo se
     suma si se indica expresamente (aniosVacPendientes). */
function calcularLiquidacion(emp,fechaRetiro,aniosVacPendientes){
  const ing=emp.fechaIngreso, sal=emp.salarioBase, anio=+fechaRetiro.slice(0,4);
  const mayor=(a,b)=>a>b?a:b;
  const bisiesto=y=>(y%4===0&&y%100!==0)||y%400===0;
  const enAnio=(y,mmdd)=>mmdd==='02-29'&&!bisiesto(y)?`${y}-02-28`:`${y}-${mmdd}`;
  const masDia=(f,k)=>{ const d=new Date(f+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+k); return d.toISOString().slice(0,10); };
  const ultimo=mmdd=>{ const f=enAnio(anio,mmdd); return f<=fechaRetiro?f:enAnio(anio-1,mmdd); };

  const diasLaborados=diasEntre(ing,fechaRetiro);
  /* Aguinaldo y Bono 14: período legal en curso, y cuántos días tiene de verdad. */
  const periodo=(mmdd,finMMDD)=>{
    const ini=ultimo(mmdd), fin=enAnio(+ini.slice(0,4)+1,finMMDD);
    return {trabajados:diasEntre(mayor(ing,ini),fechaRetiro), delPeriodo:diasEntre(ini,fin), ini};
  };
  const ag=periodo('12-01','11-30'), b14=periodo('07-01','06-30');
  /* Años de servicio: completos, más la fracción del año en curso. */
  const aniv=n=>enAnio(+ing.slice(0,4)+n,ing.slice(5));
  let n=0; while(masDia(aniv(n+1),-1)<=fechaRetiro) n++;
  const iniParcial=aniv(n), diasParcial=fechaRetiro>=iniParcial?diasEntre(iniParcial,fechaRetiro):0;
  const diasAnioServicio=diasEntre(iniParcial,masDia(aniv(n+1),-1));
  const aniosServicio=n+diasParcial/diasAnioServicio;
  /* Vacaciones: el año de servicio en curso, desde el último aniversario (o desde el ingreso, el primer año). */
  let inicioVac=enAnio(+ultimo(ing.slice(5)).slice(0,4),ing.slice(5));
  if(inicioVac<ing) inicioVac=ing;
  const finVac=masDia(enAnio(+inicioVac.slice(0,4)+1,ing.slice(5)),-1);
  const diasVac=diasEntre(inicioVac,fechaRetiro), diasAnioVac=diasEntre(inicioVac,finVac);
  const anteriores=Math.min(5,Math.max(0,Math.floor(+aniosVacPendientes||0)));   // máximo 5 años (Art. 136, Código de Trabajo)

  return {diasLaborados,aniosServicio,
    diasAg:ag.trabajados,diasPeriodoAg:ag.delPeriodo,iniAg:ag.ini,iniB14:b14.ini,
    diasB14:b14.trabajados,diasPeriodoB14:b14.delPeriodo,
    diasVac,diasAnioVac,aniosVacPendientes:anteriores,
    indemnizacion:r2(sal*14/12*aniosServicio),
    aguinaldo:r2(sal*ag.trabajados/ag.delPeriodo),
    bono14:r2(sal*b14.trabajados/b14.delPeriodo),
    vacaciones:r2(sal/2*diasVac/diasAnioVac+anteriores*sal/2)};
}
const LIQUIDACION_CONCEPTOS=[
  {k:'indemnizacion',nombre:'Indemnización',pasivo:'2.1.14',nPasivo:'Indemnización por pagar (provisión)',gasto:'6.2.21',nGasto:'Provisión de indemnización'},
  {k:'aguinaldo',nombre:'Aguinaldo proporcional',pasivo:'2.1.11',nPasivo:'Aguinaldo por pagar',gasto:'6.2.18',nGasto:'Provisión de aguinaldo'},
  {k:'bono14',nombre:'Bono 14 proporcional',pasivo:'2.1.12',nPasivo:'Bono 14 por pagar',gasto:'6.2.19',nGasto:'Provisión de Bono 14'},
  {k:'vacaciones',nombre:'Vacaciones pendientes',pasivo:'2.1.13',nPasivo:'Vacaciones por pagar',gasto:'6.2.20',nGasto:'Provisión de vacaciones'}];
const MOTIVOS_RETIRO={
  despido_injustificado:{nombre:'Despido injustificado o indirecto — corresponde indemnización',indemniza:true},
  renuncia:{nombre:'Renuncia voluntaria',indemniza:false},
  mutuo:{nombre:'Mutuo acuerdo (si se pactó pagar indemnización, escribí el monto)',indemniza:false},
  despido_justificado:{nombre:'Despido justificado',indemniza:false}};

ACCIONES.liquidarEmpleado=d=>{
  if(!puedeEliminar()){avisar('Tu rol no tiene permiso para liquidar empleados. Pedile a tu gerente que lo haga.');return}
  const e=emp(), x=e.empleados.find(y=>y.id===d.id);
  if(!x){avisar('No se encontró ese empleado.');return}
  if(!x.fechaIngreso){avisar('A este empleado le falta la fecha de ingreso: sin ella no se puede calcular su liquidación. Agregala en Editar.');return}
  const cajaBanco=cuentasCajaBanco(e);
  if(!cajaBanco.length){avisar('El catálogo no tiene ninguna cuenta de Caja o Bancos.');return}
  abrirModal(`Liquidar a ${esc(x.nombre)}`,
    `<p style="margin:0 0 12px;font-size:13px;color:var(--tinta-suave)">Ingresó el ${fFecha(x.fechaIngreso)} · sueldo base Q${Q(x.salarioBase)}.
      Los montos salen de la fórmula de cada prestación y se pueden ajustar. Lo que ya estaba provisionado en sus planillas se cancela, y la diferencia se lleva a gasto (o se libera, si sobraba).</p>
    <div class="rej">
      <div class="campo"><label>Fecha de retiro</label><input name="fechaRetiro" type="date" value="${hoy()}"></div>
      <div class="campo"><label>Se paga desde</label><select name="cuenta">${cajaBanco.map(c=>`<option value="${c.c}">${c.c} — ${esc(c.n)}</option>`).join('')}</select></div>
      <div class="campo full"><label>Motivo del retiro</label><select name="motivo">${Object.entries(MOTIVOS_RETIRO).map(([k,m])=>`<option value="${k}">${m.nombre}</option>`).join('')}</select></div>
      <div class="campo full"><label>Años de vacaciones de años anteriores que no se gozaron ni se pagaron</label>
        <input name="aniosVac" type="number" min="0" step="1" value="0">
        <span style="font-size:12.5px;color:var(--tinta-suave)">Las vacaciones deben gozarse cada año. Si al terminar la relación le quedaron años sin gozar ni pagar, se pueden reclamar hasta 5 (Art. 136, Código de Trabajo): escribí cuántos (cada uno suma medio sueldo).</span></div>
    </div>
    <table style="font-size:13px;margin-top:10px"><thead><tr><th>Concepto</th><th class="num">Se le debe</th><th class="num">Ya provisionado</th><th class="num">Ajuste a gasto</th></tr></thead>
      <tbody id="tbLiq"></tbody><tfoot><tr class="total"><td>Total neto a pagar</td><td class="num" id="totLiq"></td><td colspan="2"></td></tr></tfoot></table>
    <p id="detalleLiq" style="margin:8px 0 0;font-size:12.5px;color:var(--tinta-suave)"></p>
    <div class="aviso">La indemnización, el aguinaldo y el Bono 14 están exentos de IGSS y de ISR. Las vacaciones pagadas sí llevan IGSS laboral y patronal e ISR: se calculan solos y los podés ajustar. No incluye el sueldo de los días trabajados del último período (eso va en la planilla). Las vacaciones son las del año de servicio en curso; si le quedan años anteriores pendientes, indicalo arriba.</div>`,
    f=>{
      if(!f.fechaRetiro){avisar('Escribí la fecha de retiro.');return false}
      if(f.fechaRetiro<x.fechaIngreso){avisar('La fecha de retiro no puede ser anterior a la de ingreso.');return false}
      const montos={}, conceptos={};
      let total=0;
      for(const c of LIQUIDACION_CONCEPTOS){
        const v=r2(+mForm.querySelector(`[name="m_${c.k}"]`).value||0);
        if(v<0){avisar('Los montos no pueden ser negativos.');return false}
        montos[c.k]=v; total=r2(total+v);
      }
      const lineas=[];
      LIQUIDACION_CONCEPTOS.forEach(c=>{
        const D=montos[c.k], P=provisionPendienteEmpleado(e,x.id,c.k);
        conceptos[c.k]={debido:D,provision:P};
        if(!D&&!P) return;
        asegurarCuenta(e,c.pasivo,c.nPasivo,'pasivo'); asegurarCuenta(e,c.gasto,c.nGasto,'gasto');
        if(P>0) lineas.push({cta:c.pasivo,desc:`Liquidación de ${x.nombre}`,debe:P,haber:0});
        if(D>P) lineas.push({cta:c.gasto,desc:`Liquidación de ${x.nombre}`,debe:r2(D-P),haber:0});
        if(P>D) lineas.push({cta:c.gasto,desc:`Liquidación de ${x.nombre} — provisión que sobraba`,debe:0,haber:r2(P-D)});
      });
      let partidaNumero=null, partidaId=null;
      /* Descuentos y cargos: IGSS laboral e ISR salen del pago al empleado; las cuotas patronales son gasto de la empresa. */
      const igssLab=r2(+mForm.querySelector('[name="d_igss"]').value||0), isrLiq=r2(+mForm.querySelector('[name="d_isr"]').value||0);
      if(igssLab<0||isrLiq<0){avisar('Los descuentos no pueden ser negativos.');return false}
      if(igssLab+isrLiq>total+0.004){avisar('Los descuentos no pueden superar lo que se le debe.');return false}
      const pat=cargosSobreVacaciones(x.salarioBase,montos.vacaciones,f.fechaRetiro.slice(0,4));
      const patronalTotal=r2(pat.igssPatronal+pat.intecap+pat.irtra);
      const bruto=total, neto=r2(total-igssLab-isrLiq);
      if(patronalTotal>0){
        asegurarCuenta(e,'6.2.16','Cuota patronal INTECAP','gasto'); asegurarCuenta(e,'6.2.17','Cuota patronal IRTRA','gasto');
        lineas.push({cta:'6.2.03',desc:`Cuota patronal IGSS — liquidación de ${x.nombre}`,debe:pat.igssPatronal,haber:0},
          {cta:'6.2.16',desc:`INTECAP — liquidación de ${x.nombre}`,debe:pat.intecap,haber:0},
          {cta:'6.2.17',desc:`IRTRA — liquidación de ${x.nombre}`,debe:pat.irtra,haber:0},
          {cta:'2.1.08',desc:`Cuotas patronales — liquidación de ${x.nombre}`,debe:0,haber:patronalTotal});
      }
      if(igssLab>0) lineas.push({cta:'2.1.07',desc:`IGSS laboral — liquidación de ${x.nombre}`,debe:0,haber:igssLab});
      if(isrLiq>0) lineas.push({cta:'2.1.06',desc:`ISR retenido — liquidación de ${x.nombre}`,debe:0,haber:isrLiq});
      total=neto;
      if(total>0) lineas.push({cta:f.cuenta,desc:`Liquidación de ${x.nombre}`,debe:0,haber:total});
      if(lineas.length){
        const p={id:uid(),numero:e.correlativo++,fecha:f.fechaRetiro,
          concepto:`Liquidación final de ${x.nombre} — ${MOTIVOS_RETIRO[f.motivo].nombre.split(' — ')[0]}`,
          docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:x.nombre,lineas};
        e.partidas.push(p); partidaNumero=p.numero; partidaId=p.id;
      }
      e.liquidaciones=e.liquidaciones||[];
      e.liquidaciones.push({id:uid(),empleadoId:x.id,nombre:x.nombre,fechaRetiro:f.fechaRetiro,motivo:f.motivo,
        diasLaborados:diasEntre(x.fechaIngreso,f.fechaRetiro),conceptos,bruto,total,
        deducciones:{igssLaboral:igssLab,isr:isrLiq},patronal:{igss:pat.igssPatronal,intecap:pat.intecap,irtra:pat.irtra},cuentaPago:f.cuenta,partidaNumero,partidaId});
      x.activo=false; x.fechaRetiro=f.fechaRetiro; x.motivoRetiro=f.motivo;
      registrarLog('Liquidó a un empleado',`${x.nombre} — ${fFecha(f.fechaRetiro)} — Q${Q(total)}`);
      guardar(); pintar();
      avisar(`${x.nombre} liquidado por Q${Q(total)}${partidaNumero?`, en la partida No. ${partidaNumero}`:''}. Quedó dado de baja.`,'Listo');
    },'Liquidar y dar de baja');
  const dibujar=(reiniciar)=>{
    const fecha=mForm.querySelector('[name="fechaRetiro"]').value, motivo=mForm.querySelector('[name="motivo"]').value;
    if(!fecha||fecha<x.fechaIngreso){document.getElementById('tbLiq').innerHTML='<tr><td colspan="4">Elegí una fecha de retiro posterior al ingreso.</td></tr>';return}
    const c=calcularLiquidacion(x,fecha,mForm.querySelector('[name="aniosVac"]').value);
    /* Si ya se pagó (por adelantado) parte del Aguinaldo o del Bono 14 del período en
       curso, se descuenta: no se paga dos veces la misma prestación. */
    const yaPagado=k=>{
      const ini=k==='aguinaldo'?c.iniAg:k==='bono14'?c.iniB14:null; if(!ini) return 0;
      return r2((e.pagosPrestaciones||[]).filter(p=>p.tipo===k&&p.hasta>=ini)
        .reduce((s,p)=>s+p.detalle.filter(f=>f.empleadoId===x.id).reduce((a,f)=>a+(f.monto||0),0),0));
    };
    const sugerido=k=>k==='indemnizacion'&&!MOTIVOS_RETIRO[motivo].indemniza?0:r2(Math.max(0,c[k]-yaPagado(k)));
    document.getElementById('tbLiq').innerHTML=LIQUIDACION_CONCEPTOS.map(co=>{
      const P=provisionPendienteEmpleado(e,x.id,co.k);
      return `<tr><td>${co.nombre}</td><td class="num"><input name="m_${co.k}" type="number" step="0.01" min="0" value="${sugerido(co.k)}" style="width:110px;text-align:right"></td>
        <td class="num">${Q(P)}</td><td class="num" data-ajuste="${co.k}"></td></tr>`;}).join('')
      +`<tr><td>(−) IGSS laboral sobre vacaciones</td><td class="num"><input name="d_igss" type="number" step="0.01" min="0" value="0" style="width:110px;text-align:right"></td><td colspan="2" style="font-size:12px;color:var(--tinta-suave)">4.83% — indemnización, aguinaldo y Bono 14 no pagan</td></tr>
        <tr><td>(−) ISR sobre vacaciones</td><td class="num"><input name="d_isr" type="number" step="0.01" min="0" value="0" style="width:110px;text-align:right"></td><td colspan="2" style="font-size:12px;color:var(--tinta-suave)">estimado sobre su renta anual</td></tr>
        <tr><td colspan="4" id="patLiq" style="font-size:12.5px;color:var(--tinta-suave)"></td></tr>`;
    document.getElementById('detalleLiq').textContent=`${c.diasLaborados} días laborados (${c.aniosServicio.toFixed(4)} años de servicio) · aguinaldo: ${c.diasAg} de ${c.diasPeriodoAg} días del período · Bono 14: ${c.diasB14} de ${c.diasPeriodoB14} · vacaciones: ${c.diasVac} de ${c.diasAnioVac} días de su año de servicio${c.aniosVacPendientes?`, más ${c.aniosVacPendientes} año(s) anterior(es)`:''}.`;
    const recalcular=(autoDescuentos)=>{
      let total=0;
      LIQUIDACION_CONCEPTOS.forEach(co=>{
        const D=r2(+mForm.querySelector(`[name="m_${co.k}"]`).value||0), P=provisionPendienteEmpleado(e,x.id,co.k);
        total=r2(total+D);
        mForm.querySelector(`[data-ajuste="${co.k}"]`).textContent=Q(r2(D-P));
      });
      const cg=cargosSobreVacaciones(x.salarioBase,mForm.querySelector('[name="m_vacaciones"]').value,(fecha||hoy()).slice(0,4));
      if(autoDescuentos){ mForm.querySelector('[name="d_igss"]').value=cg.igssLaboral; mForm.querySelector('[name="d_isr"]').value=cg.isr; }
      const dIgss=r2(+mForm.querySelector('[name="d_igss"]').value||0), dIsr=r2(+mForm.querySelector('[name="d_isr"]').value||0);
      document.getElementById('patLiq').textContent=`Cuotas patronales sobre las vacaciones (gasto de la empresa, no se descuentan al empleado): IGSS Q${Q(cg.igssPatronal)} · INTECAP Q${Q(cg.intecap)} · IRTRA Q${Q(cg.irtra)}.`;
      document.getElementById('totLiq').textContent=Q(r2(total-dIgss-dIsr));
    };
    LIQUIDACION_CONCEPTOS.forEach(co=>{ mForm.querySelector(`[name="m_${co.k}"]`).oninput=()=>recalcular(true); });
    mForm.querySelector('[name="d_igss"]').oninput=()=>recalcular(false);
    mForm.querySelector('[name="d_isr"]').oninput=()=>recalcular(false);
    recalcular(true);
  };
  mForm.querySelector('[name="fechaRetiro"]').onchange=()=>dibujar(true);
  mForm.querySelector('[name="motivo"]').onchange=()=>dibujar(true);
  mForm.querySelector('[name="aniosVac"]').onchange=()=>dibujar(true);
  dibujar(true);
};


/* ---- Pago de prestaciones laborales (aguinaldo, Bono 14, vacaciones,
   indemnización): liquida en efectivo/banco lo que ya se venía provisionando
   mes a mes en cada planilla. El monto por empleado sale de sumar lo
   provisionado en las planillas ya generadas dentro del rango de fechas que
   se elija — por eso es importante no repetir el mismo período dos veces. ---- */
const PRESTACION_INFO={
  aguinaldo:{nombre:'Aguinaldo', ctaGasto:null, ctaPasivo:'2.1.11'},
  bono14:{nombre:'Bono 14', ctaGasto:null, ctaPasivo:'2.1.12'},
  vacaciones:{nombre:'Vacaciones', ctaGasto:null, ctaPasivo:'2.1.13'},
  indemnizacion:{nombre:'Indemnización', ctaGasto:null, ctaPasivo:'2.1.14'},
};
function provisionadoPorEmpleado(e,tipo,desde,hasta){
  const acum={};
  (e.planillas||[]).filter(p=>p.partidaNumero&&p.fechaPago>=desde && p.fechaPago<=hasta).forEach(p=>{
    p.detalle.forEach(f=>{
      const monto=(f.prestaciones||{})[tipo]||0;
      if(!monto) return;
      acum[f.empleadoId]=acum[f.empleadoId]||{empleadoId:f.empleadoId,nombre:f.nombre,monto:0};
      acum[f.empleadoId].monto=r2(acum[f.empleadoId].monto+monto);
    });
  });
  return Object.values(acum).filter(x=>x.monto>0).sort((a,b)=>b.monto-a.monto);
}

function enlazarFormularioPago(){
  const b=borradorPago, e=emp();

    b.detalle=provisionadoPorEmpleado(e,b.tipo,b.desde,b.hasta).map(x=>({...x,excluido:false}));
    pintar();

  if(pgTipo) pgTipo.onchange=()=>{

    b.desde=periodo.desde; b.hasta=periodo.hasta;
    recalcular();
  };
  const pgDesde=document.getElementById('pgDesde'); if(pgDesde) pgDesde.onchange=()=>{ b.desde=pgDesde.value; recalcular(); };
  const pgHasta=document.getElementById('pgHasta'); if(pgHasta) pgHasta.onchange=()=>{ b.hasta=pgHasta.value; recalcular(); };

/* Período legal de cómputo, según a qué fecha estemos: Aguinaldo (Dto. 76-78)
   corre del 1 de diciembre al 30 de noviembre siguiente; Bono 14 (Dto. 42-92)
   del 1 de julio al 30 de junio siguiente. Vacaciones e indemnización no
   tienen un período fijo así en la ley — se usa el año calendario como
   referencia razonable, editable a mano si hace falta. */
function periodoLegalPrestacion(tipo,fechaRef){
  const d=new Date(fechaRef+'T00:00:00'), anio=d.getFullYear(), mes=d.getMonth()+1;
  if(tipo==='aguinaldo'){
    return mes===12 ? {desde:`${anio}-12-01`,hasta:`${anio+1}-11-30`} : {desde:`${anio-1}-12-01`,hasta:`${anio}-11-30`};
  }
  if(tipo==='bono14'){
    return mes>=7 ? {desde:`${anio}-07-01`,hasta:`${anio+1}-06-30`} : {desde:`${anio-1}-07-01`,hasta:`${anio}-06-30`};
  }
  return {desde:`${anio}-01-01`,hasta:`${anio}-12-31`};
}

  borradorPago={tipo, desde:periodo.desde, hasta:periodo.hasta, fechaPago:h, cuentaPago:cajaBanco[0].c,
    detalle:provisionadoPorEmpleado(e,tipo,periodo.desde,periodo.hasta).map(x=>({...x,excluido:false}))};
  pintar();
};

function enlazarFormularioPlanilla(){
  const b=borradorPlanilla, e=emp();
  const recalcular=(i)=>{
    const filasARecalcular = i===undefined ? b.detalle.map((_,idx)=>idx) : [i];

      if(empleado) b.detalle[idx]=Object.assign(
        calcularPlanillaEmpleado(empleado,b.periodo,{diasFalta:f.diasFalta,horasExtra:f.horasExtra,horasExtraDomingo:f.horasExtraDomingo,horasMenos:f.horasMenos,bonoAdicional:f.bonoAdicional},{desde:b.desde,hasta:b.hasta}),
        {excluido:f.excluido});
    });
    pintar();
  };
  const pPeriodo=document.getElementById('pPeriodo');
  if(pPeriodo) pPeriodo.onchange=()=>{ b.periodo=pPeriodo.value; recalcular(); };
  const pDesde=document.getElementById('pDesde'); if(pDesde) pDesde.onchange=()=>b.desde=pDesde.value;
  const pHasta=document.getElementById('pHasta'); if(pHasta) pHasta.onchange=()=>b.hasta=pHasta.value;
  const pFechaPago=document.getElementById('pFechaPago'); if(pFechaPago) pFechaPago.onchange=()=>b.fechaPago=pFechaPago.value;
  const pCuenta=document.getElementById('pCuenta'); if(pCuenta) pCuenta.onchange=()=>b.cuentaPago=pCuenta.value;
  document.querySelectorAll('[data-campo-emp]').forEach(inp=>{
    inp.onchange=()=>{
      const i=+inp.dataset.fila;
      b.detalle[i][inp.dataset.campoEmp]=+inp.value||0;
      recalcular(i);
    };
  });
  document.querySelectorAll('[data-incluir]').forEach(ch=>{
    ch.onchange=()=>{ b.detalle[+ch.dataset.incluir].excluido=!ch.checked; pintar(); };
  });
}

/* La planilla y su partida contable son dos pasos separados: primero se genera la planilla
   (para revisarla y corregirla), y solo cuando está bien se "Genera la partida en libros".
   Mientras no tenga partida, la planilla se puede editar o eliminar, y sus provisiones de
   prestaciones todavía no cuentan para nada. */
function postearPartidaPlanilla(e,pl){
  const t=pl.totales;
  asegurarCuenta(e,'6.2.16','Cuota patronal INTECAP','gasto');
  asegurarCuenta(e,'6.2.17','Cuota patronal IRTRA','gasto');
  asegurarCuenta(e,'6.2.18','Provisión de aguinaldo','gasto');
  asegurarCuenta(e,'6.2.19','Provisión de Bono 14','gasto');
  asegurarCuenta(e,'6.2.20','Provisión de vacaciones','gasto');
  asegurarCuenta(e,'6.2.21','Provisión de indemnización','gasto');
  asegurarCuenta(e,'2.1.11','Aguinaldo por pagar','pasivo');
  asegurarCuenta(e,'2.1.12','Bono 14 por pagar','pasivo');
  asegurarCuenta(e,'2.1.13','Vacaciones por pagar','pasivo');
  asegurarCuenta(e,'2.1.14','Indemnización por pagar (provisión)','pasivo');
  const lineas=[];
  const add=(cta,debe,haber)=>{ if(debe||haber) lineas.push({cta,desc:'',debe:r2(debe||0),haber:r2(haber||0)}); };
  /* Gasto del período: salario ordinario y extraordinario (incluye horas extra y bonos
     adicionales, que sí son salario, y resta las horas de menos), bonificación incentivo,
     cuota patronal completa, y la provisión de las cuatro prestaciones. */
  add('6.2.01',r2(t.salario+t.horasExtra+t.horasExtraDomingo+t.bonoAdicional-t.horasMenos),0);
  add('6.2.02',t.bonif,0);
  add('6.2.03',t.igssPatronal,0);
  add('6.2.16',t.intecap,0);
  add('6.2.17',t.irtra,0);
  add('6.2.18',t.aguinaldo,0);
  add('6.2.19',t.bono14,0);
  add('6.2.20',t.vacaciones,0);
  add('6.2.21',t.indemnizacion,0);
  /* Pasivos: lo que se paga en efectivo/banco, y lo pendiente con el IGSS, la SAT y las prestaciones futuras. */
  add(pl.cuentaPago,0,t.liquido);
  add('2.1.07',0,t.igssLaboral);
  add('2.1.08',0,r2(t.igssPatronal+t.intecap+t.irtra));
  if(t.isr) add('2.1.06',0,t.isr);
  add('2.1.11',0,t.aguinaldo);
  add('2.1.12',0,t.bono14);
  add('2.1.13',0,t.vacaciones);
  add('2.1.14',0,t.indemnizacion);
  const n=pl.detalle.length;
  const p={id:uid(),numero:e.correlativo++,fecha:pl.fechaPago,
    concepto:`Planilla ${pl.periodo} del ${fFecha(pl.desde)} al ${fFecha(pl.hasta)} — ${n} empleado${n===1?'':'s'}`,
    docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',lineas};
  e.partidas.push(p);
  pl.partidaNumero=p.numero; pl.partidaId=p.id;
  return p;
}
ACCIONES.confirmarPlanilla=()=>{
  const e=emp(), b=borradorPlanilla;
  const incluidos=b.detalle.filter(f=>!f.excluido);
  if(!incluidos.length){avisar('No hay ningún empleado incluido en esta planilla.');return}
  if(!b.fechaPago){avisar('Elegí la fecha de pago.');return}
  const sum=campo=>r2(incluidos.reduce((s,f)=>s+f[campo],0));
  const sumPrest=campo=>r2(incluidos.reduce((s,f)=>s+f.prestaciones[campo],0));
  const totales={
    salario:sum('salarioPeriodo'),horasExtra:sum('montoHorasExtra'),horasExtraDomingo:sum('montoHorasExtraDomingo'),bonoAdicional:sum('bonoAdicional'),
    horasMenos:sum('descuentoHorasMenos'),
    bonif:sum('bonifPeriodo'),igssLaboral:sum('igssLaboral'),isr:sum('isr'),liquido:sum('liquido'),
    igssPatronal:sum('igssPatronal'),intecap:sum('intecap'),irtra:sum('irtra'),
    aguinaldo:sumPrest('aguinaldo'),bono14:sumPrest('bono14'),vacaciones:sumPrest('vacaciones'),indemnizacion:sumPrest('indemnizacion'),
  };
  const editando=b.editandoId?(e.planillas||[]).find(x=>x.id===b.editandoId):null;
  if(editando&&editando.partidaNumero){avisar('Esa planilla ya tiene partida en libros: ya no se puede editar.');return}
  confirmar(`Se ${editando?'guardarán los cambios de':'generará'} la planilla ${b.periodo} del ${fFecha(b.desde)} al ${fFecha(b.hasta)}, con ${incluidos.length} empleado(s), por un líquido total de Q${Q(totales.liquido)}.\n\nTodavía NO se registra en los libros: podés revisarla y corregirla, y cuando esté bien usás "Generar partida en libros".`,()=>{
    e.planillas=e.planillas||[];
    const datos={periodo:b.periodo,desde:b.desde,hasta:b.hasta,fechaPago:b.fechaPago,cuentaPago:b.cuentaPago,detalle:incluidos,totales};
    if(editando){
      /* Se conserva el estado de pago y correo de quien ya lo tenía. */
      incluidos.forEach(f=>{ const ant=editando.detalle.find(x=>x.empleadoId===f.empleadoId); if(ant){ if(ant.pago) f.pago=ant.pago; if(ant.correo) f.correo=ant.correo; } });
      Object.assign(editando,datos);
      registrarLog('Corrigió una planilla sin partida',`${b.periodo} del ${fFecha(b.desde)} al ${fFecha(b.hasta)} — Q${Q(totales.liquido)}`);
    }else{
      e.planillas.push({id:uid(),...datos,partidaNumero:null,partidaId:null});
      registrarLog('Generó una planilla',`${b.periodo} del ${fFecha(b.desde)} al ${fFecha(b.hasta)} — ${incluidos.length} empleados, Q${Q(totales.liquido)}`);
    }
    borradorPlanilla=null; guardar(); VISTA='planillas'; pintar();
    avisar(`Planilla ${editando?'actualizada':'generada'}. Aún no tiene partida en libros: cuando la hayas revisado, usá "Generar partida".`,'Listo');
  },editando?'Guardar cambios':'Generar planilla');
};
ACCIONES.generarPartidaPlanilla=d=>{
  const e=emp(), pl=(e.planillas||[]).find(x=>x.id===d.id);
  if(!pl){avisar('No se encontró esa planilla.');return}
  if(pl.partidaNumero){avisar(`Esta planilla ya tiene su partida (No. ${pl.partidaNumero}).`);return}
  const anio=pl.fechaPago.slice(0,4);
  if((e.partidas||[]).some(x=>(x.concepto||'').startsWith(PREFIJO_CIERRE_LIBROS+anio))){
    avisar(`El ejercicio ${anio} ya tiene Cierre de libros: no se le pueden agregar partidas. Cambiá la fecha de pago de la planilla (Editar) o deshacé el cierre.`);return}
  confirmar(`Se registrará en los libros la planilla ${pl.periodo} del ${fFecha(pl.desde)} al ${fFecha(pl.hasta)}: sueldos, IGSS, ISR, cuota patronal y provisión de prestaciones, por un líquido de Q${Q(pl.totales.liquido)}, con fecha ${fFecha(pl.fechaPago)}.\n\nDespués de esto la planilla ya no se podrá editar.`,()=>{
    const p=postearPartidaPlanilla(e,pl);
    registrarLog('Generó la partida de una planilla',`${pl.periodo} del ${fFecha(pl.desde)} al ${fFecha(pl.hasta)} — partida No. ${p.numero}`);
    guardar(); pintar();
    avisar(`Partida No. ${p.numero} registrada en los libros.`,'Listo');
  },'Generar partida');
};
ACCIONES.editarPlanilla=d=>{
  const e=emp(), pl=(e.planillas||[]).find(x=>x.id===d.id);
  if(!pl){avisar('No se encontró esa planilla.');return}
  if(pl.partidaNumero){avisar('Esa planilla ya tiene partida en libros: ya no se puede editar.');return}
  const enPlanilla=new Set(pl.detalle.map(f=>f.empleadoId));
  const otros=(e.empleados||[]).filter(x=>x.activo!==false&&!enPlanilla.has(x.id))
    .map(x=>({...calcularPlanillaEmpleado(x,pl.periodo,{},{desde:pl.desde,hasta:pl.hasta}),excluido:true}));
  borradorPlanilla={editandoId:pl.id,periodo:pl.periodo,desde:pl.desde,hasta:pl.hasta,fechaPago:pl.fechaPago,cuentaPago:pl.cuentaPago,
    detalle:[...pl.detalle.map(f=>({...f,excluido:false})),...otros]};
  VISTA='planillas'; pintar();
};
ACCIONES.eliminarPlanilla=d=>{
  if(!puedeEliminar()){avisar('Tu rol no tiene permiso para eliminar planillas.');return}
  const e=emp(), pl=(e.planillas||[]).find(x=>x.id===d.id);
  if(!pl){avisar('No se encontró esa planilla.');return}
  if(pl.partidaNumero){avisar('Esta planilla ya tiene partida en libros. Para quitarla, eliminá primero su partida.');return}
  confirmar(`Se eliminará la planilla ${pl.periodo} del ${fFecha(pl.desde)} al ${fFecha(pl.hasta)} (todavía sin partida en libros).`,()=>{
    e.planillas=e.planillas.filter(x=>x.id!==pl.id);
    registrarLog('Eliminó una planilla sin partida',`${pl.periodo} del ${fFecha(pl.desde)} al ${fFecha(pl.hasta)}`);
    guardar(); pintar();
  },'Eliminar');
};
