<meta charset="utf-8">
<title>Módulo Contable TINBREW</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,450;9..144,600&display=swap" rel="stylesheet">
<style>
/* ============ ESTILOS — Variables, tipografía y layout general ============ */
:root{
  --papel:#FBFAF7; --tinta:#17251D; --tinta-suave:#5E6B62;
  --linea:#E2DED4; --linea-fuerte:#BDB6A6;
  --verde:#1F442F; --dorado:#DF9B36; --crema:#F2DBAD;
  --debe:#1F442F; --haber:#9C5A11;
  --panel:#FFFFFF; --activo:#F4EFE3; --alerta:#9C2F35; --ok:#1F442F;
  --tipo: 'Lexend', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tipo-cifra: 'Fraunces', 'Lexend', Georgia, serif;
  --sombra: 0 2px 6px rgba(23,37,29,.06);
  --sombra-flot: 0 14px 38px rgba(23,37,29,.16);
  /* Colores de fondo de botones y avisos, para que el tema oscuro los pueda cambiar */
  --boton:#1F442F; --boton-hover:#153021; --boton-texto:#FFFFFF;
  --aviso-bg:#FDF6E7; --malo-bg:#FBEFEF; --malo-borde:#E0B3B5; --malo-hover:#F7E4E4;
  --bien-bg:#EDF3EE; --bien-borde:#A8C4B3; --seg-sub:#D9E6DC;
  --login-error-bg:#FBEEF1; --login-error-borde:#D9A3B1;
  --fondo-suave:var(--activo); --borde:var(--linea-fuerte);
  --velo:rgba(23,37,29,.45); --backdrop:rgba(27,34,41,.42);
  color-scheme:light;
}
/* ---- Tema oscuro ---- */
:root[data-theme="dark"]{
  --papel:#111714; --tinta:#E4EBE6; --tinta-suave:#9BA9A0;
  --linea:#29322C; --linea-fuerte:#3E4A42;
  --verde:#8FD0A9; --dorado:#E6A84A; --crema:#5A4520;
  --debe:#8FD0A9; --haber:#E8A95B;
  --panel:#19211C; --activo:#233029; --alerta:#F2939A; --ok:#8FD0A9;
  --sombra: 0 2px 6px rgba(0,0,0,.35);
  --sombra-flot: 0 14px 38px rgba(0,0,0,.55);
  --boton:#2F6B49; --boton-hover:#3A7F58; --boton-texto:#FFFFFF;
  --aviso-bg:#2A2416; --malo-bg:#331C1E; --malo-borde:#6E3A3E; --malo-hover:#3D2224;
  --bien-bg:#1A2E22; --bien-borde:#3C6B4E; --seg-sub:#CFE6D8;
  --login-error-bg:#331C1E; --login-error-borde:#6E3A3E;
  --velo:rgba(0,0,0,.6); --backdrop:rgba(0,0,0,.6);
  color-scheme:dark;
}
/* El logo es oscuro sobre transparente: en tema oscuro se le da un fondo claro */
:root[data-theme="dark"] .marca .logo,:root[data-theme="dark"] .login-caja img{
  background:#FBFAF7;border-radius:6px;padding:6px}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font:16.5px/1.6 var(--tipo);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
h1,h2,h3{font-weight:700;margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;background:var(--panel);
  border:1px solid var(--linea-fuerte);border-radius:3px;padding:6px 8px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--debe);outline-offset:1px}

/* --- Estructura general y menú lateral --- */
/* estructura */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--linea);padding:18px 0;
  position:sticky;top:0;height:100vh;overflow:auto}
main{padding:26px 40px 70px;max-width:1680px}

.menu-btn{position:fixed;top:10px;left:10px;z-index:55;
  background:var(--panel);border:1px solid var(--linea-fuerte);border-radius:4px;
  padding:6px 12px;color:var(--verde);font-size:14px;font-weight:600;
  box-shadow:var(--sombra)}
.menu-btn:hover{background:var(--activo)}
body.panel-abierto .menu-btn{display:none}
.cerrar-panel{position:absolute;top:6px;right:8px;z-index:2;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;border-left:none;padding:0;text-align:center;
  color:var(--tinta-suave);font-size:15px;line-height:1;border-radius:3px}
.cerrar-panel:hover{background:var(--activo);color:var(--verde)}
#velo{display:none;position:fixed;inset:0;background:var(--velo);z-index:40}

@media(min-width:821px){
  body:not(.panel-abierto) #app{grid-template-columns:1fr}
  body:not(.panel-abierto) nav{display:none}
  body:not(.panel-abierto) main{padding-top:52px}
}
@media(max-width:820px){
  #app{grid-template-columns:1fr}
  nav{position:fixed;top:0;left:0;width:262px;height:100vh;z-index:50;
    border-right:1px solid var(--linea);box-shadow:var(--sombra-flot);
    transform:translateX(-100%);transition:transform .2s ease}
  body.panel-abierto nav{transform:translateX(0)}
  body.panel-abierto #velo{display:block}
  main{padding:56px 16px 50px;max-width:none}
  #vista{overflow-x:auto}
  #vista table{min-width:620px}
  .tit{flex-direction:column;align-items:stretch}
  .rej{grid-template-columns:1fr}
  .cifras{gap:10px}
  .cifra{flex:1;min-width:120px;padding:10px 12px}
}
@media(prefers-reduced-motion:reduce){nav{transition:none}}
.marca{padding:4px 18px 16px;border-bottom:2px solid var(--dorado);margin-bottom:12px;text-align:center}
.marca .logo{width:100%;max-width:150px;height:auto;display:block;margin:0 auto 8px}
.marca .lema{margin:0;font-size:13px;letter-spacing:.14em;color:var(--verde);
  text-transform:lowercase;font-variant:small-caps;font-weight:600}
.emp-activa{margin:0 12px 14px;padding:10px 12px;background:var(--activo);
  border-left:3px solid var(--dorado);border-radius:3px;font-size:14px}
.emp-activa label{display:block;font-size:12px;color:var(--tinta-suave);margin-bottom:4px}
.emp-activa select{font-size:14px;padding:5px 6px}
.emp-datos{margin-top:6px;font-size:13px;color:var(--tinta-suave)}
.emp-activa .ayuda{display:inline-block;margin-left:3px;cursor:help;color:var(--tinta-suave);font-size:12px}
.emp-activa .ayuda:hover,.emp-activa .ayuda:focus{color:var(--dorado);outline:none}
nav button{display:block;width:100%;text-align:left;background:none;border:none;
  padding:8px 18px;color:var(--tinta);font-size:14px;border-left:3px solid transparent}
nav button:hover{background:var(--papel)}
nav button.on{border-left-color:var(--dorado);background:var(--activo);
  color:var(--verde);font-weight:600}

.grupo-cab{display:flex;justify-content:space-between;align-items:center;width:100%;
  padding:9px 18px;font-size:14px;color:var(--tinta);font-weight:500;
  background:none;border:none;border-left:3px solid transparent;text-align:left;
  margin-top:6px}
.grupo-cab:hover{background:var(--papel)}
.grupo-cab .flecha{font-size:9px;color:var(--tinta-suave);transition:transform .15s ease}
.grupo-cab.plegado .flecha{transform:rotate(-90deg)}
.grupo-cuerpo{overflow:hidden;max-height:600px;transition:max-height .18s ease}
.grupo-cuerpo.plegado{max-height:0}
.grupo-cuerpo button{font-size:13px;color:var(--tinta-suave);
  padding:7px 18px 7px 30px;letter-spacing:.01em}
.grupo-cuerpo button.on{color:var(--verde);font-weight:600;
  background:var(--activo);border-left-color:var(--dorado)}
.tit{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:2px solid var(--verde);margin-bottom:20px}
.tit>div:last-child{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.tit h2{font:600 26px/1.25 var(--tipo-cifra);letter-spacing:-.01em;color:var(--verde)}
.tit p{margin:3px 0 0;font-size:14px;color:var(--tinta-suave)}

/* controles */
/* --- Botones, controles y tarjetas --- */
.btn{background:var(--boton);color:var(--boton-texto);border:1px solid var(--boton);
  border-radius:4px;padding:8px 15px;font-size:14px;font-weight:500;
  transition:background-color .12s ease,transform .08s ease}
.btn:hover{background:var(--boton-hover)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--panel);color:var(--tinta);border-color:var(--linea-fuerte)}
.btn.sec:hover{background:var(--activo)}
.btn.mini{padding:3px 8px;font-size:13px}
.btn.peligro{color:var(--alerta);background:var(--panel);border-color:var(--linea-fuerte)}
.barra{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}

/* --- Componentes específicos: selector segmentado, zona de archivo, popover de productos --- */
#loginScreen{position:fixed;inset:0;z-index:100;background:var(--papel);
  display:flex;align-items:center;justify-content:center;padding:20px}
.login-caja{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--linea);
  border-radius:8px;padding:32px 30px;box-shadow:var(--sombra-flot)}
.login-caja img{display:block;max-width:150px;margin:0 auto 18px}
.login-caja h2{text-align:center;color:var(--verde);font:600 21px var(--tipo-cifra);margin-bottom:4px}
.login-caja p.sub{text-align:center;color:var(--tinta-suave);font-size:13px;margin:0 0 22px}
.login-caja label{display:block;font-size:13px;color:var(--tinta-suave);margin:0 0 5px}
.login-caja .campo-login{margin-bottom:14px}
.login-caja .btn{width:100%;padding:10px;font-size:15px;margin-top:6px}
.login-error{background:var(--login-error-bg);border:1px solid var(--login-error-borde);color:var(--alerta);
  border-radius:4px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.segmentado{display:flex;border:1px solid var(--linea-fuerte);border-radius:4px;overflow:hidden}
.segmentado .seg-op{flex:1;padding:9px 14px;background:var(--panel);border:none;
  border-right:1px solid var(--linea-fuerte);color:var(--tinta);font-size:14px;text-align:left}
.segmentado .seg-op:last-child{border-right:none}
.segmentado .seg-op span{display:block;font-size:12px;color:var(--tinta-suave);font-weight:400}
.segmentado .seg-op.on{background:var(--boton);color:var(--boton-texto)}
.segmentado .seg-op.on span{color:var(--seg-sub)}
.segmentado .seg-op:hover:not(.on){background:var(--activo)}

.dropzone{display:block;border:1px dashed var(--linea-fuerte);border-radius:4px;
  padding:16px 14px;text-align:center;cursor:pointer;background:var(--panel)}
.dropzone:hover{background:var(--activo);border-color:var(--dorado)}
.dropzone strong{display:block;color:var(--verde);font-size:14px;margin-bottom:3px}
.dropzone span{font-size:13px;color:var(--tinta-suave)}
.dropzone.elegido{border-style:solid;border-color:var(--verde)}

tr.fila-anulada{background:var(--malo-bg)}
tr.fila-anulada:hover{background:var(--malo-hover)}
tr.fila-anulada td{color:var(--tinta-suave);text-decoration:line-through}
tr.fila-anulada select,tr.fila-anulada input[type="checkbox"]{text-decoration:none}

.detalle-hover{position:relative;display:inline-block;cursor:help;
  border-bottom:1px dotted var(--tinta-suave)}
.detalle-hover .popover-items{
  display:none;position:absolute;z-index:60;top:100%;left:0;margin-top:6px;
  background:var(--panel);border:1px solid var(--linea-fuerte);border-radius:5px;
  box-shadow:var(--sombra-flot);padding:14px 16px;
  min-width:360px;max-width:560px;white-space:normal;text-align:left}
.detalle-hover:hover .popover-items{display:block}
.popover-items table{border-collapse:collapse;font-size:14px}
.popover-items th,.popover-items td{padding:6px 8px;border-bottom:1px solid var(--linea)}
.popover-items tbody tr:last-child td{border-bottom:none}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-size:13px;color:var(--tinta-suave)}
.campo.ancho{flex:1;min-width:220px}

/* tablas */
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel)}
th{text-align:left;font-weight:600;font-size:13px;color:var(--tinta-suave);
  padding:8px 10px;border-bottom:1px solid var(--linea-fuerte)}
th.num{text-align:right}
td{padding:7px 10px;border-bottom:1px solid var(--linea);vertical-align:top}
tbody tr:hover{background:var(--activo)}
tr.grupo-cta{background:var(--papel);font-weight:600}
tr.grupo-cta:hover{background:var(--papel)}
tr.total td{border-top:2px solid var(--verde);border-bottom:none;font-weight:600;
  background:var(--papel);color:var(--verde)}
tr.total:hover{background:var(--papel)}
.d{color:var(--debe)} .h{color:var(--haber)}
.vacio{padding:34px;text-align:center;color:var(--tinta-suave);background:var(--panel);
  border:1px dashed var(--linea-fuerte);border-radius:4px}
.aviso{padding:11px 14px;border-radius:4px;font-size:14px;margin-bottom:18px;
  background:var(--aviso-bg);border:1px solid var(--crema);border-left:3px solid var(--dorado)}
.aviso.malo{background:var(--malo-bg);border-color:var(--malo-borde);border-left-color:var(--alerta)}
.aviso.bien{background:var(--bien-bg);border-color:var(--bien-borde);border-left-color:var(--verde)}
.tarjeta{background:var(--panel);border:1px solid var(--linea);border-radius:4px;
  padding:18px;margin-bottom:14px}
.tarjeta h3{color:var(--verde)}
.modal-cuerpo h3{color:var(--verde)}
.cifras{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.cifra{background:var(--panel);border:1px solid var(--linea);border-top:3px solid var(--dorado);
  border-radius:5px;padding:13px 18px;min-width:150px;box-shadow:var(--sombra)}
.cifra span{display:block;font-size:12.5px;color:var(--tinta-suave);letter-spacing:.01em}
.cifra strong{display:block;margin-top:2px;font:600 24px/1.3 var(--tipo-cifra);
  font-variant-numeric:tabular-nums;color:var(--verde)}
dialog{border:none;border-radius:6px;padding:0;max-width:560px;width:92%;
  box-shadow:var(--sombra-flot);background:var(--panel);color:var(--tinta)}
dialog::backdrop{background:var(--backdrop)}

/* --- Recuadro de Administración (se abre flotando al lado del menú) --- */
.recuadro-admin{position:fixed;z-index:70;width:290px;max-width:calc(100vw - 24px);
  max-height:calc(100vh - 24px);overflow:auto;
  background:var(--panel);border:1px solid var(--linea-fuerte);border-radius:8px;
  box-shadow:var(--sombra-flot);padding:8px 0 12px}
.recuadro-admin[hidden]{display:none}
.recuadro-admin h4{margin:4px 16px 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tinta-suave);font-weight:600}
.recuadro-admin hr{border:none;border-top:1px solid var(--linea);margin:10px 0}
.recuadro-admin .seg-tema{display:flex;margin:0 16px;border:1px solid var(--linea-fuerte);border-radius:5px;overflow:hidden}
.recuadro-admin .seg-tema button{flex:1;padding:7px 4px;border:none;border-left:1px solid var(--linea-fuerte);
  background:var(--panel);color:var(--tinta);font-size:13px;text-align:center}
.recuadro-admin .seg-tema button:first-child{border-left:none}
.recuadro-admin .seg-tema button.on{background:var(--boton);color:var(--boton-texto);font-weight:600}
.recuadro-admin .salir{display:block;width:calc(100% - 32px);margin:4px 16px 0;text-align:center;
  border-left:1px solid var(--linea-fuerte)!important}
.grupo-cab.admin-cab.abierto{background:var(--activo);border-left-color:var(--dorado)}
.recuadro-admin .cerrar-recuadro{display:none;position:absolute;top:8px;right:10px;width:32px;height:32px;
  align-items:center;justify-content:center;background:none;border:none;color:var(--tinta-suave);font-size:16px;border-radius:4px}
.recuadro-admin .cerrar-recuadro:hover{background:var(--activo)}
#veloAdmin{position:fixed;inset:0;background:var(--velo);z-index:65}
#veloAdmin[hidden]{display:none}
/* En celular el recuadro sale como una hoja desde abajo, a todo lo ancho,
   con fondo oscurecido: así no tapa a medias el menú ni el botón que lo abrió. */
@media(max-width:820px){
  .recuadro-admin{left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto;max-width:none;
    max-height:78vh;border-radius:14px;padding:14px 0 16px}
  .recuadro-admin .cerrar-recuadro{display:flex}
  .recuadro-admin [data-v]{padding:12px 18px;font-size:15px}
  .recuadro-admin .seg-tema button{padding:10px 4px}
}
@media(min-width:821px){#veloAdmin{display:none!important}}
.recuadro-admin [data-v]{display:block;width:100%;text-align:left;background:none;border:none;
  border-left:3px solid transparent;padding:8px 16px;color:var(--tinta);font-size:14px}
.recuadro-admin [data-v]:hover{background:var(--activo)}
.recuadro-admin [data-v].on{border-left-color:var(--dorado);background:var(--activo);color:var(--verde);font-weight:600}
.modal-cuerpo{padding:22px}
.modal-cuerpo h3{font:600 19px var(--tipo-cifra);margin-bottom:14px}
.rej{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.rej .full{grid-column:1/-1}
.pie-modal{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;
  background:var(--papel);border-top:1px solid var(--linea)}
@media print{nav,.barra,.btn,.recuadro-admin{display:none}main{max-width:none;padding:0}
  :root[data-theme="dark"]{--papel:#FFFFFF;--panel:#FFFFFF;--tinta:#17251D;--tinta-suave:#5E6B62;--verde:#1F442F;
    --linea:#E2DED4;--linea-fuerte:#BDB6A6;--activo:#F4EFE3;--debe:#1F442F;--haber:#9C5A11;
    --aviso-bg:#FDF6E7;--malo-bg:#FBEFEF;--bien-bg:#EDF3EE;color-scheme:light}}
</style>
<script>
/* Tema guardado (claro, oscuro o el del sistema): se aplica antes de dibujar nada, para que no parpadee. */
(function(){var t='sistema';try{t=localStorage.getItem('contagt_tema')||'sistema'}catch(e){}
var osc=t==='oscuro'||(t==='sistema'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',osc?'dark':'light');})();
</script>

<!-- ============ HTML — Menú lateral, estructura de la app y modales ============ -->
<button id="menuBtn" class="menu-btn" type="button" aria-label="Mostrar el menú">☰ Menú</button>
<div id="loginScreen" style="display:none"></div>
<div id="velo"></div>
<div id="app">
  <nav id="panel">

<script>
/* ============ ALMACENAMIENTO ============ */
const LLAVE='contagt_v1';
const VACIO=()=>({empresas:[],activa:null,usuarios:[],sesion:null,bitacora:[]});
let modo='memoria', memoria=VACIO();
try{localStorage.setItem('_t','1');localStorage.removeItem('_t');modo='local'}catch(e){}
if(modo==='memoria' && window.storage && typeof window.storage.get==='function') modo='vista';

async function cargar(){
  try{
    if(modo==='local') return JSON.parse(localStorage.getItem(LLAVE))||VACIO();
    if(modo==='vista'){const r=await window.storage.get(LLAVE); return r&&r.value?JSON.parse(r.value):VACIO()}
  }catch(e){}
  return VACIO();
}
function guardar(){
  try{
    if(modo==='local') localStorage.setItem(LLAVE,JSON.stringify(BD));
    else if(modo==='vista') window.storage.set(LLAVE,JSON.stringify(BD)).catch(()=>{});
    else memoria=BD;
  }catch(e){avisar('No se pudo guardar: '+e.message)}
}
let BD=VACIO();
const emp=()=>{
  const e=BD.empresas.find(x=>x.id===BD.activa);
  if(!e) return null;
  const admin=administradorDeSesion();
  return (admin && e.administradorId===admin) ? e : null;
};

/* ============ DESHACER ============ */
/* Un solo nivel de historial, no una pila completa — "deshacer la última
   acción", tal como se pidió. Se guarda solo en memoria, no en el respaldo:
   si recargás la página se pierde, como es de esperar de un deshacer normal,
   y evita que el archivo de respaldo cargue con datos que ya no sirven.
   El snapshot se toma justo ANTES de que la acción de verdad cambie algo —
   no cuando se abre un modal, sino cuando se confirma —, porque muchas
   acciones en este sistema solo mutan datos en el callback de confirmación,
   no en el momento en que se hace clic en el botón que las dispara. */
let snapshotDeshacer=null, etiquetaDeshacer='';
function tomarSnapshotDeshacer(etiqueta){
  const e=emp();
  if(!e) return;
  try{ snapshotDeshacer={empId:e.id,datos:JSON.parse(JSON.stringify(e))}; etiquetaDeshacer=etiqueta||'la última acción'; }
  catch(err){ snapshotDeshacer=null; }
}
/* Corrección: antes CUALQUIER clic (incluso "Ver" o "PDF") pisaba la copia
   del deshacer, y se perdía la posibilidad de deshacer un borrado. Ahora la
   copia se toma antes de la acción pero solo se guarda si la acción de verdad
   cambió algo en la empresa. */
let saltarSnapshot=false;
async function conSnapshot(etiqueta,fn){
  const e=emp(), id=e&&e.id;
  let antes=null;
  try{ antes=e?JSON.stringify(e):null; }catch(err){}
  const r=await fn();
  if(saltarSnapshot){ saltarSnapshot=false; return r; }
  const despues=id&&BD.empresas.find(x=>x.id===id);
  if(antes&&despues){
    let cambio=false;
    try{ cambio=JSON.stringify(despues)!==antes; }catch(err){}
    if(cambio){
      snapshotDeshacer={empId:id,datos:JSON.parse(antes)}; etiquetaDeshacer=etiqueta||'la última acción';
      if(!document.getElementById('modal').open) pintar();
    }
  }
  return r;
}

/* ============ UTILIDADES ============ */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const Q=n=>(n||0).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Fecha LOCAL (Guatemala, UTC−6). toISOString() devuelve la fecha en UTC, que
   después de las 18:00 ya es "mañana" — por eso no se usa. */
const fechaLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoy=()=>fechaLocal(new Date());
/* Rango completo del mes anterior a hoy, calculado sobre el texto de la fecha
   (sin setMonth, que se desborda los días 29, 30 y 31). */
function mesAnteriorRango(){
  let [a,m]=hoy().split('-').map(Number);
  m--; if(m===0){m=12;a--;}
  const mm=String(m).padStart(2,'0');
  return {desde:`${a}-${mm}-01`,hasta:`${a}-${mm}-${String(new Date(a,m,0).getDate()).padStart(2,'0')}`};
}

/* ============ CÁLCULO CONTABLE ============ */
/* Signo: activo/costo/gasto suman por el debe; pasivo/patrimonio/ingreso por el haber. */
const NATURAL_DEUDORA=t=>t==='activo'||t==='costo'||t==='gasto';

/* Prefijo con el que se marca la partida de cierre de libros — se usa acá
   mismo y en cualquier cálculo que necesite "olvidarse" de que existe, para
   que un año ya cerrado se pueda seguir consultando con sus cifras reales. */
const PREFIJO_CIERRE_LIBROS='Cierre de libros ';
/* Las partidas de "Cierre de costo de ventas" mueven la cuenta de
   Inventarios (la acreditan, para reconocer el costo de lo vendido) — si
   una de esas partidas cae DENTRO del rango que se está analizando (por
   ejemplo, el cierre del 31 de marzo, mirado dentro de un cálculo de enero
   a marzo), su efecto no debe contarse como si fuera una compra negativa:
   no es una nota de crédito de un proveedor, es la reclasificación del
   propio cierre. Antes esto contaminaba comprasBienes — el trimestre
   parecía haber comprado menos de lo que realmente compró, exactamente por
   el monto que se cerró ese mismo corte. Esta función calcula el
   movimiento de una cuenta excluyendo esas partidas puntuales, sin tocar
   movimientos() en general — esa función la usan muchos otros cálculos
   (como leer el saldo REAL de Costo de Ventas después de un cierre) que si
   necesitan ver el efecto de esas mismas partidas. */
const PREFIJO_CIERRE_COSTO='Cierre de costo de ventas al ';
function movimientoCuentaSinCierreCosto(e,cta,desde,hasta){
  let debe=0,haber=0;
  (e.partidas||[]).forEach(p=>{
    if(desde&&p.fecha<desde) return;
    if(hasta&&p.fecha>hasta) return;
    if((p.concepto||'').startsWith(PREFIJO_CIERRE_COSTO)) return;
    p.lineas.forEach(l=>{ if(l.cta===cta){ debe+=(+l.debe||0); haber+=(+l.haber||0); } });
  });
  return {debe:r2(debe),haber:r2(haber)};
}
/* El Balance, el Libro de Inventarios y el Libro de Estados Financieros
   suman al Patrimonio la utilidad del ejercicio en curso, recalculada en
   vivo — así el Balance cuadra sin depender de que alguien haga el cierre a
   tiempo. Pero si el ejercicio que se está mirando YA se cerró con "Cierre
   de libros", ese resultado ya está adentro de las cuentas reales de
   Patrimonio (Capital o Utilidades Retenidas) — sumarlo de nuevo acá lo
   contaría dos veces. Por eso, para un ejercicio ya cerrado, esto devuelve 0:
   la utilidad real ya vive en el saldo de Patrimonio, no hace falta
   recalcularla aparte. */
/* Antes solo miraba el ejercicio de trabajo (e.ejercicio), sin importar la
   fecha de corte, y si un año anterior nunca se cerró con "Cierre de libros"
   su resultado no aparecía en ningún lado y el Balance descuadraba. Ahora se
   suman los resultados de TODOS los ejercicios hasta la fecha de corte que
   todavía no tienen cierre de libros, separando el del año del corte de los
   anteriores. */
function anioCerrado(e,anio){
  return (e.partidas||[]).some(p=>(p.concepto||'').startsWith(`${PREFIJO_CIERRE_LIBROS}${anio}`));
}
function utilidadPatrimonioDetalle(e,h){
  const anioH=+h.slice(0,4);
  const fechas=(e.partidas||[]).map(p=>p.fecha).filter(Boolean).sort();
  const primero=fechas.length?+fechas[0].slice(0,4):anioH;
  let actual=0, anteriores=0;
  for(let a=Math.min(primero,anioH);a<=anioH;a++){
    if(anioCerrado(e,a)) continue;
    const v=calcularResultados(e,`${a}-01-01`,a===anioH?h:`${a}-12-31`).netaReal;
    if(a===anioH) actual=r2(actual+v); else anteriores=r2(anteriores+v);
  }
  return {actual,anteriores,total:r2(actual+anteriores)};
}
function utilidadPatrimonioSinDuplicar(e,h){ return utilidadPatrimonioDetalle(e,h).total; }
/* Filas HTML de la utilidad que se suma al patrimonio (el año del corte y,
   si hay, ejercicios anteriores sin cierre de libros). */
function filasUtilidadPatrimonio(e,h){
  const u=utilidadPatrimonioDetalle(e,h);
  return (u.anteriores?`<tr><td style="padding-left:26px">${u.anteriores<0?'Pérdidas':'Utilidades'} de ejercicios anteriores sin cierre de libros</td><td class="num">${Q(u.anteriores)}</td></tr>`:'')
    +`<tr><td style="padding-left:26px">${u.actual<0?'Pérdida':'Utilidad'} del ejercicio en curso</td><td class="num">${Q(u.actual)}</td></tr>`;
}

/* Partidas que LIQUIDAN impuestos (pagos o compensaciones de IVA, pagos del
   ISR mensual, devoluciones de crédito fiscal). No son operaciones del
   período: si se dejaran en el cálculo, el pago de enero —fechado en
   febrero— restaría del débito y del crédito de febrero y se pagaría de menos. */
const RE_LIQ_IVA=/^(Pago de IVA del |Compensación de IVA del |Solicitud de devolución de crédito fiscal IVA|Devolución de crédito fiscal IVA recibida|Cierre fiscal total \d{4} — (compensación|pago) de IVA)/;
const RE_LIQ_ISR=/^(Pago de ISR|Pago de IVA — Régimen de Pequeño|Pago del impuesto único)/;
const esLiquidacionIVA=p=>!!p.liqIVA||RE_LIQ_IVA.test(p.concepto||'');
const esLiquidacionISR=p=>!!p.liqISR||RE_LIQ_ISR.test(p.concepto||'');
/* Movimientos de un rango SIN las partidas de liquidación de impuestos ni el cierre de libros. */
function movimientosOperativos(e,desde,hasta){
  const m={};
  (e.partidas||[]).forEach(p=>{
    if(desde&&p.fecha<desde) return;
    if(hasta&&p.fecha>hasta) return;
    if((p.concepto||'').startsWith(PREFIJO_CIERRE_LIBROS)) return;
    if(esLiquidacionIVA(p)||esLiquidacionISR(p)) return;
    p.lineas.forEach(l=>{
      if(!m[l.cta]) m[l.cta]={debe:0,haber:0};
      m[l.cta].debe+=(+l.debe||0); m[l.cta].haber+=(+l.haber||0);
    });
  });
  return m;
}
/* IVA de un período: débito y crédito de las operaciones del período, más el
   remanente de crédito fiscal que viene de antes (Art. 17, Ley del IVA). El
   remanente se saca del saldo REAL de la cuenta de crédito fiscal, menos el
   crédito de las operaciones que todavía no se han liquidado (las de este
   período en adelante). */
function ivaDelPeriodo(e,desde,hasta){
  const mov=movimientosOperativos(e,desde,hasta);
  const debito=r2((mov['2.1.04']||{haber:0}).haber-(mov['2.1.04']||{debe:0}).debe);
  const credito=r2((mov['1.1.09']||{debe:0}).debe-(mov['1.1.09']||{haber:0}).haber);
  const movFuturo=movimientosOperativos(e,desde,null);
  const saldoCredito=r2(saldoNaturalEn(e,'1.1.09',movimientos(null,null)));
  const creditoPendiente=r2((movFuturo['1.1.09']||{debe:0}).debe-(movFuturo['1.1.09']||{haber:0}).haber);
  const remanente=r2(Math.max(0,saldoCredito-creditoPendiente));
  const saldoDebito=r2(saldoNaturalEn(e,'2.1.04',movimientos(null,null)));
  const debitoPendiente=r2((movFuturo['2.1.04']||{haber:0}).haber-(movFuturo['2.1.04']||{debe:0}).debe);
  const debitoAtrasado=r2(Math.max(0,saldoDebito-debitoPendiente));
  const neto=r2(debito-credito-remanente);
  /* Retenciones de IVA que te hicieron tus clientes (constancias) todavía sin
     aplicar hasta el final del período: se restan del IVA a pagar. */
  const retencionesIVA=r2(Math.max(0,saldoNaturalEn(e,'1.1.19',movimientos(null,hasta))));
  return {debito,credito,remanente,neto,debitoAtrasado,retencionesIVA};
}
function saldoNaturalEn(e,cta,mov){
  const c=e.cuentas.find(x=>x.c===cta); if(!c) return 0;
  const m=mov[cta]||{debe:0,haber:0};
  return r2(NATURAL_DEUDORA(c.t) ? m.debe-m.haber : m.haber-m.debe);
}
function movimientos(desde,hasta,excluirCierres){
  const e=emp(); if(!e) return {};
  const m={};
  e.partidas.forEach(p=>{
    if(desde && p.fecha<desde) return;
    if(hasta && p.fecha>hasta) return;
    if(excluirCierres && (p.concepto||'').startsWith(PREFIJO_CIERRE_LIBROS)) return;
    p.lineas.forEach(l=>{
      if(!m[l.cta]) m[l.cta]={debe:0,haber:0};
      m[l.cta].debe+=(+l.debe||0);
      m[l.cta].haber+=(+l.haber||0);
    });
  });
  return m;
}
/* saldo con signo natural positivo */
function saldoNatural(cta,mov){
  const e=emp(); const c=e.cuentas.find(x=>x.c===cta); if(!c) return 0;
  const m=mov[cta]||{debe:0,haber:0};
  return r2(NATURAL_DEUDORA(c.t) ? m.debe-m.haber : m.haber-m.debe);
}
function totalTipo(tipos,mov){
  const e=emp(); let s=0;
  e.cuentas.filter(c=>c.d&&tipos.includes(c.t)).forEach(c=>s+=saldoNatural(c.c,mov));
  return r2(s);
}
function utilidad(mov){
  return r2(totalTipo(['ingreso'],mov)-totalTipo(['costo'],mov)-totalTipo(['gasto'],mov));
}

/* Una empresa puede cambiar de régimen a mitad de año, así que ningún cálculo
   puede asumir que el régimen de HOY aplicó siempre. e.historialRegimen guarda
   cada cambio con la fecha en que entró en vigencia; e.regimen se mantiene
   sincronizado con el más reciente, para no tener que tocar el resto del
   código que ya lo usa como "el régimen actual". */
function regimenEn(e,fecha){
  const historial=e.historialRegimen;
  if(!historial||!historial.length) return e.regimen;
  const vigentes=historial.filter(h=>h.vigenteDesde<=fecha).sort((a,b)=>b.vigenteDesde.localeCompare(a.vigenteDesde));
  return vigentes.length ? vigentes[0].regimen : historial[0].regimen;
}
function sincronizarRegimenActual(e){
  const historial=e.historialRegimen;
  if(historial&&historial.length) e.regimen=regimenEn(e,hoy());
}

/* Agrupados para el selector de "nuevo usuario", en el orden del organigrama. */
const ROLES_ASIGNABLES=['administrador','cont_gerente','cont_auxiliar','rrhh_gerente','rrhh_auxiliar',
  'prod_gerente','prod_auxiliar','ventas_gerente','ventas_auxiliar','ventas_vendedor',

/* No es un hash con sal ni lento como bcrypt — es SHA-256 con lo único que trae
   el navegador de fábrica. Evita que la contraseña quede escrita tal cual en
   el respaldo, pero no es criptografía de verdad para proteger contraseñas. */
async function hashClave(texto){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
/* Bitácora: solo la ve el Administrador dueño del espacio (y de rebote el
   superadmin no, porque no administra empresas). Guarda quién hizo qué,
   cuándo, y en qué empresa, para poder revisar después sin tener que
   preguntarle a cada persona. */
function registrarLog(accion,detalle){
  const u=usuarioActual(); if(!u) return;
  const admin=administradorDeSesion(); if(!admin) return;
  BD.bitacora=BD.bitacora||[];
  BD.bitacora.push({id:uid(),fecha:new Date().toISOString(),administradorId:admin,
    usuarioId:u.id,usuarioNombre:u.nombre||u.usuario,rol:(ROLES[u.rol]||{}).nombre||u.rol,
    empresaNombre:(emp()&&emp().nombre)||'',accion,detalle:detalle||''});
  /* No se guarda aparte con guardar() para no duplicar escrituras — queda
     dentro del mismo BD y se persiste con el resto en el próximo guardar(). */
}

function usuarioActual(){
  if(!BD.sesion) return null;
  return (BD.usuarios||[]).find(u=>u.id===BD.sesion) || null;
}
function rolActual(){
  const u=usuarioActual();
  return u ? ROLES[u.rol] : null;
}
function puedeEliminar(){
  const u=usuarioActual();
  if(!u) return false;
  if(u.rol==='administrador'||u.rol==='superadmin') return true;
  const r=ROLES[u.rol];
  return !!(r&&r.eliminar);
}
/* Asistente de IA: lo habilita el Superadministrador, Administrador por
   Administrador. Todo el personal de un Administrador habilitado lo hereda;
   si el Administrador no está habilitado, nadie de su equipo puede usarlo. */
function iaPermitidaSesion(){
  const admin=administradorDeSesion(); if(!admin) return false;
  const a=(BD.usuarios||[]).find(x=>x.id===admin);
  return !!(a&&a.iaPermitida&&a.activo!==false);
}
/* Qué pantallas puede ver cada rol. null = todas (Administrador). */
function vistasPermitidas(){
  const u=usuarioActual();
  if(!u) return [];
  if(u.rol==='superadmin') return ['usuarios'];
  if(u.rol==='administrador') return null;
  const r=ROLES[u.rol];
  if(!r) return ['home'];
  if(r.depto==='contabilidad') return ['home','catalogo','partidas','facturas','proveedores','clientes',
    'diario','mayor','inventario','libroInventarios','activosFijos','libroPequeno','libroVentas','libroCompras','devolucionIVA','retenciones','conciliacion','balanza','resultados','balance','flujoEfectivo','estadosFinancieros','tablero','aumentosCapital'];
  if(r.depto==='rrhh') return ['home','empleados','planillas','pagoPrestaciones'];
  if(r.depto==='produccion') return ['home','produccion'];
  if(r.depto==='ventas') return ['home','ventas'];
  if(r.depto==='compras') return ['home','compras'];
  return ['home'];
}
function puedeVer(vista){
  /* Producción solo existe para una industria productora — para nadie más, ni el Administrador. */
  if(vista==='produccion'&&!esProductora(emp())) return false;
  const permitidas=vistasPermitidas();
  return permitidas===null || permitidas.includes(vista);
}

/* Cada Administrador es dueño de su propio conjunto de empresas y de su propio
   personal (Gerentes, Auxiliares) — un Administrador no ve las empresas ni el
   personal de otro, aunque los dos usen el mismo archivo en la misma
   computadora. Esto es lo que separa a un despacho "A" de un despacho "B"
   dentro de este mismo sistema. Devuelve el id del Administrador dueño del
   espacio que le corresponde ver a quien tiene la sesión abierta. */
function administradorDeSesion(){
  const u=usuarioActual();
  if(!u) return null;
  if(u.rol==='administrador') return u.id;
  if(u.rol==='superadmin') return null;   // el superadmin no administra empresas
  return u.administradorId||null;          // gerentes, auxiliares y el resto del personal
}
/* Las empresas que puede ver la sesión actual — nunca BD.empresas directo.
   El Administrador ve siempre todas las suyas; su personal solo ve las que
   ese Administrador le asignó puntualmente ("belongs to"). Si a una cuenta
   de personal nunca se le asignó ninguna (campo sin definir, cuentas viejas
   de antes de este cambio), ve todas por compatibilidad. */
function empresasVisibles(){
  const u=usuarioActual();
  const admin=administradorDeSesion();
  if(!admin) return [];
  const propias=BD.empresas.filter(e=>e.administradorId===admin);
  if(!u||u.rol==='administrador') return propias;
  if(Array.isArray(u.empresasAsignadas)){
    if(!u.empresasAsignadas.length) return [];   // asignado explícitamente a ninguna
    return propias.filter(e=>u.empresasAsignadas.includes(e.id));
  }
  return propias;   // sin el campo definido: compatibilidad con cuentas viejas
}

/* Contraseñas con sal por usuario: el mismo texto ya no da el mismo hash en
   dos cuentas. Las cuentas viejas (sin sal) siguen entrando y se migran solas
   la próxima vez que inician sesión. */
const salAleatoria=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function fijarClave(u,clave){ u.sal=salAleatoria(); u.passHash=await hashClave(u.sal+clave); }
async function verificarClave(u,clave){ return u.passHash===await hashClave((u.sal||'')+clave); }
const CLAVE_INICIAL_SUPERADMIN='Xela2026$';

/* Si nadie se ha registrado todavía, se crea sola la cuenta de
   Superadministrador con una clave inicial, pero OBLIGADA a cambiarse en el
   primer ingreso — la clave inicial está escrita en este archivo y no puede
   quedar como clave real. */
async function asegurarSuperadmin(){
  BD.usuarios=BD.usuarios||[];
  if(BD.usuarios.some(u=>u.rol==='superadmin')) return;
  const s={id:uid(),usuario:'admin',nombre:'Superadministrador',rol:'superadmin',activo:true,debeCambiarClave:true};
  await fijarClave(s,CLAVE_INICIAL_SUPERADMIN);
  BD.usuarios.push(s);
  guardar();
}

/* Si el Administrador del que depende este usuario está bloqueado, el usuario
   queda bloqueado con él — bloquear al jefe bloquea a todo su equipo. */
function cuentaBloqueada(u){
  if(!u) return true;
  if(u.activo===false) return true;
  if(u.administradorId){
    const jefe=(BD.usuarios||[]).find(x=>x.id===u.administradorId);
    if(jefe && jefe.activo===false) return true;
  }
  return false;
}

function entrarConSesion(u){

  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='';
  VISTA = u.rol==='superadmin' ? 'usuarios' : 'home';
  filtros={};
  pintar();
}

function pantallaLogin(mensajeError){

    <button class="btn" id="btnLogin" type="button">Ingresar</button>
    <p style="text-align:center;margin-top:14px">
      <a href="#" id="linkRestablecer" style="font-size:12.5px;color:var(--tinta-suave)">¿Olvidaste la clave del Superadministrador?</a></p>
  </div>`;

    /* Migración a contraseña con sal, sin pedir nada al usuario. */
    if(!u.sal){ await fijarClave(u,clave); guardar(); }
    if(u.debeCambiarClave || (u.rol==='superadmin' && clave===CLAVE_INICIAL_SUPERADMIN)){ pantallaCambioClave(u); return; }
    entrarConSesion(u);
  };

     conocida SIN pedir nada: cualquiera podía tomar el control. Ahora exige el
     código de recuperación que se le mostró al Superadministrador al fijar su clave. */
  document.getElementById('linkRestablecer').onclick=ev=>{ ev.preventDefault(); pantallaRecuperar(); };
  document.getElementById('btnLogin').onclick=intentar;
  cont.querySelectorAll('input').forEach(i=>i.onkeydown=ev=>{ if(ev.key==='Enter') intentar(); });

}

/* Cambio obligatorio de clave (primer ingreso o clave inicial). Al
   Superadministrador se le genera además un código de recuperación. */
function pantallaCambioClave(u,mensajeError){
  const cont=document.getElementById('loginScreen');
  cont.innerHTML=`<div class="login-caja">
    <h2>Definí tu contraseña</h2>
    <p class="sub">${esc(u.nombre||u.usuario)}: por seguridad tenés que cambiar la contraseña antes de seguir.</p>
    ${mensajeError?`<div class="login-error">${esc(mensajeError)}</div>`:''}
    <div class="campo-login"><label>Nueva contraseña (mínimo 8 caracteres)</label><input id="nuevaClave" type="password" autocomplete="new-password"></div>
    <div class="campo-login"><label>Repetila</label><input id="nuevaClave2" type="password" autocomplete="new-password"></div>
    <button class="btn" id="btnGuardarClave" type="button">Guardar y entrar</button>
  </div>`;
  cont.style.display='flex';
  document.getElementById('app').style.display='none';
  const guardarClave=async()=>{
    const c1=document.getElementById('nuevaClave').value, c2=document.getElementById('nuevaClave2').value;
    if(c1.length<8){ pantallaCambioClave(u,'La contraseña tiene que tener al menos 8 caracteres.'); return; }
    if(c1!==c2){ pantallaCambioClave(u,'Las dos contraseñas no coinciden.'); return; }
    if(c1===CLAVE_INICIAL_SUPERADMIN){ pantallaCambioClave(u,'No podés usar la contraseña inicial.'); return; }
    await fijarClave(u,c1); u.debeCambiarClave=false;
    if(u.rol==='superadmin'){
      const codigo=salAleatoria().slice(0,16).toUpperCase().match(/.{4}/g).join('-');
      u.recuperacionHash=await hashClave('REC:'+codigo);
      guardar();
      cont.innerHTML=`<div class="login-caja">
        <h2>Código de recuperación</h2>
        <p class="sub">Anotalo y guardalo en un lugar seguro. Es la única forma de recuperar la cuenta de Superadministrador si olvidás la contraseña. No se vuelve a mostrar.</p>
        <p style="text-align:center;font:600 20px monospace;letter-spacing:.06em;margin:18px 0">${codigo}</p>
        <button class="btn" id="btnYaAnote" type="button">Ya lo anoté — entrar</button></div>`;
      document.getElementById('btnYaAnote').onclick=()=>entrarConSesion(u);
      return;
    }
    guardar();
    entrarConSesion(u);
  };
  document.getElementById('btnGuardarClave').onclick=guardarClave;
  cont.querySelectorAll('input').forEach(i=>i.onkeydown=ev=>{ if(ev.key==='Enter') guardarClave(); });
  setTimeout(()=>{ const x=document.getElementById('nuevaClave'); if(x) x.focus(); },0);
}

function pantallaRecuperar(mensajeError){
  const cont=document.getElementById('loginScreen');
  cont.innerHTML=`<div class="login-caja">
    <h2>Recuperar Superadministrador</h2>
    <p class="sub">Escribí el código de recuperación que se te mostró al definir la contraseña.</p>
    ${mensajeError?`<div class="login-error">${esc(mensajeError)}</div>`:''}
    <div class="campo-login"><label>Código de recuperación</label><input id="codigoRec" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX"></div>
    <button class="btn" id="btnRecuperar" type="button">Continuar</button>

  </div>`;
  const recuperar=async()=>{
    const codigo=document.getElementById('codigoRec').value.trim().toUpperCase();
    const s=(BD.usuarios||[]).find(x=>x.rol==='superadmin');
    if(!s||!s.recuperacionHash){ pantallaRecuperar('Esta cuenta todavía no tiene código de recuperación. Entrá con la contraseña que tenés.'); return; }
    if(!codigo||(await hashClave('REC:'+codigo))!==s.recuperacionHash){ pantallaRecuperar('Código incorrecto.'); return; }
    s.activo=true; s.debeCambiarClave=true; guardar();
    pantallaCambioClave(s);
  };
  document.getElementById('btnRecuperar').onclick=recuperar;
  document.getElementById('linkVolver').onclick=ev=>{ ev.preventDefault(); pantallaLogin(); };
  setTimeout(()=>{ const x=document.getElementById('codigoRec'); if(x) x.focus(); },0);
}

function pintar(){

  const permitidas=vistasPermitidas();

  document.querySelectorAll('nav [data-v], #recuadroAdmin [data-v]').forEach(a=>{

    if(!oculto && (a.dataset.v==='libroVentas'||a.dataset.v==='libroCompras')) oculto = !e0 || !tuvoRegimen(e0,['general','simplificado']);

  });
  if(!puedeVer(VISTA)){ VISTA = permitidas ? (permitidas[0]||'home') : 'home'; }
  const cajaUsuario=document.getElementById('cajaUsuario');
  if(cajaUsuario){
    const r=ROLES[u.rol];
    cajaUsuario.innerHTML=`<div class="emp-datos" style="margin:0 12px 10px">
      <strong style="display:block;color:var(--verde)">${esc(u.nombre||u.usuario)}</strong>
      <span>${esc(r?r.nombre:u.rol)}</span>
    </div>`;
    /* Cerrar sesión ahora vive en el recuadro de Administración. */
    document.getElementById('recuadroUsuario').textContent=`Sesión: ${u.nombre||u.usuario} · ${r?r.nombre:u.rol}`;
  }
  const e=emp();
  const caja=document.getElementById('empBox');
  const visibles=empresasVisibles();
  caja.innerHTML = visibles.length
    ? `<label for="selEmpresa">Empresa en uso</label>
       <select id="selEmpresa">${visibles
         .map(x=>`<option value="${x.id}"${x.id===BD.activa?' selected':''}>${esc(x.nombre)}</option>`)
         .join('')}</select>
       ${e?`<div class="emp-datos">NIT ${esc(e.nit||'—')}</div>
       <label for="selEjercicio" style="margin-top:8px" title="${AYUDA_EJERCICIO}">Ejercicio de trabajo
         <span class="ayuda" tabindex="0" aria-label="${AYUDA_EJERCICIO}" title="${AYUDA_EJERCICIO}">ⓘ</span></label>
       <input id="selEjercicio" type="number" value="${e.ejercicio}" style="width:100%" title="${AYUDA_EJERCICIO}">
       ${snapshotDeshacer&&snapshotDeshacer.empId===e.id?`<button class="btn sec" style="width:100%;margin-top:10px"
         data-accion="deshacer" title="Deshacer: ${esc(etiquetaDeshacer)}">↩ Deshacer «${esc(etiquetaDeshacer)}»</button>`:''}`:''}`
    : `<span class="emp-datos">Todavía no hay empresas registradas</span>`;
  const sel=document.getElementById('selEmpresa');
  if(sel) sel.onchange=()=>cambiarEmpresa(sel.value);
  const selEj=document.getElementById('selEjercicio');
  if(selEj) selEj.onchange=()=>{
    const nuevo=+selEj.value;
    if(!nuevo||nuevo<2000||nuevo>2100){avisar('Escribí un año válido.');selEj.value=e.ejercicio;return}
    e.ejercicio=nuevo; guardar(); pintar();
  };
  const btnDeshacer=caja.querySelector('[data-accion="deshacer"]');
  if(btnDeshacer) btnDeshacer.onclick=()=>ACCIONES.deshacer();
  if(!e && VISTA!=='empresas' && VISTA!=='config' && VISTA!=='usuarios' && VISTA!=='capitalSocial' && VISTA!=='bitacora'){ VISTA='empresas'; }
  document.getElementById('vista').innerHTML = VISTAS[VISTA]();
  const nodo=document.getElementById('vista');
  nodo.querySelectorAll('[data-accion]').forEach(b=>b.onclick=()=>{
    const acc=ACCIONES[b.dataset.accion]; if(!acc) return;
    if(b.dataset.accion==='deshacer'){ acc(b.dataset); return; }
    conSnapshot(b.textContent.trim()||b.dataset.accion,()=>acc(b.dataset));
  });
  nodo.querySelectorAll('[data-filtro]').forEach(i=>{
    i.oninput=i.onchange=()=>{filtros[i.dataset.filtro]=i.value;pintar()};
  });
  if(VISTA==='partidas' && borrador) enlazarFormulario();
  if(VISTA==='planillas' && borradorPlanilla) enlazarFormularioPlanilla();
  if(VISTA==='pagoPrestaciones' && borradorPago) enlazarFormularioPago();
  if(VISTA==='capitalSocial' && borradorCapital) enlazarCapitalSocial();
  if(VISTA==='facturas'){
    const inputArch=document.getElementById('reporte');
    if(inputArch) inputArch.onchange=function(){
      const archivos=[...this.files];
      const nombre=archivos.map(f=>f.name).join(' + ');
      const zona=document.getElementById('dropzoneLabel'), texto=document.getElementById('dropzoneTexto');
      if(zona&&texto){
        texto.textContent = nombre || 'Excel (.xls, .xlsx) o XML/ZIP de la SAT (.xml, .zip) — podés elegir los dos juntos';
        zona.classList.toggle('elegido',!!nombre);
      }
    };
  }
  if(VISTA==='facturas' && lote.length){
    nodo.querySelectorAll('[data-sel]').forEach(ch=>{
      ch.onchange=()=>{
        const d=lote[+ch.dataset.sel];
        d.sel=ch.checked;
        ch.closest('tr').style.background = d.sel ? 'var(--activo)' : '';
        const n=lote.filter(x=>x.sel).length;
        document.getElementById('contadorSel').textContent =
          n ? `${n} de ${lote.length} seleccionados` : 'Ninguno seleccionado';
      };
    });
    nodo.querySelectorAll('[data-anular]').forEach(ch=>{
      ch.onchange=()=>{
        lote[+ch.dataset.anular].anuladaManual=ch.checked;
        pintar();   // cambia totales, avisos y el tachado de la fila
      };
    });
    nodo.querySelectorAll('[data-retencion]').forEach(inp=>{
      inp.onchange=()=>{
        const d=lote[+inp.dataset.retencion];
        const monto=+inp.value||0;
        if(monto+(d.retencionIVA||0)>d.total){avisar('Las retenciones no pueden sumar más que el total del documento.');inp.value=d.retencionISR||'';return}
        d.retencionISR=monto;
      };
    });
    nodo.querySelectorAll('[data-retencioniva]').forEach(inp=>{
      inp.onchange=()=>{
        const d=lote[+inp.dataset.retencioniva];
        const monto=+inp.value||0;
        if(monto>(d.iva||0)+0.005){avisar('La retención de IVA no puede ser mayor que el IVA del documento.');inp.value=d.retencionIVA||'';return}
        d.retencionIVA=monto;
      };
    });
    nodo.querySelectorAll('[data-oc]').forEach(s=>{
      s.onchange=()=>{ lote[+s.dataset.oc].ocId=s.value; pintar(); };
    });
    nodo.querySelectorAll('[data-f]').forEach(s=>{
      s.onchange=()=>{
        const d=lote[+s.dataset.f];
        d[s.dataset.campo]=s.value;
        if(s.dataset.campo==='bs'){
          const e2=emp(); e2.mapeoBS=e2.mapeoBS||{};
          const n=d.tipo==='compra'?d.nitEmisor:d.nitReceptor;
          if(n) e2.mapeoBS[n]=d.bs;
          guardar();
        }
        if(s.dataset.campo==='cta'){
          const e2=emp();
          if(d.cta==='6.2.14'){
            /* Gastos no deducibles: el IVA de esta compra tampoco es
               acreditable —no tendría sentido que el gasto no genere
               derecho a deducir en ISR pero su IVA sí generara crédito
               fiscal—, así que se separa igual que cualquier otra factura
               y en generarPartidas() va a su propia cuenta (6.2.27, "IVA no
               deducible"), no a la de crédito fiscal ni fundido con el
               gasto. Antes esto ponía la factura completa como si fuera
               puro gasto, sin distinguir cuánto era producto y cuánto IVA. */
            if(!d.ivaReportado) d.iva=r2(d.total-d.total/1.12);
            d.base=r2(d.total-d.iva-(d.noAcred||0));
          }else{
            const regimenDoc=regimenEn(e2,d.fecha);
            const generaCredito = (regimenDoc==='general'||regimenDoc==='simplificado')
              && !d.pequeno && !(d.categoria&&/no genera cr[ée]dito/i.test(d.categoria));
            if(generaCredito){
              if(!d.ivaReportado) d.iva=r2(d.total-d.total/1.12);
              d.base=r2(d.total-d.iva-(d.noAcred||0));
            }else{
              d.iva=0; d.base=d.total;
            }
          }
          recordarCuenta(d);
          /* "Gastos no deducibles" es una decisión que se toma factura por
             factura, no por proveedor — el mismo Claro puede mandar una
             factura de servicio normal (deducible) y otra que no lo es. Para
             cualquier OTRA cuenta sí tiene sentido copiarla a las demás
             facturas del mismo proveedor en esta carga (ahorra reclasificar
             una por una cuando de verdad es la misma situación), pero no
             para esta cuenta específica. */
          if(d.cta!=='6.2.14'){
            const iguales=lote.filter(o=>o!==d && o.tipo===d.tipo && o.cta!=='6.2.14' &&
              (o.tipo==='compra'?o.nitEmisor:o.nitReceptor)===(d.tipo==='compra'?d.nitEmisor:d.nitReceptor));
            if(iguales.length) iguales.forEach(o=>o.cta=d.cta);
          }
          /* Sin esto, elegir "Gastos no deducibles" cambiaba la cuenta y
             separaba base/IVA por dentro, pero la fila seguía mostrando los
             montos viejos en pantalla hasta que algo más disparara un
             repintado — como si no hubiera pasado nada. */
          pintar();
        }
      };
    });
  }
  if(modo==='vista'){
    nodo.insertAdjacentHTML('afterbegin',
      `<div class="aviso"><strong>Estás en la vista previa.</strong> Lo que registrés aquí se guarda y sigue estando si volvés a esta conversación, así que podés probar con confianza. Para el trabajo de verdad descargá el archivo y abrilo en Chrome.</div>`);
  } else if(modo==='memoria'){
    nodo.insertAdjacentHTML('afterbegin',
      `<div class="aviso malo"><strong>Sin guardado.</strong> Esta ventana no puede conservar datos. Descargá el archivo y abrilo directamente en Chrome.</div>`);
  }
}

/* ============ AVISOS Y CONFIRMACIONES ============ */
/* Reemplazan las ventanas nativas del navegador, que no funcionan en vistas restringidas. */
const dlgAviso=document.getElementById('aviso'), avisoCuerpo=document.getElementById('avisoCuerpo');
function avisar(mensaje,titulo='Revisá esto'){
  avisoCuerpo.innerHTML=`<div class="modal-cuerpo"><h3>${esc(titulo)}</h3>
    <p style="margin:0;white-space:pre-line">${esc(mensaje)}</p></div>
    <div class="pie-modal"><button class="btn" type="button" id="aOk">Entendido</button></div>`;
  avisoCuerpo.querySelector('#aOk').onclick=()=>dlgAviso.close();
  dlgAviso.showModal();
  avisoCuerpo.querySelector('#aOk').focus();
}
function confirmar(mensaje,alConfirmar,textoBoton='Eliminar'){
  avisoCuerpo.innerHTML=`<div class="modal-cuerpo"><h3>Confirmá la acción</h3>
    <p style="margin:0;white-space:pre-line">${esc(mensaje)}</p></div>
    <div class="pie-modal"><button class="btn sec" type="button" id="aNo">Cancelar</button>
    <button class="btn peligro" type="button" id="aSi">${esc(textoBoton)}</button></div>`;
  avisoCuerpo.querySelector('#aNo').onclick=()=>dlgAviso.close();
  avisoCuerpo.querySelector('#aSi').onclick=()=>{dlgAviso.close();conSnapshot(textoBoton,alConfirmar)};
  dlgAviso.showModal();
}

/* Pregunta Sí/No que devuelve una promesa — reemplaza a window.confirm, que
   no funciona en vistas restringidas. Se puede usar con un modal abierto. */
function preguntar(mensaje,textoSi='Continuar'){
  return new Promise(ok=>{
    avisoCuerpo.innerHTML=`<div class="modal-cuerpo"><h3>Confirmá la acción</h3>
      <p style="margin:0;white-space:pre-line">${esc(mensaje)}</p></div>
      <div class="pie-modal"><button class="btn sec" type="button" id="aNo">Cancelar</button>
      <button class="btn" type="button" id="aSi">${esc(textoSi)}</button></div>`;
    let listo=false; const fin=v=>{ if(listo) return; listo=true; try{dlgAviso.close()}catch(err){} ok(v); };
    avisoCuerpo.querySelector('#aNo').onclick=()=>fin(false);
    avisoCuerpo.querySelector('#aSi').onclick=()=>fin(true);
    dlgAviso.addEventListener('close',()=>fin(false),{once:true});
    dlgAviso.showModal();
  });
}

/* ============ MODAL ============ */
const modal=document.getElementById('modal'), mForm=document.getElementById('modalForm');
function cerrarModal(){ try{modal.close()}catch(e){} mForm.innerHTML=''; pintar(); }
modal.addEventListener('cancel',ev=>{ev.preventDefault();cerrarModal()});

function abrirModal(titulo,cuerpo,alGuardar,textoBtn='Guardar'){
  mForm.innerHTML=`<div class="modal-cuerpo"><h3>${titulo}</h3>${cuerpo}</div>
    <div class="pie-modal"><button class="btn sec" type="button" id="mCancelar">Cancelar</button>
    <button class="btn" type="button" id="mAceptar">${textoBtn}</button></div>`;
  const aceptar=async()=>{
    const datos={};
    mForm.querySelectorAll('[name]').forEach(i=>{
      datos[i.name] = i.type==='checkbox' ? (i.checked?'on':'') : i.value;
    });
    const resultado=await conSnapshot(String(titulo).replace(/<[^>]+>/g,''),()=>alGuardar(datos));
    if(resultado===false) return;
    cerrarModal();
  };
  mForm.querySelector('#mCancelar').onclick=cerrarModal;
  mForm.querySelector('#mAceptar').onclick=aceptar;
  mForm.onkeydown=ev=>{
    if(ev.key==='Enter' && ev.target.tagName==='INPUT' && ev.target.type!=='file'){ ev.preventDefault(); aceptar(); }
  };
  modal.showModal();
  const primero=mForm.querySelector('input,select');
  if(primero) primero.focus();
}

function formularioPartida(){
  const e=emp();
  const b=borrador;
  /* Un <select> con 70+ cuentas obliga a hacer scroll para encontrar una.
     Un <input> con <datalist> deja escribir para filtrar, con el mismo
     desplegable nativo del navegador — sin agregar ninguna librería. La
     cuenta que muestra cada línea es "código — nombre"; al guardar se
     recorta solo el código con una expresión regular. */
  const etiquetaCuenta=cod=>{
    const c=e.cuentas.find(x=>x.c===cod);
    return c ? `${c.c} — ${c.n}` : '';
  };
  const datalistCuentas=`<datalist id="listaCuentas">${e.cuentas.filter(x=>x.d)
    .map(x=>`<option value="${x.c} — ${esc(x.n)}">`).join('')}</datalist>`;
  const tipos=['Factura','Factura pequeño contribuyente','Nota de crédito','Nota de débito','Recibo',
    'Planilla','Nota contable','Otro'].map(t=>`<option${t===b.docTipo?' selected':''}>${t}</option>`).join('');
  const filas=b.lineas.map((l,i)=>`<tr>
    <td><input list="listaCuentas" data-l="${i}" data-campo="cta" value="${esc(etiquetaCuenta(l.cta))}" placeholder="Buscar cuenta..."></td>
    <td><input data-l="${i}" data-campo="desc" value="${esc(l.desc)}" placeholder="opcional"></td>
    <td><input data-l="${i}" data-campo="debe" type="number" step="0.01" min="0" class="num" value="${l.debe||''}"></td>
    <td><input data-l="${i}" data-campo="haber" type="number" step="0.01" min="0" class="num" value="${l.haber||''}"></td>
    <td class="num"><button class="btn mini peligro" data-accion="quitarLinea" data-i="${i}" title="Quitar línea">Quitar</button></td>
  </tr>`).join('');
  const td=r2(b.lineas.reduce((s,l)=>s+(+l.debe||0),0));
  const th=r2(b.lineas.reduce((s,l)=>s+(+l.haber||0),0));
  const dif=r2(td-th);

  return cab(b.editando?`Editando partida No. ${b.numero}`:`Partida No. ${b.numero}`,
    'Los datos del documento son opcionales, pero alimentan los libros de IVA.',
    `<button class="btn sec" data-accion="cancelarPartida">Descartar</button>
     <button class="btn" data-accion="guardarPartida">${b.editando?'Guardar cambios':'Guardar partida'}</button>`)
  + (b.editando? `<div class="aviso malo">Si esta partida se generó sola —desde una factura cargada, un pago,
      un cobro o una planilla—, el detalle que alimenta la cartera, el inventario o el ISR de esos módulos
      <strong>no se entera de este cambio</strong>, porque vive guardado aparte. El Libro Mayor y los estados
      financieros sí se actualizan solos porque siempre recalculan de las partidas; lo que no se actualiza es
      el origen. Para esos casos, suele ser más seguro eliminar la partida y volver a generarla desde donde
      salió, en vez de editarla a mano.</div>` : !iaPermitidaSesion() ? '' : `<div class="tarjeta">
      <h3 style="margin-bottom:10px">Asistente de registro</h3>
      <p style="margin:0 0 10px;color:var(--tinta-suave);font-size:14px">
        Describí la operación como se la contarías a un colega y te propongo la partida usando tu catálogo.
        Revisá siempre lo que sugiere antes de guardar: la responsabilidad del registro es tuya.</p>
      <textarea id="iaTexto" style="resize:vertical" rows="2" placeholder="Ej. Compré 50 resmas de papel bond por Q1,250 más IVA, según factura serie A número 4471 de Distribuidora Xela, pagado con cheque del banco"></textarea>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
        <button class="btn" data-accion="sugerirIA">Proponer partida</button>
        <span id="iaEstado" style="font-size:14px;color:var(--tinta-suave)"></span>
      </div>
      <div id="iaNota"></div>
    </div>`)
  + `<div class="tarjeta">
      <div class="rej">

        <div class="campo"><label>Tipo de documento</label><select data-cab="docTipo"><option value=""></option>${tipos}</select></div>
        <div class="campo"><label>Serie y número</label>
          <div style="display:flex;gap:6px">
            <input data-cab="docSerie" value="${esc(b.docSerie)}" placeholder="Serie" style="width:40%">
            <input data-cab="docNum" value="${esc(b.docNum)}" placeholder="Número">
          </div></div>
        <div class="campo"><label>NIT de la contraparte</label><input data-cab="nit" value="${esc(b.nit)}" placeholder="C/F o 1234567-8"></div>
        <div class="campo"><label>Nombre de la contraparte</label><input data-cab="contraparte" value="${esc(b.contraparte)}"></div>
      </div>

    <table><thead><tr><th style="width:34%">Cuenta</th><th>Descripción</th>

      <tbody>${filas}</tbody>
      <tfoot><tr class="total"><td colspan="2">Sumas</td>
        <td class="num d" id="totDebe">${Q(td)}</td><td class="num h" id="totHaber">${Q(th)}</td><td></td></tr></tfoot>
    </table>
    <div class="barra" style="margin-top:12px">
      <button class="btn sec" data-accion="agregarLinea">Agregar línea</button>
