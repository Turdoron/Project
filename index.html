      <span><strong>Confirmo que este es el porcentaje que voy a usar para depreciar este activo.</strong>
      ${yaDep?'El cambio aplica de aquí en adelante; lo ya depreciado no se recalcula.':''}</span></label>`,
    d=>{
      const cat=yaDep?a.categoria:d.categoria, c=CATEGORIAS_DEPRECIACION[cat];
      const costo=yaDep?a.costo:r2(+d.costo), pct=+d.pct;
      if(!d.descripcion.trim()){avisar('Escribí la descripción del activo.');return false}
      if(!(costo>0)){avisar('Escribí el costo de adquisición.');return false}
      const fAdq=yaDep?a.fechaAdquisicion:d.fechaAdquisicion, fUso=yaDep?a.fechaInicioUso:(d.fechaInicioUso||d.fechaAdquisicion);
      if(!fAdq||!fUso){avisar('Escribí la fecha de adquisición y la fecha desde la que se usa.');return false}
      if(fUso<fAdq){avisar('El activo no puede empezar a usarse antes de adquirirse.');return false}
      if(!(pct>0)){avisar('Escribí el porcentaje anual de depreciación.');return false}
      if(pct>c.pct+1e-9 && !(d.autorizacionSAT||'').trim()){
        avisar(`El máximo legal para esta categoría es ${c.pct}% (Art. 28). Para usar ${pct}% necesitás autorización previa de la SAT — escribí el número de resolución, o bajá el porcentaje.`);return false}
      if(d.confirmaPct!=='on'){avisar('Confirmá que ese es el porcentaje que vas a usar — marcá la casilla de confirmación.');return false}
      asegurarCuenta(e,c.act,c.nAct,'activo'); asegurarCuenta(e,c.dep,c.nDep,'activo');
      e.activosFijos=e.activosFijos||[];
      const datos={descripcion:d.descripcion.trim(),categoria:cat,costo,fechaAdquisicion:fAdq,fechaInicioUso:fUso,pct,
        autorizacionSAT:pct>c.pct+1e-9?d.autorizacionSAT.trim():'',cuentaActivo:c.act,cuentaDep:c.dep};
      if(nuevo){
        e.activosFijos.push({id:uid(),...datos,acumulada:0,depreciadoHasta:'',baja:null});
        registrarLog('Registró un activo fijo',`${datos.descripcion} — Q${Q(costo)} al ${pct}%`);
      }else{
        Object.assign(a,datos);
        registrarLog('Editó un activo fijo',`${datos.descripcion} — ${pct}%`);
      }
      guardar(); pintar();
    },nuevo?'Registrar activo':'Guardar cambios');
  const sel=mForm.querySelector('[name="categoria"]');
  sel.onchange=()=>{
    const c=CATEGORIAS_DEPRECIACION[sel.value];
    document.getElementById('maxLey').textContent=c.pct+'%';
    mForm.querySelector('[name="pct"]').value=c.pct;
  };
}
ACCIONES.nuevoActivoFijo=()=>formActivoFijo(null);
ACCIONES.editarActivoFijo=d=>{
  const a=(emp().activosFijos||[]).find(x=>x.id===d.id);
  if(!a){avisar('No se encontró ese activo.');return}
  formActivoFijo(a);
};
/* Baja de un activo: venta, pérdida, obsolescencia o donación. Se registra en UNA partida que
   (1) completa la depreciación que falte hasta el mes de la baja, (2) saca el activo y su
   depreciación acumulada de los libros, y (3) reconoce la ganancia o la pérdida de capital contra el valor
   en libros (costo − depreciación acumulada) en el Estado de Resultados. Si la venta ya se
   facturó y se cargó en "Cargar facturas", el precio se saca de la cuenta de ingreso donde
   quedó, para que no se cuente como venta del giro. */
const MOTIVOS_BAJA_ACTIVO={venta:'Venta',perdida:'Pérdida, robo o siniestro',obsolescencia:'Obsolescencia o desecho',donacion:'Donación'};
function calcularBajaActivo(e,a,fecha,precio){
  const copia={...a,baja:{fecha}};
  const pend=calcularDepreciacionPendiente({activosFijos:[copia]},fecha.slice(0,7));
  const depPend=r2(pend.reduce((s,f)=>s+f.monto,0));
  const acumFinal=r2((a.acumulada||0)+depPend);
  const valorLibros=r2(a.costo-acumFinal);
  const resultado=r2((+precio||0)-valorLibros);   // >0 ganancia, <0 pérdida
  return {depPend,acumFinal,valorLibros,resultado,hastaMes:fecha.slice(0,7)};
}
/* Corrección: la ganancia o pérdida en la baja de un activo fijo SÍ pasa por
   el Estado de Resultados (NIC 16 / NIIF para PYMES secc. 17) — como "Otros
   ingresos" (4.2.03) o como gasto (6.2.29). Para el ISR es una renta de
   capital (Dto. 10-2012): la ganancia tributa el 10% aparte y no entra en la
   renta imponible de actividades lucrativas; la pérdida tampoco se deduce
   ahí (solo se compensa contra ganancias de capital). */
const TASA_GANANCIA_CAPITAL=0.10;
ACCIONES.bajaActivoFijo=d=>{
  const e=emp(), a=(e.activosFijos||[]).find(x=>x.id===d.id);
  if(!a){avisar('No se encontró ese activo.');return}
  const cajaBanco=cuentasCajaBanco(e);
  if(!cajaBanco.length){avisar('El catálogo no tiene ninguna cuenta de Caja o Bancos.');return}
  const ctasIngreso=e.cuentas.filter(c=>c.d&&c.t==='ingreso');
  abrirModal(`Dar de baja: ${esc(a.descripcion)}`,
    `<p style="margin:0 0 12px;font-size:13px;color:var(--tinta-suave)">Costo Q${Q(a.costo)} · depreciación registrada Q${Q(a.acumulada||0)}. La partida completa la depreciación que falte hasta el mes de la baja y reconoce la ganancia o la pérdida.</p>
    <div class="rej">
      <div class="campo"><label>Fecha de la baja</label><input name="fecha" type="date" value="${hoy()}"></div>
      <div class="campo"><label>Motivo</label><select name="tipo">${Object.entries(MOTIVOS_BAJA_ACTIVO).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="campo" id="cPrecio"><label>Precio de venta (sin IVA)</label><input name="precio" type="number" step="0.01" min="0" value="0"></div>
      <div class="campo" id="cCuenta"><label>Se cobra en</label><select name="cuenta">${cajaBanco.map(c=>`<option value="${c.c}">${c.c} — ${esc(c.n)}</option>`).join('')}<option value="1.1.04">1.1.04 — Clientes (a crédito)</option></select></div>
      <div class="campo full" id="cFactura"><label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input type="checkbox" name="facturada" style="width:auto;margin-top:4px">
        <span>Ya cargué la factura de esta venta en "Cargar facturas" (el cobro y el IVA ya están registrados). Dejala sin marcar si no hay factura cargada: la partida registra el cobro.</span></label></div>
      <div class="campo full" id="cIngreso" style="display:none"><label>¿En qué cuenta de ingreso quedó esa factura?</label>
        <select name="ctaIngreso">${ctasIngreso.map(c=>`<option value="${c.c}"${c.c==='4.1.01'?' selected':''}>${c.c} — ${esc(c.n)}</option>`).join('')}</select>
        <span style="font-size:12.5px;color:var(--tinta-suave)">Se saca de ahí para que la venta del activo no se cuente como venta del giro normal.</span></div>
    </div>
    <table id="tablaBaja" style="font-size:13px;margin-top:10px"></table>
    <div class="aviso">La ganancia o pérdida va al Estado de Resultados. Para el ISR es renta de capital: la ganancia paga 10% aparte (se registra el pasivo) y no se suma a la renta imponible del régimen; la pérdida solo puede compensarse con ganancias de capital (de este año o de los dos siguientes). Si la venta lleva IVA, se declara con su factura.</div>`,
    f=>{
      if(!f.fecha){avisar('Escribí la fecha de la baja.');return false}
      if(f.fecha<a.fechaInicioUso){avisar('La baja no puede ser anterior a la fecha en que empezó a usarse.');return false}
      const anio=f.fecha.slice(0,4);
      if(anioCerrado(e,anio)){avisar(`El ejercicio ${anio} ya tiene Cierre de libros: no se le pueden agregar partidas.`);return false}
      const venta=f.tipo==='venta', precio=venta?r2(+f.precio||0):0;
      if(venta&&!(precio>0)){avisar('Escribí el precio de venta.');return false}
      const facturada=venta&&f.facturada==='on';
      const r=calcularBajaActivo(e,a,f.fecha,precio);
      asegurarCuenta(e,'6.2.11','Depreciaciones','gasto');
      const c=CATEGORIAS_DEPRECIACION[a.categoria];
      asegurarCuenta(e,c.act,c.nAct,'activo'); asegurarCuenta(e,c.dep,c.nDep,'activo');
      const L=[]; const desc=`Baja de ${a.descripcion}`;
      if(r.depPend>0.004){ L.push({cta:'6.2.11',desc:`${desc} — depreciación hasta ${r.hastaMes}`,debe:r.depPend,haber:0}); L.push({cta:a.cuentaDep,desc:`${desc} — depreciación hasta ${r.hastaMes}`,debe:0,haber:r.depPend}); }
      if(r.acumFinal>0.004) L.push({cta:a.cuentaDep,desc,debe:r.acumFinal,haber:0});
      L.push({cta:a.cuentaActivo,desc,debe:0,haber:a.costo});
      if(precio>0){
        if(facturada) L.push({cta:f.ctaIngreso||'4.1.01',desc:`${desc} — se reclasifica la factura de venta del activo`,debe:precio,haber:0});
        else L.push({cta:f.cuenta,desc:`${desc} — cobro de la venta`,debe:precio,haber:0});
      }
      let isrCapital=0;
      if(r.resultado>0.004){
        asegurarCuenta(e,'4.2.03','Ganancia en venta de activos fijos (renta de capital)','ingreso');
        L.push({cta:'4.2.03',desc:`${desc} — ganancia de capital`,debe:0,haber:r.resultado});
        isrCapital=r2(r.resultado*TASA_GANANCIA_CAPITAL);
        asegurarCuenta(e,'6.2.31','ISR sobre rentas de capital','gasto');
        asegurarCuenta(e,'2.1.18','ISR sobre rentas de capital por pagar','pasivo');
        L.push({cta:'6.2.31',desc:`${desc} — ISR 10% ganancia de capital`,debe:isrCapital,haber:0});
        L.push({cta:'2.1.18',desc:`${desc} — ISR 10% ganancia de capital`,debe:0,haber:isrCapital});
      }else if(r.resultado<-0.004){
        asegurarCuenta(e,'6.2.29','Pérdida en baja de activos fijos (pérdida de capital)','gasto');
        L.push({cta:'6.2.29',desc:`${desc} — pérdida de capital`,debe:-r.resultado,haber:0});
      }
      const resultadoTxt=r.resultado>0.004?`Ganancia de capital de Q${Q(r.resultado)} (ISR 10%: Q${Q(isrCapital)} por pagar).`:(r.resultado<-0.004?`Pérdida de capital de Q${Q(-r.resultado)}.`:'Sin ganancia ni pérdida.');
      const p={id:uid(),numero:e.correlativo++,fecha:f.fecha,
        concepto:`${MOTIVOS_BAJA_ACTIVO[f.tipo]} de activo fijo — ${a.descripcion}${facturada?' (venta facturada)':''}`,
        docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',lineas:L};
      e.partidas.push(p);
      const prevAcumulada=a.acumulada||0, prevDepreciadoHasta=a.depreciadoHasta||'';
      a.acumulada=r.acumFinal; a.depreciadoHasta=r.hastaMes;
      a.baja={fecha:f.fecha,motivo:MOTIVOS_BAJA_ACTIVO[f.tipo],tipo:f.tipo,precio,facturada,valorLibros:r.valorLibros,
        resultado:r.resultado,isrCapital,partidaNumero:p.numero,partidaId:p.id,prevAcumulada,prevDepreciadoHasta};
      registrarLog('Dio de baja un activo fijo',`${a.descripcion} — ${fFecha(f.fecha)} — ${MOTIVOS_BAJA_ACTIVO[f.tipo]} — ${resultadoTxt}`);
      guardar(); pintar();
      avisar(`Baja registrada en la partida No. ${p.numero}. ${resultadoTxt}`,'Listo');
    },'Registrar baja');
  const actualizar=()=>{
    const g=n=>mForm.querySelector(`[name="${n}"]`);
    const venta=g('tipo').value==='venta';
    ['cPrecio','cCuenta','cFactura'].forEach(id=>{document.getElementById(id).style.display=venta?'':'none'});
    const fact=venta&&g('facturada').checked;
    document.getElementById('cIngreso').style.display=fact?'':'none';
    document.getElementById('cCuenta').style.display=venta&&!fact?'':'none';
    const fecha=g('fecha').value; if(!fecha){document.getElementById('tablaBaja').innerHTML='';return}
    const precio=venta?r2(+g('precio').value||0):0;
    const r=calcularBajaActivo(e,a,fecha,precio);
    const res=r.resultado;
    document.getElementById('tablaBaja').innerHTML=`<tbody>
      <tr><td>Depreciación que falta registrar hasta ${r.hastaMes}</td><td class="num">${Q(r.depPend)}</td></tr>
      <tr><td>Depreciación acumulada al dar de baja</td><td class="num">${Q(r.acumFinal)}</td></tr>
      <tr class="total"><td>Valor en libros (costo − depreciación)</td><td class="num">${Q(r.valorLibros)}</td></tr>
      ${venta?`<tr><td>Precio de venta</td><td class="num">${Q(precio)}</td></tr>`:''}
      <tr class="total"><td>${res>0.004?'Ganancia de capital':res<-0.004?'Pérdida de capital':'Resultado'}</td><td class="num">${Q(Math.abs(res))}</td></tr>
      ${res>0.004?`<tr><td>ISR sobre ganancia de capital (10%)</td><td class="num">${Q(r2(res*TASA_GANANCIA_CAPITAL))}</td></tr>`:''}</tbody>`;
  };
  ['tipo','fecha','precio','facturada'].forEach(n=>{ const el=mForm.querySelector(`[name="${n}"]`); el.oninput=actualizar; el.onchange=actualizar; });
  actualizar();
};

/* Cuadro de depreciación: lo que corresponde según el % y la fecha de inicio de cada activo hasta el
   mes de corte, separado en lo acumulado al cierre del año anterior y lo del ejercicio. */
function depreciacionTeoricaHasta(a,mes){
  const mesCompra=mesSiguiente((a.fechaAdquisicion||a.fechaInicioUso).slice(0,7)), mesUso=a.fechaInicioUso.slice(0,7);
  const inicio=mesCompra>mesUso?mesCompra:mesUso;
  let fin=mes; if(a.baja&&a.baja.fecha.slice(0,7)<fin) fin=a.baja.fecha.slice(0,7);
  if(fin<inicio) return 0;
  return r2(Math.min(a.costo,a.costo*a.pct/100/12*mesesEntre(inicio,fin)));
}
ACCIONES.pdfActivosFijos=async()=>{
  const e=emp(), lista=e.activosFijos||[];
  if(!lista.length){avisar('No hay activos fijos registrados todavía.');return}
  const corte=filtros.corteActivos||(hoy().slice(0,4)===String(e.ejercicio)?hoy().slice(0,7):`${e.ejercicio}-12`);
  const anio=corte.slice(0,4), mesAnt=`${+anio-1}-12`;
  const alto=altoEncabezado();
  try{
    const jsPDF=await cargarJsPDF();
    const doc=new jsPDF({unit:'pt',format:'letter',orientation:'landscape'});
    const T={costo:0,ant:0,ej:0,acum:0,libros:0,pend:0};
    const body=lista.map(a=>{
      const c=CATEGORIAS_DEPRECIACION[a.categoria];
      const ant=depreciacionTeoricaHasta(a,mesAnt), acum=depreciacionTeoricaHasta(a,corte), ej=r2(acum-ant);
      const pend=r2(Math.max(0,acum-(a.acumulada||0)));
      const vivo=!a.baja||a.baja.fecha.slice(0,7)>corte;
      const libros=r2(a.costo-acum);
      if(vivo){T.costo=r2(T.costo+a.costo);T.libros=r2(T.libros+libros);}
      T.ant=r2(T.ant+ant);T.ej=r2(T.ej+ej);T.acum=r2(T.acum+acum);T.pend=r2(T.pend+pend);
      return [a.descripcion+'\n'+c.nAct,fFecha(a.fechaAdquisicion),a.pct+'%',Q(a.costo),Q(ant),Q(ej),Q(acum),vivo?Q(libros):'—',pend>0.004?Q(pend):'—',
        a.baja&&a.baja.fecha.slice(0,7)<=corte?`Baja ${fFecha(a.baja.fecha)}`:(libros<0.005?'Depreciado':'En uso')];
    });
    body.push([{content:'Totales',colSpan:3,styles:{fontStyle:'bold',textColor:VERDE}},
      ...[T.costo,T.ant,T.ej,T.acum,T.libros,T.pend].map(v=>({content:Q(v),styles:{fontStyle:'bold',halign:'right',textColor:VERDE}})),'']);
    doc.autoTable({
      head:[['Activo','Adquisición','% anual','Costo',`Dep. acum. al 31/12/${+anio-1}`,`Dep. del ejercicio ${anio}`,'Dep. acum. al corte','Valor en libros','Falta registrar','Estado']],
      body,startY:alto,margin:{top:alto,left:40,right:40,bottom:42},
      styles:{fontSize:8,cellPadding:4,lineColor:[225,222,212],lineWidth:.3},headStyles:{fillColor:VERDE,fontSize:7.5},
      columnStyles:{0:{cellWidth:150},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'},7:{halign:'right'},8:{halign:'right'},2:{halign:'right'}},
      didDrawPage:()=>encabezadoPDF(doc,'Cuadro de depreciación de activos fijos',
        `Línea recta, desde el mes siguiente a la compra (Arts. 27 y 28, Dto. 10-2012) · corte: ${corte} · cifras en quetzales`)});
    pieDePagina(doc);
    doc.save(`Cuadro-Depreciacion-${archivoSeguro(e.nombre)}-${corte}.pdf`);
    avisarDatosIncompletos();
  }catch(err){
    avisar('No se pudo generar el PDF: '+err.message+'\n\nEl generador se descarga de internet la primera vez, así que necesitás conexión.');
  }
};
ACCIONES.generarDepreciacion=()=>{
  const e=emp();
  if(!(e.activosFijos||[]).some(a=>!a.baja)){avisar('No hay activos fijos registrados todavía.');return}
  const hoyMes=hoy().slice(0,7);
  const porDefecto=hoyMes.slice(0,4)===String(e.ejercicio)
    ? (hoyMes.slice(5)==='01'?hoyMes:`${hoyMes.slice(0,5)}${String(+hoyMes.slice(5)-1).padStart(2,'0')}`)
    : `${e.ejercicio}-12`;
  abrirModal('Generar depreciación',
    `<p style="margin:0 0 12px;font-size:13px;color:var(--tinta-suave)">Registra la depreciación de todos los activos que falte depreciar, hasta el cierre del mes
      que elijas — con el porcentaje que confirmaste en cada uno. Genera una sola partida: gasto de depreciación contra la depreciación acumulada de cada cuenta.</p>
    <div class="rej"><div class="campo full"><label>Depreciar hasta el cierre de</label><input name="hastaMes" type="month" value="${porDefecto}"></div></div>
    <table id="tablaDep" style="font-size:13px;margin-top:10px"></table>`,
    d=>{
      const hastaMes=d.hastaMes;
      if(!hastaMes){avisar('Elegí hasta qué mes se deprecia.');return false}
      if(hastaMes>hoyMes){avisar('No se puede depreciar un mes que todavía no termina.');return false}
      const filas=calcularDepreciacionPendiente(e,hastaMes);
      if(!filas.length){avisar('No hay nada pendiente de depreciar hasta ese mes.');return false}
      /* Años que toca esta depreciación, y si alguno ya tiene Cierre de libros. */
      const anosTocados=new Set();
      filas.forEach(f=>{for(let a=+f.desde.slice(0,4);a<=+f.hasta.slice(0,4);a++) anosTocados.add(String(a));});
      const cerrado=[...anosTocados].some(a=>(e.partidas||[]).some(p=>(p.concepto||'').startsWith(PREFIJO_CIERRE_LIBROS+a)));
      if(cerrado){avisar('Ese ejercicio ya tiene Cierre de libros: no se le pueden agregar partidas. Deshacé el cierre primero, o depreciá solo hasta el último mes abierto.');return false}
      asegurarCuenta(e,'6.2.11','Depreciaciones','gasto');
      const porCuenta={};
      filas.forEach(f=>{porCuenta[f.activo.cuentaDep]=r2((porCuenta[f.activo.cuentaDep]||0)+f.monto)});
      const total=r2(Object.values(porCuenta).reduce((s,x)=>s+x,0));
      const p={id:uid(),numero:e.correlativo++,fecha:ultimoDiaDelMes(hastaMes),
        concepto:`Depreciación de activos fijos — hasta ${hastaMes}`,docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',
        lineas:[{cta:'6.2.11',desc:'',debe:total,haber:0},...Object.entries(porCuenta).map(([cta,m])=>({cta,desc:'',debe:0,haber:m}))]};
      p.depDetalle=filas.map(f=>({activoId:f.activo.id,monto:f.monto,prevHasta:f.activo.depreciadoHasta||''}));
      e.partidas.push(p);
      filas.forEach(f=>{f.activo.acumulada=r2((f.activo.acumulada||0)+f.monto); f.activo.depreciadoHasta=f.hasta});
      registrarLog('Generó la depreciación de activos fijos',`hasta ${hastaMes} — Q${Q(total)}`);
      guardar(); pintar();
      avisar(`Depreciación registrada en la partida No. ${p.numero}, por Q${Q(total)}.`,'Listo');
    },'Registrar depreciación');
  const actualizar=()=>{
    const m=mForm.querySelector('[name="hastaMes"]').value;
    const filas=m?calcularDepreciacionPendiente(e,m):[];
    document.getElementById('tablaDep').innerHTML=filas.length
      ? `<thead><tr><th>Activo</th><th class="num">%</th><th class="num">Meses</th><th class="num">Depreciación</th></tr></thead><tbody>${filas.map(f=>
          `<tr><td>${esc(f.activo.descripcion)}</td><td class="num">${f.activo.pct}%</td><td class="num">${f.meses}</td><td class="num">${Q(f.monto)}</td></tr>`).join('')}</tbody>
         <tfoot><tr class="total"><td colspan="3">Total</td><td class="num">${Q(r2(filas.reduce((s,f)=>s+f.monto,0)))}</td></tr></tfoot>`
      : `<tbody><tr><td>No hay nada pendiente de depreciar hasta ese mes.</td></tr></tbody>`;
  };
  mForm.querySelector('[name="hastaMes"]').onchange=actualizar;
  actualizar();
};

/* ============ ISO — FORMA DE ACREDITAMIENTO (Art. 11, Dto. 73-2008) ============ */
/* El contribuyente elige UNA de dos formas, y la SAT la lleva en el RTU:
   a) el ISO pagado en los cuatro trimestres de un año se acredita al ISR (mensual,
      trimestral o anual) de los TRES años calendario siguientes, hasta agotarse; lo que
      no se logre acreditar es gasto deducible en la liquidación anual del año en que
      concluyen los tres años.
   b) los pagos trimestrales de ISR se acreditan al ISO del mismo año calendario.
   Se puede cambiar al inicio de cada período fiscal. Según la SAT, quien pasa de a) a b)
   ya no puede aplicar al ISR el ISO que pagó bajo a). */
const ISO_OPCIONES={
  a:{corto:'ISO a ISR',nombre:'a) El ISO pagado se acredita al ISR de los 3 años siguientes (la más común)'},
  b:{corto:'ISR a ISO',nombre:'b) Los pagos trimestrales de ISR se acreditan al ISO del mismo año'}};
const ISO_ANOS_CREDITO=3;
function isoOpcionEn(e,fecha){
  const h=(e.historialISO||[]).filter(x=>x.vigenteDesde<=fecha).sort((x,y)=>x.vigenteDesde.localeCompare(y.vigenteDesde));
  return h.length?h[h.length-1].opcion:null;
}
const isoOpcionDelAnio=(e,anio)=>isoOpcionEn(e,`${anio}-12-31`);
const restanteCreditoISO=c=>r2(c.monto-(c.usado||0)-(c.vencido||0));

/* Opción a): créditos de ISO. Un ISO pagado en el año Y se puede aplicar en Y+1, Y+2 y Y+3. */
function creditosISOUsables(e,anioUso){
  return (e.creditosISO||[]).filter(c=>!c.congelado&&c.anio<anioUso&&c.anio+ISO_ANOS_CREDITO>=anioUso&&restanteCreditoISO(c)>0.004)
    .sort((x,y)=>x.anio-y.anio||x.trimestre-y.trimestre);
}
const totalCreditoISOUsable=(e,anioUso)=>r2(creditosISOUsables(e,anioUso).reduce((s,c)=>s+restanteCreditoISO(c),0));
/* Aplica créditos empezando por los más viejos (son los primeros que vencen). */
function aplicarCreditosISO(e,monto,fecha,contexto,partidaId){
  let falta=monto, aplicado=0;
  creditosISOUsables(e,+fecha.slice(0,4)).forEach(c=>{
    if(falta<=0.004) return;
    const t=r2(Math.min(restanteCreditoISO(c),falta));
    c.usado=r2((c.usado||0)+t); (c.usos=c.usos||[]).push({fecha,monto:t,contexto,partidaId:partidaId||''});
    falta=r2(falta-t); aplicado=r2(aplicado+t);
  });
  return aplicado;
}
/* Opción b): lo que se pagó de ISR en los trimestres de un año, menos lo que ya se usó para pagar ISO. */
function isrConsumidoPorISO(e,anio,antesDeTrimestre){
  return r2((e.pagosISO||[]).filter(p=>p.anio===anio&&p.opcion==='b'&&(antesDeTrimestre===undefined||p.trimestre<antesDeTrimestre))
    .reduce((s,p)=>s+(p.acreditadoISR||0),0));
}
function poolISRparaISO(e,anio,hastaTrimestre){
  const pagado=(e.cierresParciales||[]).filter(c=>c.ejercicio===anio&&c.trimestre<=hastaTrimestre).reduce((s,c)=>s+c.monto,0);
  return r2(Math.max(0,pagado-isrConsumidoPorISO(e,anio)));
}
/* Partida de pago de ISR: del ISR por pagar sale el efectivo y, si hay, el crédito de ISO. */
function lineasPagoISR(ctaDebe,monto,cred,cuenta){
  const l=[{cta:ctaDebe,desc:'',debe:monto,haber:0}];
  if(cred>0.004) l.push({cta:'1.1.16',desc:'',debe:0,haber:cred});
  if(monto-cred>0.004) l.push({cta:cuenta,desc:'',debe:0,haber:r2(monto-cred)});
  return l;
}
/* Liquidación anual con ISO (opción a): el crédito se aplica al ISR a pagar, y el ISO que cumple
   sus tres años sin usarse pasa a gasto deducible — pero ese gasto baja la renta imponible y, con
   ella, el ISR contra el que se aplicaría el crédito. Se resuelve iterando hasta que se estabilice. */
function planificarISOAnual(e,base0,pagado){
  const Z=e.ejercicio, cs=e.creditosISO||[];
  const usables=creditosISOUsables(e,Z);
  const totalUsable=r2(usables.reduce((s,c)=>s+restanteCreditoISO(c),0));
  const vencUsables=r2(usables.filter(c=>c.anio+ISO_ANOS_CREDITO===Z).reduce((s,c)=>s+restanteCreditoISO(c),0));
  const vencCongelados=r2(cs.filter(c=>c.congelado&&c.anio+ISO_ANOS_CREDITO===Z).reduce((s,c)=>s+restanteCreditoISO(c),0));
  let E=0;
  for(let i=0;i<60;i++){
    const isr=r2(Math.max(0,r2(base0-E))*0.25), dif=r2(isr-pagado);
    const aplic=r2(Math.min(totalUsable,Math.max(0,dif)));
    const nuevo=r2(vencCongelados+Math.max(0,vencUsables-aplic));
    if(Math.abs(nuevo-E)<0.005){E=nuevo;break}
    E=nuevo;
  }
  const base=r2(base0-E), isr=r2(Math.max(0,base)*0.25), dif=r2(isr-pagado);
  return {base,isr,dif,aplicado:r2(Math.min(totalUsable,Math.max(0,dif))),vencido:E};
}
/* Pasa a gasto deducible el ISO que cumplió sus tres años sin acreditarse. */
function postearISOVencido(e,hastaAno){
  const Z=e.ejercicio;
  const venc=(e.creditosISO||[]).filter(c=>c.anio+ISO_ANOS_CREDITO===Z&&restanteCreditoISO(c)>0.004);
  const total=r2(venc.reduce((s,c)=>s+restanteCreditoISO(c),0));
  if(total<=0.004) return 0;
  asegurarCuenta(e,'6.2.25','Impuesto de Solidaridad (ISO) no acreditado','gasto');
  asegurarCuenta(e,'1.1.16','ISO por acreditar','activo');
  e.partidas.push({id:uid(),numero:e.correlativo++,fecha:hastaAno,
    concepto:`Cierre fiscal total ${Z} — ISO no acreditado en 3 años, pasa a gasto deducible`,
    docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',
    lineas:[{cta:'6.2.25',desc:'',debe:total,haber:0},{cta:'1.1.16',desc:'',debe:0,haber:total}]});
  const pv=e.partidas[e.partidas.length-1];
  venc.forEach(c=>{c.vencido=r2((c.vencido||0)+restanteCreditoISO(c)); c.vencidoPartidaId=pv.id;});
  return total;
}

ACCIONES.elegirISO=(continuar)=>{
  const e=emp();
  abrirModal('¿Cómo acredita esta empresa el ISO?',
    `<p style="margin:0 0 12px;font-size:13px;color:var(--tinta-suave)">El régimen General lleva Impuesto de Solidaridad, y la ley deja elegir una de dos formas de acreditarlo (Art. 11).
      Es la que tiene inscrita la empresa en la SAT: confirmala antes de pagar el primer trimestre.</p>
    <div class="rej"><div class="campo full"><label>Forma de acreditamiento</label>
      <select name="opcion">${Object.entries(ISO_OPCIONES).map(([k,o])=>`<option value="${k}">${o.nombre}</option>`).join('')}</select></div></div>`,
    d=>{
      e.historialISO=[{opcion:d.opcion,vigenteDesde:`${e.ejercicio}-01-01`}];
      registrarLog('Eligió la forma de acreditar el ISO',`${e.nombre} — ${ISO_OPCIONES[d.opcion].corto}`);
      guardar(); pintar();
      if(typeof continuar==='function') setTimeout(continuar,0);
    },'Guardar');
};
ACCIONES.cambiarISO=()=>{
  const e=emp(), actual=isoOpcionDelAnio(e,e.ejercicio);
  const otra=actual==='a'?'b':'a';
  abrirModal('Cambiar la forma de acreditar el ISO',
    `<p style="margin:0 0 12px;font-size:13px;color:var(--tinta-suave)">Forma actual: <strong>${esc(ISO_OPCIONES[actual||'a'].nombre)}</strong>.
      El cambio solo puede regir desde el <strong>1 de enero</strong> de un año, y tiene que coincidir con lo que se registre en la SAT.</p>
    <div class="rej">
      <div class="campo full"><label>Nueva forma</label><select name="opcion">${Object.entries(ISO_OPCIONES).map(([k,o])=>`<option value="${k}"${k===otra?' selected':''}>${o.nombre}</option>`).join('')}</select></div>
      <div class="campo full"><label>Rige desde</label><input name="vigenteDesde" type="date" value="${e.ejercicio+1}-01-01"></div>
    </div>
    <div class="aviso">Si pasás de a) a b), según la SAT el ISO que ya pagaste bajo a) <strong>ya no se puede aplicar al ISR</strong>.
      El sistema lo deja congelado y, al cumplirse sus tres años, lo pasa a gasto deducible.</div>`,
    d=>{
      if(d.opcion===actual){avisar('Ya es la forma que tiene la empresa — elegí la otra.');return false}
      if(!/^\d{4}-01-01$/.test(d.vigenteDesde||'')){avisar('El cambio solo puede regir desde el 1 de enero de un año.');return false}
      e.historialISO=e.historialISO||[];
      e.historialISO.push({opcion:d.opcion,vigenteDesde:d.vigenteDesde});
      if(d.opcion==='b') (e.creditosISO||[]).forEach(c=>{ if(restanteCreditoISO(c)>0.004) c.congelado=true; });
      registrarLog('Cambió la forma de acreditar el ISO',`${e.nombre} — ahora ${ISO_OPCIONES[d.opcion].corto} desde ${fFecha(d.vigenteDesde)}`);
      guardar(); pintar();
    },'Registrar cambio');
};

ACCIONES.pagarISO=()=>{
  const e=emp();
  if(e.regimen!=='general'){avisar('El Impuesto de Solidaridad es solo para el régimen General.');return}
  const iso=calcularISO(e);
  if(!iso.aplica){avisar('Esta empresa no está afecta al ISO ahora mismo: '+iso.motivo);return}
  const cajaBanco=cuentasCajaBanco(e);
  if(!cajaBanco.length){avisar('El catálogo no tiene ninguna cuenta de Caja o Bancos.');return}
  const opcion=isoOpcionDelAnio(e,e.ejercicio);
  if(!opcion){ACCIONES.elegirISO(()=>ACCIONES.pagarISO());return}
  abrirModal('Pagar Impuesto de Solidaridad',
    `<p style="margin:0 0 14px;font-size:13px;color:var(--tinta-suave)">
      Base: la mayor entre 1/4 del activo neto (Q${Q(iso.activoNetoAnt)}) y 1/4 de los ingresos brutos
      (Q${Q(iso.ingresosAnt)}) del ejercicio ${iso.ejercicioAnterior} — en este caso, ${esc(iso.criterio)}.
      <strong>ISO trimestral: Q${Q(iso.isoTrimestral)}.</strong> Forma de acreditar: <strong>${esc(ISO_OPCIONES[opcion].corto)}</strong>.</p>
    <div class="rej">
      <div class="campo"><label>Trimestre</label><select name="trimestre">
        <option value="1">Ene–Mar</option><option value="2">Abr–Jun</option>
        <option value="3">Jul–Sep</option><option value="4">Oct–Dic</option>
      </select></div>
      <div class="campo"><label>Monto del ISO</label><input name="monto" type="number" step="0.01" min="0" value="${iso.isoTrimestral}"></div>
      <div class="campo"><label>Se paga desde</label><select name="cuenta">
        ${cajaBanco.map(c=>`<option value="${c.c}">${c.c} — ${esc(c.n)}</option>`).join('')}
      </select></div>
      <div class="campo"><label>Fecha de pago</label><input name="fechaPago" type="date" value="${fechaPagoDefault(e)}"></div>
    </div>
    ${iso.criterio==='activo neto'?`<div class="rej" style="margin-top:8px">
      <div class="campo full"><label>¿La empresa paga IUSI?</label>
        <select name="pagaIUSI"><option value="">— Elegí una opción —</option><option value="no">No paga IUSI (no tiene inmuebles a su nombre, o está exenta)</option><option value="si">Sí paga IUSI</option></select></div>
    </div>
    <div class="rej" id="camposIUSI" style="margin-top:8px;display:none">
      <div class="campo"><label>IUSI pagado en el trimestre</label><input name="iusi" type="number" step="0.01" min="0" value="0"></div>
      <div class="campo"><label>Estimar IUSI: valor del inmueble</label><input name="iusiValor" type="number" step="0.01" min="0" placeholder="Opcional"></div>
      <div class="campo"><label>Uso</label><select name="iusiUso"><option value="comercial">Comercial u otros</option><option value="vivienda">Vivienda o mixto</option></select></div>
    </div>
    <p id="previewIUSI" style="margin:6px 0 0;font-size:12.5px;color:var(--tinta-suave)"></p>`:''}
    <p style="margin:6px 0 0;font-size:12.5px;color:var(--tinta-suave)">El monto viene calculado sobre la base de arriba.
      ${iso.criterio==='activo neto'?'Como la base es el activo neto, el IUSI pagado en el trimestre se resta del ISO: escribilo arriba y el monto se ajusta solo.':'El IUSI solo se resta cuando la base es el activo neto; acá la base son los ingresos, así que no aplica.'}
      <br>Nuevo IUSI (Dto. 18-2026, aplicado desde ${fFecha(IUSI_VIGENCIA_NUEVA)}): vivienda exenta; comercial 3‰, 6‰ y 9‰ por tramos.</p>
    <p id="previewISO" style="margin:10px 0 0;font-size:13px"></p>
    <div class="aviso">${opcion==='a'
      ? 'Se registra como <strong>ISO por acreditar</strong> (un activo), no como gasto: se aplicará al ISR de los 3 años siguientes. Lo que no se acredite en ese plazo pasa a gasto deducible.'
      : 'Se paga con los pagos trimestrales de ISR del mismo año, hasta donde alcancen. Lo que se use así ya no cuenta como ISR pagado, y el ISO no se recupera más adelante: se registra como gasto no deducible.'}</div>`,
    d=>{
      const t=+d.trimestre, monto=r2(+d.monto);
      /* No todas las empresas pagan IUSI: se pregunta cada vez, cuando aplica. */
      if(iso.criterio==='activo neto'&&!d.pagaIUSI){avisar('Indicá si la empresa paga IUSI: el IUSI pagado se resta del ISO cuando la base es el activo neto.');return false}
      if(!(monto>0)){avisar('Escribí el monto del ISO.');return false}
      const yaPagado=(e.pagosISO||[]).some(x=>x.anio===e.ejercicio&&x.trimestre===t)
        ||e.partidas.some(x=>(x.concepto||'').startsWith(`Pago de ISO — trimestre ${t} de ${e.ejercicio}`));
      if(yaPagado){avisar(`El ISO del trimestre ${t} de ${e.ejercicio} ya está registrado.`);return false}
      e.pagosISO=e.pagosISO||[];
      let p;
      if(opcion==='a'){
        asegurarCuenta(e,'1.1.16','ISO por acreditar','activo');
        p={id:uid(),numero:e.correlativo++,fecha:d.fechaPago,
          concepto:`Pago de ISO — trimestre ${t} de ${e.ejercicio} (por acreditar al ISR)`,
          docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',
          lineas:[{cta:'1.1.16',desc:'',debe:monto,haber:0},{cta:d.cuenta,desc:'',debe:0,haber:monto}]};
        e.partidas.push(p);
        (e.creditosISO=e.creditosISO||[]).push({id:uid(),anio:e.ejercicio,trimestre:t,monto,usado:0,vencido:0,
          fechaPago:d.fechaPago,partidaId:p.id,congelado:false,usos:[]});
        e.pagosISO.push({id:uid(),anio:e.ejercicio,trimestre:t,monto,fecha:d.fechaPago,opcion:'a',acreditadoISR:0,partidaId:p.id});
      }else{
        const A=r2(Math.min(monto,poolISRparaISO(e,e.ejercicio,t)));
        asegurarCuenta(e,'6.2.28','ISO pagado con crédito de ISR (no deducible)','gasto');
        asegurarCuenta(e,'2.1.05','ISR por pagar','pasivo');
        const lineas=[{cta:'6.2.28',desc:'',debe:monto,haber:0}];
        if(A>0.004) lineas.push({cta:'2.1.05',desc:'',debe:0,haber:A});
        if(monto-A>0.004) lineas.push({cta:d.cuenta,desc:'',debe:0,haber:r2(monto-A)});
        p={id:uid(),numero:e.correlativo++,fecha:d.fechaPago,
          concepto:`Pago de ISO — trimestre ${t} de ${e.ejercicio}${A>0.004?' (acreditando ISR pagado)':''}`,
          docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',lineas};
        e.partidas.push(p);
        e.pagosISO.push({id:uid(),anio:e.ejercicio,trimestre:t,monto,fecha:d.fechaPago,opcion:'b',acreditadoISR:A,partidaId:p.id});
      }
      registrarLog('Pagó ISO',`${e.nombre} — trimestre ${t}/${e.ejercicio} — Q${Q(monto)} — ${ISO_OPCIONES[opcion].corto}`);
      guardar(); pintar();
      avisar(`ISO pagado por Q${Q(monto)}, registrado en la partida No. ${p.numero}.`,'Listo');
    },'Registrar pago');
  const actualizar=()=>{
    const t=+mForm.querySelector('[name="trimestre"]').value, monto=r2(+mForm.querySelector('[name="monto"]').value||0);
    document.getElementById('previewISO').innerHTML = opcion==='a'
      ? `Quedará como crédito para el ISR de ${e.ejercicio+1} a ${e.ejercicio+ISO_ANOS_CREDITO}.`
      : (()=>{const A=r2(Math.min(monto,poolISRparaISO(e,e.ejercicio,t)));
          return `Pagos de ISR disponibles para acreditar: Q${Q(poolISRparaISO(e,e.ejercicio,t))} · se acreditan Q${Q(A)} · en efectivo Q${Q(r2(monto-A))}.`})();
  };
  mForm.querySelector('[name="trimestre"]').onchange=actualizar;
  mForm.querySelector('[name="monto"]').oninput=actualizar;
  const campoIUSI=mForm.querySelector('[name="iusi"]');
  const selPagaIUSI=mForm.querySelector('[name="pagaIUSI"]');
  if(selPagaIUSI) selPagaIUSI.onchange=()=>{
    const si=selPagaIUSI.value==='si';
    document.getElementById('camposIUSI').style.display=si?'':'none';
    document.getElementById('previewIUSI').style.display=si?'':'none';
    if(!si){ campoIUSI.value=0; campoIUSI.oninput(); }
  };
  if(campoIUSI){
    const estimar=()=>{
      const v=+mForm.querySelector('[name="iusiValor"]').value||0;
      const el=document.getElementById('previewIUSI');
      if(!v){ el.textContent=''; return; }
      const r=calcularIUSI(v,mForm.querySelector('[name="iusiUso"]').value,mForm.querySelector('[name="fechaPago"]').value);
      el.textContent=`IUSI estimado (${r.ley}): Q${Q(r.anual)} al año, Q${Q(r2(r.anual/4))} por trimestre. ${r.nota} Es una estimación; el monto real es el del recibo de la municipalidad.`;
      campoIUSI.value=r2(r.anual/4);
      campoIUSI.oninput();
    };
    campoIUSI.oninput=()=>{
      const iusi=Math.max(0,r2(+campoIUSI.value||0));
      mForm.querySelector('[name="monto"]').value=Math.max(0,r2(iso.isoTrimestral-iusi));
      actualizar();
    };
    ['iusiValor','iusiUso','fechaPago'].forEach(n=>{ mForm.querySelector(`[name="${n}"]`).oninput=estimar; mForm.querySelector(`[name="${n}"]`).onchange=estimar; });
  }
  actualizar();
};

/* La tarjeta del Tablero fiscal: cuánto toca de ISO y cómo está su acreditamiento. */
function htmlTarjetaISO(e){
  const iso=calcularISO(e);
  if(!iso.aplica) return `<div class="aviso">Impuesto de Solidaridad: ${esc(iso.motivo)}</div>`;
  const op=isoOpcionDelAnio(e,e.ejercicio);
  let detalle;
  if(!op){
    detalle=`<div class="aviso malo">Falta elegir cómo acredita esta empresa el ISO. <button class="btn mini" data-accion="elegirISO">Elegir ahora</button></div>`;
  }else if(op==='a'){
    const cs=[...(e.creditosISO||[])].sort((x,y)=>x.anio-y.anio||x.trimestre-y.trimestre);
    detalle=`<p style="margin:0 0 8px;font-size:13px;color:var(--tinta-suave)">El ISO pagado se acredita al ISR de los 3 años siguientes; lo que no se use pasa a gasto deducible al cumplirse el plazo.</p>`
      +(cs.length?`<table style="font-size:13px"><thead><tr><th>ISO pagado</th><th class="num">Monto</th><th class="num">Aplicado</th><th class="num">Por aplicar</th><th>Estado</th></tr></thead><tbody>${cs.map(c=>{
        const rest=restanteCreditoISO(c);
        const est=c.congelado?'Congelado por cambio de forma':(rest<=0.004?(c.vencido?'Pasó a gasto':'Aplicado'):(e.ejercicio<=c.anio?`Aplicable desde ${c.anio+1}`:`Vence al cierre de ${c.anio+ISO_ANOS_CREDITO}`));
        return `<tr><td>Trimestre ${c.trimestre} de ${c.anio}</td><td class="num">${Q(c.monto)}</td><td class="num">${Q(c.usado||0)}</td><td class="num">${Q(rest)}</td><td>${est}</td></tr>`;}).join('')}</tbody></table>`
        :`<div class="vacio" style="padding:14px">Todavía no hay ISO pagado por acreditar.</div>`);
  }else{
    const ps=(e.pagosISO||[]).filter(x=>x.anio===e.ejercicio&&x.opcion==='b');
    detalle=`<p style="margin:0 0 8px;font-size:13px;color:var(--tinta-suave)">Los pagos trimestrales de ISR se acreditan al ISO del mismo año. Lo que se usa así ya no cuenta como ISR pagado en la liquidación anual.</p>
      <div class="cifras"><div class="cifra"><span>ISR pagado en ${e.ejercicio}</span><strong>${Q(r2((e.cierresParciales||[]).filter(c=>c.ejercicio===e.ejercicio).reduce((s,c)=>s+c.monto,0)))}</strong></div>
      <div class="cifra"><span>Usado para pagar ISO</span><strong>${Q(isrConsumidoPorISO(e,e.ejercicio))}</strong></div>
      <div class="cifra"><span>ISO pagado en ${e.ejercicio}</span><strong>${Q(r2(ps.reduce((s,x)=>s+x.monto,0)))}</strong></div></div>`;
  }
  return `<h3 style="color:var(--verde);margin:22px 0 4px">Impuesto de Solidaridad (ISO)</h3>
    <p style="margin:0 0 12px;font-size:14px;color:var(--tinta-suave)">
      Tarifa del 1% trimestral sobre la mayor entre 1/4 del activo neto y 1/4 de los ingresos brutos,
      ambos del ejercicio ${iso.ejercicioAnterior} completo (Dto. 73-2008).
      ${op?`Forma de acreditar: <strong>${esc(ISO_OPCIONES[op].nombre)}</strong>. <button class="btn mini sec" data-accion="cambiarISO">Cambiar</button>`:''}</p>
    <div class="cifras">
      <div class="cifra"><span>Activo neto ${iso.ejercicioAnterior}</span><strong>${Q(iso.activoNetoAnt)}</strong></div>
      <div class="cifra"><span>Ingresos brutos ${iso.ejercicioAnterior}</span><strong>${Q(iso.ingresosAnt)}</strong></div>
      <div class="cifra"><span>Base (${esc(iso.criterio)})</span><strong>${Q(iso.base)}</strong></div>
      <div class="cifra"><span>ISO trimestral (1%)</span><strong>${Q(iso.isoTrimestral)}</strong></div>
    </div>${detalle}`;
}

/* Cierre de libros — el cierre contable tradicional de fin de ejercicio:
   deja en cero cada cuenta de ingreso, costo y gasto, y traslada el
   resultado neto a Utilidades Retenidas, dentro del Patrimonio. Se marca con
   un concepto reconocible (PREFIJO_CIERRE_LIBROS) para que Resultados, el
   Tablero y el Flujo de Efectivo la ignoren al recalcular — así un ejercicio
   ya cerrado se sigue pudiendo consultar con sus cifras reales, sin que su
   propia partida de cierre las deje en cero. El Balance General SÍ la ve
   normal, porque ahí es donde tiene que aparecer el traslado a patrimonio. */
ACCIONES.cierreDeLibros=()=>{
  const e=emp();
  const desde=`${e.ejercicio}-01-01`, hasta=`${e.ejercicio}-12-31`;
  const yaCerrado=(e.partidas||[]).some(p=>(p.concepto||'').startsWith(`${PREFIJO_CIERRE_LIBROS}${e.ejercicio}`));
  if(yaCerrado){avisar(`El ejercicio ${e.ejercicio} ya tiene un cierre de libros registrado. Si necesitás corregirlo, borrá esas partidas primero desde Partidas.`);return}

  const mov=movimientos(desde,hasta,true);
  const lineas=[], detalle=[];
  let totalIngresos=0, totalCostosGastos=0;
  e.cuentas.filter(c=>c.d&&['ingreso','costo','gasto'].includes(c.t)).forEach(c=>{
    const saldo=saldoNatural(c.c,mov);
    if(!saldo) return;
    if(c.t==='ingreso'){ lineas.push({cta:c.c,desc:'',debe:saldo,haber:0}); totalIngresos=r2(totalIngresos+saldo); }
    else{ lineas.push({cta:c.c,desc:'',debe:0,haber:saldo}); totalCostosGastos=r2(totalCostosGastos+saldo); }
    detalle.push({cuenta:c.c,nombre:c.n,tipo:c.t,saldo});
  });
  if(!lineas.length){avisar(`No hay movimiento de ingresos, costos ni gastos en el ejercicio ${e.ejercicio} para cerrar.`);return}
  const neto=r2(totalIngresos-totalCostosGastos);
  /* En una empresa individual no hay "utilidades retenidas" separadas del
     capital del dueño — todo es la misma cuenta, así que el resultado del
     ejercicio se suma directo a Capital. En una sociedad, en cambio, sí
     tiene sentido llevarlo aparte a Utilidades Retenidas, distinguiendo lo
     que los socios aportaron de lo que la empresa generó. */
  const esIndividual=e.tipoSociedad!=='sociedad';
  const ctaDestino=esIndividual?'3.1.01':'3.1.03';
  const nombreDestino=esIndividual?'Capital':'Utilidades retenidas';

  abrirModal('Cierre de libros',
    `<p style="margin:0 0 14px;font-size:13px;color:var(--tinta-suave)">Cierre contable tradicional, en dos
      partidas con una cuenta puente — "Pérdidas y Ganancias" —, no una sola directa a Patrimonio:</p>
    <ol style="margin:0 0 14px;padding-left:20px;font-size:13px;color:var(--tinta-suave)">
      <li>Cada cuenta de ingreso se debita, cada cuenta de costo y gasto se acredita, y la contrapartida de las
        dos va a Pérdidas y Ganancias — así quedan todas en cero para el año que empieza.</li>
      <li>El saldo que le queda a Pérdidas y Ganancias —${neto>=0?'utilidad':'pérdida'} de
        Q${Q(Math.abs(neto))}— se traslada aparte a ${nombreDestino}, y la cuenta puente también queda en cero.</li>
      ${!esIndividual&&neto>0?`<li>Por ser sociedad, se separa el 5% de la utilidad neta —Q${Q(r2(neto*0.05))}— como Reserva legal (Art. 36, Código de Comercio).</li>`:''}
    </ol>
    <p style="margin:0 0 14px;font-size:13px;color:var(--tinta-suave)">Los reportes de Estado de Resultados y el
      Libro de Estados Financieros van a seguir mostrando las cifras reales de ${e.ejercicio} si los volvés a
      consultar — estas dos partidas no se mezclan con esos cálculos, solo con el Balance General y el Diario.
      No se deshacen con un botón, solo borrándolas a mano desde Partidas si hiciera falta.</p>
    <div style="max-height:40vh;overflow:auto"><table style="font-size:13px"><thead><tr><th>Cuenta</th>
      <th class="num">Se cierra por</th></tr></thead><tbody>
      ${detalle.map(x=>`<tr><td>${x.cuenta} — ${esc(x.nombre)}</td><td class="num">${x.tipo==='ingreso'?'Debe':'Haber'} ${Q(x.saldo)}</td></tr>`).join('')}
      <tr class="total"><td>Pérdidas y Ganancias, saldo del ejercicio</td>
        <td class="num">${neto>=0?'Haber':'Debe'} ${Q(Math.abs(neto))}</td></tr>
      <tr class="total"><td>${neto>=0?'Utilidad':'Pérdida'} a ${nombreDestino}</td>
        <td class="num">${neto>=0?'Haber':'Debe'} ${Q(Math.abs(neto))}</td></tr>
      </tbody></table></div>`,
    ()=>{
      asegurarCuenta(e,'3.1.08','Pérdidas y ganancias del ejercicio','patrimonio');
      asegurarCuenta(e,ctaDestino,nombreDestino,'patrimonio');
      /* Partida 1: cada cuenta de ingreso/costo/gasto se cierra contra la
         cuenta puente — nunca directo contra Patrimonio. */
      lineas.push(neto>=0?{cta:'3.1.08',desc:'',debe:0,haber:neto}:{cta:'3.1.08',desc:'',debe:r2(-neto),haber:0});
      const p1={id:uid(),numero:e.correlativo++,fecha:hasta,
        concepto:`${PREFIJO_CIERRE_LIBROS}${e.ejercicio} — traslado a Pérdidas y Ganancias`,
        docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',lineas};
      e.partidas.push(p1);
      /* Partida 2: recién acá se traslada el resultado neto —ya sentado en
         la cuenta puente— hacia Patrimonio. Dos movimientos separados, no
         uno solo, para que la cuenta puente exista de verdad en el Mayor
         como un paso intermedio, tal como espera ver un auditor. */
      const p2={id:uid(),numero:e.correlativo++,fecha:hasta,
        concepto:`${PREFIJO_CIERRE_LIBROS}${e.ejercicio} — traslado de Pérdidas y Ganancias a ${nombreDestino}`,
        docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',
        lineas: neto>=0
          ? [{cta:'3.1.08',desc:'',debe:neto,haber:0},{cta:ctaDestino,desc:'',debe:0,haber:neto}]
          : [{cta:'3.1.08',desc:'',debe:0,haber:r2(-neto)},{cta:ctaDestino,desc:'',debe:r2(-neto),haber:0}]};
      e.partidas.push(p2);
      /* Art. 36 del Código de Comercio: toda sociedad separa anualmente, como
         mínimo, el 5% de la utilidad neta del ejercicio para la reserva legal. */
      let p3=null;
      if(!esIndividual && neto>0){
        const reserva=r2(neto*0.05);
        asegurarCuenta(e,'3.1.02','Reserva legal','patrimonio');
        p3={id:uid(),numero:e.correlativo++,fecha:hasta,
          concepto:`${PREFIJO_CIERRE_LIBROS}${e.ejercicio} — reserva legal del 5% (Art. 36, Código de Comercio)`,
          docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',
          lineas:[{cta:'3.1.03',desc:'',debe:reserva,haber:0},{cta:'3.1.02',desc:'',debe:0,haber:reserva}]};
        e.partidas.push(p3);
      }
      registrarLog('Hizo el cierre de libros',`${e.nombre} — ejercicio ${e.ejercicio} — ${neto>=0?'utilidad':'pérdida'} Q${Q(Math.abs(neto))}`);
      guardar();
      avisar(`Cierre de libros del ejercicio ${e.ejercicio} registrado en las partidas No. ${p1.numero} y ${p2.numero}${p3?`, y la reserva legal (Q${Q(p3.lineas[0].debe)}) en la No. ${p3.numero}`:''}.`,'Listo');
    },'Postear el cierre');
};

ACCIONES.cambiarRegimen=()=>{
  const e=emp();
  const ops=Object.entries(REGIMENES).map(([k,v])=>`<option value="${k}"${k===e.regimen?' selected':''}>${v}</option>`).join('');
  abrirModal('Cambiar régimen',
    `<p style="margin:0 0 14px;font-size:13px;color:var(--tinta-suave)">Régimen actual: <strong>${esc(REGIMENES[e.regimen]||e.regimen)}</strong>.
      Los meses ya registrados bajo el régimen anterior no se recalculan — cada uno conserva el régimen que regía
      en su momento.</p>
    <div class="rej">
      <div class="campo full"><label>Nuevo régimen</label><select name="nuevoRegimen">${ops}</select></div>
      <div class="campo full"><label>Vigente a partir de</label><input name="vigenteDesde" type="date"></div>
    </div>`,
    d=>{
      if(!d.vigenteDesde){avisar('Elegí la fecha desde la que rige el nuevo régimen.');return false}
      if(d.nuevoRegimen===e.regimen){avisar('Ya es el régimen actual — elegí uno distinto.');return false}
      /* De Pequeño Contribuyente hacia cualquier otro régimen se puede en
         cualquier momento (incluso la ley obliga a hacerlo apenas se supera
         el tope de ingresos). De cualquier otro régimen HACIA Pequeño
         Contribuyente, solo entra en vigencia el 1 de enero. */
      if(d.nuevoRegimen==='pequeno' && e.regimen!=='pequeno'){
        const [anio,mes,dia]=d.vigenteDesde.split('-').map(Number);
        if(mes!==1||dia!==1){
          avisar('El cambio hacia Pequeño Contribuyente solo puede entrar en vigencia el 1 de enero. Elegí esa fecha, del año que corresponda.');
          return false;
        }
      }
      e.historialRegimen=e.historialRegimen||[{regimen:e.regimen,vigenteDesde:`${e.ejercicio}-01-01`}];
      e.historialRegimen.push({regimen:d.nuevoRegimen,vigenteDesde:d.vigenteDesde});
      e.historialRegimen.sort((a,b)=>a.vigenteDesde.localeCompare(b.vigenteDesde));
      sincronizarRegimenActual(e);
      registrarLog('Cambió de régimen',`${e.nombre} — ${REGIMENES[d.nuevoRegimen]} desde el ${fFecha(d.vigenteDesde)}`);
      guardar(); pintar();
      const pideISO=d.nuevoRegimen==='general'&&!(e.historialISO||[]).length;
      avisar(`Régimen actualizado. Los meses antes del ${fFecha(d.vigenteDesde)} conservan el régimen anterior en todos los cálculos.${pideISO?'\n\nEl régimen General lleva Impuesto de Solidaridad: elegí cómo se acredita en el Tablero fiscal, antes de pagar el primer trimestre.':''}`,'Listo');
    },'Registrar cambio');
};

/* El costo de ventas, hasta acá, siempre fue solo una fórmula de reporte —
   nunca se posteaba una partida real que redujera Inventarios. Eso hacía que
   el Balance General mostrara TODO lo comprado en la vida de la empresa como
   activo, mientras el Estado de Resultados restaba una porción como gasto:
   dos historias distintas de la misma plata. Esto sí postea la diferencia de
   verdad: lo que hay en 1.1.08 baja hasta el inventario final que diste, y
   la diferencia se reconoce como Costo de Ventas real. */
ACCIONES.cerrarCostoVentas=d=>{
  const e=emp();
  /* Un cierre fechado en el futuro no tiene sentido contable — sería
     reconocer el costo de mercadería que todavía no tuvo tiempo de
     venderse. Sin este candado, era fácil terminar cerrando sin querer una
     fecha de fin de año mientras se estaba trabajando un corte anterior,
     si el filtro de la pantalla había quedado en el 31 de diciembre. */
  if(d.hasta>hoy()){avisar(`${fFecha(d.hasta)} todavía no llegó — no se puede cerrar el costo de ventas de una fecha futura. Si querés cerrar el trimestre o el año en curso, cambiá el filtro de arriba a la fecha de corte real.`);return}
  const invFinal=e.inventarioFinal?.[d.hasta];
  if(invFinal===undefined){avisar('Primero guardá el inventario final de esa fecha de corte.');return}
  const saldoActual=saldoNatural('1.1.08',movimientos(null,d.hasta));
  const costo=r2(saldoActual-invFinal);
  if(costo<=0){avisar(costo===0?'El inventario ya está exacto en ese monto — no hay nada que cerrar.':
    'El inventario final es mayor que el saldo actual de Inventarios — revisá el monto, porque no puede vender más de lo que hay.');return}
  confirmar(`Esto va a postear una partida que reduce Inventarios de Q${Q(saldoActual)} a Q${Q(invFinal)},
    reconociendo Q${Q(costo)} como Costo de Ventas real del período. Después de esto, el Balance General y el
    Estado de Resultados van a coincidir exactos — no se puede deshacer con un botón, solo borrando la partida
    a mano si hace falta. ¿Confirmás?`,()=>{
    asegurarCuenta(e,'5.1.01','Costo de ventas','costo');
    const p={id:uid(),numero:e.correlativo++,fecha:d.hasta,
      concepto:`Cierre de costo de ventas al ${fFecha(d.hasta)} — inventario final Q${Q(invFinal)}`,
      docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',
      lineas:[{cta:'5.1.01',desc:'',debe:costo,haber:0},{cta:'1.1.08',desc:'',debe:0,haber:costo}]};
    e.partidas.push(p);
    registrarLog('Cerró el costo de ventas',`${e.nombre} — Q${Q(costo)} al ${fFecha(d.hasta)}`);
    guardar(); pintar();
    avisar(`Costo de ventas cerrado en la partida No. ${p.numero}. Inventarios queda en Q${Q(invFinal)}.`,'Listo');
  },'Postear el cierre');
};

    .map(([k,v])=>`<option value="${k}"${e.regimen===k?' selected':''}>${v}</option>`).join('');

      <div class="campo full"><label>Dirección fiscal</label>
        <input name="direccion" value="${esc(e.direccion||'')}" placeholder="Como aparece en el RTU"></div>
      <div class="campo"><label>NIT</label><input name="nit" value="${esc(e.nit||'')}" placeholder="1234567-8"></div>

      <div class="campo full"><label>Método de valuación de inventarios (Art. 41, Dto. 10-2012)</label>
        <select name="metodoCosteo">${Object.entries(METODOS_COSTEO).map(([k,v])=>`<option value="${k}"${metodoCosteo(e)===k?' selected':''}>${v}</option>`).join('')}</select>
        <span style="font-size:12.5px;color:var(--tinta-suave)">${e.metodoCosteoConfirmado
          ? 'Una vez adoptado, la ley no permite cambiarlo sin autorización previa de la SAT. Si ya la tenés, escribí el número de resolución abajo.'
          : (existente?'Esta empresa venía trabajando con promedio ponderado. Confirmá el método que tenés registrado en la SAT — después de guardarlo, ya no se puede cambiar sin autorización.'
                       :'Es el método que vas a usar para valuar la existencia al cerrar cada año. Una vez adoptado, no se puede cambiar sin autorización previa de la SAT, así que elegí con cuidado.')}</span></div>
      ${e.metodoCosteoConfirmado?`<div class="campo full"><label>Resolución de la SAT que autoriza el cambio (solo si lo cambiás)</label><input name="autorizacionCosteo" placeholder="Número de resolución"></div>`:''}
      ${!existente? `<div class="campo full"><label>Régimen de ISR</label><select name="regimen">${ops}</select></div>

        <span style="font-size:12.5px;color:var(--tinta-suave)">El ISO lo llevan las empresas del régimen General. Es la opción que tenés inscrita en la SAT; se puede cambiar al inicio de cada período fiscal, pero cambiarla afecta el ISO que ya pagaste.</span></div>

        <option value="individual">Empresa individual</option>

      </select></div>` : ''}

    <p style="margin:4px 0 0;font-size:13px;color:var(--tinta-suave)">

    d=>{

      const datos={nombre:d.nombre.trim(),representante:(d.representante||'').trim(),

          avisar('Cambiar el método de valuación de inventarios necesita autorización previa de la SAT (Art. 41, Dto. 10-2012). Escribí el número de resolución, o dejá el método como está.');
          return false;

        existente.metodoCosteo=d.metodoCosteo; existente.metodoCosteoConfirmado=true;
        if(cambia) registrarLog('Cambió el método de valuación de inventarios',`${datos.nombre} — ahora ${METODOS_COSTEO[d.metodoCosteo]} — resolución SAT ${d.autorizacionCosteo.trim()}`);
        registrarLog('Editó una empresa',datos.nombre);
      }
      else{
        const nueva={id:uid(),...datos,regimen:d.regimen,metodoCosteo:d.metodoCosteo,metodoCosteoConfirmado:true,
          historialRegimen:[{regimen:d.regimen,vigenteDesde:`${datos.ejercicio}-01-01`}],
          historialISO:d.regimen==='general'?[{opcion:d.isoOpcion,vigenteDesde:`${datos.ejercicio}-01-01`}]:[],
          tipoSociedad:d.tipoSociedad,administradorId:administradorDeSesion(),
          cuentas:nuevoCatalogo(),partidas:[],documentos:[],
          mapeoNit:{},mapeoCat:{},mapeoBS:{},mapeoProducto:{},pagos:[],cobros:[],inventarioFinal:{},
          empleados:[],planillas:[],socios:[],salarioMinimo:SALARIO_MINIMO,correlativo:1};
        BD.empresas.push(nueva); BD.activa=nueva.id;
        registrarLog('Creó una empresa',nueva.nombre);
        guardar();
        setTimeout(()=>{
          if(d.tipoSociedad==='sociedad'){
            borradorCapital={empresaId:nueva.id,capitalAutorizado:0,fecha:fechaConstitucionDefault(nueva),socios:[socioVacio(),socioVacio()]};
            VISTA='capitalSocial'; pintar();
          }
          else { formCapitalIndividual(nueva); }
        },0);
        return;
      }
      guardar();
    }, existente?'Guardar cambios':'Crear empresa');
  const selReg=mForm.querySelector('[name="regimen"]'), campoISO=mForm.querySelector('#campoISO');
  if(selReg&&campoISO){
    const alternar=()=>{ campoISO.style.display=selReg.value==='general'?'':'none'; };
    selReg.onchange=alternar; alternar();
  }
}
/* ============ ACCIONES GENERALES — empresas, catálogo, cartera ============ */
/* Un usuario solo puede tocar cuentas dentro de lo que le toca administrar:
   el superadmin, cuentas de Administrador; cada Administrador, su propio
   personal — nunca el de otro Administrador. */
/* ============ CAPITAL SOCIAL — al constituir una empresa individual o sociedad ============ */
const socioVacio=()=>({nombre:'',monto:0,tipo:'dineraria',cuenta:'1.1.01'});
/* La partida de capital ya no se fecha siempre con la fecha de hoy: si la
   empresa se crea para un ejercicio pasado, ese ejercicio quedaba sin capital. */
const fechaConstitucionDefault=e=>hoy().slice(0,4)===String(e.ejercicio)?hoy():`${e.ejercicio}-01-01`;

VISTAS.capitalSocial=()=>{
  const e=emp(), b=borradorCapital;
  if(!b) return cab('Capital social')+`<div class="vacio">No hay ningún registro de capital pendiente.</div>`;
  const cajaBanco=cuentasCajaBanco(e);
  const cuentasActivo=e.cuentas.filter(c=>c.d&&c.t==='activo');
  const totalSuscrito=r2(b.socios.reduce((s,x)=>s+(+x.monto||0),0));
  const excede=b.capitalAutorizado && totalSuscrito>b.capitalAutorizado;
  const filas=b.socios.map((s,i)=>`<tr>
    <td><input data-socio="${i}" data-campo="nombre" value="${esc(s.nombre)}" placeholder="Nombre del socio"></td>
    <td><input data-socio="${i}" data-campo="monto" type="number" step="0.01" min="0" value="${s.monto||''}" style="width:120px"></td>
    <td><select data-socio="${i}" data-campo="tipo">
      <option value="dineraria"${s.tipo==='dineraria'?' selected':''}>En dinero</option>
      <option value="no_dineraria"${s.tipo==='no_dineraria'?' selected':''}>En especie (bienes)</option>
    </select></td>
    <td><select data-socio="${i}" data-campo="cuenta">
      ${s.tipo==='dineraria'
        ? cajaBanco.map(c=>`<option value="${c.c}"${s.cuenta===c.c?' selected':''}>${c.c} — ${esc(c.n)}</option>`).join('')
        : cuentasActivo.map(c=>`<option value="${c.c}"${s.cuenta===c.c?' selected':''}>${c.c} — ${esc(c.n)}</option>`).join('')}
    </select></td>
    <td class="num"><button class="btn mini peligro" data-quitarSocio="${i}">Quitar</button></td></tr>`).join('');
  return cab('Capital social',`${esc(e.nombre)} — registrá los socios y lo que aporta cada uno.`,
    `<button class="btn" data-accion="confirmarCapitalSocial">Registrar capital</button>`)
  + `<div class="tarjeta"><div class="campo" style="max-width:260px">
      <label>Capital autorizado (según la escritura)</label>
      <input id="capAutorizado" type="number" step="0.01" min="0" value="${b.capitalAutorizado||''}"></div>
      <div class="campo" style="max-width:260px;margin-top:10px"><label>Fecha de la escritura / registro</label>
      <input id="capFecha" type="date" value="${b.fecha||fechaConstitucionDefault(e)}"></div></div>
    <table><thead><tr><th>Socio</th><th>Monto que suscribe</th><th>Forma de aportación</th>
      <th>¿A qué cuenta entra?</th><th class="num"></th></tr></thead>
      <tbody>${filas}</tbody>
      <tfoot><tr class="total"><td colspan="1">Total suscrito</td><td class="num">${Q(totalSuscrito)}</td>
        <td colspan="3"></td></tr></tfoot></table>
    <p style="margin:10px 0"><button class="btn sec mini" data-accion="agregarSocio">Agregar socio</button></p>
    ${excede?`<div class="aviso malo">Lo suscrito (Q${Q(totalSuscrito)}) supera el capital autorizado (Q${Q(b.capitalAutorizado)}).
      No puede ser mayor.</div>`:''}
    <div class="aviso">Se van a generar dos partidas: primero la que reconoce el capital autorizado y lo que
      cada socio se compromete a aportar (queda como una cuenta por cobrar a cada socio, identificada con su
      nombre); y otra que registra el pago real de esa aportación, a la cuenta que elegiste para cada quien.
      Si algún socio todavía no paga lo que suscribió, dejá su fila en la primera parte y generá el pago después
      desde una partida manual.</div>`;
};

function enlazarCapitalSocial(){
  const b=borradorCapital;
  const capAut=document.getElementById('capAutorizado');
  if(capAut) capAut.onchange=()=>{ b.capitalAutorizado=r2(+capAut.value||0); pintar(); };
  const capFecha=document.getElementById('capFecha');
  if(capFecha) capFecha.onchange=()=>{ b.fecha=capFecha.value; };
  document.querySelectorAll('[data-socio]').forEach(campo=>{
    campo.onchange=()=>{
      const i=+campo.dataset.socio, prop=campo.dataset.campo;
      b.socios[i][prop] = prop==='monto' ? (+campo.value||0) : campo.value;
      if(prop==='tipo'){   // cambia el tipo: reiniciar la cuenta al valor por defecto de ese tipo
        b.socios[i].cuenta = campo.value==='dineraria' ? '1.1.01' : (emp().cuentas.find(c=>c.d&&c.t==='activo')||{}).c;
      }
      pintar();
    };
  });
  document.querySelectorAll('[data-quitarSocio]').forEach(btn=>{
    btn.onclick=()=>{ b.socios.splice(+btn.dataset.quitarsocio,1); pintar(); };
  });
}
ACCIONES.agregarSocio=()=>{ borradorCapital.socios.push(socioVacio()); pintar(); };
ACCIONES.confirmarCapitalSocial=()=>{
  const e=emp(), b=borradorCapital;
  const socios=b.socios.filter(s=>s.nombre.trim() && (+s.monto||0)>0);
  if(!socios.length){avisar('Agregá al menos un socio con nombre y monto.');return}
  const totalSuscrito=r2(socios.reduce((s,x)=>s+(+x.monto||0),0));
  const autorizado=r2(+b.capitalAutorizado||0);
  if(!autorizado){avisar('Escribí el capital autorizado según la escritura.');return}
  if(totalSuscrito>autorizado){avisar('Lo suscrito no puede ser mayor que el capital autorizado.');return}

  confirmar(`Se registrará un capital autorizado de Q${Q(autorizado)}, con Q${Q(totalSuscrito)} suscrito entre ${socios.length} socio(s), y el pago correspondiente a la cuenta que elegiste para cada uno.`,()=>{
    asegurarCuenta(e,'1.1.12','Capital suscrito por cobrar a socios','activo');
    asegurarCuenta(e,'3.1.05','Capital Autorizado','patrimonio');
    asegurarCuenta(e,'3.1.06','Capital Autorizado No Suscrito','patrimonio');
    asegurarCuenta(e,'3.1.07','Capital Suscrito','patrimonio');

    /* Partida 1: se reconoce el capital autorizado completo, y de ese total,
       lo que ya se suscribió queda como una cuenta por cobrar a cada socio,
       identificada con su nombre. */
    const noSuscrito=r2(autorizado-totalSuscrito);
    const lineas1=[];
    if(noSuscrito) lineas1.push({cta:'3.1.06',desc:'',debe:noSuscrito,haber:0});
    socios.forEach(s=>lineas1.push({cta:'1.1.12',desc:`Suscripción de ${s.nombre.trim()}`,debe:r2(s.monto),haber:0}));
    lineas1.push({cta:'3.1.05',desc:'',debe:0,haber:autorizado});
    const fechaCap=b.fecha||fechaConstitucionDefault(e);
    const p1={id:uid(),numero:e.correlativo++,fecha:fechaCap,
      concepto:`Capital autorizado y suscrito de ${e.nombre}`,
      docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',lineas:lineas1};
    e.partidas.push(p1);

    /* Partida 2: el pago real de lo suscrito, a la cuenta que corresponda
       según si cada socio aportó en dinero o en especie. */
    const lineas2=[];
    socios.forEach(s=>lineas2.push({cta:s.cuenta,desc:`Aportación de ${s.nombre.trim()}`,debe:r2(s.monto),haber:0}));
    socios.forEach(s=>lineas2.push({cta:'1.1.12',desc:`Pago de ${s.nombre.trim()}`,debe:0,haber:r2(s.monto)}));
    const p2={id:uid(),numero:e.correlativo++,fecha:fechaCap,
      concepto:`Pago del capital suscrito de ${e.nombre}`,
      docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',lineas:lineas2};
    e.partidas.push(p2);

    /* Se guarda la lista de socios aparte de las partidas, para poder elegirlos
       después en un aumento de capital sin tener que volver a escribir el
       nombre ni arriesgar que quede distinto por un error de tipeo. */
    e.socios=e.socios||[];
    socios.forEach(s=>{
      if(!e.socios.some(x=>x.nombre.trim().toLowerCase()===s.nombre.trim().toLowerCase()))
        e.socios.push({id:uid(),nombre:s.nombre.trim()});
    });

    registrarLog('Registró el capital social',`${e.nombre} — autorizado Q${Q(autorizado)}, suscrito Q${Q(totalSuscrito)} entre ${socios.length} socios`);
    borradorCapital=null; guardar(); VISTA='empresas'; pintar();
    avisar(`Capital social registrado en las partidas No. ${p1.numero} y No. ${p2.numero}.`,'Listo');
  },'Registrar capital');
};

/* ---- Aumento de capital: aportaciones posteriores a la constitución, de
   cualquier origen (sueldo, préstamo, venta de un bien personal, etc.) — se
   identifican siempre con quién aporta y de dónde salió el dinero, para que
   quede trazable. ---- */
const ORIGENES_CAPITAL=['Sueldo de relación de dependencia','Préstamo personal del propietario o socio',
  'Venta de un bien personal','Herencia o donación recibida','Ahorros propios','Otro'];

VISTAS.aumentosCapital=()=>{
  const e=emp();
  e.aumentosCapital=e.aumentosCapital||[];
  const lista=[...e.aumentosCapital].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const filas=lista.map(a=>`<tr><td>${fFecha(a.fecha)}</td>
    <td>${a.socio?esc(a.socio):'—'}</td>
    <td>${esc(a.origen)}${a.origenDetalle?`<br><span style="font-size:12px;color:var(--tinta-suave)">${esc(a.origenDetalle)}</span>`:''}</td>
    <td class="num">${Q(a.monto)}</td>
    <td class="num"><button class="btn mini" data-accion="verPartida" data-id="${a.partidaId}">Ver partida</button></td></tr>`).join('');
  return cab('Aumento de capital','Aportaciones a la empresa después de la constitución, con su origen identificado.',
    `<button class="btn" data-accion="nuevoAumentoCapital">Registrar aumento</button>`)
  + (lista.length? `<table><thead><tr><th>Fecha</th><th>${e.tipoSociedad==='sociedad'?'Socio':'Aportante'}</th>
      <th>Origen del dinero</th><th class="num">Monto</th><th class="num"></th></tr></thead>
      <tbody>${filas}</tbody>
      <tfoot><tr class="total"><td colspan="3">Total aportado después de la constitución</td>
        <td class="num">${Q(r2(lista.reduce((s,a)=>s+a.monto,0)))}</td><td></td></tr></tfoot></table>`
     : `<div class="vacio">Todavía no se ha registrado ningún aumento de capital.</div>`);
};

ACCIONES.nuevoAumentoCapital=()=>{
  const e=emp();
  const cajaBanco=cuentasCajaBanco(e);
  if(!cajaBanco.length){avisar('El catálogo no tiene ninguna cuenta de Caja o Bancos.');return}
  const esSociedad=e.tipoSociedad==='sociedad';
  const cuentasActivo=e.cuentas.filter(c=>c.d&&c.t==='activo');
  const opsSocio = esSociedad ? (e.socios||[]).map(s=>`<option value="${esc(s.nombre)}">${esc(s.nombre)}</option>`)
    .concat(['<option value="__nuevo__">+ Nuevo socio (escribir nombre)</option>']).join('') : '';

  abrirModal('Registrar aumento de capital',
    `<div class="rej">
      <div class="campo full"><label>Monto aportado</label><input name="monto" type="number" step="0.01" min="0"></div>
      <div class="campo"><label>Fecha</label><input name="fecha" type="date" value="${hoy()}"></div>
      ${esSociedad? `<div class="campo"><label>Socio que aporta</label><select name="socio">${opsSocio}</select></div>
      <div class="campo full" id="socioNuevoWrap" style="display:none"><label>Nombre del socio nuevo</label>
        <input name="socioNuevo"></div>` : ''}
      <div class="campo full"><label>¿De dónde proviene el dinero?</label><select name="origen">
        ${ORIGENES_CAPITAL.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}
      </select></div>
      <div class="campo full" id="origenDetalleWrap" style="display:none"><label>Especificá</label>
        <input name="origenDetalle" placeholder="Ej. venta de un vehículo particular"></div>
      <div class="campo full"><label>Forma de aportación</label><select name="tipoAportacion">
        <option value="dineraria">En dinero</option>
        <option value="no_dineraria">En especie (bienes)</option>
      </select></div>
      <div class="campo full" id="cuentaDinerariaWrap"><label>¿A qué cuenta entra?</label><select name="cuentaDineraria">
        ${cajaBanco.map(c=>`<option value="${c.c}">${c.c} — ${esc(c.n)}</option>`).join('')}
      </select></div>
      <div class="campo full" id="cuentaNoDinerariaWrap" style="display:none"><label>¿A qué cuenta de activo entra?</label>
        <select name="cuentaNoDineraria">${cuentasActivo.map(c=>`<option value="${c.c}">${c.c} — ${esc(c.n)}</option>`).join('')}</select></div>
    </div>`,
    d=>{
      const monto=r2(+d.monto);
      if(!monto||monto<=0){avisar('Escribí el monto aportado.');return false}
      let socio='';
      if(esSociedad){
        socio = d.socio==='__nuevo__' ? (d.socioNuevo||'').trim() : d.socio;
        if(!socio){avisar('Elegí quién aporta, o escribí el nombre del socio nuevo.');return false}
      }
      const origen = d.origen==='Otro' ? 'Otro' : d.origen;
      const origenDetalle = d.origen==='Otro' ? (d.origenDetalle||'').trim() : '';
      if(d.origen==='Otro' && !origenDetalle){avisar('Especificá de dónde proviene el dinero.');return false}
      const cuenta = d.tipoAportacion==='dineraria' ? d.cuentaDineraria : d.cuentaNoDineraria;

      asegurarCuenta(e,'3.1.05','Capital Autorizado','patrimonio');
      asegurarCuenta(e,'3.1.07','Capital Suscrito','patrimonio');
      const ctaCapital = esSociedad ? '3.1.07' : '3.1.01';
      const quien = esSociedad ? socio : (e.representante||'el propietario');
      const lineas=[
        {cta:cuenta,desc:`Aumento de capital — ${quien}`,debe:monto,haber:0},
        {cta:ctaCapital,desc:`Aumento de capital — ${quien}`,debe:0,haber:monto},
      ];
      const p={id:uid(),numero:e.correlativo++,fecha:d.fecha||hoy(),
        concepto:`Aumento de capital de ${e.nombre}${esSociedad?' — '+socio:''} (${origenDetalle||origen})`,
        docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:socio,lineas};
      e.partidas.push(p);

      if(esSociedad && socio){
        e.socios=e.socios||[];
        if(!e.socios.some(x=>x.nombre.toLowerCase()===socio.toLowerCase())) e.socios.push({id:uid(),nombre:socio});
      }
      e.aumentosCapital=e.aumentosCapital||[];
      e.aumentosCapital.push({id:uid(),fecha:d.fecha||hoy(),monto,socio,origen,origenDetalle,partidaId:p.id});

      registrarLog('Registró un aumento de capital',`${e.nombre}${esSociedad?' — '+socio:''} — Q${Q(monto)} (${origenDetalle||origen})`);
      guardar();
      avisar(`Aumento de capital registrado en la partida No. ${p.numero}.`,'Listo');
    },'Registrar aumento');

  const selOrigen=mForm.querySelector('[name="origen"]');
  selOrigen.onchange=()=>{ document.getElementById('origenDetalleWrap').style.display = selOrigen.value==='Otro'?'':'none'; };
  const selTipo=mForm.querySelector('[name="tipoAportacion"]');
  selTipo.onchange=()=>{
    const dineraria=selTipo.value==='dineraria';
    document.getElementById('cuentaDinerariaWrap').style.display=dineraria?'':'none';
    document.getElementById('cuentaNoDinerariaWrap').style.display=dineraria?'none':'';
  };
  if(esSociedad){
    const selSocio=mForm.querySelector('[name="socio"]');
    selSocio.onchange=()=>{ document.getElementById('socioNuevoWrap').style.display = selSocio.value==='__nuevo__'?'':'none'; };
  }
};

function formCapitalIndividual(empresa){
  abrirModal('Capital inicial',
    `<p style="margin:0 0 14px;font-size:13px;color:var(--tinta-suave)">${esc(empresa.nombre)} es una empresa
      individual. Este capital queda a nombre del propietario.</p>
    <div class="rej">
      <div class="campo full"><label>Capital inicial</label><input name="capital" type="number" step="0.01" min="0"></div>
      <div class="campo full"><label>Fecha de inicio de operaciones</label><input name="fecha" type="date" value="${fechaConstitucionDefault(empresa)}"></div>
      <div class="campo full"><label>¿A qué cuenta va?</label><select name="destino">
        <option value="caja">Solo Caja</option>
        <option value="bancos">Solo Bancos</option>
        <option value="ambas">Parte en Caja y parte en Bancos</option>
      </select></div>
      <div class="campo" id="montoCajaWrap" style="display:none"><label>Monto en Caja</label>
        <input name="montoCaja" type="number" step="0.01" min="0"></div>
      <div class="campo" id="montoBancosWrap" style="display:none"><label>Monto en Bancos</label>
        <input name="montoBancos" type="number" step="0.01" min="0"></div>
    </div>`,
    d=>{
      const capital=r2(+d.capital);
      if(!capital||capital<=0){avisar('Escribí el capital inicial.');return false}
      const e=empresa;
      let montoCaja=0, montoBancos=0;
      if(d.destino==='caja') montoCaja=capital;
      else if(d.destino==='bancos') montoBancos=capital;
      else{
        montoCaja=r2(+d.montoCaja||0); montoBancos=r2(+d.montoBancos||0);
        if(r2(montoCaja+montoBancos)!==capital){avisar(`Caja + Bancos tiene que sumar exacto el capital inicial (Q${Q(capital)}).`);return false}
      }
      const lineas=[];
      if(montoCaja) lineas.push({cta:'1.1.01',desc:'',debe:montoCaja,haber:0});
      if(montoBancos) lineas.push({cta:'1.1.03',desc:'',debe:montoBancos,haber:0});
      lineas.push({cta:'3.1.01',desc:'',debe:0,haber:capital});
      e.partidas.push({id:uid(),numero:e.correlativo++,fecha:d.fecha||fechaConstitucionDefault(e),
        concepto:`Capital inicial de ${e.nombre}`,
        docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',lineas});
      registrarLog('Registró el capital inicial',`${e.nombre} — Q${Q(capital)}`);
      guardar(); VISTA='empresas'; pintar();
      avisar('Capital inicial registrado.','Listo');
    },'Registrar capital');
  const destinoSel=mForm.querySelector('[name="destino"]');
  destinoSel.onchange=()=>{
    const ambas=destinoSel.value==='ambas';
    document.getElementById('montoCajaWrap').style.display=ambas?'':'none';
    document.getElementById('montoBancosWrap').style.display=ambas?'':'none';
  };
}

function usuarioEnAlcance(id){
  const actual=usuarioActual();
  const x=(BD.usuarios||[]).find(u=>u.id===id);
  if(!x||!actual) return null;
  if(actual.rol==='superadmin') return x.rol==='administrador' ? x : null;
  if(actual.rol==='administrador') return x.administradorId===actual.id ? x : null;
  return null;
}
ACCIONES.nuevoUsuario=()=>formUsuario(null);
ACCIONES.editarUsuario=d=>{
  const x=usuarioEnAlcance(d.id);
  if(!x){avisar('Esa cuenta no está a tu alcance.');return}
  formUsuario(x);
};
function formUsuario(existente){
  const actual=usuarioActual(), esSuper=actual.rol==='superadmin';
  const x=existente||{};
  const opsRol = esSuper
    ? `<option value="administrador">Administrador</option>`
    : ROLES_ASIGNABLES.filter(r=>r!=='administrador')
        .map(r=>`<option value="${r}"${x.rol===r?' selected':''}>${ROLES[r].nombre}</option>`).join('');
  const misEmpresas = esSuper ? [] : BD.empresas.filter(e=>e.administradorId===actual.id);
  const asignadasActuales = Array.isArray(x.empresasAsignadas) ? x.empresasAsignadas : null;   // null = todas (compatibilidad)
  const checksEmpresas = misEmpresas.map(e=>`<label style="display:flex;align-items:center;gap:6px;font-weight:400;margin-bottom:4px">
      <input type="checkbox" name="emp_${e.id}" style="width:auto"
        ${asignadasActuales===null || asignadasActuales.includes(e.id) ? 'checked' : ''}>
      ${esc(e.nombre)}</label>`).join('');
  abrirModal(existente?'Editar usuario':(esSuper?'Agregar administrador':'Agregar usuario'),
    `<div class="rej">
      <div class="campo full"><label>Nombre completo</label><input name="nombre" value="${esc(x.nombre||'')}"></div>

      <div class="campo"><label>Rol</label><select name="rol" ${esSuper?'disabled':''}>${opsRol}</select></div>
      <div class="campo full"><label>${existente?'Nueva contraseña (dejar en blanco para no cambiarla)':'Contraseña'}</label>
        <input name="clave" type="password"></div>
      ${esSuper ? `<div class="campo full"><label style="display:flex;gap:8px;align-items:flex-start;font-weight:400">
        <input type="checkbox" name="iaPermitida" style="width:auto;margin-top:4px"${x.iaPermitida?' checked':''}>

      ${!esSuper ? `<div class="campo full"><label>Empresas a las que tiene acceso</label>

    async d=>{
      if(!d.nombre.trim()){avisar('Escribí el nombre.');return false}
      if(!d.usuario.trim()){avisar('Escribí el usuario.');return false}
      const yaExiste=(BD.usuarios||[]).some(u=>u.usuario.toLowerCase()===d.usuario.trim().toLowerCase() && u.id!==(existente&&existente.id));
      if(yaExiste){avisar('Ya existe un usuario con ese nombre de usuario.');return false}
      if(!existente && !d.clave){avisar('Escribí una contraseña.');return false}
      if(!existente && d.clave.length<8){avisar('La contraseña tiene que tener al menos 8 caracteres.');return false}
      const rol = esSuper ? 'administrador' : d.rol;
      const empresasAsignadas = esSuper ? undefined : misEmpresas.filter(e=>d['emp_'+e.id]==='on').map(e=>e.id);
      if(existente){
        existente.nombre=d.nombre.trim(); existente.usuario=d.usuario.trim(); existente.rol=rol;
        if(!esSuper) existente.empresasAsignadas=empresasAsignadas;
        if(esSuper) existente.iaPermitida=d.iaPermitida==='on';
        if(d.clave){ if(d.clave.length<8){avisar('La contraseña tiene que tener al menos 8 caracteres.');return false} await fijarClave(existente,d.clave); }
        registrarLog('Editó una cuenta de usuario',`${existente.nombre} (${existente.usuario})`);
      }else{
        BD.usuarios=BD.usuarios||[];
        BD.usuarios.push({id:uid(),usuario:d.usuario.trim(),nombre:d.nombre.trim(),rol,
          administradorId: esSuper ? null : actual.id,   // a quién le reporta este personal
          empresasAsignadas: esSuper ? undefined : empresasAsignadas,
          iaPermitida: esSuper ? d.iaPermitida==='on' : undefined,
          activo:true});
        await fijarClave(BD.usuarios[BD.usuarios.length-1],d.clave);
        registrarLog('Creó una cuenta de usuario',`${d.nombre.trim()} (${d.usuario.trim()}) — ${ROLES[rol].nombre}`);
      }
      guardar();
    },existente?'Guardar cambios':'Crear cuenta');
}

  abrirModal('Agregar cuenta',

      <div class="campo"><label>Fecha</label><input name="fecha" type="date" value="${hoy()}"></div>

      if(!dat.cuenta){avisar('No se encontró una cuenta de Caja o Bancos para esta forma de pago.');return false}

      registrarLog('Registró un pago a proveedor',`${prov.nombre||prov.nit} — Q${Q(monto)}`);
      guardar();
    },'Registrar pago');
  /* La cuenta se elige sola según la forma de pago: efectivo va a Caja, cheque

     (varios bancos), se puede elegir entre ellas. */
  const formaSel=mForm.querySelector('[name="forma"]'), cuentaSel=mForm.querySelector('[name="cuenta"]');

    let ops=cajaBanco.filter(c=>(vaABanco?/banco/i:/caja/i).test(c.n));
    if(!ops.length) ops=cajaBanco;
    cuentaSel.innerHTML=ops.map(c=>`<option value="${c.c}">${c.c} — ${esc(c.n)}</option>`).join('');
  };
  formaSel.onchange=actualizarCuenta; actualizarCuenta();
};
