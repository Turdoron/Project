}
function textoCuadre(td,th){
  const dif=r2(td-th);
  if(td===0&&th===0) return 'Todavía no hay montos cargados.';
  if(dif===0) return `La partida cuadra en Q${Q(td)}.`;
  return `Descuadre de Q${Q(Math.abs(dif))}. ${dif>0?'Falta en el haber.':'Falta en el debe.'}`;
}
function leerCabecera(){
  document.querySelectorAll('[data-cab]').forEach(i=>borrador[i.dataset.cab]=i.value);
}
function enlazarFormulario(){
  document.querySelectorAll('[data-cab]').forEach(i=>i.oninput=()=>borrador[i.dataset.cab]=i.value);
  document.querySelectorAll('[data-l]').forEach(i=>{
    i.oninput=i.onchange=()=>{
      const l=borrador.lineas[+i.dataset.l], campo=i.dataset.campo;
      if(campo==='cta'){
        /* El input trae "código — nombre" si se eligió del desplegable, o
           puede traer solo el código si alguien lo escribió de memoria y no
           llegó a seleccionar la sugerencia — las dos formas son válidas.
           Solo se guarda cuando lo escrito coincide exacto con una cuenta
           real del catálogo, así nunca se guarda algo a medio teclear ni un
           código inventado. */
        const valor=(i.value||'').trim();
        const m=valor.match(/^([0-9][0-9.]*)\s*—/);   // admite códigos como 1.10.01 o 1.1.03.01
        const codigo=m?m[1]:valor;
        if(emp().cuentas.some(c=>c.c===codigo)) l.cta=codigo;
      }else{
        l[campo]=(campo==='debe'||campo==='haber')?(+i.value||0):i.value;
      }
      if(campo==='debe'&&+i.value) { l.haber=0; const o=document.querySelector(`[data-l="${i.dataset.l}"][data-campo="haber"]`); if(o)o.value=''; }
      if(campo==='haber'&&+i.value){ l.debe=0; const o=document.querySelector(`[data-l="${i.dataset.l}"][data-campo="debe"]`); if(o)o.value=''; }
      const td=r2(borrador.lineas.reduce((s,x)=>s+(+x.debe||0),0));
      const th=r2(borrador.lineas.reduce((s,x)=>s+(+x.haber||0),0));
      document.getElementById('totDebe').textContent=Q(td);
      document.getElementById('totHaber').textContent=Q(th);
      const c=document.getElementById('cuadre');
      c.textContent=textoCuadre(td,th);
      c.className='aviso '+(r2(td-th)===0&&td>0?'bien':'malo');
    };
  });
}

VISTAS.diario=()=>{
  const e=emp();
  const d=filtros.desde||`${e.ejercicio}-01-01`, h=filtros.hasta||`${e.ejercicio}-12-31`;
  const lista=e.partidas.filter(p=>p.fecha>=d&&p.fecha<=h)
    .sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.numero-b.numero);
  let td=0,th=0, cuerpo='';
  lista.forEach(p=>{
    cuerpo+=`<tr class="grupo-cta"><td colspan="4">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <span>Partida No. ${p.numero} — ${fFecha(p.fecha)} — ${esc(p.concepto)}</span>
        <button class="btn mini sec" data-accion="editarPartida" data-id="${p.id}">Editar</button>
      </div></td></tr>`;
    p.lineas.forEach(l=>{
      td+=(+l.debe||0); th+=(+l.haber||0);
      const c=e.cuentas.find(x=>x.c===l.cta);
      cuerpo+=`<tr><td class="num" style="text-align:left">${l.cta}</td>
        <td>${esc(c?c.n:'?')}${l.desc?` <span style="color:var(--tinta-suave)">· ${esc(l.desc)}</span>`:''}</td>
        <td class="num d">${l.debe?Q(l.debe):''}</td><td class="num h">${l.haber?Q(l.haber):''}</td></tr>`;
    });
  });
  return cab('Libro Diario','Registro cronológico, con las operaciones de cada día en una sola partida.',
    `<button class="btn sec" data-accion="cierreDeLibros">Cierre de libros</button>
     <button class="btn" data-accion="pdfDiario">Descargar PDF</button>`)
    + rangoFechas(d,h)
    + (lista.length? `<table><thead><tr><th>Cuenta</th><th>Descripción</th><th class="num">Debe</th><th class="num">Haber</th></tr></thead>
       <tbody>${cuerpo}</tbody><tfoot><tr class="total"><td colspan="2">Sumas iguales</td>
       <td class="num d">${Q(td)}</td><td class="num h">${Q(th)}</td></tr></tfoot></table>`
      : `<div class="vacio">Sin operaciones en el rango seleccionado.</div>`);
};

VISTAS.mayor=()=>{
  const e=emp();
  const d=filtros.desde||`${e.ejercicio}-01-01`, h=filtros.hasta||`${e.ejercicio}-12-31`;
  const detalle=e.cuentas.filter(c=>c.d);
  const cta=filtros.cta||(detalle[0]&&detalle[0].c);
  const c=e.cuentas.find(x=>x.c===cta);
  const opciones=detalle.map(x=>`<option value="${x.c}" ${x.c===cta?'selected':''}>${x.c} — ${esc(x.n)}</option>`).join('');
  let cuerpo='',ant=0,sd=0,sh=0;
  if(c){
    e.partidas.filter(p=>p.fecha<d).forEach(p=>p.lineas.filter(l=>l.cta===cta)
      .forEach(l=>ant+=(+l.debe||0)-(+l.haber||0)));
    let corr=ant;
    e.partidas.filter(p=>p.fecha>=d&&p.fecha<=h)
      .sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.numero-b.numero)
      .forEach(p=>p.lineas.filter(l=>l.cta===cta).forEach(l=>{
        corr+=(+l.debe||0)-(+l.haber||0); sd+=(+l.debe||0); sh+=(+l.haber||0);
        cuerpo+=`<tr><td>${fFecha(p.fecha)}</td><td class="num" style="text-align:left">${p.numero}</td>
          <td>${esc(l.desc||p.concepto)}</td><td class="num d">${l.debe?Q(l.debe):''}</td>
          <td class="num h">${l.haber?Q(l.haber):''}</td>
          <td class="num">${Q(NATURAL_DEUDORA(c.t)?corr:-corr)}</td></tr>`;
      }));
  }
  return cab('Libro Mayor', c?`${c.c} — ${esc(c.n)} · naturaleza ${NATURAL_DEUDORA(c.t)?'deudora':'acreedora'}`:'',
    `<button class="btn" data-accion="pdfMayor">Descargar PDF de todas las cuentas</button>`)
    + `<div class="barra"><div class="campo ancho"><label>Cuenta</label><select data-filtro="cta">${opciones}</select></div>
       <div class="campo"><label>Desde</label><input type="date" data-filtro="desde" value="${d}"></div>
       <div class="campo"><label>Hasta</label><input type="date" data-filtro="hasta" value="${h}"></div></div>`
    + (c? `<table><thead><tr><th>Fecha</th><th>Partida</th><th>Descripción</th><th class="num">Debe</th><th class="num">Haber</th><th class="num">Saldo</th></tr></thead>
      <tbody><tr class="grupo-cta"><td colspan="5">Saldo al ${fFecha(d)}</td><td class="num">${Q(NATURAL_DEUDORA(c.t)?ant:-ant)}</td></tr>
      ${cuerpo}</tbody>
      <tfoot><tr class="total"><td colspan="3">Movimientos del período</td><td class="num d">${Q(sd)}</td>
      <td class="num h">${Q(sh)}</td><td class="num">${Q(NATURAL_DEUDORA(c.t)?ant+sd-sh:-(ant+sd-sh))}</td></tr></tfoot></table>`
      : `<div class="vacio">Agregá cuentas de detalle al catálogo.</div>`);
};

VISTAS.balanza=()=>{
  const e=emp();
  const d=filtros.desde||`${e.ejercicio}-01-01`, h=filtros.hasta||`${e.ejercicio}-12-31`;
  const mov=movimientos(d,h);
  let td=0,th=0,tsd=0,tsh=0,cuerpo='';
  e.cuentas.filter(c=>c.d).forEach(c=>{
    const m=mov[c.c]; if(!m) return;
    const neto=r2(m.debe-m.haber);
    td+=m.debe; th+=m.haber;
    const sd=neto>0?neto:0, sh=neto<0?-neto:0;
    tsd+=sd; tsh+=sh;
    cuerpo+=`<tr><td class="num" style="text-align:left">${c.c}</td><td>${esc(c.n)}</td>
      <td class="num d">${Q(m.debe)}</td><td class="num h">${Q(m.haber)}</td>
      <td class="num">${sd?Q(sd):''}</td><td class="num">${sh?Q(sh):''}</td></tr>`;
  });
  const cuadra=r2(td)===r2(th)&&r2(tsd)===r2(tsh);
  return cab('Balance de comprobación','Sumas y saldos de todas las cuentas con movimiento.')
    + rangoFechas(d,h)
    + `<div class="aviso ${cuadra?'bien':'malo'}">${cuadra
        ? 'La balanza cuadra: las sumas del debe y del haber son iguales.'
        : 'La balanza no cuadra. Revisá las partidas del período.'}</div>`
    + (cuerpo? `<table><thead><tr><th>Código</th><th>Cuenta</th><th class="num" colspan="2" style="text-align:center">Movimientos</th>
       <th class="num" colspan="2" style="text-align:center">Saldos</th></tr>
       <tr><th></th><th></th><th class="num">Debe</th><th class="num">Haber</th><th class="num">Deudor</th><th class="num">Acreedor</th></tr></thead>
       <tbody>${cuerpo}</tbody><tfoot><tr class="total"><td colspan="2">Totales</td>
       <td class="num d">${Q(td)}</td><td class="num h">${Q(th)}</td>
       <td class="num">${Q(tsd)}</td><td class="num">${Q(tsh)}</td></tr></tfoot></table>`
      : `<div class="vacio">Sin movimientos en el rango seleccionado.</div>`);
};

/* Saldo de una cuenta, en su signo natural, con todos los movimientos anteriores
   a una fecha — el mismo "saldo anterior" que ya usa el Libro Mayor. */
function saldoCuentaAntesDe(e,cta,fecha){
  const c=e.cuentas.find(x=>x.c===cta); if(!c) return 0;
  let ant=0;
  e.partidas.filter(p=>p.fecha<fecha).forEach(p=>p.lineas.filter(l=>l.cta===cta)
    .forEach(l=>ant+=(+l.debe||0)-(+l.haber||0)));
  return NATURAL_DEUDORA(c.t) ? ant : -ant;
}
/* Lo mismo, pero sumando TODAS las cuentas de un tipo — para el activo neto
   del ISO no importa una cuenta en particular, importa el activo completo. */
function saldoTipoAntesDe(e,tipos,fecha){
  return r2(e.cuentas.filter(c=>c.d&&tipos.includes(c.t))
    .reduce((s,c)=>s+saldoCuentaAntesDe(e,c.c,fecha),0));
}

/* Impuesto de Solidaridad — Dto. 73-2008. Solo régimen General, con margen
   bruto mayor al 4%. La base es la mayor entre 1/4 del activo neto y 1/4 de
   los ingresos brutos, ambos del EJERCICIO ANTERIOR completo — nunca del
   actual, así lo exige el Art. 7. Si el activo neto es más de 4 veces los
   ingresos, la base son solo los ingresos (para no castigar a una empresa
   con mucho activo pero pocas ventas). */
/* IUSI — Impuesto Único Sobre Inmuebles. Dos regímenes:
   · Dto. 15-98 (vigente hoy): exento hasta Q2,000; 2‰ de Q2,000.01 a Q20,000;
     6‰ de Q20,000.01 a Q70,000; 9‰ arriba de Q70,000.
   · Dto. 18-2026 (aprobado el 29/07/2026, sancionado y publicado el 28/08/2026):
     vivienda y uso mixto = 0‰ (exentos); uso comercial u otros = 3‰ hasta
     Q500,000; 6‰ de Q500,000.01 a Q1,000,000; 9‰ arriba de Q1,000,000.
     Rige 90 días después de su publicación (ver IUSI_VIGENCIA_NUEVA).
   Los tramos se aplican por rangos de valor (cada tasa solo a su porción).
   Es una ESTIMACIÓN: el monto real lo fija el avalúo de la municipalidad.
   Confirmar la fecha exacta de vigencia con el texto publicado. */
/* Corrección: antes se aplicaba desde el 01/07/2026, antes de que la ley
   existiera. Una ley no puede aplicarse antes de su vigencia: el Dto. 18-2026
   se sancionó y publicó el 28/08/2026 y rige 90 días después. Confirmar la
   fecha exacta con el Diario de Centro América. */
const IUSI_VIGENCIA_NUEVA='2026-11-26';
const IUSI_TRAMOS_VIGENTE=[[2000,0],[20000,0.002],[70000,0.006],[Infinity,0.009]];
const IUSI_TRAMOS_NUEVO_COMERCIAL=[[500000,0.003],[1000000,0.006],[Infinity,0.009]];
function calcularIUSI(valor,uso,fecha){
  valor=+valor||0;
  const nuevo=(fecha||hoy())>=IUSI_VIGENCIA_NUEVA;
  if(nuevo&&uso==='vivienda') return {anual:0,ley:'Dto. 18-2026',nota:'Vivienda y uso mixto: exentos.'};
  const tramos=nuevo?IUSI_TRAMOS_NUEVO_COMERCIAL:IUSI_TRAMOS_VIGENTE;
  let previo=0,total=0;
  for(const [tope,tasa] of tramos){
    if(valor>previo) total+=(Math.min(valor,tope)-previo)*tasa;
    previo=tope;
  }
  return {anual:r2(total),ley:nuevo?'Dto. 18-2026':'Dto. 15-98',nota:''};
}

function calcularISO(e){
  const ejercicioAnterior=e.ejercicio-1;
  const desdeAnt=`${ejercicioAnterior}-01-01`, hastaAnt=`${ejercicioAnterior}-12-31`;
  const huboPartidasAntes=e.partidas.some(p=>p.fecha<`${e.ejercicio}-01-01`);
  if(!huboPartidasAntes) return {aplica:false,motivo:'No hay datos del ejercicio anterior todavía — el ISO se calcula sobre el activo y los ingresos del año pasado completo, y este parece ser el primer ejercicio de la empresa en el sistema.'};
  const movAnt=movimientos(desdeAnt,hastaAnt,true);
  const ingresosAnt=totalTipo(['ingreso'],movAnt);
  const {costo:costoBienesAnt}=costoVentasPeriodo(e,desdeAnt,hastaAnt,movAnt);
  const costoTotalAnt=r2(costoBienesAnt+totalTipo(['costo'],movAnt));
  const margenBruto = ingresosAnt ? r2((ingresosAnt-costoTotalAnt)/ingresosAnt*100) : 0;
  if(ingresosAnt && margenBruto<4) return {aplica:false,motivo:`Exenta: el margen bruto del ejercicio ${ejercicioAnterior} fue de ${margenBruto}%, inferior al 4% (Art. 4, Dto. 73-2008).`};
  /* Activo neto: activo total menos depreciaciones, reserva de incobrables (ya
     vienen restando como cuentas de activo) y menos los créditos fiscales
     pendientes de reintegro por la SAT (Art. 7, Dto. 73-2008). */
  const activoNetoAnt=r2(saldoTipoAntesDe(e,['activo'],`${e.ejercicio}-01-01`)-saldoCuentaAntesDe(e,'1.1.15',`${e.ejercicio}-01-01`));
  const baseActivo=activoNetoAnt/4, baseIngresos=ingresosAnt/4;
  let base, criterio;
  if(activoNetoAnt>ingresosAnt*4){ base=baseIngresos; criterio='ingresos brutos (el activo supera 4 veces los ingresos)'; }
  else if(baseActivo>=baseIngresos){ base=baseActivo; criterio='activo neto'; }
  else{ base=baseIngresos; criterio='ingresos brutos'; }
  const isoTrimestral=r2(base*0.01);
  return {aplica:true,ejercicioAnterior,activoNetoAnt,ingresosAnt,margenBruto,base,criterio,isoTrimestral};
}

/* Cálculo completo del Estado de Resultados — usado por la pantalla de
   Resultados, el Libro de Estados Financieros combinado, y sus dos PDF.
   Vive en un solo lugar a propósito: la vez pasada el libro combinado tenía
   su propia copia de este cálculo, se desactualizó apenas se corrigió el
   costo de ventas por inventario y el ajuste de viáticos/donaciones, y quedó
   mostrando números viejos sin que nadie lo notara hasta que alguien lo
   comparó contra la pantalla de Resultados. Que nunca se pueda desincronizar
   de nuevo: todo lo que muestra cualquiera de las pantallas sale de acá. */
function calcularResultados(e,desde,hasta){
  const mov=movimientos(desde,hasta,true);
  const porTipo=(tipos,prefijo,excluir)=>{
    let s=0;
    e.cuentas.filter(c=>c.d&&tipos.includes(c.t)&&(!prefijo||c.c.startsWith(prefijo))&&!(excluir&&excluir.includes(c.c)))
      .forEach(c=>s+=saldoNatural(c.c,mov));
    return r2(s);
  };
  const invInicial=r2(saldoCuentaAntesDe(e,'1.1.08',desde));
  const movInvComprasBienes=movimientoCuentaSinCierreCosto(e,'1.1.08',desde,hasta);
  const comprasBienes=r2((movInvComprasBienes.debe||0)-(movInvComprasBienes.haber||0));
  const tieneFinal=Object.prototype.hasOwnProperty.call(e.inventarioFinal||{},hasta);
  const invFinal=tieneFinal?r2(e.inventarioFinal[hasta]):0;
  /* costoVentasPeriodo ya sabe si esta fecha de corte tuvo un cierre real
     posteado (ACCIONES.cerrarCostoVentas) — en ese caso devuelve costo:0,
     porque a partir de ahí se usa el saldo real de 5.1.01 en vez de la
     fórmula, que ya no significa nada una vez cerrado. */
  const {costo:costoVentasFormula,yaCerrado}=costoVentasPeriodo(e,desde,hasta,mov);
  /* Las devoluciones y rebajas sobre compras (5.1.03) son un ajuste directo
     al costo de lo vendido, no un "otro costo" aparte — se funden en la
     misma línea de Costo de Ventas. Antes vivían sueltas en un bloque de
     "Otros costos", lo que hacía que el costo de ventas pareciera aparecer
     dos veces: una en 0 (la fórmula, antes de cerrar) y otra con el monto
     real, escondida más abajo. */
  const devolucionesCompras=saldoNatural('5.1.03',mov);
  const costoVentasBase=yaCerrado?saldoNatural('5.1.01',mov):costoVentasFormula;
  const costoVentas=r2(costoVentasBase+devolucionesCompras);
  const ingresos=porTipo(['ingreso']);
  /* "Otros costos" ahora es de verdad "lo que no es costo de ventas": compras
     de servicios (5.1.02) y fletes (5.1.04). 5.1.01 y 5.1.03 ya se sumaron
     arriba, en la línea de Costo de Ventas. */
  const otrosCostos=porTipo(['costo'],null,['5.1.01','5.1.03']);
  const costoTotal=r2(costoVentas+otrosCostos);

  const regimenPeriodo=regimenEn(e,hasta);
  const anioHasta=+hasta.slice(0,4);
  const cierreTotalHecho=(e.partidas||[]).some(p=>(p.concepto||'').startsWith('Cierre fiscal total '+anioHasta));
  /* El ISR nunca debe verse mezclado adentro de "Gastos de operación" — es
     un impuesto sobre la utilidad, no un gasto operativo del negocio, y
     tiene su propia línea aparte más abajo ("ISR sobre utilidades"), que
     resta directo de la utilidad antes de impuesto. Antes esto solo se
     excluía después del Cierre Fiscal Total, así que mientras tanto el
     ISR ya pagado en los cierres parciales se contaba DOS veces: una vez
     adentro de "Gastos de operación" (porque ahí vive la partida real que
     lo posteó), y otra vez en la línea de "ISR sobre utilidades" de abajo.
     Sacarlo siempre de acá, sin importar si el año ya cerró del todo,
     corrige eso — y de paso ya no hace falta compensarlo aparte en otros
     cálculos (como el de la renta imponible acumulada), porque nunca llega
     a estar adentro de "gastos" para empezar.
     Ojo: 6.2.22 también se usa para el impuesto definitivo mensual de
     Pequeño/Primario — ahí siempre es un gasto operativo normal, la
     exclusión es solo para régimen General. */
  const excluirDeGastos = regimenPeriodo==='general' ? ['6.2.22'] : [];
  /* El ISO que se paga con pagos de ISR (opción b del Art. 11, Dto. 73-2008)
     no se puede recuperar contra el ISR más adelante, y la ley solo declara
     deducible el remanente no acreditado de la opción a). Se trata por eso,
     con criterio prudente, como gasto no deducible —6.2.28—, y viaja junto a
     6.2.14 para que se sume de vuelta a la renta imponible en todos los
     cálculos sin tocarlos uno por uno. */
  /* 6.2.29 (pérdida en baja de activos, que es pérdida de capital) y 6.2.31
     (ISR sobre rentas de capital) tampoco se deducen de las actividades
     lucrativas. */
  const noDeducible=r2(saldoNatural('6.2.14',mov)+saldoNatural('6.2.28',mov)+saldoNatural('6.2.29',mov)+saldoNatural('6.2.31',mov));
  /* Rentas de OTRAS categorías (Dto. 10-2012): los intereses (4.2.01) y las
     ganancias de capital por venta de activos (4.2.03) son rentas de capital,
     que tributan aparte (10%), no dentro del ISR sobre utilidades. Se restan
     de la renta imponible para no cobrarlas dos veces. */
  const rentasOtrasCategorias=r2(saldoNatural('4.2.01',mov)+saldoNatural('4.2.03',mov));
  /* Los costos y gastos que la empresa vincula a esas rentas de capital
     (elegidos en Configuración) tampoco se deducen de las actividades
     lucrativas: se suman de vuelta a la renta imponible. */
  const gastosRentasCapital=r2(cuentasGastoRentasCapital(e).reduce((s,c)=>s+saldoNatural(c,mov),0));
  /* El IVA de una compra marcada como gasto no deducible tampoco es
     acreditable, así que va a su propia cuenta (6.2.27) — es un gasto real
     igual que 6.2.14, y para el ISR juega el mismo papel: se suma de vuelta
     a la renta imponible. Se muestra aparte porque identificarlo por
     separado ayuda a explicar de dónde sale cada peso, en vez de fundirlo
     con "Gastos no deducibles" sin distinción. */
  const ivaNoDeducible=saldoNatural('6.2.27',mov);
  const gv=porTipo(['gasto'],'6.1',excluirDeGastos), ga=porTipo(['gasto'],'6.2',excluirDeGastos), gf=porTipo(['gasto'],'6.3',excluirDeGastos);
  const bruta=r2(ingresos-costoTotal);
  const gastos=r2(gv+ga+gf);
  const antesISR=r2(bruta-gastos);
  /* "antesISR" y, más abajo, "isr" y "neta" son para MOSTRAR el Estado de
     Resultados — ahí el ISR siempre se calcula completo, sin importar si la
     partida que lo paga ya quedó posteada a esta fecha exacta o todavía no
     (por ejemplo, si el cierre de un trimestre es al 31/03 pero el pago se
     hace el 10/04, esos diez días de diferencia). Pero el Balance General
     necesita otra cosa: cuánto cambió el Patrimonio de verdad, según lo que
     el libro mayor YA tiene posteado a esta fecha — ni un centavo más, ni
     un centavo menos. Por eso "netaReal" se calcula aparte, sin excluir
     6.2.22: si la partida del pago ya existe a esta fecha, la cuenta real
     de ISR ya la tiene adentro y hay que dejarla ahí; si todavía no existe,
     tampoco debe restarse acá aunque el Estado de Resultados sí la
     muestre como gasto del período completo. */
  const gastosConIsrReal=r2(gv+ga+gf+(regimenPeriodo==='general'?saldoNatural('6.2.22',mov):0));
  /* Corrección: el costo de ventas de "bruta" puede ser una ESTIMACIÓN (sin
     inventario final cerrado), pero el Balance necesita solo lo posteado en el
     mayor — si no, la mercadería se resta como costo y a la vez sigue en
     Inventarios, y el Balance descuadra por ese monto. */
  const netaReal=r2(ingresos-porTipo(['costo'])-r2(gv+ga+gf)-(regimenPeriodo==='general'?saldoNatural('6.2.22',mov):0));
  const viaticos=saldoNatural('6.2.23',mov);
  const limiteViaticos=r2(ingresos*0.03);
  const excesoViaticos=r2(Math.max(0,viaticos-limiteViaticos));
  const donaciones=saldoNatural('6.2.26',mov);
  const limiteDonaciones=r2(Math.min(Math.max(0,antesISR)*0.05,500000));
  const excesoDonaciones=r2(Math.max(0,donaciones-limiteDonaciones));
  const excesoNoDeducible=r2(excesoViaticos+excesoDonaciones);

  const baseImponibleISR=r2(antesISR+excesoNoDeducible+noDeducible+ivaNoDeducible+gastosRentasCapital-rentasOtrasCategorias);
  const isrYaCerrado=cierreTotalHecho;
  let isr=0;
  if(regimenPeriodo==='general'){
    if(cierreTotalHecho){
      isr=saldoNatural('6.2.22',mov);
    }else{
      /* Los gastos no deducibles bajan la utilidad contable de arriba, porque
         son un gasto real de la empresa — pero para el ISR la ley no permite
         restarlos, así que se suman de vuelta acá para llegar a la renta
         imponible real. Es la misma lógica que ya se aplicaba al exceso de
         viáticos y donaciones, solo que antes no se aplicaba a "gastos no
         deducibles" en general — el formulario de la SAT (Declaraguate) lo
         muestra exactamente así: "(+) Costos y gastos no deducibles". */
      const baseImponible=baseImponibleISR;
      const proyeccionCompleta=baseImponible>0?r2(baseImponible*0.25):0;
      /* Acá va el 25% completo sobre la renta imponible del período que se
         está mirando — el gasto real de ISR de ESE período para Estado de
         Resultados —, no "lo que todavía falta pagar" descontando lo ya
         posteado en cierres parciales anteriores. Esas son dos preguntas
         distintas: cuánto le costó el impuesto a este período (la de acá),
         contra cuánto hay que desembolsar hoy en la próxima declaración (la
         de "Impuesto determinado en este trimestre", en el cierre parcial y
         el formulario de la SAT). Restar isrYaPosteado acá mezclaba las dos
         y hacía que la utilidad del período pareciera mejor de lo que era,
         mientras el impuesto ya pagado quedaba escondido adentro de "Gastos
         de operación" — doble conteo en un lado, faltante en el otro. */
      isr=proyeccionCompleta;
    }
  }
  const neta=r2(antesISR-isr);

  return {mov,invInicial,comprasBienes,tieneFinal,invFinal,costoVentas,yaCerrado,devolucionesCompras,ingresos,otrosCostos,costoTotal,
    gv,ga,gf,bruta,gastos,antesISR,viaticos,limiteViaticos,excesoViaticos,donaciones,limiteDonaciones,noDeducible,ivaNoDeducible,
    excesoDonaciones,excesoNoDeducible,regimenPeriodo,isr,isrYaCerrado,neta,netaReal,rentasOtrasCategorias,gastosRentasCapital,baseImponibleISR};
}
/* Cuentas de costo o gasto que la empresa marcó como vinculadas a rentas de
   capital. Se excluyen las que ya se suman de vuelta por otro motivo, para no
   contarlas dos veces. */
const CUENTAS_YA_NO_DEDUCIBLES=['6.2.14','6.2.22','6.2.27','6.2.28','6.2.29','6.2.31'];
function cuentasGastoRentasCapital(e){
  return (e.cuentasRentasCapital||[]).filter(c=>!CUENTAS_YA_NO_DEDUCIBLES.includes(c)&&e.cuentas.some(x=>x.c===c&&x.d&&(x.t==='gasto'||x.t==='costo')));
}

/* Estas funciones son la ÚNICA fuente del desglose de costo de ventas y de
   la conciliación del ISR — Estado de Resultados, el Libro de Estados
   Financieros, y su PDF, los tres leen de acá. Antes cada pantalla armaba su
   propia versión de estas mismas líneas por separado, y cada vez que se
   corregía una se le olvidaba corregir la otra — exactamente lo que acaba de
   pasar con el desglose de costo de ventas. Devuelven un array neutral de
   filas ({tipo,label,value}), no HTML ni una tabla de PDF todavía — cada
   pantalla lo convierte al formato que le toca con filasAHtml() o
   filasAPdf(). */
function filasCostoVentas(R){
  const filas=[];
  if(R.yaCerrado){
    filas.push({tipo:'grupo',label:'Costo de ventas'});
    if(R.devolucionesCompras){
      filas.push({tipo:'linea',label:'Costo de ventas (cerrado)',value:r2(R.costoVentas-R.devolucionesCompras)});
      filas.push({tipo:'linea',label:'Devoluciones y rebajas sobre compras',value:R.devolucionesCompras});
      filas.push({tipo:'subtotal',label:'Costo de ventas',value:R.costoVentas});
    }else{
      /* Sin devoluciones que sumarle, la línea del cierre YA es el total —
         repetirla como subtotal abajo mostraba el mismo número dos veces
         seguidas, sin agregar nada. */
      filas.push({tipo:'linea',label:'Costo de ventas (cerrado)',value:R.costoVentas});
    }
  }else if(R.invInicial||R.comprasBienes||R.tieneFinal||R.devolucionesCompras){
    filas.push({tipo:'grupo',label:'Costo de ventas'});
    filas.push({tipo:'linea',label:'Inventario inicial',value:R.invInicial});
    filas.push({tipo:'linea',label:'(+) Compras de bienes del período, neto de notas de crédito',value:R.comprasBienes});
    if(R.devolucionesCompras) filas.push({tipo:'linea',label:'Devoluciones y rebajas sobre compras',value:R.devolucionesCompras});
    filas.push({tipo:'linea',label:`(−) Inventario final${R.tieneFinal?'':' (sin ingresar)'}`,value:R.invFinal});
    filas.push({tipo:'subtotal',label:'Costo de ventas',value:R.costoVentas});
  }
  return filas;
}
function filasConciliacionISR(R){
  const filas=[];
  if(R.regimenPeriodo==='general'&&(R.noDeducible||R.ivaNoDeducible||R.excesoNoDeducible||R.rentasOtrasCategorias||R.gastosRentasCapital)){
    filas.push({tipo:'linea',label:`${R.antesISR<0?'Pérdida':'Utilidad'} antes de ISR`,value:R.antesISR});
    if(R.noDeducible) filas.push({tipo:'linea',label:'(+) Gastos no deducibles',value:R.noDeducible});
    if(R.ivaNoDeducible) filas.push({tipo:'linea',label:'(+) IVA no deducible',value:R.ivaNoDeducible});
    if(R.excesoViaticos) filas.push({tipo:'linea',label:'(+) Exceso de viáticos no deducible',value:R.excesoViaticos});
    if(R.excesoDonaciones) filas.push({tipo:'linea',label:'(+) Exceso de donaciones no deducible',value:R.excesoDonaciones});
    if(R.gastosRentasCapital) filas.push({tipo:'linea',label:'(+) Costos y gastos vinculados a rentas de capital (no deducibles)',value:R.gastosRentasCapital});
    if(R.rentasOtrasCategorias) filas.push({tipo:'linea',label:'(−) Rentas de capital (intereses y ganancias de capital, tributan aparte)',value:-R.rentasOtrasCategorias});
    filas.push({tipo:'subtotal',label:'Renta imponible',value:R.baseImponibleISR});
  }
  return filas;
}
function filaISRTexto(R){
  if(R.regimenPeriodo!=='general') return '';
  return `ISR sobre utilidades${R.isrYaCerrado?' (cerrado con el cierre fiscal total)':' (25%)'}`;
}
function notaISRTexto(R){
  if(R.regimenPeriodo==='general') return R.isrYaCerrado
    ? 'El cierre fiscal total ya liquidó este impuesto — el monto que se muestra es la partida real posteada, no una proyección.'
    : 'El 25% se calcula sobre la renta imponible, no sobre la utilidad contable — los gastos no deducibles y los excesos de viáticos y donaciones bajan la utilidad de arriba porque son gastos reales, pero la ley no permite restarlos para el ISR, así que se suman de vuelta antes de aplicar la tarifa. Los pagos trimestrales que se hacen durante el año son a cuenta de este mismo impuesto anual — el detalle está en el Tablero fiscal.';
  if(R.regimenPeriodo==='simplificado') return 'El ISR del Régimen Opcional Simplificado ya está descontado arriba, dentro de Gastos de administración, porque se contabiliza en el momento de cada venta.';
  return `El régimen vigente en este período (${esc(REGIMENES[R.regimenPeriodo]||'—')}) no calcula ISR por separado del IVA.`;
}
function filasAHtml(filas){
  return filas.map(f=>{
    if(f.tipo==='grupo') return `<tr class="grupo-cta"><td colspan="2">${f.label}</td></tr>`;
    if(f.tipo==='subtotal') return `<tr><td style="padding-left:26px"><em>${f.label}</em></td><td class="num"><em>${Q(f.value)}</em></td></tr>`;
    /* Mismo color que se usa en el listado de gastos para estas dos líneas
       —"Gastos no deducibles" e "IVA no deducible"—, para que se reconozcan
       como la misma cosa en las dos partes donde aparecen: donde se restan
       dentro de gastos, y acá donde se vuelven a sumar para la renta
       imponible. */
    const esNoDeducible=/no deducible/i.test(f.label);
    return `<tr><td style="padding-left:26px${esNoDeducible?';color:var(--haber)':''}">${f.label}</td><td class="num"${esNoDeducible?' style="color:var(--haber)"':''}>${Q(f.value)}</td></tr>`;
  }).join('');
}
function filasAPdf(filas){
  return filas.filter(f=>f.tipo!=='grupo').map(f=>
    f.tipo==='subtotal'
      ? [{content:f.label,styles:{fontStyle:'italic'}},{content:Q(f.value),styles:{fontStyle:'italic',halign:'right'}}]
      : [f.label,Q(f.value)]);
}

VISTAS.resultados=()=>{
  const e=emp();
  e.inventarioFinal=e.inventarioFinal||{};
  const d=filtros.desde||`${e.ejercicio}-01-01`, h=filtros.hasta||`${e.ejercicio}-12-31`;
  const R=calcularResultados(e,d,h);
  const mov=R.mov;
  const bloque=(titulo,tipos,prefijo,excluir)=>{
    let s=0,f='';
    e.cuentas.filter(c=>c.d&&tipos.includes(c.t)&&(!prefijo||c.c.startsWith(prefijo))&&!(excluir&&excluir.includes(c.c))).forEach(c=>{
      const v=saldoNatural(c.c,mov); if(!v) return; s+=v;
      /* Gastos no deducibles y su IVA se destacan con otro color dentro del
         listado — mezclados con Honorarios, Papelería y demás gastos
         normales, no se notaba que estas dos son de una naturaleza
         distinta: no bajan la base del ISR, aunque sí sean un gasto real. */
      const esNoDeducible=c.c==='6.2.14'||c.c==='6.2.27'||c.c==='6.2.28';
      f+=`<tr><td style="padding-left:26px${esNoDeducible?';color:var(--haber)':''}">${esc(c.n)}</td><td class="num"${esNoDeducible?' style="color:var(--haber)"':''}>${Q(v)}</td></tr>`;
    });
    return f? {html:`<tr class="grupo-cta"><td colspan="2">${titulo}</td></tr>${f}
      <tr><td style="padding-left:26px"><em>Total ${titulo.toLowerCase()}</em></td><td class="num"><em>${Q(s)}</em></td></tr>`,total:r2(s)}
      : {html:'',total:0};
  };

  /* Una vez que el costo de ventas ya se cerró con una partida real, no tiene
     sentido seguir mostrando la fórmula (inventario inicial + compras −
     inventario final) — esos números de compras quedan contaminados por la
     propia partida de cierre, y mostrar "0.00" ahí, para después mostrar el
     costo real más abajo como si fuera otra cosa, es justo la confusión que
     hacía parecer que el costo de ventas aparecía dos veces. Cerrado, se
     muestra directo el saldo real de la cuenta. Las devoluciones y rebajas
     sobre compras se funden en esta misma línea siempre, cerrado o no. */
  const cosInvHtml = filasAHtml(filasCostoVentas(R));

  const ing={total:R.ingresos,html:bloque('Ingresos',['ingreso']).html};
  const cosOtros=bloque('Otros costos',['costo'],null,['5.1.01','5.1.03']);   // fletes u otras cuentas de costo
  const excluirGastos = R.regimenPeriodo==='general' ? ['6.2.22'] : [];
  const gv=bloque('Gastos de venta',['gasto'],'6.1',excluirGastos);
  const ga=bloque('Gastos de administración',['gasto'],'6.2',excluirGastos);
  const gf=bloque('Gastos financieros',['gasto'],'6.3',excluirGastos);

  /* La conciliación de ISR, el texto de su línea y su nota son los mismos
     que arma el Libro de Estados Financieros — misma fuente, así no se
     pueden desincronizar entre pantallas. */
  const filasConciliacion=filasAHtml(filasConciliacionISR(R));
  const isrTexto=filaISRTexto(R);
  const filaISR=isrTexto?`<tr><td>${isrTexto}</td><td class="num">${Q(R.isr)}</td></tr>`:'';
  const notaISR=notaISRTexto(R);

  return cab('Estado de resultados',`Del ${fFecha(d)} al ${fFecha(h)} · cifras en quetzales`)
    + rangoFechas(d,h)
    + (!R.tieneFinal && (R.invInicial||R.comprasBienes) ? `<div class="aviso malo">
        Falta el inventario final al ${fFecha(h)} para que el costo de ventas sea correcto.
        Se está calculando con Q0.00 mientras tanto, lo que infla el costo de ventas.
        Ingresalo abajo, con el valor de un conteo físico real.</div>` : '')
    + (R.excesoViaticos ? `<div class="aviso malo">Los viáticos del período (Q${Q(R.viaticos)}) superan el 3% de la renta
        bruta permitido por ley (Q${Q(R.limiteViaticos)}, Art. 21 Dto. 10-2012). El exceso, Q${Q(R.excesoViaticos)},
        sigue siendo un gasto contable real, pero no es deducible para ISR — ya se sumó de vuelta a la utilidad
        imponible de abajo.</div>` : '')
    + (R.excesoDonaciones ? `<div class="aviso malo">Las donaciones del período (Q${Q(R.donaciones)}) superan el límite
        deducible —el menor entre 5% de la renta neta y Q500,000 anuales— que es de Q${Q(R.limiteDonaciones)}
        (Art. 21 núm. 22, Dto. 10-2012). El exceso, Q${Q(R.excesoDonaciones)}, sigue siendo un gasto contable real,
        pero no es deducible para ISR — ya se sumó de vuelta a la utilidad imponible de abajo. Esto no aplica a
        donaciones a universidades o a asociaciones científicas y culturales no lucrativas, que no tienen este
        límite — si es tu caso, revisá el monto a mano.</div>` : '')
    + (R.noDeducible && R.regimenPeriodo==='general' && !R.isrYaCerrado ? `<div class="aviso">Los gastos no
        deducibles del período (Q${Q(R.noDeducible)}) siguen siendo un gasto contable real —por eso bajan la
        utilidad de arriba—, pero la ley no permite restarlos para el ISR: ya se sumaron de vuelta a la utilidad
        imponible de abajo, igual que muestra el propio formulario de la SAT en Declaraguate.</div>` : '')
    + `<div class="barra" style="margin-bottom:10px">
        <div class="campo"><label>Inventario final al ${fFecha(h)}</label>
          <input id="invFinalInput" type="number" step="0.01" min="0"
            value="${R.tieneFinal?R.invFinal:''}" placeholder="Del conteo físico"></div>
        <button class="btn sec" data-accion="guardarInvFinal" data-hasta="${h}">Guardar inventario final</button>
        ${R.tieneFinal&&!R.yaCerrado?`<button class="btn" data-accion="cerrarCostoVentas" data-hasta="${h}">Cerrar costo de ventas</button>`:''}
      </div>
    ${R.yaCerrado?`<div class="aviso bien">El costo de ventas de este período ya se cerró con una partida real —
        Inventarios y Costo de Ventas reflejan el conteo físico que diste, no una estimación.</div>`:''}
    <table><tbody>${ing.html}${cosInvHtml}${cosOtros.html}
      <tr class="total"><td>${R.bruta<0?'Pérdida bruta':'Utilidad bruta'}</td><td class="num">${Q(R.bruta)}</td></tr>
      ${gv.html}${ga.html}${gf.html}
      <tr class="total"><td>Total gastos de operación</td><td class="num">${Q(R.gastos)}</td></tr>
      ${filasConciliacion || `<tr class="total"><td>${R.antesISR<0?'Pérdida':'Utilidad'} antes de ISR</td><td class="num">${Q(R.antesISR)}</td></tr>`}
      ${filaISR}
      <tr class="total"><td>${R.neta<0?'Pérdida':'Utilidad'} neta del período</td><td class="num">${Q(R.neta)}</td></tr>
      </tbody></table>
      <div class="aviso">${notaISR}</div>`;
};

/* Libro de Inventarios — Art. 368 Código de Comercio: "un detalle clasificado
   y pormenorizado del contenido del saldo de cada una de las cuentas de
   activo, pasivo y capital", normalmente al cierre del ejercicio. No es un
   kardex de productos (eso vive en "Inventario") — es el detalle de TODO
   el balance, cuenta por cuenta, y donde ya se tiene el desglose (inventario,
   clientes, proveedores) se muestra completo. */
VISTAS.libroInventarios=()=>{
  const e=emp();
  const h=filtros.corteInventario||`${e.ejercicio}-12-31`;
  const mov=movimientos(null,h);
  const siguienteDia=(()=>{ const d=new Date(h+'T00:00:00'); d.setDate(d.getDate()+1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();

  const detalleCuenta=cta=>{
    if(cta==='1.1.08'){
      const {lista}=inventarioDetalle(e);
      return lista.map(p=>({nombre:p.producto+(p.cantidad?` (${p.cantidad} u.)`:''),monto:p.total}));
    }
    if(cta==='1.1.04') return carteraClientes(e).filter(x=>x.saldo).map(x=>({nombre:x.nombre||x.nit,monto:x.saldo}));
    if(cta==='2.1.01') return carteraProveedores(e).filter(x=>x.saldo).map(x=>({nombre:x.nombre||x.nit,monto:x.saldo}));
    return null;
  };
  const bloque=(titulo,tipo)=>{
    let s=0,f='';
    e.cuentas.filter(c=>c.d&&c.t===tipo).forEach(c=>{
      const v=saldoCuentaAntesDe(e,c.c,siguienteDia); if(!v) return; s+=v;
      const detalle=detalleCuenta(c.c);
      f+=`<tr class="grupo-cta"><td colspan="2">${esc(c.c)} — ${esc(c.n)}</td></tr>`;
      if(detalle&&detalle.length){
        detalle.forEach(x=>f+=`<tr><td style="padding-left:36px;font-size:13px;color:var(--tinta-suave)">${esc(x.nombre)}</td>
          <td class="num" style="font-size:13px">${Q(x.monto)}</td></tr>`);
        f+=`<tr><td style="padding-left:26px"><em>Subtotal ${esc(c.n)}</em></td><td class="num"><em>${Q(v)}</em></td></tr>`;
      }else{
        f+=`<tr><td style="padding-left:26px">${esc(c.n)}</td><td class="num">${Q(v)}</td></tr>`;
      }
    });
    return {html:f||`<tr class="grupo-cta"><td colspan="2">${titulo}</td></tr><tr><td style="padding-left:26px;color:var(--tinta-suave)">Sin saldos</td><td></td></tr>`,total:r2(s)};
  };
  const a=bloque('Activo','activo'), p=bloque('Pasivo','pasivo'), pt=bloque('Patrimonio','patrimonio');
  /* Misma utilidad que el Balance General (antes sumaba toda la historia de
     la empresa y no coincidía). */
  const u=utilidadPatrimonioSinDuplicar(e,h);
  return cab('Libro de Inventarios',`Al ${fFecha(h)} · detalle de cada cuenta del balance · cifras en quetzales`,
    `<button class="btn" data-accion="pdfLibroInventarios">Descargar PDF</button>`)
  + `<div class="barra"><div class="campo"><label>Fecha de corte</label>
      <input type="date" data-filtro="corteInventario" value="${h}"></div></div>
    <div class="aviso">Normalmente se corta al cierre del ejercicio, el 31 de diciembre. Las cuentas de
      Inventarios, Clientes y Proveedores ya muestran su desglose completo — producto por producto,

VISTAS.balance=()=>{
  const e=emp();
  const h=filtros.hasta||`${e.ejercicio}-12-31`;
  const mov=movimientos(null,h);
  const bloque=(titulo,tipo)=>{
    let s=0,f='';
    e.cuentas.filter(c=>c.d&&c.t===tipo).forEach(c=>{
      const v=saldoNatural(c.c,mov); if(!v) return; s+=v;
      f+=`<tr><td style="padding-left:26px">${esc(c.n)}</td><td class="num">${Q(v)}</td></tr>`;
    });
    return {html:`<tr class="grupo-cta"><td colspan="2">${titulo}</td></tr>${f||'<tr><td style="padding-left:26px;color:var(--tinta-suave)">Sin saldos</td><td></td></tr>'}`,total:r2(s)};
  };
  const a=bloque('Activo','activo'), p=bloque('Pasivo','pasivo'), pt=bloque('Patrimonio','patrimonio');
  /* La utilidad que se suma al patrimonio tiene que ser la misma que muestra
     el Estado de Resultados para el mismo ejercicio — si no, este balance y
     ese reporte cuentan una historia distinta del mismo negocio. Se toma
     desde el inicio del ejercicio hasta la fecha de corte del balance. */
  const u=utilidadPatrimonioSinDuplicar(e,h);
  const totalPP=r2(p.total+pt.total+u);
  const cuadra=r2(a.total)===totalPP;
  return cab('Balance general',`Al ${fFecha(h)} · cifras en quetzales`)
    + `<div class="barra"><div class="campo"><label>Al</label><input type="date" data-filtro="hasta" value="${h}"></div></div>`
    + `<div class="aviso ${cuadra?'bien':'malo'}">${cuadra
        ? 'El balance cuadra: activo igual a pasivo más patrimonio.'
        : `Descuadre de Q${Q(Math.abs(a.total-totalPP))}. Revisá las partidas.`}</div>`
    + `<table><tbody>${a.html}
      <tr class="total"><td>Total activo</td><td class="num">${Q(a.total)}</td></tr>
      ${p.html}<tr class="total"><td>Total pasivo</td><td class="num">${Q(p.total)}</td></tr>
      ${pt.html}${filasUtilidadPatrimonio(e,h)}
      <tr class="total"><td>Total patrimonio</td><td class="num">${Q(r2(pt.total+u))}</td></tr>
      <tr class="total"><td>Total pasivo y patrimonio</td><td class="num">${Q(totalPP)}</td></tr>
      </tbody></table>`;
};

/* ============ FLUJO DE EFECTIVO — por variación de saldos (método indirecto simplificado) ============ */
/* No parte de estimar categorías a ojo: usa la identidad contable de la
   partida doble. Cada partida cuadra siempre (debe=haber), así que la suma
   de TODOS los movimientos de una cuenta que no sea Caja/Bancos, con el
   signo invertido, es exactamente el efecto que tuvo esa cuenta sobre el
   efectivo — sin importar si el otro lado de la operación tocó Caja
   directamente o pasó por Clientes, Proveedores, etc. primero. Lo único que
   sí es una simplificación real: como el catálogo no separa "activo fijo"
   de circulante, todo activo que no sea de los operativos conocidos
   (Clientes, Inventarios, IVA, etc.) se clasifica como inversión — puede
   que alguna cuenta puntual no encaje ahí para tu caso. */
const CUENTAS_OPERATIVAS_FLUJO=['1.1.04','1.1.05','1.1.06','1.1.07','1.1.08','1.1.09','1.1.10','1.1.11',
  '1.1.12','1.1.13','1.1.14','1.1.15','2.1.01','2.1.02','2.1.03','2.1.04','2.1.05','2.1.06','2.1.07',
  '2.1.08','2.1.09','2.1.10','2.1.11','2.1.12','2.1.13','2.1.14','2.1.15','2.1.16'];
function claseFlujo(c){
  /* Aportes de capital y lo que los socios deben de su suscripción: financiamiento. */
  if(c.c.startsWith('3.')||c.c==='1.1.12') return 'financiamiento';
  /* Préstamos y documentos financieros: financiamiento (antes caían en operación). */
  if(c.t==='pasivo' && (c.c==='2.1.17'||c.c==='2.2.01'||/pr[ée]stamo|financiamiento|hipoteca/i.test(c.n))) return 'financiamiento';
  /* Depreciación y amortización acumuladas no son inversión: son el ajuste
     que no movió efectivo y compensa el gasto de depreciación (operación). */
  if(c.t==='activo' && /depreciaci|amortizaci/i.test(c.n)) return 'operacion';
  if(CUENTAS_OPERATIVAS_FLUJO.includes(c.c)) return 'operacion';
  if(c.t==='ingreso'||c.t==='gasto'||c.t==='costo') return 'operacion';
  /* Todo el activo corriente (1.1.x) es capital de trabajo: operación. */
  if(c.t==='activo' && c.c.startsWith('1.1.')) return 'operacion';
  if(c.t==='activo') return 'inversion';   // activo no corriente: propiedad, planta y equipo, inversiones
  return 'operacion';
}
function flujoEfectivo(e,desde,hasta){
  const mov=movimientos(desde,hasta,true);
  const cuentasCaja=cuentasCajaBanco(e).map(c=>c.c);
  const buckets={operacion:0,inversion:0,financiamiento:0};
  const detalle={operacion:[],inversion:[],financiamiento:[]};
  e.cuentas.filter(c=>c.d&&!cuentasCaja.includes(c.c)).forEach(c=>{
    const m=mov[c.c]; if(!m) return;
    const impactoCaja=r2((m.haber||0)-(m.debe||0));   // efecto opuesto al movimiento propio de la cuenta
    if(!impactoCaja) return;
    const clase=claseFlujo(c);
    buckets[clase]=r2(buckets[clase]+impactoCaja);
    detalle[clase].push({cuenta:c.c,nombre:c.n,monto:impactoCaja});
  });
  const saldoInicial=r2(cuentasCaja.reduce((s,cta)=>s+saldoCuentaAntesDe(e,cta,desde),0));
  const cambioNeto=r2(buckets.operacion+buckets.inversion+buckets.financiamiento);
  const saldoFinal=r2(saldoInicial+cambioNeto);
  return {buckets,detalle,saldoInicial,cambioNeto,saldoFinal};
}

VISTAS.flujoEfectivo=()=>{
  const e=emp();
  const d=filtros.desdeFlujo||`${e.ejercicio}-01-01`, h=filtros.hastaFlujo||`${e.ejercicio}-12-31`;
  const f=flujoEfectivo(e,d,h);
  const seccion=(titulo,clave)=>{
    const items=f.detalle[clave];
    if(!items.length) return `<tr class="grupo-cta"><td colspan="2">${titulo}</td></tr>
      <tr><td style="padding-left:26px;color:var(--tinta-suave)">Sin movimiento</td><td></td></tr>`;
    return `<tr class="grupo-cta"><td colspan="2">${titulo}</td></tr>`
      + items.map(x=>`<tr><td style="padding-left:26px">${esc(x.nombre)}</td><td class="num">${Q(x.monto)}</td></tr>`).join('')
      + `<tr><td style="padding-left:26px"><em>Efectivo neto de ${titulo.toLowerCase()}</em></td><td class="num"><em>${Q(f.buckets[clave])}</em></td></tr>`;
  };
  return cab('Flujo de efectivo',`Del ${fFecha(d)} al ${fFecha(h)} · método indirecto (variación de saldos) · cifras en quetzales`,
    `<button class="btn" data-accion="pdfFlujoEfectivo">Descargar PDF</button>`)
  + `<div class="barra">
      <div class="campo"><label>Desde</label><input type="date" data-filtro="desdeFlujo" value="${d}"></div>

    <div class="aviso">Clasificación: activo corriente (1.1), resultados, depreciación acumulada y pasivos comerciales →
      operación; activo no corriente (1.2) → inversión; préstamos, capital y aportes de socios → financiamiento.
      Revisá que te haga sentido si agregaste cuentas propias al catálogo.</div>
    <table><tbody>

/* ============ TABLERO FISCAL ============ */
/* Bases legales: IVA Dto. 27-92 · ISR Dto. 10-2012 · Regímenes primario y
   pecuario Dto. 31-2024 y su reglamento AG 54-2026. */
const MESES_NOM=['Enero','Febrero','Marzo','Abril','Mayo','Junio',
  'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const SALARIO_MINIMO=4002.28;            // sector no agrícola, 2026 — se puede ajustar por empresa

/* ============ PLANILLAS Y SALARIOS ============ */
/* Tasas verificadas: Acuerdo 1124 IGSS (4.83% laboral, 10.67% patronal),
   Ley del IRTRA Dto. 1528 (1% patronal), INTECAP Dto. 17-72 (1% patronal).
   La bonificación incentivo (Dto. 78-89, Q250 mensual) NO entra en la base de
   ninguna de estas cuotas — solo el salario ordinario y extraordinario las genera. */
const IGSS_LABORAL=0.0483, IGSS_PATRONAL=0.1067, INTECAP_PCT=0.01, IRTRA_PCT=0.01;
const BONIFICACION_INCENTIVO=250;
const RECARGO_HORA_EXTRA=1.5;   // Código de Trabajo, Art. 121: mínimo tiempo y medio
const RECARGO_HORA_EXTRA_DOMINGO=2;   // Trabajo en el día de descanso semanal (domingo) o de asueto

/* ISR sobre rentas del trabajo — Dto. 10-2012, reformado por el Dto. 13-2026.
   Deducción personal anual (sin necesidad de facturas):
   · hasta 2025: Q48,000.
   · 2026: Q51,024 (Q48,000 + Q3,024 extraordinaria del artículo transitorio),
     con la que el salario mínimo queda sin retención en 2026.
   · desde 2027: equivale a 12 salarios mínimos mensuales de actividades no
     agrícolas, INCLUIDA la bonificación incentivo, tomando el más alto del país
     (circunscripción 1). La SAT publica el valor cada año: si ya lo publicó, se
     escribe en Configuración y manda sobre el cálculo.
   La bonificación incentivo SÍ paga ISR, aunque no pague IGSS. */
function deduccionPersonalAnual(anio,e){
  e=e||emp();
  anio=+anio||+hoy().slice(0,4);
  const publicada=e&&e.deduccionPersonalSAT&&+e.deduccionPersonalSAT[anio];
  if(publicada>0) return r2(publicada);
  if(anio<=2025) return 48000;
  if(anio===2026) return 51024;
  const sm=(e&&e.salarioMinimo)||SALARIO_MINIMO;
  return r2(12*(sm+BONIFICACION_INCENTIVO));
}
function isrTablaTrabajo(rentaImponible){
  return rentaImponible<=300000 ? r2(rentaImponible*0.05) : r2(300000*0.05+(rentaImponible-300000)*0.07);
}
function calcularISRMensual(salarioBaseMensual,anio){
  const rentaBrutaAnual=r2((salarioBaseMensual+BONIFICACION_INCENTIVO)*12);
  const igssDeducibleAnual=r2(salarioBaseMensual*12*IGSS_LABORAL);
  const rentaImponible=Math.max(0,r2(rentaBrutaAnual-igssDeducibleAnual-deduccionPersonalAnual(anio)));
  const isrAnual=isrTablaTrabajo(rentaImponible);
  /* Sin r2() acá: esto se pasa a prorratear(), que todavía lo va a dividir
     entre 30 y multiplicar por 7 o 15 si el período es semanal o quincenal —
     redondear antes de esa cuenta es el mismo error que ya corregimos en
     inventario y en planillas. prorratear() ya redondea el monto final. */
  return isrAnual/12;
}

/* Descuentos y cargos sobre lo que se paga al retirarse un empleado. La indemnización, el aguinaldo y
   el Bono 14 están exentos de IGSS y de ISR; las vacaciones pagadas son salario, así que sí llevan
   IGSS laboral (4.83%), cuotas patronales (IGSS, INTECAP, IRTRA) e ISR. El ISR de las vacaciones es
   lo que sube el impuesto anual del empleado al sumar ese pago a su renta de un año (misma tabla
   y deducciones que la planilla). Es una estimación: el cálculo definitivo es el de la retención anual. */
function isrAnualTrabajo(brutoAnual,igssAnual,anio){
  const imp=Math.max(0,r2(brutoAnual-igssAnual-deduccionPersonalAnual(anio)));
  return isrTablaTrabajo(imp);
}
function cargosSobreVacaciones(salarioBase,monto,anio){
  monto=r2(Math.max(0,+monto||0));
  const brutoBase=r2((salarioBase+BONIFICACION_INCENTIVO)*12), igssBase=r2(salarioBase*12*IGSS_LABORAL);
  const igssLaboral=r2(monto*IGSS_LABORAL);
  const isr=r2(Math.max(0,isrAnualTrabajo(brutoBase+monto,igssBase+igssLaboral,anio)-isrAnualTrabajo(brutoBase,igssBase,anio)));
  return {igssLaboral,isr,
    igssPatronal:r2(monto*IGSS_PATRONAL),intecap:r2(monto*INTECAP_PCT),irtra:r2(monto*IRTRA_PCT)};
}
/* Prorratea un monto mensual al período de pago, sobre la base de un mes de 30
   días — el criterio más común en Guatemala para planillas semanales/quincenales. */
function prorratear(montoMensual,periodo){
  const diario=montoMensual/30;
  if(periodo==='semanal') return r2(diario*7);
  if(periodo==='quincenal') return r2(diario*15);
  return r2(montoMensual);   // mensual: completo
}

/* Salario diario "legal": se anualiza el salario mensual y se divide entre 365,
   no entre 30 — es el criterio correcto en Guatemala para prestaciones,
   ausencias y horas extra, porque un mes real no son exactamente 30 días.
   La hora es ese salario diario entre 8 (jornada ordinaria). */
function salarioDiarioLegal(salarioBase){
  /* Sin r2() acá a propósito, mismo motivo que el costo de inventario: esto
     es una TASA que se multiplica después (por horas, por días de
     vacaciones) — si se redondea acá, el redondeo se arrastra multiplicado.
     Se redondea recién en el monto final de cada cálculo que lo usa. */
  return (salarioBase*12)/365;
}

function diasEntre(desde,hasta){ return Math.round((new Date(hasta)-new Date(desde))/86400000)+1; }
function diasNominalesPeriodo(periodo){ return periodo==='semanal'?7:periodo==='quincenal'?15:30; }

/* Provisión de prestaciones laborales, por empleado, en su ley:
   Aguinaldo y Bono 14 = un sueldo al año (1/12 por mes); Vacaciones = 15 días
   hábiles al año, que equivalen a la MITAD del sueldo base mensual (así se
   paga: no se multiplican días de calendario por el salario diario);
   Indemnización = un sueldo por año trabajado sobre el promedio de 14 sueldos
   al año —el sueldo más la parte de aguinaldo y Bono 14—, es decir
   (sueldo × 14 ÷ 12) por año. Solo se paga de verdad si hay despido
   injustificado, pero contablemente se va reconociendo mes a mes. Si la fecha de ingreso del empleado cae DENTRO de este período
   de planilla, se prorratea solo desde ese día — así lo exige la ley tanto
   para el Aguinaldo (Dto. 76-78) como para el Bono 14 (Dto. 42-92). */
function provisionesPrestaciones(salarioBase,periodo,fechaIngreso,desdePeriodo,hastaPeriodo){
  let dias=diasNominalesPeriodo(periodo);
  if(fechaIngreso && desdePeriodo && hastaPeriodo){
    if(fechaIngreso>hastaPeriodo) dias=0;                              // todavía no había ingresado
    else if(fechaIngreso>desdePeriodo) dias=Math.max(0,diasEntre(fechaIngreso,hastaPeriodo));  // ingresó a mitad del período
  }
  const factor=dias/30;
  const vacacionesAnual=r2(salarioBase/2);
  return {
    aguinaldo: r2(salarioBase/12*factor),
    bono14: r2(salarioBase/12*factor),
    vacaciones: r2(vacacionesAnual/12*factor),
    indemnizacion: r2(salarioBase*14/12/12*factor),
  };
}

function calcularPlanillaEmpleado(emp,periodo,extras,fechasPeriodo){
  extras=extras||{}; fechasPeriodo=fechasPeriodo||{};
  const diasFalta=+extras.diasFalta||0, horasExtra=+extras.horasExtra||0, bonoAdicional=r2(+extras.bonoAdicional||0);
  const horasMenos=+extras.horasMenos||0, horasExtraDomingo=+extras.horasExtraDomingo||0;

  const salarioDiario=salarioDiarioLegal(emp.salarioBase);
  /* Descuento simple: los días que se indiquen, tal cual. Si corresponde
     descontar también el séptimo día por la falta (Art. 126 del Código de
     Trabajo), se captura a mano sumándolo a "días de falta" — el sistema no
     lo agrega solo, porque no sabe en qué semana cayó cada falta. */
  const descuentoFaltas=r2(salarioDiario*diasFalta);
  const salarioPeriodo=r2(Math.max(0,prorratear(emp.salarioBase,periodo)-descuentoFaltas));

  const horaOrdinaria=salarioDiario/8;
  const montoHorasExtra=r2(horaOrdinaria*RECARGO_HORA_EXTRA*horasExtra);
  /* Hora trabajada en domingo o día de descanso semanal: el día ya está
     pagado dentro del sueldo mensual (Art. 126), y encima el tiempo
     trabajado se paga aparte, con recargo distinto al de la hora extra
     entre semana. */
  const montoHorasExtraDomingo=r2(horaOrdinaria*RECARGO_HORA_EXTRA_DOMINGO*horasExtraDomingo);
  /* Horas de menos: tiempo que el empleado quedó debiendo (llegadas tarde,
     salidas antes). Se descuentan al valor normal de la hora, sin el recargo
     de tiempo y medio — no son horas extra, son lo contrario. */
  const descuentoHorasMenos=r2(horaOrdinaria*horasMenos);

  /* La bonificación incentivo se reduce en la misma proporción que el tiempo
     no trabajado —días de falta y horas de menos—, porque compensa la
     dedicación completa al puesto. Las horas extra NO la aumentan ni la
     afectan: es un mínimo fijo, no un pago por hora. */
  const bonifDiaria=BONIFICACION_INCENTIVO/30;
  const bonifHora=bonifDiaria/8;
  const descuentoBonif=r2(bonifDiaria*diasFalta+bonifHora*horasMenos);
  const bonifPeriodo=r2(Math.max(0,prorratear(BONIFICACION_INCENTIVO,periodo)-descuentoBonif));

  /* Horas extra (entre semana y domingo) y bonificación adicional SÍ pagan
     IGSS, INTECAP e IRTRA — son salario ordinario y extraordinario. La
     bonificación incentivo, no. Las horas de menos restan de la misma base,
     porque es menos salario devengado, no un concepto aparte. */
  const baseIGSS=r2(Math.max(0,salarioPeriodo+montoHorasExtra+montoHorasExtraDomingo+bonoAdicional-descuentoHorasMenos));
  const igssLaboral=r2(baseIGSS*IGSS_LABORAL);
  const igssPatronal=r2(baseIGSS*IGSS_PATRONAL);
  const intecap=r2(baseIGSS*INTECAP_PCT);
  const irtra=r2(baseIGSS*IRTRA_PCT);

  const isr=prorratear(calcularISRMensual(emp.salarioBase,(fechasPeriodo.hasta||hoy()).slice(0,4)),periodo);
  const prestaciones=provisionesPrestaciones(emp.salarioBase,periodo,emp.fechaIngreso,fechasPeriodo.desde,fechasPeriodo.hasta);

  const liquido=r2(Math.max(0,salarioPeriodo+montoHorasExtra+montoHorasExtraDomingo+bonoAdicional-descuentoHorasMenos+bonifPeriodo-igssLaboral-isr));

  return {empleadoId:emp.id,nombre:emp.nombre,salarioBase:emp.salarioBase,
    diasFalta,horasExtra,horasExtraDomingo,bonoAdicional,horasMenos,descuentoFaltas,descuentoHorasMenos,descuentoBonif,
    salarioPeriodo,montoHorasExtra,montoHorasExtraDomingo,bonifPeriodo,
    igssLaboral,igssPatronal,intecap,irtra,isr,liquido,
    prestaciones};
}

/* Opcional Simplificado: 5% sobre los primeros Q30,000 del mes, 7% del excedente. */
const isrSimplificado=b=> b<=30000 ? r2(b*0.05) : r2(1500+(b-30000)*0.07);

/* El tramo del 5%/7% es MENSUAL ACUMULADO, no por factura ni por día: hay que
   saber cuánto se vendió antes en el mes para calcular el impuesto marginal
   de lo nuevo. Se compara el impuesto sobre "lo acumulado hasta ahora" contra
   el impuesto sobre "lo acumulado antes", y la diferencia es lo que corresponde
   a esta venta. */
function previoVentasAntesDe(e,corte){
  const mesIni=corte.slice(0,7)+'-01';
  return r2((e.documentos||[]).filter(d=>d.tipo==='venta' && d.fecha>=mesIni && d.fecha<corte)
    .reduce((s,d)=>s+(d.signo||1)*d.base,0));
}
function isrIncrementalPorTramo(previo,ventasNuevas){
  if(!ventasNuevas) return 0;
  return r2(isrSimplificado(r2(previo+ventasNuevas))-isrSimplificado(previo));
}
/* Ventas (con signo, las notas de crédito restan) que caen dentro de un grupo
   ya sea un solo día o un mes completo, según el modo de agrupación elegido. */
function ventasDelGrupo(docs,g,modo){
  return r2(docs.filter(d=>d.tipo==='venta' &&
      (modo==='dia' ? d.fecha===g.fecha : d.fecha && d.fecha.slice(0,7)===g.fecha.slice(0,7)))
    .reduce((s,d)=>s+(d.signo||1)*d.base,0));
}

/* Costo de ventas de un período — misma fórmula que usa el Estado de
   Resultados (inventario inicial + compras de bienes del período − inventario
   final), para que el Tablero y los cierres fiscales no sigan calculando la
   utilidad como si comprar mercadería no costara nada. Si no hay un conteo
   físico registrado justo en esa fecha de corte (lo normal para un mes
   suelto, el conteo real casi siempre es al cierre del año), se usa como
   estimación razonable lo comprado en ese mismo período — no es exacto,
   pero es muchísimo mejor que no restar nada. */
function costoVentasPeriodo(e,desde,hasta,mov){
  /* Si ya existe un inventario final guardado para esta fecha de corte, Y el
     saldo real de la cuenta de Inventarios YA coincide con ese monto, quiere
     decir que alguna partida real ya hizo el cierre — no importa cuál acción
     lo posteó (Cerrar costo de ventas, o el cierre fiscal parcial de un
     trimestre que también lo cierra) ni el texto exacto de su concepto.
     Chequear el saldo real en vez de un texto es más robusto: cualquier
     partida que de verdad deje el inventario en ese número cuenta como un
     cierre real, y no hay que estimar de nuevo con la fórmula — se
     contaría dos veces. */
  const invFinalGuardado=Object.prototype.hasOwnProperty.call(e.inventarioFinal||{},hasta)?r2(e.inventarioFinal[hasta]):null;
  const yaCerrado=invFinalGuardado!==null && r2(saldoNatural('1.1.08',movimientos(null,hasta)))===invFinalGuardado;
  if(yaCerrado) return {costo:0,estimado:false,yaCerrado:true};
  const invInicial=saldoCuentaAntesDe(e,'1.1.08',desde);
  /* Una nota de crédito de un proveedor abona (haber) la cuenta de
     Inventarios, no la debita — si acá solo se mira el debe, la devolución
     nunca se resta del costo estimado, aunque el saldo real de la cuenta sí
     la reste. Por eso hay que usar el movimiento neto (debe menos haber),
     igual que hace saldoNatural con cualquier otra cuenta. Se calcula acá
     con movimientoCuentaSinCierreCosto en vez de leer directo de mov, para
     que un cierre de costo de ventas fechado dentro de este mismo rango
     no se cuente como si fuera una compra negativa. */
  const movInv=movimientoCuentaSinCierreCosto(e,'1.1.08',desde,hasta);
  const comprasBienes=r2((movInv.debe||0)-(movInv.haber||0));
  const tieneFinal=Object.prototype.hasOwnProperty.call(e.inventarioFinal||{},hasta);
  if(tieneFinal) return {costo:r2(invInicial+comprasBienes-r2(e.inventarioFinal[hasta])),estimado:false};
  /* Sin un inventario final real, hay que estimar — pero el kardex ya sabe
     el costo real de lo que salió por venta directa y por consignación
     vendida en este período, así que es una base mucho mejor que "todo lo
     que se compró se vendió" (comprasBienes), que se queda corto o se pasa
     de largo según cuánto haya crecido o bajado la mercadería en existencia.
     Si todavía no hay nada en el kardex —una empresa que recién carga
     facturas sin usar Ventas todavía—, comprasBienes sigue como respaldo,
     mejor una estimación gruesa que ninguna. */
  const salidasKardex=(e.salidasInventario||[]).filter(s=>s.fecha>=desde&&s.fecha<=hasta&&s.motivo!=='produccion')
    .reduce((sum,s)=>sum+(s.costoTotal||0),0);
  const consignVendidas=(e.consignaciones||[]).filter(c=>c.estado==='vendido'&&c.fechaVenta&&c.fechaVenta>=desde&&c.fechaVenta<=hasta)
    .reduce((sum,c)=>sum+(c.costoTotal||0),0);
  const costoKardex=r2(salidasKardex+consignVendidas);
  return {costo:costoKardex>0?costoKardex:comprasBienes,estimado:true,deKardex:costoKardex>0};
}

function mesesDelEjercicio(){
  const e=emp(), a=e.ejercicio, out=[];
  for(let m=1;m<=12;m++){
    const mm=String(m).padStart(2,'0');
    const desde=`${a}-${mm}-01`, hasta=`${a}-${mm}-${new Date(a,m,0).getDate()}`;
    const mov=movimientos(desde,hasta,true);
    /* El IVA del mes sale solo de las operaciones del mes: los pagos y
       compensaciones de meses anteriores no deben restarle nada. */
    const movIva=movimientosOperativos(e,desde,hasta);
    const credito=saldoNatural('1.1.09',movIva), debito=saldoNatural('2.1.04',movIva);
    const ingresos=totalTipo(['ingreso'],mov);
    const regimenMes=regimenEn(e,hasta);   // el que regía ESE mes, no necesariamente el de hoy
    const {costo:costoBienes,estimado}=costoVentasPeriodo(e,desde,hasta,mov);
    const cg=r2(costoBienes+totalTipo(['costo'],mov)+totalTipo(['gasto'],mov));
    const fila={m,mm,nombre:MESES_NOM[m-1],desde,hasta,ingresos,regimen:regimenMes,
      cg, costoEstimado:estimado,
      credito,debito,ivaPagar:r2(debito-credito),utilidad:r2(ingresos-cg),imp:0};
    if(regimenMes==='simplificado') fila.imp=isrSimplificado(ingresos);
    else if(regimenMes==='pequeno')  fila.imp=r2(ingresos*0.05);
    else if(regimenMes==='primario'||regimenMes==='pecuario') fila.imp=r2(ingresos*0.015);
    out.push(fila);
  }
  return out;
}

/* Detalle de inventario (Libro de Inventarios): junta las líneas de producto de
   todas las compras de bienes y lo producido, agrupado por descripción, y resta
   las salidas (ventas, consignaciones y materiales usados en producción): es la
   existencia según el kardex, no un conteo físico. Los documentos cargados desde Excel
   no traen detalle de línea, así que su valor se cuenta pero queda aparte, sin
   desglosar por producto. */
/* Método de valuación de inventarios — Art. 41, Dto. 10-2012. Para una
   empresa comercializadora la ley deja elegir entre promedio ponderado y PEPS
   (el costo de producción es para quien fabrica). Una vez adoptado, no puede
   cambiarse sin autorización previa de la SAT; por eso se pregunta al crear
   la empresa y después queda bloqueado. Las empresas que ya existían venían
   trabajando con promedio ponderado: ese es el valor por defecto. */
/* A qué se dedica la empresa. "Productora" fabrica o transforma un bien y habilita el área de
   Producción; no quita nada de lo comercial, así que una empresa que fabrica algunos productos
   y revende otros elige "productora". Las empresas que ya existían eran comercializadoras. */
const TIPOS_ACTIVIDAD={
  comercializadora:'Empresa comercializadora — compra y vende bienes o servicios',
  productora:'Industria productora — fabrica o transforma un bien (también puede revender)'};
const esProductora=e=>!!e&&e.tipoActividad==='productora';
const METODOS_COSTEO={ppp:'Promedio ponderado',peps:'PEPS (primero en entrar, primero en salir)'};
const metodoCosteo=e=>(e&&e.metodoCosteo==='peps')?'peps':'ppp';

/* Capas de compra de un producto, en orden cronológico — cada compra de
   bienes con detalle es una capa con su cantidad y su costo neto de IVA.
   Una nota de crédito (signo negativo) es una devolución al proveedor: se
   descuenta de las capas más recientes, que son las que se compraron último. */
function capasDeCompra(e,producto){
  const capas=[];
  (e.documentos||[]).map((d,i)=>({d,i})).filter(x=>x.d.tipo==='compra'&&x.d.cta==='1.1.08'&&x.d.items&&x.d.items.length)
    .sort((a,b)=>(a.d.fecha<b.d.fecha?-1:a.d.fecha>b.d.fecha?1:a.i-b.i))
    .forEach(({d})=>{
      d.items.filter(it=>it.bs==='B'&&(it.descripcion||'Sin descripción').trim()===producto).forEach(it=>{
        const s=d.signo||1;
        const ivaItem=(it.impuestos||[]).filter(im=>(im.nombre||'').toUpperCase()==='IVA').reduce((a,im)=>a+(im.monto||0),0);
        const neto=(it.total||0)-ivaItem, cant=it.cantidad||0;
        if(s>0){ if(cant>0) capas.push({cantidad:cant,total:neto,fecha:d.fecha}); }
        else{
          let quitar=cant;
          for(let k=capas.length-1;k>=0&&quitar>1e-9;k--){
            const t=Math.min(capas[k].cantidad,quitar), cu=capas[k].total/capas[k].cantidad;
            capas[k].cantidad-=t; capas[k].total-=t*cu; quitar-=t;
          }
        }
      });
    });
  /* Lo producido entra como una capa más, en el orden de su fecha de cierre. */
  (e.ordenesProduccion||[]).filter(o=>o.estado==='cerrada'&&o.producto===producto&&o.cantidadTerminada>0)
    .forEach(o=>capas.push({cantidad:o.cantidadTerminada,total:o.costoTerminado,fecha:o.fechaCierre}));
  if((e.ordenesProduccion||[]).length) capas.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  return capas.filter(c=>c.cantidad>1e-9);
}
/* Cuánto cuesta lo que sale. Es LA única fuente para ventas directas,
   consignaciones y las salidas automáticas al cargar facturas — así el
   método elegido no puede aplicarse distinto en cada pantalla.
   · Promedio ponderado: cantidad × (valor total en existencia ÷ unidades en existencia).
   · PEPS: se agotan primero las capas de compra más antiguas; lo que ya salió
     antes (en unidades) se salta, y lo nuevo se valúa con las capas que siguen. */
function costoSalidaInventario(e,producto,cantidad){
  if(metodoCosteo(e)==='peps'){
    const capas=capasDeCompra(e,producto);
    let saltar=(e.salidasInventario||[]).filter(x=>x.producto===producto).reduce((a,x)=>a+x.cantidad,0);
    let restante=cantidad, costo=0;
    for(const c of capas){
      if(restante<=1e-9) break;
      if(saltar>=c.cantidad-1e-9){ saltar-=c.cantidad; continue; }
      const disp=c.cantidad-Math.max(saltar,0), toma=Math.min(disp,restante);
      costo+=toma*(c.total/c.cantidad); restante-=toma; saltar=0;
    }
    if(restante>1e-9){   // se vendió más de lo que había: el excedente se valúa a la última capa
      const u=capas[capas.length-1];
      costo+=restante*(u?u.total/u.cantidad:0);
    }
    return {costoTotal:r2(costo), costoUnitario:cantidad?costo/cantidad:0};
  }
  const item=inventarioDetalle(e).lista.find(x=>x.producto===producto);
  const cu=item?item.costoUnitario:0;
  return {costoTotal:r2(cantidad*cu), costoUnitario:cu};
}

function inventarioDetalle(e){
  const productos={};
  let sinDetalle=0, sinDetalleValor=0;
  /* Antes esto solo miraba d.bs==='B', sin importar qué cuenta contable
     terminó teniendo el documento — así que una nota de crédito reclasificada
     a "Devoluciones y rebajas sobre compras" (una rebaja de precio, sin que
     la mercadería físicamente vuelva) seguía restando cantidad del kardex
     igual que una devolución real. Ahora el kardex sigue la MISMA decisión
     que ya tomó el contador al clasificar la cuenta: solo entra si de verdad
     quedó en Inventarios (1.1.08), que es la cuenta que implica movimiento
     físico real. */
  (e.documentos||[]).filter(d=>d.tipo==='compra' && d.cta==='1.1.08').forEach(d=>{
    if(d.items && d.items.length){
      d.items.filter(it=>it.bs==='B').forEach(it=>{
        const k=(it.descripcion||'Sin descripción').trim();
        productos[k]=productos[k]||{producto:k,cantidad:0,total:0,movimientos:0};
        const s=d.signo||1;
        /* Se valúa sin IVA: lo que de verdad queda cargado en la cuenta de
           Inventarios es el neto, el IVA se va aparte a crédito fiscal. */
        const ivaItem=(it.impuestos||[]).filter(im=>(im.nombre||'').toUpperCase()==='IVA')
          .reduce((s2,im)=>s2+(im.monto||0),0);
        const neto=r2((it.total||0)-ivaItem);
        productos[k].cantidad=r2(productos[k].cantidad+s*(it.cantidad||0));
        productos[k].total=r2(productos[k].total+s*neto);
        productos[k].movimientos++;
      });
    }else{
      sinDetalle++; sinDetalleValor=r2(sinDetalleValor+(d.signo||1)*d.base);
    }
  });
  /* Lo que sale —una venta directa o algo que se fue a consignación— se
     resta acá, al costo promedio que tenía en el momento de registrarse
     (guardado en la propia salida, no recalculado ahora). Sin esto, el
     inventario solo sumaría entradas para siempre y nunca bajaría, aunque
     ya no quede nada en existencia. */
  /* Lo que se fabricó entra al kardex a su costo de producción (órdenes y corridas ya cerradas). */
  (e.ordenesProduccion||[]).filter(o=>o.estado==='cerrada'&&o.cantidadTerminada>0).forEach(o=>{
    const k=o.producto;
    productos[k]=productos[k]||{producto:k,cantidad:0,total:0,movimientos:0};
    productos[k].cantidad=r2(productos[k].cantidad+o.cantidadTerminada);
    productos[k].total=r2(productos[k].total+o.costoTerminado);
    productos[k].movimientos++;
  });
  (e.salidasInventario||[]).forEach(s=>{
    const k=s.producto;
    productos[k]=productos[k]||{producto:k,cantidad:0,total:0,movimientos:0};
    productos[k].cantidad=r2(productos[k].cantidad-s.cantidad);
    productos[k].total=r2(productos[k].total-s.costoTotal);
  });
  const lista=Object.values(productos).map(p=>({...p,
    /* Sin r2() acá a propósito: si se redondea el costo unitario ANTES de
       usarlo para calcular el costo de una venta o consignación, cada
       transacción grande arrastra un poquito de error — 3,400 cajas a
       Q2.036144 exacto no es lo mismo que 3,400 cajas a Q2.04 redondeado, y
       esa diferencia se va acumulando con cada movimiento. Q() ya redondea
       solo para mostrarlo en pantalla, así que no hace falta perder
       precisión acá. */
    costoUnitario: p.cantidad>0.0001 ? p.total/p.cantidad : 0}))
    /* Un producto que ya se agotó no tiene nada que aportar a "cuánto tengo
       en existencia ahora" — se saca de la lista en vez de dejarlo en cero
       estorbando. Si por algún error de carga quedó en negativo (se vendió
       más de lo que había), sí se deja visible — eso es justo la señal de
       que algo no cuadra y hay que revisarlo, no algo para esconder. */
    .filter(p=>p.cantidad>0.0001||p.cantidad<-0.0001)
    .sort((a,b)=>b.total-a.total);
  return {lista, sinDetalle, sinDetalleValor};
}

/* Si la empresa alguna vez estuvo en alguno de estos regímenes (no
   necesariamente el actual), corresponde que el libro de ese régimen
   siga visible — para no perder el acceso a lo que ya se registró ahí. */
function tuvoRegimen(e,tipos){
  const historial=e.historialRegimen&&e.historialRegimen.length ? e.historialRegimen : [{regimen:e.regimen}];
  return historial.some(h=>tipos.includes(h.regimen));
}

/* Libros de Compras y de Ventas (Art. 37 de la Ley del IVA y su reglamento):
   cada documento separa bienes, servicios, operaciones exentas o sin IVA,
   compras a pequeños contribuyentes, el impuesto, y se totaliza por mes. */
function desgloseCV(d){
  const s=d.signo||1, base=s*(d.base||0);
  let pB=d.bs==='S'?0:1;
  if(d.items&&d.items.length){
    const tb=d.items.filter(it=>it.bs==='B').reduce((a,it)=>a+(it.total||0),0);
    const ts=d.items.filter(it=>it.bs==='S').reduce((a,it)=>a+(it.total||0),0);
    if(tb+ts>0) pB=tb/(tb+ts);
  }
  const peq=!!d.pequeno||d.tipoDte==='FPEQ'||d.tipoDte==='FCAP';
  const exenta=!peq&&!d.iva;
  const gravada=!peq&&!exenta;
  const noDed=d.cta==='6.2.14';
  return {
    bienes:gravada?r2(base*pB):0, servicios:gravada?r2(base*(1-pB)):0,
    peq:peq?r2(s*d.total):0, exentas:exenta?r2(base):0,
    idp:r2(s*(d.idp||0)),
    credito:noDed?0:r2(s*(d.iva||0)), ivaNoDed:noDed?r2(s*(d.iva||0)):0,
    iva:r2(s*(d.iva||0)), total:r2(s*d.total)};
}
const COLS_VENTAS=[['bienes','Bienes'],['servicios','Servicios'],['exentas','Exentas / sin IVA'],['iva','Débito fiscal'],['total','Total']];
const COLS_COMPRAS=[['bienes','Bienes'],['servicios','Servicios'],['peq','Peq. contribuyente'],['exentas','Exentas / sin IVA'],['idp','IDP y otros'],['credito','Crédito fiscal'],['ivaNoDed','IVA no deducible'],['total','Total']];
/* Filas de un libro agrupadas por mes: {mes, docs:[{d,x}], tot} y el total general. */
function libroPorMes(docs,cols){
  const meses={}, gen={};
  cols.forEach(([k])=>gen[k]=0);
  docs.forEach(d=>{
    const m=(d.fecha||'').slice(0,7);
    meses[m]=meses[m]||{mes:m,docs:[],tot:Object.fromEntries(cols.map(([k])=>[k,0]))};
    const x=desgloseCV(d);
    meses[m].docs.push({d,x});
    cols.forEach(([k])=>{ meses[m].tot[k]=r2(meses[m].tot[k]+x[k]); gen[k]=r2(gen[k]+x[k]); });
  });
  return {meses:Object.values(meses).sort((a,b)=>a.mes.localeCompare(b.mes)),gen};
}
const nombreMes=m=>{ const [a,mm]=m.split('-'); return `${MESES_NOM[+mm-1]||''} ${a}`; };
function tablaLibroCV(docs,cols,etiquetaContraparte){
  const L=libroPorMes(docs,cols);
  const cab4=`<th>Fecha</th><th>Documento</th><th>NIT</th><th>${etiquetaContraparte}</th>`;
  const cuerpo=L.meses.map(M=>
    `<tr class="grupo-cta"><td colspan="${4+cols.length}">${nombreMes(M.mes)}</td></tr>`
    +M.docs.map(({d,x})=>`<tr><td>${fFecha(d.fecha)}</td><td>${esc(d.tipoDte||'FACT')} ${esc(d.serie||'')}${d.dte?'-'+esc(d.dte):''}</td>
      <td>${esc(d.nit||'CF')}</td><td>${esc(d.nombre||'—')}</td>${cols.map(([k])=>`<td class="num">${x[k]?Q(x[k]):'—'}</td>`).join('')}</tr>`).join('')
    +`<tr><td colspan="4" style="padding-left:26px"><em>Total ${nombreMes(M.mes)}</em></td>${cols.map(([k])=>`<td class="num"><em>${Q(M.tot[k])}</em></td>`).join('')}</tr>`).join('');
  return {L,html:`<table style="font-size:13px"><thead><tr>${cab4}${cols.map(([,t])=>`<th class="num">${t}</th>`).join('')}</tr></thead>
    <tbody>${cuerpo}</tbody>
    <tfoot><tr class="total"><td colspan="4">Totales</td>${cols.map(([k])=>`<td class="num">${Q(L.gen[k])}</td>`).join('')}</tr></tfoot></table>`};
}

VISTAS.inventario=()=>{
  const e=emp();
  const {lista, sinDetalle, sinDetalleValor}=inventarioDetalle(e);
  const totalProductos=r2(lista.reduce((s,p)=>s+p.total,0));
  const totalGeneral=r2(totalProductos+sinDetalleValor);
  const filas=lista.map(p=>`<tr><td>${esc(p.producto)}</td>
    <td class="num">${p.cantidad?Q(p.cantidad).replace(/\.00$/,''):'—'}</td>
    <td class="num">${Q(p.costoUnitario)}</td>
    <td class="num">${Q(p.total)}</td></tr>`).join('');
  return cab('Existencias',`Existencia por producto: compras y producción, menos ventas, consignaciones y materiales usados — un kardex de trabajo, no el libro legal. Método de valuación: ${METODOS_COSTEO[metodoCosteo(e)]}.`,
    `<button class="btn sec" data-accion="revisarItemsInventario">Revisar ítems</button>
     <button class="btn" data-accion="pdfInventario">Descargar PDF</button>`)
  + `<div class="cifras">
      <div class="cifra"><span>Productos distintos</span><strong>${lista.length}</strong></div>
      <div class="cifra"><span>Valor total en inventario</span><strong>${Q(totalGeneral)}</strong></div>
    </div>
    <div class="aviso">Cada producto muestra lo que entró (compras de bienes y producción terminada) menos lo que
      salió (ventas, consignaciones y materiales usados en producción), valuado con el método de la empresa.
      Los servicios no generan inventario. Compará contra un conteo físico antes de cerrar el costo de ventas.</div>
    ${lista.length? `<table><thead><tr><th>Producto</th><th class="num">Existencia</th>
      <th class="num">Costo unitario prom.</th><th class="num">Valor</th></tr></thead>
      <tbody>${filas}</tbody>
      <tfoot><tr class="total"><td colspan="3">Total con detalle de producto</td><td class="num">${Q(totalProductos)}</td></tr></tfoot></table>`
     : `<div class="vacio">Todavía no hay compras de bienes con detalle de producto registradas.
        Se completa cargando facturas en XML desde "Cargar facturas".</div>`}
    ${sinDetalle? `<div class="aviso" style="margin-top:16px">${sinDetalle} compra${sinDetalle===1?'':'s'} de bienes por Q${Q(sinDetalleValor)}
      se cargaron desde Excel, que no trae detalle de producto por línea. Ese valor está incluido
      en el total general, pero no aparece desglosado por producto arriba. Para verlo desglosado,
      cargá esas facturas en XML en vez de Excel.</div>` : ''}`;
};

VISTAS.tablero=()=>{
  const e=emp(), meses=mesesDelEjercicio();
  const sel=filtros.periodo||'anio';
  const conMov=meses.filter(x=>x.ingresos||x.credito||x.debito||x.cg);
  const opciones=`<option value="anio"${sel==='anio'?' selected':''}>Todo el ejercicio ${e.ejercicio}</option>`
    + meses.map(x=>`<option value="${x.mm}"${sel===x.mm?' selected':''}>${x.nombre} ${e.ejercicio}</option>`).join('');

  const p = sel==='anio'
    ? meses.reduce((a,x)=>({ingresos:r2(a.ingresos+x.ingresos),cg:r2(a.cg+x.cg),
        credito:r2(a.credito+x.credito),debito:r2(a.debito+x.debito),
        utilidad:r2(a.utilidad+x.utilidad),imp:r2(a.imp+x.imp)}),
        {ingresos:0,cg:0,credito:0,debito:0,utilidad:0,imp:0})
    : meses.find(x=>x.mm===sel);
  const ivaNeto=r2(p.debito-p.credito);

  /* --- ISR según el régimen --- */
  let bloqueISR='';
  const hastaPeriodoSel = sel==='anio' ? `${e.ejercicio}-12-31` : (meses.find(x=>x.mm===sel)||{}).hasta;
  const regimenPeriodoSel = regimenEn(e,hastaPeriodoSel);
  if(regimenPeriodoSel==='general'){
    const trim=trimestresGeneral(e);
    const tc=trim.reduce((s,x)=>s+x.cierre,0), te=trim.reduce((s,x)=>s+x.estimada,0);
    /* El acumulado del año se calcula aparte, sobre el ejercicio completo de
       una sola vez — sumar los 4 trimestres tendría el mismo riesgo de
       contar el inventario dos veces si solo alguno de ellos tiene un
       inventario final registrado. */
    const desdeAno=`${e.ejercicio}-01-01`, hastaAno=`${e.ejercicio}-12-31`;
    const movAno=movimientos(desdeAno,hastaAno);
    const rentasAno=totalTipo(['ingreso'],movAno);
    const {costo:costoBienesAno}=costoVentasPeriodo(e,desdeAno,hastaAno,movAno);
    const utilAno=r2(rentasAno-r2(costoBienesAno+totalTipo(['costo'],movAno)+totalTipo(['gasto'],movAno)));
    bloqueISR=`<h3 style="color:var(--verde);margin:26px 0 4px">ISR sobre Utilidades de Actividades Lucrativas</h3>
      <p style="margin:0 0 12px;font-size:14px;color:var(--tinta-suave)">
        Tarifa del 25% con liquidación anual. Los pagos son <strong>trimestrales</strong>, no mensuales,
        y podés elegir entre cierre contable parcial o renta imponible estimada en 8% de la renta bruta.
        Formulario SAT-1361, dentro del mes siguiente al cierre del trimestre.</p>
      <table><thead><tr><th>Trimestre</th><th class="num">Rentas brutas</th><th class="num">Utilidad contable</th>
        <th class="num">Por cierre parcial (25%)</th><th class="num">Por renta estimada (8% × 25%)</th></tr></thead>
      <tbody>${trim.map(x=>`<tr><td>${['Ene–Mar','Abr–Jun','Jul–Sep','Oct–Dic'][x.t-1]}</td>
        <td class="num">${Q(x.rentas)}</td><td class="num">${Q(x.util)}</td>
        <td class="num">${Q(x.cierre)}</td><td class="num">${Q(x.estimada)}</td></tr>`).join('')}</tbody>
      <tfoot><tr class="total"><td>Acumulado del ejercicio</td>
        <td class="num">${Q(rentasAno)}</td>
        <td class="num">${Q(utilAno)}</td>
        <td class="num">${Q(tc)}</td><td class="num">${Q(te)}</td></tr></tfoot></table>
      <div class="aviso">El cuarto trimestre no se paga aparte: se liquida junto con la declaración anual,
        a más tardar el 31 de marzo.</div>
      <h3 style="color:var(--verde);margin:22px 0 4px">Costos y gastos por trimestre</h3>
      <p style="margin:0 0 12px;font-size:14px;color:var(--tinta-suave)">Mismo desglose que la conciliación de
        Estado de Resultados, trimestre por trimestre — para llenar la declaración sin tener que rearmarlo a mano.</p>
      <table><thead><tr><th>Trimestre</th><th class="num">Costo de ventas</th>
        <th class="num">Gastos deducibles</th><th class="num">No deducibles</th><th class="num">Total</th></tr></thead>
      <tbody>${trim.map(x=>`<tr><td>${['Ene–Mar','Abr–Jun','Jul–Sep','Oct–Dic'][x.t-1]}</td>
        <td class="num">${Q(x.costoVentas)}</td><td class="num">${Q(x.gastosDeducibles)}</td>
        <td class="num">${Q(x.noDeducible)}</td>
