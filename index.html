/* ============ CARGA DE FACTURAS ============ */
let lote=[], leyendo=false;
const soloNit=s=>String(s||'').replace(/[^0-9kK]/g,'').toUpperCase();

/* Cuentas sugeridas por categoría del reporte de la Agencia Virtual. */
const MAPEO_BASE={
  'Combustibles':'6.1.06',
  'No genera Credito Fiscal':'6.2.14',
  'No genera Crédito Fiscal':'6.2.14',
  'Otras Compras':'5.1.02',
  'Servicios Adquiridos':'6.2.24',
  'Notas de Credito':'5.1.03',
};

/* Asigna base, IVA y tipo según el régimen de la empresa que lleva la contabilidad. */
/* Si el documento viene de XML, se sabe con certeza por línea (BienOServicio real
   de la SAT, no una suposición). Se compara el valor de las líneas de bien contra
   las de servicio y gana la mayoría. Sin detalle de líneas (Excel), no hay cómo
   saberlo desde el documento mismo y se devuelve null. */
function bsDelDocumento(d){
  if(!d.items || !d.items.length) return null;
  const totalB=d.items.filter(it=>it.bs==='B').reduce((s,it)=>s+(it.total||0),0);
  const totalS=d.items.filter(it=>it.bs==='S').reduce((s,it)=>s+(it.total||0),0);
  if(!totalB && !totalS) return null;
  return totalB>=totalS ? 'B' : 'S';
}

function clasificar(d){
  const e=emp(), nitEmp=soloNit(e.nit);
  e.mapeoNit=e.mapeoNit||{}; e.mapeoCat=e.mapeoCat||{}; e.mapeoBS=e.mapeoBS||{};
  /* Factura especial: la EMITE la propia empresa (comprador) a nombre del
     vendedor. Para tratarla como compra, la contraparte es el receptor. */
  if(d.tipoDte==='FESP' && nitEmp && d.nitEmisor===nitEmp && d.nitReceptor!==nitEmp && !d.fespInvertida){
    [d.nitEmisor,d.nitReceptor]=[d.nitReceptor,d.nitEmisor];
    [d.emisor,d.receptor]=[d.receptor,d.emisor];
    d.fespInvertida=true; d.tipo='compra'; d.tipoFijo=true;
  }
  /* Si el usuario declaró de qué es el archivo, esa decisión manda sobre el NIT. */
  if(!d.tipoFijo){
    d.tipo = nitEmp&&d.nitReceptor===nitEmp ? 'compra'
           : nitEmp&&d.nitEmisor===nitEmp ? 'venta'
           : (d.tipo||'compra');
  }
  const nitOtro = d.tipo==='compra'?d.nitEmisor:d.nitReceptor;

  /* Bien o servicio se decide ANTES que la cuenta, porque ahora la cuenta depende
     de esto: una compra de bienes debe cargarse a Inventarios (Ley de Comercio,
     libro de inventarios), no a Compras/gasto directo. Orden de prioridad: el
     detalle real del XML, luego lo aprendido por proveedor, y si no hay ninguna
     pista, se asume bien (es lo más común en una compra). */
  if(!d.bs) d.bs = bsDelDocumento(d) || e.mapeoBS[nitOtro] || 'B';

  /* El régimen que decide si hay crédito fiscal es el que regía EN LA FECHA
     del documento, no el de hoy — si la empresa cambió de régimen, un
     documento viejo se clasifica con las reglas de cuando ocurrió, nunca
     con las de ahora. */
  const regimenDoc = regimenEn(e,d.fecha);
  const conCredito = regimenDoc==='general'||regimenDoc==='simplificado';
  const sinCredito = (d.categoria&&/no genera cr[ée]dito/i.test(d.categoria)) || d.pequeno;
  /* El IDP y los demás impuestos específicos no pagan IVA y no son acreditables:
     forman parte del costo, pero se separan para poder verlos. */
  const especificos=r2((d.idp||0)+(d.otrosImp||0));
  if(conCredito && !sinCredito){
    /* Si el reporte trae la columna de IVA, manda ese dato aunque venga en cero
       (exentos, pequeño contribuyente). Solo se calcula cuando no hay dato. */
    if(!d.ivaReportado) d.iva = r2(d.total - d.total/1.12);
    d.noAcred = d.tipo==='compra' ? especificos : 0;
    d.base = r2(d.total - d.iva - d.noAcred);
  }else{
    d.iva=0; d.noAcred=0; d.base=d.total;   // sin derecho a crédito fiscal: todo es costo
  }
  if(!d.cta){
    d.cta = e.mapeoNit[nitOtro]
         || e.mapeoCat[d.categoria]
         || MAPEO_BASE[(d.categoria||'').trim()]
         || (d.tipo==='compra'
              ? (d.signo===-1 && d.bs==='B' ? '5.1.03'   // nota de crédito de bienes: rebaja el costo de compras, no la mercadería en existencia
                 : d.bs==='B' ? '1.1.08' : '5.1.02')     // bien -> Inventarios; servicio -> Compras
              : '4.1.01');
  }
  if(!e.cuentas.some(c=>c.c===d.cta&&c.d))
    d.cta = d.tipo==='compra'
      ? (d.signo===-1 && d.bs==='B' ? '5.1.03' : d.bs==='B'?'1.1.08':'5.1.02')
      : '4.1.01';
  /* Si la cuenta resuelta —aunque sea por un proveedor ya aprendido— es
     Gastos no deducibles, el IVA de esa compra tampoco es acreditable, pero
     eso no significa que haya que fundirlo con el gasto: se separa igual
     que cualquier factura normal, y en generarPartidas() va a su propia
     cuenta (6.2.27, "IVA no deducible"), para que el Estado de Resultados y
     el formulario de IVA lo puedan identificar aparte. Esto reemplaza lo
     que hizo sinCredito más arriba si la razón de no acreditar fue otra
     (por ejemplo, régimen Pequeño), porque acá la razón específica es que
     el gasto en sí no es deducible, no que la empresa no participe del IVA. */
  if(d.cta==='6.2.14'){
    if(!d.ivaReportado) d.iva=r2(d.total-d.total/1.12);
    d.noAcred=0; d.base=r2(d.total-d.iva);
  }
  /* Cambiaria = operación al crédito: va a cuentas por pagar o por cobrar.
     El resto se asume de contado. */
  if(!d.ctaPago){
    d.ctaPago = d.alCredito
      ? (d.tipo==='compra' ? '2.1.01' : '1.1.04')
      : '1.1.01';
  }
  if(d.noAcred && !d.ctaIdp){
    asegurarCuenta(e,'6.1.07','Impuesto a la distribución de petróleo (IDP)','gasto');
    d.ctaIdp='6.1.07';
  }
  return d;
}
/* Las empresas creadas antes de que existiera una cuenta no la tienen en su catálogo. */
function asegurarCuenta(e,c,n,t){
  if(e.cuentas.some(x=>x.c===c)) return;
  e.cuentas.push({c,n,t,d:true});
  e.cuentas.sort((a,b)=>a.c.localeCompare(b.c,undefined,{numeric:true}));
  guardar();
}

/* ---- Reporte de DTE de la Agencia Virtual (.xls / .xlsx) ----
   El archivo no trae encabezados: las columnas se leen por posición.
   Las filas con una sola celda son el nombre de la categoría. */
const COL={fecha:0,auth:1,tipoDte:2,serie:3,dte:4,nitEmisor:8,emisor:9,
  nitReceptor:12,receptor:13,estado:16,moneda:17,total:18,iva:19,
  petroleo:22,otrosDesde:23,otrosHasta:32};

async function cargarSheetJs(){
  if(window.XLSX) return window.XLSX;
  await new Promise((ok,mal)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=ok; s.onerror=()=>mal(new Error('no se pudo cargar el lector de Excel'));
    document.head.appendChild(s);
  });
  return window.XLSX;
}
const TIPOS_DTE=['FACT','FCAM','FPEQ','FCAP','NCRE','NDEB','NABN','RDON','FESP','FACA'];
/* El receptor puede venir como CF (consumidor final) en vez de NIT. */
const nitDoc=v=>{
  const s=String(v??'').trim().toUpperCase();
  if(!s||s==='NAN'||s==='CF'||s==='C/F'||s==='CONSUMIDOR FINAL') return 'CF';
  return s.replace(/\.0+$/,'').replace(/[^0-9K]/g,'') || 'CF';
};

/* ---- Lector de DTE en XML (el mismo documento que certifica el certificador) ----
   Estructura verificada contra archivos reales de la SAT (namespace dte 0.2.0):
   dte:GTDocumento > dte:SAT > dte:DTE > dte:DatosEmision >
     dte:DatosGenerales@Tipo,@FechaHoraEmision
     dte:Emisor@NITEmisor,@NombreEmisor  (+ dte:DireccionEmisor/dte:Direccion)
     dte:Receptor@IDReceptor,@NombreReceptor
     dte:Items/dte:Item@BienOServicio  (Cantidad, Descripcion, PrecioUnitario, Impuestos, Total)
     dte:Totales/dte:TotalImpuestos/dte:TotalImpuesto@NombreCorto,@TotalMontoImpuesto ; dte:GranTotal
   dte:Certificacion/dte:NumeroAutorizacion@Numero,@Serie
   Complemento de factura cambiaria (cfc:): cfc:Abono con fecha de vencimiento por cuota,
   dato que el Excel de la Agencia Virtual no trae. */
function leerXmlDTE(texto,archivo){
  let doc;
  try{ doc=new DOMParser().parseFromString(texto,'application/xml'); }
  catch(e){ return {archivo,estado:'revisar',aviso:'XML inválido',total:0}; }
  if(doc.querySelector('parsererror')) return {archivo,estado:'revisar',aviso:'XML inválido',total:0};

  const porNS=(tag)=>{
    const x=doc.getElementsByTagNameNS('*',tag);
    return x.length?x[0]:null;
  };
  const gen=porNS('DatosGenerales'), emi=porNS('Emisor'), rec=porNS('Receptor'),
        certif=porNS('NumeroAutorizacion'), totales=porNS('Totales');
  if(!gen||!emi||!rec) return {archivo,estado:'revisar',aviso:'No es un DTE reconocible',total:0};

  const tipoDte=(gen.getAttribute('Tipo')||'').toUpperCase();
  const nitEmisor=soloNit(emi.getAttribute('NITEmisor'));
  const nitReceptor=nitDoc(rec.getAttribute('IDReceptor'));

  // items: detalle de bienes o servicios, con su propio bien/servicio y monto de IVA
  const items=[...doc.getElementsByTagNameNS('*','Item')].map(it=>{
    const txt=(tag)=>{ const n=it.getElementsByTagNameNS('*',tag)[0]; return n?n.textContent:''; };
    const impuestos=[...it.getElementsByTagNameNS('*','Impuesto')].map(im=>({
      nombre:(im.getElementsByTagNameNS('*','NombreCorto')[0]||{}).textContent||'',
      monto:+((im.getElementsByTagNameNS('*','MontoImpuesto')[0]||{}).textContent||0)
    }));
    return {
      bs: it.getAttribute('BienOServicio')||'B',
      cantidad:+txt('Cantidad')||0, descripcion:txt('Descripcion'),
      precioUnitario:+txt('PrecioUnitario')||0, total:+txt('Total')||0,
      impuestos
    };
  });
  // total por nombre de impuesto: IVA aparte, cualquier otro (IDP u otros específicos) se suma aparte
  // sin necesidad de conocer su nombre exacto de antemano.
  let iva=0, otros=0;
  (totales?[...totales.getElementsByTagNameNS('*','TotalImpuesto')]:[]).forEach(ti=>{
    const nom=(ti.getAttribute('NombreCorto')||'').toUpperCase();
    const monto=+(ti.getAttribute('TotalMontoImpuesto')||0);
    if(nom==='IVA') iva=r2(iva+monto); else otros=r2(otros+monto);
  });
  const granTotal=totales?+((totales.getElementsByTagNameNS('*','GranTotal')[0]||{}).textContent||0):0;

  // vencimientos de factura cambiaria (complemento cfc), si existen
  const vencimientos=[...doc.getElementsByTagNameNS('*','Abono')].map(a=>({
    numero:+((a.getElementsByTagNameNS('*','NumeroAbono')[0]||{}).textContent||0),
    fecha:(a.getElementsByTagNameNS('*','FechaVencimiento')[0]||{}).textContent||'',
    monto:+((a.getElementsByTagNameNS('*','MontoAbono')[0]||{}).textContent||0)
  }));

  return {
    archivo, estado:'ok', tipoDte,
    fecha:(gen.getAttribute('FechaHoraEmision')||'').slice(0,10),
    nitEmisor, emisor:emi.getAttribute('NombreEmisor')||'',
    nitReceptor, receptor:rec.getAttribute('NombreReceptor')||'',
    serie:certif?certif.getAttribute('Serie')||'':'', dte:certif?certif.getAttribute('Numero')||'':'',
    total:r2(granTotal), iva:r2(iva), otrosImp:r2(otros), ivaReportado:true,
    idp:0,   // los impuestos específicos (IDP u otros) quedan en "otrosImp", ver arriba
    /* Una nota de crédito reduce lo que se le debe al proveedor, así que
       tiene que entrar a la Cartera igual que una factura cambiaria — si no,
       nunca resta del saldo y hay que compensarla con una partida aparte a mano. */
    alCredito: tipoDte==='FCAM' || tipoDte==='FCAP' || tipoDte==='NCRE', pequeno: tipoDte==='FPEQ' || tipoDte==='FCAP',
    signo: tipoDte==='NCRE' ? -1 : 1,
    items, vencimientos
  };
}

async function cargarJsZip(){
  if(window.JSZip) return window.JSZip;
  await new Promise((ok,mal)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload=ok; s.onerror=()=>mal(new Error('no se pudo cargar el lector de ZIP'));
    document.head.appendChild(s);
  });
  return window.JSZip;
}

function leerReporteSAT(filas,archivo,tipoArchivo){
  const docs=[]; let categoria='', anuladas=0, saltadas=0;
  filas.forEach(f=>{
    const llenas=f.filter(v=>v!==null&&v!==undefined&&String(v).trim()!=='');
    if(llenas.length===0) return;
    if(llenas.length===1 && String(f[0]||'').trim()){ categoria=String(f[0]).replace(/\s*\(.*$/,'').trim(); return; }
    const tipoDte=String(f[COL.tipoDte]||'').trim().toUpperCase();
    if(!TIPOS_DTE.includes(tipoDte)){ saltadas++; return; }
    const estado=String(f[COL.estado]||'').trim();
    if(/anulad/i.test(estado)){ anuladas++; return; }
    const entero=v=>String(v??'').replace(/\.0+$/,'').replace(/[^0-9Kk]/g,'').toUpperCase();
    const d={
      archivo, categoria, estado:'ok', tipoDte,
      fecha:String(f[COL.fecha]||'').slice(0,10),
      serie:String(f[COL.serie]||'').trim(),
      dte:entero(f[COL.dte]),
      nitEmisor:entero(f[COL.nitEmisor]), emisor:String(f[COL.emisor]||'').trim(),
      nitReceptor:nitDoc(f[COL.nitReceptor]), receptor:String(f[COL.receptor]||'').trim(),
      moneda:String(f[COL.moneda]||'GTQ').trim(),
      total:r2(+f[COL.total]||0), iva:r2(+f[COL.iva]||0), ivaReportado:true,
      idp:r2(+f[COL.petroleo]||0),
      otrosImp:r2(Array.from({length:COL.otrosHasta-COL.otrosDesde+1},
        (_,k)=>+f[COL.otrosDesde+k]||0).reduce((s,v)=>s+v,0)),
      alCredito: tipoDte==='FCAM' || tipoDte==='FCAP' || tipoDte==='NCRE',
      signo: tipoDte==='NCRE' ? -1 : 1,
      pequeno: tipoDte==='FPEQ' || tipoDte==='FCAP',
    };
    if(!d.total) return;
    d.tipo=tipoArchivo; d.tipoFijo=true;
    docs.push(clasificar(d));
  });
  return {docs,anuladas,saltadas};
}

/* Validación y mensaje final, compartidos entre Excel, XML suelto y ZIP de XML. */
function finalizarCarga(docs,anuladas,tipoArchivo,prog){
  if(!docs.length){
    avisar('No se encontraron documentos legibles en el archivo.\n\nRevisá que sea la consulta de DTE de la Agencia Virtual, o un XML/ZIP de DTE certificados.');
    if(prog) prog.textContent=''; return;
  }
  const e=emp(), nitEmp=soloNit(e.nit);
  let contradicen=0, ajenos=0;
  if(nitEmp) docs.filter(d=>d.tipoDte!=='FESP').forEach(d=>{   // la factura especial ya se acomodó como compra en clasificar()
    const propio = tipoArchivo==='compra' ? d.nitReceptor : d.nitEmisor;
    const otro   = tipoArchivo==='compra' ? d.nitEmisor   : d.nitReceptor;
    if(propio!==nitEmp) (otro===nitEmp ? contradicen++ : ajenos++);
  });
  if(contradicen===docs.length && docs.length){
    if(prog) prog.textContent='';
    avisar(`Dijiste que el archivo es de ${tipoArchivo==='compra'?'compras':'ventas'}, pero en los ${docs.length} documentos el NIT ${nitEmp} aparece del lado contrario.\n\nEse archivo parece ser de ${tipoArchivo==='compra'?'ventas':'compras'}. No se cargó nada.`,'El archivo no coincide');
    return;
  }
  lote=lote.concat(docs);
  pintar();
  let msg=`Se cargaron ${docs.length} documentos como ${tipoArchivo==='compra'?'compras':'ventas'}.`;
  if(anuladas) msg+=`\n\nSe omitieron ${anuladas} documentos anulados.`;
  if(contradicen) msg+=`\n\n${contradicen} tienen el NIT del lado contrario: revisalos uno por uno.`;
  if(ajenos) msg+=`\n\n${ajenos} no mencionan el NIT ${nitEmp} por ningún lado.`;
  if(!nitEmp) msg+=`\n\nLa empresa no tiene NIT registrado, así que no pude verificar nada. Agregalo.`;
  avisar(msg,'Reporte cargado');
}

/* Extrae, de un Excel de la Agencia Virtual, solo el conjunto de documentos
   marcados como anulados (clave serie-numero), para usarlo como filtro sobre
   el XML/ZIP: el XML del documento no dice si está anulado, esa información
   únicamente vive en el estado que reporta este Excel. */
function clavesAnuladasDelExcel(filas){
  const claves=new Set();
  const TIPOS_DTE_LOCAL=['FACT','FCAM','FPEQ','FCAP','NCRE','NDEB','NABN','RDON','FESP','FACA'];
  filas.forEach(f=>{
    const tipoDte=String(f[2]||'').trim().toUpperCase();
    if(!TIPOS_DTE_LOCAL.includes(tipoDte)) return;
    if(!/anulad/i.test(String(f[16]||''))) return;
    const serie=String(f[3]||'').trim();
    const dte=String(f[4]??'').replace(/\.0+$/,'');
    claves.add(serie+'-'+dte);
  });
  return claves;
}

ACCIONES.leerReporte=async()=>{
  const archivos=[...(document.getElementById('reporte').files||[])];
  const tipoArchivo=(document.getElementById('tipoArchivo')||{}).value||'compra';
  if(!archivos.length){avisar('Elegí el archivo que bajaste de la Agencia Virtual.');return}
  const prog=document.getElementById('progreso');

  const extDe=f=>(f.name.split('.').pop()||'').toLowerCase();
  const excelFile = archivos.find(f=>['xls','xlsx'].includes(extDe(f)));
  const zipFile    = archivos.find(f=>extDe(f)==='zip');
  const xmlFiles    = archivos.filter(f=>extDe(f)==='xml');
  const soloExcelSinZipNiXml = excelFile && !zipFile && !xmlFiles.length;

  /* Si además del ZIP/XML se seleccionó un Excel, se usa solo para saber cuáles
     documentos están anulados — el resto del Excel se ignora en ese caso. */
  let anuladasRef=null;
  if(excelFile && (zipFile || xmlFiles.length)){
    try{
      const XL=await cargarSheetJs();
      const wb=XL.read(await excelFile.arrayBuffer(),{type:'array'});
      const filas=XL.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null});
      anuladasRef=clavesAnuladasDelExcel(filas);
    }catch(err){
      avisar('No se pudo leer el Excel para cruzar las anuladas: '+err.message+'\n\nSe sigue cargando el XML/ZIP, pero sin ese filtro.');
    }
  }
  const claveDoc=d=>(d.serie||'')+'-'+(d.dte||'');

  if(soloExcelSinZipNiXml){
    prog.textContent='Leyendo el reporte...';
    try{
      const XL=await cargarSheetJs();
      const wb=XL.read(await excelFile.arrayBuffer(),{type:'array'});
      const filas=XL.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null});
      const {docs,anuladas}=leerReporteSAT(filas,excelFile.name,tipoArchivo);
      finalizarCarga(docs,anuladas,tipoArchivo,prog);
    }catch(err){
      prog.textContent='';
      avisar('No se pudo leer el reporte: '+err.message+'\n\nEl lector se descarga de internet la primera vez, así que necesitás conexión.');
    }
    return;
  }

  if(zipFile){
    prog.textContent='Descomprimiendo...';
    try{
      const JSZip=await cargarJsZip();
      const zip=await JSZip.loadAsync(await zipFile.arrayBuffer());
      const nombres=Object.keys(zip.files).filter(n=>!zip.files[n].dir && n.toLowerCase().endsWith('.xml'));
      if(!nombres.length){ prog.textContent=''; avisar('El ZIP no trae ningún archivo .xml adentro.'); return; }
      const docs=[]; let malos=0, anuladasOmitidas=0;
      for(let i=0;i<nombres.length;i++){
        prog.textContent=`Leyendo ${i+1} de ${nombres.length}...`;
        try{
          const texto=await zip.files[nombres[i]].async('text');
          const d=leerXmlDTE(texto,nombres[i]);
          if(d.estado!=='ok'){ malos++; continue; }
          if(anuladasRef && anuladasRef.has(claveDoc(d))){ anuladasOmitidas++; continue; }
          d.tipo=tipoArchivo; d.tipoFijo=true; d.sinVerificarAnulacion=!anuladasRef; docs.push(clasificar(d));
        }catch(e){ malos++; }
      }
      let avisoExtra='';
      if(malos) avisoExtra+=`${malos} archivo(s) del ZIP no se pudieron leer y se omitieron.\n\n`;
      if(anuladasOmitidas) avisoExtra+=`${anuladasOmitidas} documento(s) estaban anulados según el Excel y se excluyeron.\n\n`;
      if(!anuladasRef) avisoExtra+='No se cargó un Excel de referencia junto al ZIP, así que no se pudo verificar si alguno de estos documentos está anulado — el XML por sí solo no lo dice. Revisá los totales.\n\n';
      if(avisoExtra) avisar(avisoExtra.trim(),'Aviso');
      finalizarCarga(docs,anuladasOmitidas,tipoArchivo,prog);
    }catch(err){
      prog.textContent='';
      avisar('No se pudo leer el ZIP: '+err.message+'\n\nEl lector se descarga de internet la primera vez, así que necesitás conexión.');
    }
    return;
  }

  if(xmlFiles.length){
    prog.textContent='Leyendo el XML...';
    try{
      const docs=[]; let malos=0, anuladasOmitidas=0;
      for(let i=0;i<xmlFiles.length;i++){
        const texto=await xmlFiles[i].text();
        const d=leerXmlDTE(texto,xmlFiles[i].name);
        if(d.estado!=='ok'){ malos++; continue; }
        if(anuladasRef && anuladasRef.has(claveDoc(d))){ anuladasOmitidas++; continue; }
        d.tipo=tipoArchivo; d.tipoFijo=true; d.sinVerificarAnulacion=!anuladasRef; docs.push(clasificar(d));
      }
      let avisoExtra='';
      if(malos) avisoExtra+=`${malos} archivo(s) no se pudieron leer.\n\n`;
      if(anuladasOmitidas) avisoExtra+=`${anuladasOmitidas} documento(s) estaban anulados según el Excel y se excluyeron.\n\n`;
      if(!anuladasRef && !soloExcelSinZipNiXml) avisoExtra+='No se cargó un Excel de referencia, así que no se pudo verificar anulaciones — el XML por sí solo no lo dice.\n\n';
      if(avisoExtra) avisar(avisoExtra.trim(),'Aviso');
      finalizarCarga(docs,anuladasOmitidas,tipoArchivo,prog);
    }catch(err){
      prog.textContent='';
      avisar('No se pudo leer el XML: '+err.message);
    }
    return;
  }

  avisar('No se reconoció ningún archivo de Excel, XML o ZIP entre lo que elegiste.');
};

/* ---- Recuerda la cuenta elegida para no repetir la clasificación cada mes ---- */
function recordarCuenta(d){
  const e=emp();
  e.mapeoNit=e.mapeoNit||{}; e.mapeoCat=e.mapeoCat||{};
  const nit=d.tipo==='compra'?d.nitEmisor:d.nitReceptor;
  /* "Gastos no deducibles" es una decisión por factura, no por proveedor —
     recordarla como el default de todo el NIT haría que la próxima factura
     de este mismo proveedor, que puede ser perfectamente deducible, caiga
     ahí solo por venir del mismo emisor. Para esta cuenta específica, mejor
     no recordar nada y dejar que cada factura se revise por su cuenta. */
  if(nit && d.cta!=='6.2.14') e.mapeoNit[nit]=d.cta;
  if(d.categoria && !MAPEO_BASE[d.categoria] && d.cta!=='6.2.14') e.mapeoCat[d.categoria]=d.cta;
  guardar();
}

let modoPartida='dia';

/* Todos los documentos del período entran en UNA partida. Los montos se acumulan
   por cuenta con signo: positivo va al debe, negativo al haber. Así las compras
   de contado y al crédito del mismo día conviven como renglones distintos. */
function agruparDocs(docs,modo){
  const g={};
  docs.forEach(d=>{
    const f=d.fecha||hoy();
    const per = modo==='dia' ? f : f.slice(0,7)+'-01';
    /* La clave es solo el período: compras y ventas del mismo día caen
       en el mismo grupo, y de ahí a la misma partida. */
    g[per]=g[per]||{fecha:modo==='dia'?f:ultimoDia(f),acum:{},n:0};
    const a=g[per]; a.n++;
    const s=d.signo||1;   // las notas de crédito restan
    const sumar=(cta,v)=>{ if(cta&&v) a.acum[cta]=(a.acum[cta]||0)+v; };
    if(d.tipo==='compra'){
      sumar(d.cta,    s*d.base);
      sumar(d.ctaIdp, s*(d.noAcred||0));
      /* Mismo criterio que en armar(): el IVA de un gasto no deducible no
         es crédito fiscal, va a su propia cuenta de gasto (6.2.27). */
      sumar(d.cta==='6.2.14'?'6.2.27':'1.1.09', s*d.iva);
      /* Factura especial: la empresa retiene el IVA y el ISR al vendedor y
         los entera ella a la SAT — al vendedor se le paga el neto. */
      const rIva=s*r2(d.retIvaFesp||0), rIsr=s*r2(d.retIsrFesp||0);
      sumar(d.ctaPago,-s*d.total+rIva+rIsr);
      if(rIva) sumar('2.1.19',-rIva);
      if(rIsr) sumar('2.1.06',-rIsr);
    }else{
      /* Si el cliente te retuvo impuesto al pagarte, ese monto no llega en
         efectivo — queda como crédito a favor contra tu propio impuesto:
         ISR (1.1.10) o, en Pequeño Contribuyente, el 5% (1.1.17). */
      const retISR=s*r2(d.retencionISR||0), retIVA=s*r2(d.retencionIVA||0);
      sumar(d.ctaPago, s*d.total-retISR-retIVA);
      if(retISR) sumar(ctaRetencionVenta(d), retISR);
      if(retIVA) sumar('1.1.19', retIVA);
      sumar(d.cta,    -s*d.base);
      sumar('2.1.04', -s*d.iva);
    }
  });
  return Object.values(g).sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function lineasDeGrupo(g){
  return Object.keys(g.acum)
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))
    .map(cta=>{ const v=r2(g.acum[cta]); return {cta,desc:'',debe:v>0?v:0,haber:v<0?-v:0}; })
    .filter(l=>l.debe||l.haber);
}
/* Suma un movimiento (debe/haber) a una partida existente, neteando por cuenta.
   Así, varios pagos del mismo día quedan en una sola partida en vez de una por pago. */
function sumarMovimiento(p,cta,debe,haber){
  const acum={};
  p.lineas.forEach(l=>{ acum[l.cta]=(acum[l.cta]||0)+(+l.debe||0)-(+l.haber||0); });
  acum[cta]=(acum[cta]||0)+((debe||0)-(haber||0));
  p.lineas=Object.keys(acum).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))
    .map(c=>{ const v=r2(acum[c]); return {cta:c,desc:'',debe:v>0?v:0,haber:v<0?-v:0}; })
    .filter(l=>l.debe||l.haber);
}
/* Todo lo que pasó en un día —compras, ventas, pagos a proveedores, cobros a
   clientes— cae en la MISMA partida, sin importar de qué pantalla venga. */
function partidaDelDia(e,fecha){
  let p=e.partidas.find(x=>x.fecha===fecha && x.origen==='dia');
  if(!p){
    p={id:uid(),numero:e.correlativo++,fecha,concepto:'',origen:'dia',n:0,
      docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',lineas:[]};
    e.partidas.push(p);
  }
  return p;
}
function actualizarConceptoDia(p){
  p.concepto=`Operaciones del ${fFecha(p.fecha)} — ${p.n} operaci${p.n===1?'ón':'ones'}`;
}
function ultimoDia(f){
  const [a,m]=f.split('-'); return `${a}-${m}-${new Date(+a,+m,0).getDate()}`;
}

/* Encuentra, entre las facturas de venta del lote, qué descripciones de
   producto todavía no se sabe a qué producto del inventario corresponden —
   ni porque el texto coincide exacto con uno ya conocido, ni porque ya se
   vinculó antes (e.mapeoProducto). Una sola por descripción, aunque
   aparezca en varias facturas del mismo lote. */
function itemsVentaSinMapear(e,activos){
  const {lista}=inventarioDetalle(e);
  const nombresConocidos=new Set(lista.map(p=>p.producto));
  /* Las compras del MISMO lote todavía no están en e.documentos —recién se
     guardan cuando se confirma la generación—, así que inventarioDetalle()
     todavía no las ve. Sin esto, una venta con el mismo nombre exacto que
     una compra que se está cargando junto pedía vincular igual, como si el
     producto fuera desconocido. */
  activos.filter(d=>d.tipo==='compra'&&d.items&&d.items.length).forEach(d=>{
    d.items.filter(it=>it.bs==='B'&&it.descripcion).forEach(it=>nombresConocidos.add(it.descripcion.trim()));
  });
  const vistos=new Set(), pendientes=[];
  activos.filter(d=>d.tipo==='venta'&&d.items&&d.items.length).forEach(d=>{
    d.items.filter(it=>it.bs==='B').forEach(it=>{
      const desc=(it.descripcion||'').trim();
      if(!desc||vistos.has(desc)) return;
      vistos.add(desc);
      if((e.mapeoProducto||{})[desc]||nombresConocidos.has(desc)) return;
      pendientes.push(desc);
    });
  });
  return pendientes;
}
ACCIONES.generarPartidas=()=>{
  const e=emp();
  const modo=(document.getElementById('modoPartida')||{}).value||'dia';
  modoPartida=modo;
  const activos=lote.filter(d=>!d.anuladaManual);
  const excluidas=lote.length-activos.length;
  if(!activos.length){avisar('Todos los documentos están marcados como anulados. No hay nada que generar.');return}
  const sinCuenta=activos.filter(d=>!d.cta||!d.ctaPago||!d.total);
  if(sinCuenta.length){avisar(`${sinCuenta.length} documento(s) no tienen cuenta o monto. Completalos antes de generar.`);return}

  const pendientes=itemsVentaSinMapear(e,activos);
  if(pendientes.length){
    const {lista}=inventarioDetalle(e);
    const nombresLista=new Set(lista.map(p=>p.producto));
    const nombresLote=new Set();
    activos.filter(x=>x.tipo==='compra'&&x.items&&x.items.length).forEach(x=>
      x.items.filter(it=>it.bs==='B'&&it.descripcion).forEach(it=>nombresLote.add(it.descripcion.trim())));
    /* Las opciones del desplegable tienen que incluir también los productos
       de las compras del MISMO lote que se está por procesar — todavía no
       están en e.documentos, así que inventarioDetalle() por sí solo no
       los ve, pero igual son productos válidos a los que vincular una
       venta. */
    const todosLosProductos=[...nombresLista,...[...nombresLote].filter(n=>!nombresLista.has(n))].sort();
    const opsProd=todosLosProductos.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
    abrirModal('Vincular productos de venta',
      `<p style="margin:0 0 14px;font-size:13px;color:var(--tinta-suave)">Estas ${pendientes.length} descripción(es)
        de las facturas de venta no coinciden con ningún producto que ya tengas en el inventario. Decí a cuál
        corresponde cada una — se acuerda de tu elección, así que la próxima vez que aparezca esta misma
        descripción ya la va a reconocer sola. Si alguna no es un producto físico (un servicio, un flete, algo que
        no debería descontar inventario), dejala en "Omitir".</p>
      <div class="rej">${pendientes.map((desc,i)=>`
        <div class="campo full"><label>${esc(desc)}</label>
          <select name="producto_${i}"><option value="">— Omitir, no es un producto de inventario —</option>${opsProd}</select>
        </div>`).join('')}</div>`,
      d=>{
        e.mapeoProducto=e.mapeoProducto||{};
        pendientes.forEach((desc,i)=>{ if(d['producto_'+i]) e.mapeoProducto[desc]=d['producto_'+i]; });
        guardar();
        continuarGenerarPartidas(e,activos,excluidas,modo);
      },'Vincular y continuar');
    return;
  }
  continuarGenerarPartidas(e,activos,excluidas,modo);
};
/* Cuenta donde queda lo que el cliente retuvo al pagarte. */
const ctaRetencionVenta=d=>regimenEn(emp(),d.fecha)==='pequeno'?'1.1.17':'1.1.10';
/* Factura especial (FESP): quien compra emite el documento y retiene el IVA
   completo y el ISR (5% sobre la base) al vendedor; los entera él a la SAT. */
function prepararRetencionesFesp(d){
  if(d.tipo==='compra'&&d.tipoDte==='FESP'){
    d.retIvaFesp=r2(d.iva||0);
    d.retIsrFesp=r2((d.base||0)*0.05);
  }else{ d.retIvaFesp=0; d.retIsrFesp=0; }
}
function continuarGenerarPartidas(e,activos,excluidas,modo){
  activos.forEach(prepararRetencionesFesp);
  if(activos.some(d=>d.retIvaFesp)) asegurarCuenta(e,'2.1.19','IVA retenido por pagar (facturas especiales)','pasivo');
  if(activos.some(d=>d.tipo==='venta'&&d.retencionIVA)) asegurarCuenta(e,'1.1.19','IVA retenido por clientes (constancias por aplicar)','activo');
  if(activos.some(d=>d.tipo==='venta'&&d.retencionISR&&ctaRetencionVenta(d)==='1.1.17'))
    asegurarCuenta(e,'1.1.17','Retenciones del 5% sufridas (Pequeño Contribuyente)','activo');
  const grupos = modo==='documento' ? null : agruparDocs(activos,modo);
  const cuantas = grupos ? grupos.length : activos.length;
  const detalle = modo==='documento' ? 'una por cada documento'
    : `${cuantas} partidas consolidadas a partir de ${activos.length} documentos`;

  /* Órdenes de compra vinculadas: tienen que seguir aprobadas y disponibles, y se
     compara lo que se va a facturar contra lo que a cada una le falta. */
  if(activos.some(d=>d.tipo==='compra'&&d.ocId&&!ocVinculable(e,d.ocId))){
    avisar('Una de las órdenes de compra vinculadas ya no está aprobada o disponible. Revisá la columna "Orden de compra" y volvé a elegirla.');
    return;
  }
  const vinculos=resumenVinculosOC(e,activos);
  const textoOC=vinculos.length?`\n\nÓrdenes de compra vinculadas:\n${vinculos.map(v=>`• ${v.oc.numero}: Q${Q(v.monto)} de Q${Q(v.rest)} por facturar${v.excede?` — OJO: se pasa por Q${Q(v.dif)}`:v.completa?' — la completa':` — queda por facturar Q${Q(-v.dif)}`}`).join('\n')}`:'';
  confirmar(`Se crearán ${cuantas} partidas en ${e.nombre}, ${detalle}.${excluidas?`\n\nSe excluyen ${excluidas} documento(s) marcados como anulados.`:''}\n\nSe numeran en orden cronológico, de la fecha más antigua a la más reciente.\n\nRevisá que las cuentas asignadas sean las correctas: después hay que corregirlas una por una.${textoOC}`,()=>{
    /* Empresas creadas antes de que existiera esta cuenta no la tienen en su
       propio catálogo, aunque nuevoCatalogo() ya la incluya para las
       nuevas — sin esto, la partida queda apuntando a un código que no
       existe, y en vez del nombre se ve un signo de interrogación. */
    asegurarCuenta(e,'6.2.27','IVA no deducible','gasto');
    e.documentos=e.documentos||[];
    /* El reporte de la SAT viene de la fecha más reciente hacia atrás.
       Se ordena al derecho para que el correlativo siga la cronología. */
    const enOrden=[...activos].sort((a,b)=>
      (a.fecha||'').localeCompare(b.fecha||'') || (a.serie||'').localeCompare(b.serie||''));
    /* El detalle siempre se guarda, aunque el diario vaya resumido. */
    /* Cada documento guardado recuerda en qué partida quedó (partidaId), para
       que al eliminar esa partida se puedan quitar también sus documentos,
       su cartera y sus salidas de inventario. */
    const docGuardado=new Map();
    enOrden.forEach(d=>{
      const g={id:uid(),tipo:d.tipo,tipoDte:d.tipoDte||'FACT',signo:d.signo||1,
      fecha:d.fecha,serie:d.serie,dte:d.dte,categoria:d.categoria||'',
      nit:d.tipo==='compra'?d.nitEmisor:d.nitReceptor,
      nombre:d.tipo==='compra'?d.emisor:d.receptor,
      bs:d.bs||'B',base:r2(d.base),idp:r2(d.noAcred||0),iva:r2(d.iva),total:r2(d.total),
      alCredito:!!d.alCredito,cta:d.cta,ctaPago:d.ctaPago,pequeno:!!d.pequeno,
      items:d.items||[],   // detalle de producto por línea, solo disponible desde XML
      retencionISR:r2(d.retencionISR||0),retencionIVA:r2(d.retencionIVA||0),retIvaFesp:r2(d.retIvaFesp||0),retIsrFesp:r2(d.retIsrFesp||0),
      ocId:d.ocId||'',ocNumero:(d.ocId&&buscarOC(e,d.ocId))?buscarOC(e,d.ocId).numero:''};
      e.documentos.push(g); docGuardado.set(d,g);
    });
    const fechaGrupo=d=>{ const f=d.fecha||hoy(); return modo==='dia'?f:ultimoDia(f); };
    const lineasOC=aplicarVinculosOC(e,enOrden);

    const armar=(o,concepto,doc)=>{
      const lineas=[];
      const inv=o.signo===-1;
      const D=(cta,desc,m)=>lineas.push(inv?{cta,desc,debe:0,haber:r2(m)}:{cta,desc,debe:r2(m),haber:0});
      const H=(cta,desc,m)=>lineas.push(inv?{cta,desc,debe:r2(m),haber:0}:{cta,desc,debe:0,haber:r2(m)});
      /* Las líneas no llevan el nombre del proveedor ni del cliente: ese dato
         queda en la cabecera de la partida y en el detalle para los libros de IVA. */
      if(o.tipo==='compra'){
        D(o.cta,'',o.base);
        if(o.noAcred) D(o.ctaIdp,'',o.noAcred);
        /* El IVA de una compra marcada como gasto no deducible tampoco es
           acreditable — no tendría sentido que el gasto no cuente para ISR
           pero su IVA sí contara como crédito fiscal —, así que en vez de
           ir a 1.1.09 (crédito fiscal) va a su propia cuenta de gasto,
           6.2.27, para que se pueda identificar aparte tanto en el Estado
           de Resultados como en el reporte de IVA. */
        if(o.iva) D(o.cta==='6.2.14'?'6.2.27':'1.1.09','',o.iva);
        const rIva=r2(o.retIvaFesp||0), rIsr=r2(o.retIsrFesp||0);
        H(o.ctaPago,'',r2(o.total-rIva-rIsr));
        if(rIva) H('2.1.19','IVA retenido — factura especial',rIva);
        if(rIsr) H('2.1.06','ISR retenido — factura especial',rIsr);
      }else{
        const retISR=r2(o.retencionISR||0), retIVA=r2(o.retencionIVA||0);
        D(o.ctaPago,'',r2(o.total-retISR-retIVA));
        if(retISR) D(ctaRetencionVenta(o),'',retISR);
        if(retIVA) D('1.1.19','IVA retenido por el cliente',retIVA);
        H(o.cta,'',o.base);
        if(o.iva) H('2.1.04','',o.iva);
      }
      const p={id:uid(),numero:e.correlativo++,fecha:o.fecha||hoy(),concepto,
        docTipo:doc.docTipo||'',docSerie:doc.docSerie||'',docNum:doc.docNum||'',
        nit:doc.nit||'',contraparte:doc.nombre||'',lineas};
      e.partidas.push(p);
      return p;
    };

    if(grupos){
      grupos.forEach(g=>{
        const lineas=lineasDeGrupo(g);
        if(lineas.length<2) return;   // si todo se anula, no hay partida que registrar
        const p=partidaDelDia(e,g.fecha);
        lineas.forEach(l=>sumarMovimiento(p,l.cta,l.debe,l.haber));
        p.n=(p.n||0)+g.n;
        enOrden.filter(d=>fechaGrupo(d)===g.fecha).forEach(d=>{ docGuardado.get(d).partidaId=p.id; });
        if(regimenEn(e,g.fecha)==='simplificado'){
          const ventas=ventasDelGrupo(enOrden,g,modo);
          const corte = modo==='dia' ? g.fecha : g.fecha.slice(0,7)+'-01';
          const previo=previoVentasAntesDe(e,corte);
          const isr=isrIncrementalPorTramo(previo,ventas);
          if(isr){
            asegurarCuenta(e,'6.2.15','ISR Régimen Opcional Simplificado','gasto');
            sumarMovimiento(p,'6.2.15',isr>0?isr:0,isr<0?-isr:0);
            sumarMovimiento(p,'2.1.05',isr<0?-isr:0,isr>0?isr:0);
          }
        }
        actualizarConceptoDia(p);
      });
    }else{
      /* En este modo cada documento es su propia partida, pero el tramo del
         5%/7% sigue siendo mensual: se lleva un acumulado del día para no
         recalcular mal cuando hay varios documentos en la misma fecha. */
      let diaISR=null, acumHoyISR=0;
      enOrden.forEach(d=>{
        const ref=`${d.serie?d.serie+'-':''}${d.dte}`;
        const nombreDoc = d.signo===-1?'nota de crédito':(d.tipoDte==='NDEB'?'nota de débito':'factura');
        const nombre = d.tipo==='compra'?d.emisor:d.receptor;
        const p=armar(d,`${d.tipo==='compra'?'Compra según':'Venta según'} ${nombreDoc} ${ref}`,
          {nombre,docTipo:d.tipoDte||'Factura',docSerie:d.serie,docNum:d.dte,
           nit:d.tipo==='compra'?d.nitEmisor:d.nitReceptor});
        docGuardado.get(d).partidaId=p.id;
        if(regimenEn(e,d.fecha)==='simplificado' && d.tipo==='venta'){
          if(d.fecha!==diaISR){ diaISR=d.fecha; acumHoyISR=0; }
          const venta=r2((d.signo||1)*d.base);
          const previo=r2(previoVentasAntesDe(e,d.fecha)+acumHoyISR);
          const isr=isrIncrementalPorTramo(previo,venta);
          acumHoyISR=r2(acumHoyISR+venta);
          if(isr){
            asegurarCuenta(e,'6.2.15','ISR Régimen Opcional Simplificado','gasto');
            p.lineas.push({cta:'6.2.15',desc:'',debe:isr>0?isr:0,haber:isr<0?-isr:0});
            p.lineas.push({cta:'2.1.05',desc:'',debe:isr<0?-isr:0,haber:isr>0?isr:0});
          }
        }
      });
    }
    /* Con las partidas ya generadas, ahora se descuenta el inventario solo,
       para cada ítem de una factura de venta que ya se sepa a qué producto
       corresponde —ya sea porque el texto coincidía exacto con uno
       conocido, o porque se vinculó recién arriba—. Antes esto había que
       hacerlo aparte, a mano, con "Nueva venta directa" por cada factura.
       Se recalcula el inventario disponible después de cada salida, para
       que dos ventas del mismo producto en el mismo lote se descuenten en
       cadena y no las dos contra el mismo disponible inicial. */
    const avisosInventario=[];
    e.salidasInventario=e.salidasInventario||[];
    enOrden.filter(d=>d.tipo==='venta'&&d.items&&d.items.length).forEach(d=>{
      d.items.filter(it=>it.bs==='B').forEach(it=>{
        const desc=(it.descripcion||'').trim();
        if(!desc||!it.cantidad) return;
        const {lista}=inventarioDetalle(e);
        const conocido=lista.find(p=>p.producto===desc);
        const producto=conocido?desc:(e.mapeoProducto||{})[desc];
        if(!producto) return;   // se dejó en "Omitir" — no es un producto de inventario
        const item=lista.find(p=>p.producto===producto);
        const disponible=item?item.cantidad:0;
        const cantidad=r2((d.signo||1)*it.cantidad);
        const {costoUnitario,costoTotal}=costoSalidaInventario(e,producto,cantidad);
        if(cantidad>disponible) avisosInventario.push(`${producto}: se vendieron ${cantidad}, pero solo había ${disponible} en existencia (factura ${d.serie?d.serie+'-':''}${d.dte}, ${fFecha(d.fecha)})`);
        e.salidasInventario.push({id:uid(),fecha:d.fecha,producto,cantidad,
          costoUnitario,costoTotal,motivo:'venta',partidaId:docGuardado.get(d).partidaId||'',documentoId:docGuardado.get(d).id});
      });
    });
    const n=activos.length; lote=[]; guardar(); VISTA='partidas'; pintar();
    registrarLog('Generó partidas desde facturas cargadas',`${cuantas} partida(s) a partir de ${n} documentos`);
    avisar(`Se generaron ${cuantas} partidas a partir de ${n} documentos.${excluidas?` Se excluyeron ${excluidas} marcados como anulados.`:''} Revisalas antes de cerrar el mes.${lineasOC.length?`\n\nÓrdenes de compra:\n${lineasOC.join('\n')}`:''}${avisosInventario.length?`\n\nOjo con el inventario:\n${avisosInventario.join('\n')}`:''}`,'Listo');
  },'Generar partidas');
}

/* ============ PRODUCCIÓN: COSTO DE LO QUE SE FABRICA ============ */
/* Hay varias formas válidas de costear lo que se fabrica, y cada empresa usa la suya; la ley (Art. 41,
   Dto. 10-2012) pide valuar al "costo de producción" y que el método se mantenga. Por eso el
   administrador ELIGE, y el sistema aplica esa y no otra:
   · Por órdenes: cada trabajo o lote lleva su propia hoja de costos (materiales, mano de obra y costos
     indirectos reales); el costo unitario es el costo de la orden entre las unidades terminadas.
   · Proceso continuo: se produce en serie y se costea por período, en unidades equivalentes con promedio
     ponderado — lo que queda a medio hacer se valúa según su % de avance, y pasa al período siguiente.
   · Costo estándar: se fija de antemano un costo por unidad; lo terminado entra al inventario a ese
     costo y la diferencia contra lo realmente gastado queda como variación (materiales, mano de obra e
     indirectos), a resultados.
   Contabilidad (sistema periódico, como el resto del inventario):
   · materiales a la orden:  Productos en proceso (1.1.18) contra Inventarios (1.1.08)
   · mano de obra y CIF:     Productos en proceso contra el gasto donde ya estaban (sueldos, energía…)
   · orden terminada:        Inventarios (1.1.08, producto terminado) contra Productos en proceso
   Así el costo de lo fabricado entra a la fórmula del costo de ventas (inventario inicial + compras y
   producción − inventario final) sin duplicar nada, y el kardex ya ve el producto terminado. */
const METODOS_PRODUCCION={
  ordenes:{nombre:'Por órdenes de producción',corto:'Por órdenes',
    texto:'Cada trabajo, pedido o lote tiene su hoja de costos. Ideal si fabricás sobre pedido o por lotes distintos entre sí.'},
  continuo:{nombre:'Proceso continuo (unidades equivalentes)',corto:'Proceso continuo',
    texto:'Producción en serie de productos iguales. Se costea por período; lo que queda a medio hacer se valúa según su avance. Promedio ponderado.'},
  estandar:{nombre:'Costo estándar',corto:'Costo estándar',
    texto:'Fijás un costo por unidad. Lo terminado entra a ese costo y las diferencias contra lo real se muestran como variaciones.'}};
const VARIACIONES_ESTANDAR=[['mat','5.1.05','Variación de materiales (costo estándar)'],['mod','5.1.06','Variación de mano de obra (costo estándar)'],['cif','5.1.07','Variación de costos indirectos (costo estándar)']];
let ordenProdActual=null;
const anioCerradoLibros=(e,fecha)=>(e.partidas||[]).some(p=>(p.concepto||'').startsWith(PREFIJO_CIERRE_LIBROS+fecha.slice(0,4)));
const metodoProduccion=e=>(e&&METODOS_PRODUCCION[e.metodoProduccion])?e.metodoProduccion:'';
const sumaOrden=(o,k)=>r2((o[k]||[]).reduce((s,x)=>s+(x.monto!==undefined?x.monto:x.costoTotal||0),0));
function totalesOrden(o){
  const mat=sumaOrden(o,'materiales'), mod=sumaOrden(o,'manoObra'), cif=sumaOrden(o,'cif');
  return {mat,mod,cif,total:r2(mat+mod+cif)};
}
function inicialProcesoContinuo(e,producto){
  const prev=(e.ordenesProduccion||[]).filter(o=>o.tipo==='continuo'&&o.producto===producto&&o.estado==='cerrada'&&o.wipFinal)
    .sort((a,b)=>(a.fechaCierre||'').localeCompare(b.fechaCierre||'')||a.numero-b.numero).pop();
  return prev?prev.wipFinal:{unidades:0,mat:0,conv:0,avMat:0,avConv:0};
}
/* Unidades equivalentes, promedio ponderado. Lo que no se transfiere queda en proceso, de modo que
   (inicial + costos del período) = (transferido + en proceso al final), siempre. */
function costeoContinuo(o,T,W,pm,pc){
  const t=totalesOrden(o), ini=o.inicial||{mat:0,conv:0};
  const matTot=r2(ini.mat+t.mat), convTot=r2(ini.conv+t.mod+t.cif);
  const euM=T+W*pm/100, euC=T+W*pc/100;
  const cuM=euM>0?matTot/euM:0, cuC=euC>0?convTot/euC:0;
  const transferido=r2(T*(cuM+cuC));
  const enProceso=r2(matTot+convTot-transferido);
  const wipMat=r2(Math.min(enProceso,W*pm/100*cuM));
  return {euM,euC,cuM,cuC,transferido,enProceso,wipMat,wipConv:r2(enProceso-wipMat),costoUnitario:T>0?transferido/T:0,matTot,convTot};
}
function varianzasEstandar(e,o,T){
  const std=(e.costosEstandar||{})[o.producto]||{mat:0,mod:0,cif:0}, t=totalesOrden(o);
  const est={mat:r2(T*std.mat),mod:r2(T*std.mod),cif:r2(T*std.cif)};
  return {est,estTotal:r2(est.mat+est.mod+est.cif),
    var:{mat:r2(t.mat-est.mat),mod:r2(t.mod-est.mod),cif:r2(t.cif-est.cif)}};
}
function productosConocidos(e){
  const s=new Set(inventarioDetalle(e).lista.map(p=>p.producto));
  (e.ordenesProduccion||[]).forEach(o=>s.add(o.producto));
  return [...s].sort();
}

function vistaProduccion(){
  const e=emp(); e.ordenesProduccion=e.ordenesProduccion||[];
  const m=metodoProduccion(e);
  if(!m){
    return cab('Producción','Costo de lo que fabricás: elegí cómo lo vas a calcular.')
    + `<div class="tarjeta"><h3>¿Cómo se costea la producción de ${esc(e.nombre)}?</h3>
        <p style="font-size:13px;color:var(--tinta-suave)">Hay varias formas válidas. Elegí la que usa la empresa: una vez que se empieza a producir, el método se mantiene (cambiarlo requiere que no haya órdenes abiertas y queda en la bitácora).</p>
        ${Object.entries(METODOS_PRODUCCION).map(([k,v])=>`<div style="margin:10px 0;padding:10px 12px;border:1px solid var(--linea);border-radius:6px">
          <strong>${v.nombre}</strong><div style="font-size:13px;color:var(--tinta-suave);margin:4px 0 8px">${v.texto}</div>
          <button class="btn mini" data-accion="elegirMetodoProduccion" data-metodo="${k}">Usar este método</button></div>`).join('')}
      </div>`;
  }
  if(ordenProdActual){ const o=e.ordenesProduccion.find(x=>x.id===ordenProdActual); if(o) return vistaOrdenProduccion(e,o); ordenProdActual=null; }
  const mov=movimientos(null,null);
  const wip=saldoNatural('1.1.18',mov);
  const lista=[...e.ordenesProduccion].sort((a,b)=>b.numero-a.numero);
  const etiqueta=m==='continuo'?'Corrida':'Orden';
  const filas=lista.map(o=>{const t=totalesOrden(o); return `<tr><td>${etiqueta} ${o.numero}</td><td>${esc(o.producto)}</td><td>${fFecha(o.fechaInicio)}</td>
    <td>${o.estado==='cerrada'?`Cerrada ${fFecha(o.fechaCierre)}`:'<span style="color:var(--alerta)">Abierta</span>'}</td>
    <td class="num">${Q(t.mat)}</td><td class="num">${Q(t.mod+t.cif)}</td><td class="num">${Q(t.total)}</td>
    <td class="num">${o.estado==='cerrada'&&o.cantidadTerminada?`${Q(o.cantidadTerminada)} u. a Q${Q(o.costoUnitario)}`:'—'}</td>
    <td class="num"><button class="btn mini" data-accion="abrirOrdenProduccion" data-id="${o.id}">Abrir</button></td></tr>`;}).join('');
  return cab('Producción',`Método de costeo: ${METODOS_PRODUCCION[m].nombre}`,
    `${m==='estandar'?'<button class="btn sec" data-accion="costosEstandar">Costos estándar</button>':''}
     <button class="btn sec" data-accion="cambiarMetodoProduccion">Cambiar método</button>
     <button class="btn" data-accion="nuevaOrdenProduccion">${m==='continuo'?'Nueva corrida (período)':'Nueva orden'}</button>`)
  + `<div class="cifras">
      <div class="cifra"><span>Productos en proceso (en libros)</span><strong>${Q(wip)}</strong></div>
      <div class="cifra"><span>${etiqueta}s abiertas</span><strong>${lista.filter(o=>o.estado==='abierta').length}</strong></div>
      <div class="cifra"><span>${etiqueta}s cerradas</span><strong>${lista.filter(o=>o.estado==='cerrada').length}</strong></div>
    </div>`
  + (lista.length?`<table><thead><tr><th></th><th>Producto</th><th>Inicio</th><th>Estado</th><th class="num">Materiales</th><th class="num">Mano de obra y CIF</th><th class="num">Costo total</th><th class="num">Terminado</th><th></th></tr></thead><tbody>${filas}</tbody></table>`
    :`<div class="vacio">Todavía no hay ${etiqueta.toLowerCase()}s. Creá la primera con el botón de arriba.</div>`)
  + `<div class="aviso">El producto terminado entra al inventario (cuenta 1.1.08) y al kardex a su costo de producción; lo que está a medio hacer se muestra en "Productos en proceso". Los materiales salen del inventario al costo del método que tiene la empresa (promedio o PEPS). La mano de obra y los costos indirectos que se aplican acá se pasan desde los gastos donde ya estaban registrados, sin duplicarlos.</div>`;
}
VISTAS.produccion=vistaProduccion;

function vistaOrdenProduccion(e,o){
  const m=o.tipo, t=totalesOrden(o), abierta=o.estado==='abierta', etiqueta=m==='continuo'?'Corrida':'Orden';
  const tabla=(titulo,lista,cols,filaFn)=>`<h3 style="color:var(--verde);margin:18px 0 6px;font-size:15px">${titulo}</h3>`
    +(lista.length?`<table style="font-size:13px"><thead><tr>${cols.map((c,i)=>`<th${i===cols.length-1?' class="num"':''}>${c}</th>`).join('')}</tr></thead><tbody>${lista.map(filaFn).join('')}</tbody></table>`
      :`<div class="vacio" style="padding:10px">Sin registros todavía.</div>`);
  const ini=o.inicial&&(o.inicial.unidades>0||o.inicial.mat>0||o.inicial.conv>0)?o.inicial:null;
  return cab(`${etiqueta} ${o.numero} — ${esc(o.producto)}`,`${METODOS_PRODUCCION[m].nombre} · inicio ${fFecha(o.fechaInicio)}${o.nota?' · '+esc(o.nota):''}`,
    `<button class="btn sec" data-accion="volverProduccion">Volver</button>
     <button class="btn sec" data-accion="pdfOrdenProduccion" data-id="${o.id}">Hoja de costos PDF</button>
     ${abierta?`<button class="btn peligro" data-accion="anularOrdenProduccion" data-id="${o.id}">Anular</button>
       <button class="btn" data-accion="cerrarOrdenProduccion" data-id="${o.id}">Cerrar y pasar a inventario</button>`:''}`)
  + `<div class="cifras">
      <div class="cifra"><span>Materiales</span><strong>${Q(t.mat)}</strong></div>
      <div class="cifra"><span>Mano de obra</span><strong>${Q(t.mod)}</strong></div>
      <div class="cifra"><span>Costos indirectos</span><strong>${Q(t.cif)}</strong></div>
      <div class="cifra"><span>Total del período</span><strong>${Q(t.total)}</strong></div>
    </div>`
  + (ini?`<div class="aviso">Viene con producción en proceso del período anterior: ${ini.unidades} u., materiales Q${Q(ini.mat)} y conversión Q${Q(ini.conv)}.</div>`:'')
  + (abierta?`<p style="margin:12px 0"><button class="btn mini" data-accion="materialOrdenProduccion" data-id="${o.id}">Agregar materiales</button>
      <button class="btn mini" data-accion="costoOrdenProduccion" data-id="${o.id}" data-clase="manoObra">Agregar mano de obra</button>
      <button class="btn mini" data-accion="costoOrdenProduccion" data-id="${o.id}" data-clase="cif">Agregar costos indirectos</button></p>`:'')
  + tabla('Materiales usados',o.materiales||[],['Fecha','Material','Cantidad','Costo unitario','Costo'],x=>`<tr><td>${fFecha(x.fecha)}</td><td>${esc(x.producto)}</td><td class="num">${x.cantidad}</td><td class="num">${Q(x.costoUnitario)}</td><td class="num">${Q(x.costoTotal)}</td></tr>`)
  + tabla('Mano de obra directa',o.manoObra||[],['Fecha','Detalle','Pasada desde','Monto'],x=>`<tr><td>${fFecha(x.fecha)}</td><td>${esc(x.descripcion||'')}</td><td>${esc(x.origen||'')}</td><td class="num">${Q(x.monto)}</td></tr>`)
  + tabla('Costos indirectos de fabricación',o.cif||[],['Fecha','Detalle','Pasada desde','Monto'],x=>`<tr><td>${fFecha(x.fecha)}</td><td>${esc(x.descripcion||'')}</td><td>${esc(x.origen||'')}</td><td class="num">${Q(x.monto)}</td></tr>`)
  + (o.estado==='cerrada'?`<div class="aviso" style="margin-top:16px"><strong>Cerrada el ${fFecha(o.fechaCierre)}.</strong>
      ${o.cantidadTerminada} u. terminadas, ${m==='estandar'?`al costo estándar de Q${Q(o.costoUnitario)} c/u (costo real de la orden Q${Q(t.total)})`:`Q${Q(o.costoTerminado)} a Q${Q(o.costoUnitario)} c/u`}.
      ${o.wipFinal&&o.wipFinal.unidades>0?` En proceso: ${o.wipFinal.unidades} u. (Q${Q(r2(o.wipFinal.mat+o.wipFinal.conv))}).`:''}
      ${o.variaciones?` Variaciones: materiales Q${Q(o.variaciones.mat)}, mano de obra Q${Q(o.variaciones.mod)}, indirectos Q${Q(o.variaciones.cif)} (positivo = gastó más que el estándar).`:''}
      Partida No. ${o.partidaCierreNumero}.</div>`:'');
}

ACCIONES.elegirMetodoProduccion=d=>{
  const e=emp(); if(!METODOS_PRODUCCION[d.metodo]) return;
  e.metodoProduccion=d.metodo;
  registrarLog('Eligió el método de costeo de producción',`${e.nombre} — ${METODOS_PRODUCCION[d.metodo].nombre}`);
  guardar(); pintar();
};
ACCIONES.cambiarMetodoProduccion=()=>{
  const e=emp();
  if((e.ordenesProduccion||[]).some(o=>o.estado==='abierta')){avisar('Hay órdenes abiertas: cerrá o anulá todas antes de cambiar el método de costeo.');return}
  abrirModal('Cambiar el método de costeo',
    `<p style="margin:0 0 12px;font-size:13px;color:var(--tinta-suave)">Método actual: <strong>${METODOS_PRODUCCION[metodoProduccion(e)].nombre}</strong>. Cambiarlo mezcla criterios dentro del mismo ejercicio: lo ya cerrado no se recalcula. Si la empresa ya declaró un método ante la SAT, el cambio puede requerir autorización.</p>
    <div class="campo full"><label>Nuevo método</label><select name="metodo">${Object.entries(METODOS_PRODUCCION).map(([k,v])=>`<option value="${k}"${k===metodoProduccion(e)?' selected':''}>${v.nombre}</option>`).join('')}</select></div>`,
    d=>{
      if(d.metodo===metodoProduccion(e)){avisar('Ese ya es el método actual.');return false}
      e.metodoProduccion=d.metodo; ordenProdActual=null;
      registrarLog('Cambió el método de costeo de producción',`${e.nombre} — ahora ${METODOS_PRODUCCION[d.metodo].nombre}`);
      guardar(); pintar();
    },'Cambiar método');
};
ACCIONES.volverProduccion=()=>{ordenProdActual=null;pintar()};
ACCIONES.abrirOrdenProduccion=d=>{ordenProdActual=d.id;pintar()};

ACCIONES.costosEstandar=()=>{
  const e=emp(); e.costosEstandar=e.costosEstandar||{};
  const filas=Object.entries(e.costosEstandar).map(([p,c])=>`<tr><td>${esc(p)}</td><td class="num">${Q(c.mat)}</td><td class="num">${Q(c.mod)}</td><td class="num">${Q(c.cif)}</td><td class="num">${Q(r2(c.mat+c.mod+c.cif))}</td></tr>`).join('');
  abrirModal('Costos estándar por unidad',
    `<p style="margin:0 0 12px;font-size:13px;color:var(--tinta-suave)">Fijá cuánto debería costar fabricar UNA unidad. Si el producto ya tiene estándar, se reemplaza para lo que se cierre de aquí en adelante.</p>
    ${filas?`<table style="font-size:13px;margin-bottom:12px"><thead><tr><th>Producto</th><th class="num">Materiales</th><th class="num">Mano de obra</th><th class="num">Indirectos</th><th class="num">Total</th></tr></thead><tbody>${filas}</tbody></table>`:''}
    <div class="rej">
      <div class="campo full"><label>Producto terminado</label><input name="producto" list="dlProd" placeholder="Nombre exacto del producto"><datalist id="dlProd">${productosConocidos(e).map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div>
      <div class="campo"><label>Materiales por unidad</label><input name="mat" type="number" step="0.0001" min="0" value="0"></div>
      <div class="campo"><label>Mano de obra por unidad</label><input name="mod" type="number" step="0.0001" min="0" value="0"></div>
      <div class="campo"><label>Indirectos por unidad</label><input name="cif" type="number" step="0.0001" min="0" value="0"></div>
    </div>`,
    d=>{
      const p=(d.producto||'').trim(); if(!p){avisar('Escribí el producto.');return false}
      const c={mat:+d.mat||0,mod:+d.mod||0,cif:+d.cif||0};
      if(c.mat+c.mod+c.cif<=0){avisar('El costo estándar tiene que ser mayor que cero.');return false}
      e.costosEstandar[p]=c; registrarLog('Fijó un costo estándar',`${p} — Q${Q(r2(c.mat+c.mod+c.cif))} por unidad`);
      guardar(); pintar();
    },'Guardar estándar');
};

ACCIONES.nuevaOrdenProduccion=()=>{
  const e=emp(), m=metodoProduccion(e); if(!m) return;
  const etiqueta=m==='continuo'?'corrida':'orden';
  abrirModal(`Nueva ${etiqueta} de producción`,
    `<div class="rej">
      <div class="campo full"><label>Producto que se fabrica</label><input name="producto" list="dlProd2" placeholder="Nombre del producto terminado"><datalist id="dlProd2">${productosConocidos(e).map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div>
      <div class="campo"><label>${m==='continuo'?'Inicio del período':'Fecha de inicio'}</label><input name="fecha" type="date" value="${hoy()}"></div>
      <div class="campo full"><label>Nota (cliente, lote, pedido…)</label><input name="nota" placeholder="Opcional"></div>
    </div>
    ${m==='estandar'?'<div class="aviso">Con costo estándar, el producto tiene que tener su estándar fijado (botón "Costos estándar").</div>':''}`,
    d=>{
      const p=(d.producto||'').trim(); if(!p){avisar('Escribí el producto que se fabrica.');return false}
      if(!d.fecha){avisar('Escribí la fecha de inicio.');return false}
      if(m==='estandar'&&!(e.costosEstandar||{})[p]){avisar('Ese producto no tiene costo estándar. Fijalo primero en "Costos estándar".');return false}
      if(m==='continuo'&&e.ordenesProduccion.some(o=>o.producto===p&&o.estado==='abierta')){avisar('Ese producto ya tiene una corrida abierta: cerrala antes de abrir otra.');return false}
      e.correlativoProd=(e.correlativoProd||0)+1;
      const o={id:uid(),numero:e.correlativoProd,tipo:m,producto:p,fechaInicio:d.fecha,nota:(d.nota||'').trim(),estado:'abierta',
        materiales:[],manoObra:[],cif:[]};
      if(m==='continuo') o.inicial=inicialProcesoContinuo(e,p);
      e.ordenesProduccion.push(o); ordenProdActual=o.id;
      registrarLog('Abrió una orden de producción',`${etiqueta} ${o.numero} — ${p}`);
      guardar(); pintar();
    },`Crear ${etiqueta}`);
};
const ordenAbierta=(e,id)=>{ const o=(e.ordenesProduccion||[]).find(x=>x.id===id); if(!o){avisar('No se encontró esa orden.');return null} if(o.estado!=='abierta'){avisar('Esa orden ya está cerrada.');return null} return o; };

ACCIONES.materialOrdenProduccion=d=>{
  const e=emp(), o=ordenAbierta(e,d.id); if(!o) return;
  const {lista}=inventarioDetalle(e);
  abrirModal('Agregar materiales a la orden',
    `<p style="margin:0 0 12px;font-size:13px;color:var(--tinta-suave)">Salen del inventario al costo del método de la empresa (${METODOS_COSTEO[metodoCosteo(e)]}) y pasan a Productos en proceso.</p>
    <div class="rej">
      <div class="campo full"><label>Material</label><select name="material">${lista.filter(p=>p.cantidad>0).map(p=>`<option value="${esc(p.producto)}" data-disp="${p.cantidad}">${esc(p.producto)} — disponible ${p.cantidad}</option>`).join('')}</select></div>
      <div class="campo"><label>Cantidad</label><input name="cantidad" type="number" step="0.01" min="0"></div>
      <div class="campo"><label>Fecha</label><input name="fecha" type="date" value="${hoy()}"></div>
    </div><p id="prevMat" style="margin:8px 0 0;font-size:13px"></p>`,
    async f=>{
      const cantidad=r2(+f.cantidad), prod=f.material;
      if(!prod){avisar('No hay materiales en existencia.');return false}
      if(!(cantidad>0)){avisar('Escribí la cantidad.');return false}
      if(!f.fecha){avisar('Escribí la fecha.');return false}
      if(anioCerradoLibros(e,f.fecha)){avisar('Ese ejercicio ya tiene Cierre de libros.');return false}
      const item=lista.find(x=>x.producto===prod), disp=item?item.cantidad:0;
      if(cantidad>disp){
        const seguir=await preguntar(`Solo hay ${disp} en existencia de ${prod}. ¿Registrar de todos modos?`,'Registrar');
        if(!seguir) return false;
      }
      const {costoUnitario,costoTotal}=costoSalidaInventario(e,prod,cantidad);
      asegurarCuenta(e,'1.1.18','Productos en proceso','activo');
      const p={id:uid(),numero:e.correlativo++,fecha:f.fecha,concepto:`Producción — ${o.tipo==='continuo'?'corrida':'orden'} ${o.numero} — materiales: ${prod}`,
        docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',
        lineas:[{cta:'1.1.18',desc:prod,debe:costoTotal,haber:0},{cta:'1.1.08',desc:prod,debe:0,haber:costoTotal}]};
      e.partidas.push(p);
      e.salidasInventario=e.salidasInventario||[];
      const sid=uid();
      e.salidasInventario.push({id:sid,fecha:f.fecha,producto:prod,cantidad,costoUnitario,costoTotal,motivo:'produccion',ordenId:o.id});
      o.materiales.push({id:uid(),fecha:f.fecha,producto:prod,cantidad,costoUnitario,costoTotal,salidaId:sid,partidaId:p.id,partidaNumero:p.numero});
      registrarLog('Aplicó materiales a producción',`${o.producto} — ${prod} × ${cantidad} — Q${Q(costoTotal)}`);
      guardar(); pintar();
    },'Agregar');
  const act=()=>{const sel=mForm.querySelector('[name="material"]'); const c=+mForm.querySelector('[name="cantidad"]').value||0;
    document.getElementById('prevMat').textContent=sel.value?`Costo que sale del inventario: Q${Q(costoSalidaInventario(e,sel.value,c).costoTotal)}`:'';};
  mForm.querySelector('[name="material"]').onchange=act; mForm.querySelector('[name="cantidad"]').oninput=act; act();
};

ACCIONES.costoOrdenProduccion=d=>{
  const e=emp(), o=ordenAbierta(e,d.id); if(!o) return;
  const clase=d.clase==='cif'?'cif':'manoObra';
  const nombre=clase==='cif'?'costos indirectos de fabricación':'mano de obra directa';
  const gastos=e.cuentas.filter(c=>c.d&&c.t==='gasto');
  const defecto=clase==='manoObra'?(gastos.find(c=>c.c==='6.2.01')||gastos[0]):(gastos.find(c=>c.c==='6.2.07')||gastos.find(c=>c.c!=='6.2.01')||gastos[0]);
  abrirModal(`Agregar ${nombre}`,
    `<p style="margin:0 0 12px;font-size:13px;color:var(--tinta-suave)">Esto NO es un gasto nuevo: pasa a Productos en proceso un monto que ya está registrado como gasto (por ejemplo, el sueldo del operario en la planilla). Elegí de cuál cuenta de gasto se traslada, para que no se cuente dos veces.</p>
    <div class="rej">
      <div class="campo full"><label>Se traslada desde la cuenta de gasto</label><select name="origen">${gastos.map(c=>`<option value="${c.c}"${defecto&&c.c===defecto.c?' selected':''}>${c.c} — ${esc(c.n)}</option>`).join('')}</select></div>
      <div class="campo"><label>Monto</label><input name="monto" type="number" step="0.01" min="0"></div>
      <div class="campo"><label>Fecha</label><input name="fecha" type="date" value="${hoy()}"></div>
      <div class="campo full"><label>Detalle</label><input name="descripcion" placeholder="Ej.: operarios de la semana 3"></div>
    </div>`,
    async f=>{
      const monto=r2(+f.monto); if(!(monto>0)){avisar('Escribí el monto.');return false}
      if(!f.fecha){avisar('Escribí la fecha.');return false}
      if(anioCerradoLibros(e,f.fecha)){avisar('Ese ejercicio ya tiene Cierre de libros.');return false}
      const saldo=saldoNatural(f.origen,movimientos(null,f.fecha));
      if(monto>saldo+0.004&&!(await preguntar(`La cuenta ${f.origen} tiene Q${Q(saldo)} a esa fecha; vas a trasladar Q${Q(monto)}. ¿Continuar?`))) return false;
      asegurarCuenta(e,'1.1.18','Productos en proceso','activo');
      const cta=e.cuentas.find(c=>c.c===f.origen);
      const p={id:uid(),numero:e.correlativo++,fecha:f.fecha,concepto:`Producción — ${o.tipo==='continuo'?'corrida':'orden'} ${o.numero} — ${nombre}`,
        docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',
        lineas:[{cta:'1.1.18',desc:(f.descripcion||'').trim(),debe:monto,haber:0},{cta:f.origen,desc:'Traslado a producción',debe:0,haber:monto}]};
      e.partidas.push(p);
      o[clase].push({id:uid(),fecha:f.fecha,descripcion:(f.descripcion||'').trim(),monto,origen:`${f.origen} ${cta?cta.n:''}`.trim(),partidaId:p.id,partidaNumero:p.numero});
      registrarLog(`Aplicó ${nombre} a producción`,`${o.producto} — Q${Q(monto)}`);
      guardar(); pintar();
    },'Agregar');
};

ACCIONES.cerrarOrdenProduccion=d=>{
  const e=emp(), o=ordenAbierta(e,d.id); if(!o) return;
  const t=totalesOrden(o), m=o.tipo;
  if(t.total<=0&&!(o.inicial&&(o.inicial.mat+o.inicial.conv)>0)){avisar('La orden no tiene ningún costo todavía: agregá materiales, mano de obra o costos indirectos antes de cerrarla.');return}
  abrirModal(`Cerrar ${m==='continuo'?'la corrida':'la orden'} ${o.numero} — ${esc(o.producto)}`,
    `<div class="rej">
      <div class="campo"><label>Fecha de cierre</label><input name="fecha" type="date" value="${hoy()}"></div>
      <div class="campo"><label>Unidades terminadas</label><input name="terminadas" type="number" step="0.01" min="0"></div>
      ${m==='continuo'?`<div class="campo"><label>Unidades que quedan en proceso</label><input name="proceso" type="number" step="0.01" min="0" value="0"></div>
      <div class="campo"><label>% de avance de materiales</label><input name="avMat" type="number" step="1" min="0" max="100" value="100"></div>
      <div class="campo"><label>% de avance de mano de obra e indirectos</label><input name="avConv" type="number" step="1" min="0" max="100" value="50"></div>`:''}
    </div>
    <table id="tablaCierre" style="font-size:13px;margin-top:10px"></table>
    <div class="aviso">${m==='ordenes'?'Todo el costo de la orden pasa al producto terminado; el costo unitario es el total entre las unidades terminadas.'
      :m==='continuo'?'Se calculan unidades equivalentes con promedio ponderado. Lo que queda en proceso sigue en Productos en proceso y la próxima corrida del producto arranca con ello.'
      :'El producto entra al inventario al costo estándar; la diferencia contra el costo real queda como variación en resultados.'}</div>`,
    f=>{
      const T=r2(+f.terminadas||0), W=m==='continuo'?r2(+f.proceso||0):0;
      if(!(T>0)){avisar('Escribí las unidades terminadas.');return false}
      if(!f.fecha||f.fecha<o.fechaInicio){avisar('La fecha de cierre no puede ser anterior al inicio.');return false}
      if(anioCerradoLibros(e,f.fecha)){avisar('Ese ejercicio ya tiene Cierre de libros.');return false}
      asegurarCuenta(e,'1.1.18','Productos en proceso','activo');
      const lineas=[]; let costoTerm, cu, extra={};
      if(m==='ordenes'){
        costoTerm=t.total; cu=costoTerm/T;
        lineas.push({cta:'1.1.08',desc:o.producto,debe:costoTerm,haber:0},{cta:'1.1.18',desc:`${o.producto} — orden ${o.numero}`,debe:0,haber:costoTerm});
      }else if(m==='continuo'){
        const pm=+f.avMat||0, pc=+f.avConv||0;
        if(W>0&&(pm<0||pm>100||pc<0||pc>100)){avisar('Los porcentajes de avance van de 0 a 100.');return false}
        const c=costeoContinuo(o,T,W,pm,pc);
        costoTerm=c.transferido; cu=c.costoUnitario;
        if(costoTerm<=0){avisar('El costo transferido es cero: revisá los costos y las unidades.');return false}
        extra={wipFinal:{unidades:W,mat:c.wipMat,conv:c.wipConv,avMat:pm,avConv:pc}};
        lineas.push({cta:'1.1.08',desc:o.producto,debe:costoTerm,haber:0},{cta:'1.1.18',desc:`${o.producto} — corrida ${o.numero}`,debe:0,haber:costoTerm});
      }else{
        const v=varianzasEstandar(e,o,T);
        costoTerm=v.estTotal; cu=costoTerm/T;
        lineas.push({cta:'1.1.08',desc:o.producto,debe:costoTerm,haber:0});
        const real=t.total;
        lineas.push({cta:'1.1.18',desc:`${o.producto} — orden ${o.numero}`,debe:0,haber:real});
        VARIACIONES_ESTANDAR.forEach(([k,cta,nom])=>{
          const x=v.var[k]; if(Math.abs(x)<0.005) return;
          asegurarCuenta(e,cta,nom,'costo');
          lineas.push(x>0?{cta,desc:'Gastó más que el estándar',debe:x,haber:0}:{cta,desc:'Gastó menos que el estándar',debe:0,haber:-x});
        });
        extra={variaciones:v.var};
      }
      costoTerm=r2(costoTerm);
      const p={id:uid(),numero:e.correlativo++,fecha:f.fecha,
        concepto:`Producción terminada — ${m==='continuo'?'corrida':'orden'} ${o.numero} — ${o.producto} × ${T}`,
        docTipo:'',docSerie:'',docNum:'',nit:'',contraparte:'',lineas};
      const dif=r2(lineas.reduce((s,l)=>s+l.debe-l.haber,0));
      if(Math.abs(dif)>0.004){ avisar('La partida no cuadra por Q'+Q(dif)+'. Revisá los costos de la orden.'); e.correlativo--; return false; }
      e.partidas.push(p);
      Object.assign(o,{estado:'cerrada',fechaCierre:f.fecha,cantidadTerminada:T,costoTerminado:costoTerm,costoUnitario:cu,
        partidaCierreId:p.id,partidaCierreNumero:p.numero},extra);
      registrarLog('Cerró una orden de producción',`${o.producto} × ${T} — Q${Q(costoTerm)}`);
      guardar(); pintar();
      avisar(`${m==='continuo'?'Corrida':'Orden'} cerrada: ${T} u. de ${o.producto} entran al inventario a Q${Q(cu)} c/u. Partida No. ${p.numero}.`,'Listo');
    },'Cerrar y pasar a inventario');
  const act=()=>{
    const g=n=>mForm.querySelector(`[name="${n}"]`), T=+g('terminadas').value||0;
    let html='';
    if(m==='ordenes'){
      html=`<tbody><tr><td>Costo total de la orden</td><td class="num">${Q(t.total)}</td></tr><tr class="total"><td>Costo unitario</td><td class="num">${T>0?Q(t.total/T):'—'}</td></tr></tbody>`;
    }else if(m==='continuo'){
      const W=+g('proceso').value||0, c=costeoContinuo(o,T,W,+g('avMat').value||0,+g('avConv').value||0);
      html=`<tbody><tr><td>Costo de materiales (con lo que venía en proceso)</td><td class="num">${Q(c.matTot)}</td></tr>
        <tr><td>Costo de conversión (con lo que venía en proceso)</td><td class="num">${Q(c.convTot)}</td></tr>
        <tr><td>Unidades equivalentes: materiales / conversión</td><td class="num">${c.euM.toFixed(2)} / ${c.euC.toFixed(2)}</td></tr>
        <tr><td>Costo unitario: materiales + conversión</td><td class="num">${Q(c.cuM)} + ${Q(c.cuC)}</td></tr>
        <tr class="total"><td>Pasa a producto terminado (${T} u. a Q${Q(c.costoUnitario)})</td><td class="num">${Q(c.transferido)}</td></tr>
        <tr><td>Queda en proceso (${W} u.)</td><td class="num">${Q(c.enProceso)}</td></tr></tbody>`;
    }else{
      const v=varianzasEstandar(e,o,T);
      html=`<tbody><tr><td>Costo estándar de ${T} u.</td><td class="num">${Q(v.estTotal)}</td></tr><tr><td>Costo real de la orden</td><td class="num">${Q(t.total)}</td></tr>
        <tr><td>Variación de materiales</td><td class="num">${Q(v.var.mat)}</td></tr><tr><td>Variación de mano de obra</td><td class="num">${Q(v.var.mod)}</td></tr>
        <tr><td>Variación de indirectos</td><td class="num">${Q(v.var.cif)}</td></tr>
        <tr class="total"><td>Variación total (positivo = gastó más)</td><td class="num">${Q(r2(t.total-v.estTotal))}</td></tr></tbody>`;
    }
    document.getElementById('tablaCierre').innerHTML=html;
  };
  mForm.querySelectorAll('input').forEach(i=>{i.oninput=act;});
  act();
};

/* ============ LIBROS EN PDF ============ */
async function cargarScript(src){
  await new Promise((ok,mal)=>{
    const s=document.createElement('script'); s.src=src; s.onload=ok;
    s.onerror=()=>mal(new Error('no se pudo descargar el generador de PDF'));
    document.head.appendChild(s);
  });
}
async function cargarJsPDF(){
  if(!window.jspdf) await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  if(!window.jspdf.jsPDF.API.autoTable) await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  return window.jspdf.jsPDF;
}
const VERDE=[31,68,47], CREMA=[244,239,227];
const archivoSeguro=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,28);

/* Datos que debe llevar cada hoja de un libro habilitado. */
function encabezadoPDF(doc,titulo,sub){
  const y=bloqueEmpresaPDF(doc);
  const an=doc.internal.pageSize.getWidth();
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...VERDE);
  doc.text(titulo,40,y+9);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90,90,90);
  doc.text(sub,40,y+21);
  doc.setDrawColor(...VERDE); doc.setLineWidth(1);
  doc.line(40,y+28,an-40,y+28);
  return y+38;   // dónde puede empezar la tabla
}
/* Solo el bloque con los datos de la empresa —nombre, propietario, NIT,
   dirección, ejercicio—, sin título ni línea debajo. Para un documento como
   el Libro de Estados Financieros, donde varios "estados" distintos pueden
   compartir la misma hoja física: este bloque va una sola vez al principio
   de cada hoja, y cada estado agrega su propio título aparte, más chico,
   sin repetir los datos de la empresa cada vez. */
function bloqueEmpresaPDF(doc){
  const e=emp();
  doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(...VERDE);
  doc.text(e.nombre,40,40);

  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(70,70,70);
  let y=53;
  const an=doc.internal.pageSize.getWidth();
  const dato=(etiqueta,valor)=>{
    const texto=`${etiqueta}: ${valor||'—'}`;
    doc.splitTextToSize(texto,an-160).forEach(linea=>{ doc.text(linea,40,y); y+=10; });
  };
  dato('Propietario',e.representante);
  dato('NIT',e.nit);
  dato('Dirección fiscal',e.direccion);
  dato('Ejercicio contable',e.ejercicio);
  return y+6;
}
function pieDePagina(doc,folioInicial=1){
  const n=doc.internal.getNumberOfPages(), an=doc.internal.pageSize.getWidth(), al=doc.internal.pageSize.getHeight();
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...VERDE);
    doc.text(`Folio No. ${folioInicial+i-1}`,an-40,44,{align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(130,130,130);
    doc.text(`Generado el ${fFecha(hoy())}`,40,al-22);
    doc.text(`Página ${i} de ${n}`,an-40,al-22,{align:'right'});
  }
  return n;   // cuántas hojas ocupó esta descarga, para acumular el siguiente folio
}
/* Folio legal corrido (Art. 368 Código de Comercio). Un libro es una
   acumulación: el folio de una hoja depende de QUÉ período imprime y de
   cuántas hojas ocuparon los períodos anteriores — nunca de cuántas veces se
   descargó el PDF. Por eso se guarda, por libro, cuántas hojas ocupó cada
   período impreso ({desde,hasta,hojas}); volver a descargar el mismo período
   reemplaza su registro, no lo suma. Un período nuevo (el mes siguiente, el
   ejercicio siguiente) empieza donde terminó el anterior.
   Los libros que se imprimen completos desde el origen (ventas, compras,
   pequeño contribuyente, inventario) siempre arrancan en el folio 1: su
   numeración es estable porque lo ya impreso nunca cambia de lugar. */
function entradasFolio(e,libro){
  e.folios=e.folios||{};
  if(!Array.isArray(e.folios[libro])) e.folios[libro]=[];   // el contador viejo (un número que crecía con cada descarga) se descarta
  return e.folios[libro];
}
function siguienteFolio(e,libro,desde){
  if(!desde) return 1;
  const previos=entradasFolio(e,libro).filter(x=>x.hasta<desde);
  /* Si un período más amplio ya cubre a otro (el año completo vs. un mes de ese año),
     cuenta solo el amplio — si no, las mismas hojas se sumarían dos veces. */
  const vigentes=previos.filter(x=>!previos.some(y=>y!==x&&y.desde<=x.desde&&y.hasta>=x.hasta&&(y.desde<x.desde||y.hasta>x.hasta)));
  return vigentes.reduce((s,x)=>s+x.hojas,0)+1;
}
function registrarFolio(e,libro,desde,hasta,hojas){
  const lista=entradasFolio(e,libro), reg={desde,hasta,hojas};
  const i=lista.findIndex(x=>x.desde===desde&&x.hasta===hasta);
  if(i>=0) lista[i]=reg; else lista.push(reg);
  guardar();
}
/* La altura del encabezado varía si la dirección ocupa más de un renglón. */
function altoEncabezado(){
  const e=emp();
  const texto=`Dirección fiscal: ${e.direccion||'—'}`;
  const renglonesExtra=Math.max(0,Math.ceil(texto.length/100)-1);
  return 131 + renglonesExtra*10;
}
function avisarDatosIncompletos(){
  const e=emp(), faltan=[];
  if(!e.nit) faltan.push('el NIT');
  if(!e.direccion) faltan.push('la dirección fiscal');
  if(!e.representante) faltan.push('el propietario');
  if(faltan.length){
    avisar(`A la empresa le falta ${faltan.join(', ')}.\n\nEsos datos deben aparecer en cada hoja del libro. Corregilos en la pantalla de Empresas antes de imprimir el libro definitivo.`,'Datos incompletos');
  }
}
const rango=()=>{
  const e=emp();
  return [filtros.desde||`${e.ejercicio}-01-01`, filtros.hasta||`${e.ejercicio}-12-31`];
};

/* Cada renglón de una factura XML trae su propio "Bien" o "Servicio" puesto
   por el proveedor en su propia factura electrónica — el sistema confía en
   eso. Cuando un proveedor marca mal un cobro (flete, servicio logístico, un
   descuento) como si fuera mercadería, se cuela al inventario sin que haya
   ninguna cuenta nueva ni partida de por medio: es el mismo renglón, solo
   hay que corregir su marca. Esto lista todo lo que hoy cuenta como "Bien"
   para poder excluir lo que no corresponda. */
ACCIONES.revisarItemsInventario=()=>{
  const e=emp();
  const items=[];
  (e.documentos||[]).forEach((d,di)=>{
    if(d.tipo!=='compra'||!d.items||!d.items.length) return;
    d.items.forEach((it,ii)=>{
      if(it.bs==='B') items.push({di,ii,fecha:d.fecha,nombre:d.nombre,descripcion:it.descripcion,cantidad:it.cantidad,total:it.total});
    });
  });
  if(!items.length){avisar('No hay ningún ítem marcado como "Bien" para revisar.');return}
  items.sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const filas=items.map(x=>`<tr data-fila="${x.di}-${x.ii}">
    <td>${fFecha(x.fecha)}</td><td>${esc(x.nombre||'—')}</td><td>${esc(x.descripcion)}</td>
    <td class="num">${x.cantidad?Q(x.cantidad).replace(/\.00$/,''):'—'}</td>
    <td class="num">${Q(x.total)}</td>
    <td class="num"><button class="btn mini sec" data-accion="excluirItemInventario" data-di="${x.di}" data-ii="${x.ii}">No es mercadería</button></td></tr>`).join('');
  abrirModal('Revisar ítems del inventario',
    `<p style="margin:0 0 14px;font-size:13px;color:var(--tinta-suave)">Estos son todos los renglones que hoy
      cuentan como mercadería, tal como vinieron marcados en la factura del proveedor. Si alguno en realidad es
      un cobro de flete, servicio, o un descuento — no un producto —, sacalo de acá; no se borra el renglón, solo
      deja de contar como inventario.</p>
    <div style="max-height:60vh;overflow:auto">
    <table><thead><tr><th>Fecha</th><th>Proveedor</th><th>Descripción</th>

ACCIONES.pdfLibroInventarios=async()=>{
  const e=emp();
  const h=filtros.corteInventario||`${e.ejercicio}-12-31`;
  const mov=movimientos(null,h);
  const siguienteDia=(()=>{ const d=new Date(h+'T00:00:00'); d.setDate(d.getDate()+1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  const detalleCuenta=cta=>{
    if(cta==='1.1.08'){ const {lista}=inventarioDetalle(e); return lista.map(p=>({nombre:p.producto+(p.cantidad?` (${p.cantidad} u.)`:''),monto:p.total})); }
    if(cta==='1.1.04') return carteraClientes(e).filter(x=>x.saldo).map(x=>({nombre:x.nombre||x.nit,monto:x.saldo}));
    if(cta==='2.1.01') return carteraProveedores(e).filter(x=>x.saldo).map(x=>({nombre:x.nombre||x.nit,monto:x.saldo}));
    return null;
  };
  const filas=[];
  ['activo','pasivo','patrimonio'].forEach(tipo=>{
    let hayAlguna=false;
    e.cuentas.filter(c=>c.d&&c.t===tipo).forEach(c=>{
      const v=saldoCuentaAntesDe(e,c.c,siguienteDia); if(!v) return; hayAlguna=true;
      filas.push([{content:`${c.c} — ${c.n}`,colSpan:2,styles:{fontStyle:'bold',fillColor:[242,239,231]}},'']);
      const detalle=detalleCuenta(c.c);

        filas.push([{content:`Subtotal ${c.n}`,styles:{fontStyle:'italic'}},{content:Q(v),styles:{fontStyle:'italic',halign:'right'}}]);
      }else{
        filas.push(['',Q(v)]);
